body:
  text: 古亷文集卷十一明李時勉撰詩詞和答復古先生茲山稀行迹嘉木自繁隂我嘗愛山行坐來生隱心陽崖飛清瀑陰谷響春禽會非遺紛慮焉知山水深青苔雨裏滑石路君獨尋參差惜乖違何以愜往忱茲竭嵗華力相逐厯青岑旱孟夏久不雨赤日赫髙丘溝澮無蓄水江浦無深流山田禾未插農老劇增愁掃地設雩祭望雲坐田頭霖雨不可得密雲終日浮顧此重悽傷俯仰亦何求天瓢有餘滴孰濟蒼生憂野老望雲桑樹春鳩鳴農事起來早仰視天邊雲來往田間道虹電耀西渚白日行穹昊澗少一線水田多去年草欲犁不得雨種苗復枯稿耕穫恆飢苦不耕難自保傷哉罹此憂欲從首陽老送解學士布政廣西兼行交趾事時平交趾立郡縣閣前冠冕照青春日下除書拜紫宸神武又平南海尉綏懷遙寄玉堂賓鵷鸞不久違中禁禮樂從今及逺人何處相思不相見斜陽獨立楚江濱寄慣窮老人還鄉塞門迢遞鴈門開匹馬蕭蕭入楚來從此雲蘿成隱逸不妨水竹久徘徊歸田剩有間居賦觀國慚無濟世才自是因君懷舊隱望鄉頻上鳳凰臺山家春曉日髙照見松窗裏照人春眠猶未起家僮灑掃及中堂喚起客來供盥洗披衣隨步小窗外楊栁依微鶯細語皆言昨夜風雨惡緑樹披離花滿地老父庭前掃落花掃開春徑莫教遮怕有客來尋舊術不妨竹裏引輕車田家日晚歌東郊草長牛正肥溝渠水通田可犁老翁向田姑哺兒新婦厨中炊獨遲歸來對客少間語但説田家有辛苦春寒種榖不著泥北風吹麥皆入土里胥徵稅不得了丁男出官多奔走兩月山中去不歸老身那似少年時春深田家百事急田多草荒犁不及野鹿呦呦滿舊山隨牛終日在田間縱及收成罷耕作官家無事身始間清明昨日街頭初禁煙今日清明煙火傳家家齊上墳頭拜更翦荆榛挂紙錢東郊古碑翳荒草近隴纍纍誰灑掃問著樵夫説姓名子孫繁華難自保輕裘駿馬誰家兒東阡西陌紛相隨鬬殘蹴踘忽歸去還向髙堂縱歌舞古意寄曾學士二首百川日夜流浩浩以東注環海幾萬里不見涯涘處混涵無不容日月自吞吐風波任蕩潏貝錯極生聚萬古長若斯焉能為量數蛟龍挾雲雨倐忽甘澤布深𢎞有如此豈比尋常具梧桐生崇岡亭亭出雲林一朝樵夫採斤斧來相尋幸爾爨下餘斫削成素琴粲粲絃朱絲燁燁徽黃金當窗試一彈悠然太古音清風流水逺白雲蒼山深世無鍾子期誰能識其心立雪齋講學志已篤更欲從明師鵠立在函丈翼翼慎其儀豈不思退逸進修當此時朔風吹前庭雪落何霏霏凝心注道妙不覺寒切肌自非素志堅安取青名垂陽風激髙唱兔苑誇嚴辭徒然駭衆聽名教竟何裨揆豫慕前修將殊世俗為軒居既曠達豈徒積書詩朂哉崇明德賢哲與同歸白土洞燒丹閬仙幾年洞中去採藥燒丹是何處乍臨爐鼎聚精神便覺林巒藹煙霧由來仙骨少塵心丹砂易得成黃金姹女初凝碧天曉河車欲轉紫霞深深幽好似崆洞裏炎井龍遊虎渡水絳雪晶熒宜可同金砂的皪寧堪擬騰光燭夜天宇清尋常白日起風霆空山魑魅嘯爭訝繞林猿鶴時相驚世人曾見洞天啓恍遇蓬山羡門子刀圭入口可長年何必還餐石中髓知君好古意猶勤賣藥壺中秋復春不肯吹笙向緱嶺要將仙術濟時人我亦平生慕仙道神逰八極身已老眼前勝境未得親遙望蓬瀛鬱懷抱年來多病少見知欲服還丹誰為持可遣沉痾脫然去放歌為作還丹詩中溪草堂雙溪東南來奔流自縈回朝宗逺勢合浩蕩青如苔中溪曠望彌原陸十里人煙接喬木比屋常聞絃誦聲髙岡逺見牛羊牧故人昔住橫山前宦遊辭家經幾年歸來愛此風景好移居卜築溪水邊數椽粗朴也瀟灑窗戶臨溪瞰平野屋裏連牀積簡編門前終日留車馬種松藝竹環碧山蘭舟蕩漾滄浪間雲龍仙人放鶴去浣花野客釣魚還羡君自是文章伯歸老林泉得間適問字人尋揚子居息交誰訪陶潛宅山田八月禾黍收豪吟縱飲亦何求舞回鴝鵒千峯曙歌罷滄浪萬頃秋由來勝地多山水如此清幽能有幾開門獨步少塵喧但見青山白雲起昔聞好是平泉莊一時草木生輝光只今零落竟何有逢人唯説鄭公鄉友桂庭庭前有桂樹託根固宜深鬱鬱蔽灌木亭亭出層岑冬春不改色當夏團清陰儼立若端士幽貞無邀尋獨比友直諒悠然諧素襟商飈動金粟芬芳被喬林有時得醇酣對酌還自斟低枝拂舞袖深翠挹鳴禽歡賞豈有極因之發孤吟谷風既絶響遼濶誰知音惟有蘭藏馨可以喻同心馮主事粉署畫故山讀書處憶昔少年讀書處野竹蒼松藹雲霧下帷盡日絶煩囂開帙臨窗得深趣蓽門蓬戶霏巖煙溪壑猶為靜者憐孔明有意吟梁甫揚子留心草太玄清風最好窮今古焚蘭映雪甘辛苦十年遊息無與倫數畝林泉自為侣君不見狂俠兒輕裘駿馬紛相馳白日羣逰幾人伴青樓一笑千金資又不見富家子錦衣珍饌矜豪侈堂上歌鐘遏曉雲門前車馬如流水但誇意氣恣所為一字從來都不知羲和西飛花落地昨日繁華今日非以茲感激志猶勤蹤迹頻年不出門長楊賦就人始羡金榜名成誰不聞自從作官别鄉井羇思離懷不能屏故令圖繪坐中看咫尺江上覺寥迥粉署長間樂有餘朝回對此形神舒倚檻渾驚蠧魚起臨潭宛見鮫人居大夫出身事明主報國何心懷舊土却笑吳中張季鷹獨憶秋風便歸去吾觀馮子好胸襟畫圖幽意頗難尋欲將蠧簡樹勳業不負當年一片心大雨水至暝色凝陰處濃雲翳碧天一時傾暑雨四壁湧春泉直似鮫人室何如海屋仙聲疑三島近勢覺五湖連可舉任公釣堪乘范蠡船剝床應及水沉竈故無煙寸步誰將引丹心自可憐幾時及白日隨地即周旋白雲書舍白雲飛繞秦川山山中人與雲俱間黃金滿籯未足貴貯書萬卷不為難書日益多心益喜欲把箕裘遺諸子天上樓成忽見招身後經傳竟誰是丁寧為語結髮人我死兒存書可親莫言孤寡即消落當知富貴須辛勤妻賢子孝念遺訓下帷讀書初發憤十載猶聞占畢聲九霄忽覩鯤鵬運虎榜春題姓字香簪纓曳紱在周行烏府爭看新錦繡白雲還憶舊山房山房書在人已逝慈顔逺隔縈離思一望雲山更愴神獨宿霜臺不成寐昨來北闕荷恩榮褒封應慰倚門情郎官追贈賁幽壤晝繡東來别上京上京漸逺雲漸近浙水東頭是鄉郡昔年猿鶴駭衣冠此日風雲護門徑綵衣舞罷望天門思將忠赤答君恩焉能久作林泉客還欲離家辭白雲送人南還冀北霜寒正授衣西風忽與故交違馬嘶去路多秋草斾拂離亭滿夕暉客路不堪千里别故鄉今見幾人歸到家倘遇難兄問薊北雲邊一鴈飛春雨山中謾興寄憶誠辨戴隱君回風吹雲雜髙樹樹底紛紛作疏雨雨多十日未開門前頭草色連荒村故人不來老却春山陰獨立愁將昏憶我初逰上京國君獨看人惜離别鳳臺旅思逐春雲剡曲間情對秋月幾日歸來接故園願分鄰舍對柴關訪舊多尋溪底棹看雲不厭門前山山家煙火人來去野水孤村自成趣仄徑長留松竹陰低簷近引藤蘿霧草深沙路不堪行遲爾幽居須待晴傳語先題數行字有窗多聽曉鶯聲題謝堅千戶行樂圖將軍一生膽氣雄六韜三略蟠心胸間來校獵擁貂虎城西倐忽又城東彎弓走馬如驚電草頭雲外人不見射鴻彈鴈應弦落殺狐逐兔隨風轉昨聞虎來五里岡出門飛騎何鷹揚指揮猛士盡踴躍直前殺虎如刲羊有時嬉逰到鄉里千村萬落爭迎喜挾彈歸來烏欲棲日落營門暮煙紫自是名家冨貴人何幸遭逢明聖君豈肯偷間度時日長懷報國樹功勳陳百戶熙山莊一劍功成荷國恩間居優老信乾坤盡將韜略傳諸子直買山田向逺村南陌雨晴看稼穡東臯日出放雞豚客來開閣無餘事共聽樵歌對酒樽留别復古謝先生青溪溪色照間心古樹猶堪落夕陰小徑舊時通隱處清風長日在幽林間窗却掃逢人坐村酒常沽不自斟杳杳青山成别去重尋應惜白雲深懷舊橋頭流水漾清漪懷舊傷心淚自垂無地可為埋骨處平生交誼竟何為馬修撰挽詩一日聲名遍天下幾年文彩動朝端揮毫才思如濤湧對客情懷似海寬常想承恩趨魏闕還思退食出長安池邊梅閣今猶在窗外青山誰共看畫竹為侍御韓雍題渭水過千畝幽居只數竿清陰連野外翠色上雲端不是全髙節如何耐苦寒風霜時淨掃塵俗可能干候湯總兵不至三首聞道征驂夜未休今朝可到泰安州遲回欲候論心思河上扁舟難久留懸輿歸去一間身到處相逢非故人千里尋君今不見滿懷幽思向誰陳只今相候已如斯别後相逢未有期一去空山千萬里五雲回首各天涯山水圖為王給事理題青山江上起江深欲無路微茫島嶼間亦有人家住日夕西風來亂捲庭前樹江水皆起立溪雲不能駐小橋架空鑿盡日無人度惟有江上山萬古吹不去自鳴藁贈陳百戶入門問姓名知我是儒官延我入席坐取茶為我傳勸我勿深憂謂我且自寬從容意漸密氣和言甚溫日落門已閉但聞鈴鐸喧喚人為掃地鋪榻近牀前舉燈自起照避溼已就乾中夜復相呼問我眠可安清晨邀我起頮盥同一盆念此殷勤意豈啻弟與昆白首猶按劍傾蓋如舊歡平生易為感况爾危難間而能脫流俗相與出肺肝浮雲多變態蒼松知嵗寒感激何由報申此平生言中秋書懷盡向良宵慶太平圜扉寂寞度寒更愁中偏對燈花落窗外空憐月影清遙憶家林難作夢時聞禁漏不勝情至尊萬里興戎馬今夜沙場何處營中秋望月共道中秋月輝輝向壁端預愁夜不見故向此時看桂影才欲轉露華已自寒那能如舊日歡賞到更闌送李伯亮使車昨日到金臺緑水芙蓉花正開圜堵愧勞相問訊客居夢想共銜杯含愁不聽新鶯語躍馬還從舊路來料得故交多出餞寂寥離思獨難裁送人作教官振鐸南行别縉紳不瞻風采自傷神可堪落日驚殘雨空擬看花及早春驛路薰風初去客圜垣斜日獨愁人到家稚子如相問萬里淒涼誰是親送御史巡按遼東自從罹難坐園扉每聽烏啼憶繡衣使節乘春歸上國愁心過雨對斜暉憐分祿米情偏厚愧乏璚瑤願不違盡道門前可羅雀誰知交誼古來稀寄恆遜廣文久别相思見面難今來不得盡交歡九年桃李湘隂滿十月風霜薊北寒愁思不隨雲影散好懷應與酒杯寬孤根儻有回春意好待花開共我看感興偶成過雨晴峯正好看又驚雲霧罩江干氷壺慘淡清秋月松徑陰生白雪寒江淨淺流堪濯錦竹深棄籜可裁冠何人識得緱山路願學吹簫駕紫鸞胡侍御贈皮裘新製輕衣直一金能將遺我及冬深誰憐薄命艱危日獨有平生故舊心夜榻厭燈堪起坐風簷欺冷可行吟長歌為感祶袍意豈效鍾儀奏楚音與瀚子能到圜門裏相看淚泫然愛親渠意切報國我心堅身老多羸疾家貧少藥錢但令無愧怍生死任皇天夢長兄客裏常相夢無如此夢悲為憐居苦地渾似在生時色慘言猶厲情深淚秪垂不才多違訓深愧負連枝秋夜見月髙窗正向東初月淡朦朧不見氷輪轉惟看素練通妻孥千里外羈縶獨愁中悵望清輝裏相思此意同秋暮見霜秋暮今朝始見霜客懷嬰此轉淒涼布衣單夾增寒氣茅屋陰凝背日光草砌蛩聲方寂寂松林樹色更蒼蒼也知時序功成際不為鄒生獨感傷九日醉後呈同飲諸公圜門逢九日清坐得相陪正爾論文際紛然送酒來狂風吹破帽黃菊泛深杯盡飲斜陽裏題詩愧薄才九日再酌幾年佳節留京國今日淒涼處夏臺知己青尊聊共酌故園黃菊若為開情飛紫禁雲長繞目極瑤臺鴈獨回興洽暫因愁思失更將談笑盡餘杯彭疏敬至京不得相見作此遺之郎官逺去牧南邦倐忽還京使我傷旅館盍簪勞夢想圜門離思益愁腸春臨花縣先栽樹寒到金臺未降霜咫尺丰姿瀛海隔苦心不寐夜偏長征婦怨三首前年征塞北今嵗戍邊西幾度占歸信空驚烏鵲啼獨夜登樓望如聞笳吹聲月明沙塞逺何處是君營庭前相送處緑樹葉皆飛借問南來鴈秋深夫可歸雜詩三首幾年種桃李日望成大樹結實未堪嘗爭來摘將去幾年作鹽梅氣質固無異惟有消渴人偏能識其味麋鹿食田榖自向田中聚飽來山上眠豈念耕者苦求何郎中山水圖故園修竹映松關一曲溪流萬疉山五老天低紅日近三山臺古白雲間平村煙樹連空濶逺浦漁舟自往還無那别來懷夢想慿君寫入畫圖間在囹圄中遇九日憶長兄憶别荆庭幾嵗華况逢短景陪思家鴈歸逺道書難寄鵲噪虛簷日易斜夜卧牀幃誰共被曉燃爐火自烹茶何時得離拘攣苦笑詠寒梅數落花彭副使琉約過訪候久不至知有相過處終朝不見來幾回聞犬吠數起把門開翹首瞻車蓋專心拂酒杯徘徊日又夕客思苦難裁北征藁夜行關陜中遇雨次早始逹榆林行在所雞鳴别京邑日落出關門山深路逾險夜黑不待曛崖壁上崇崒澗水中潺湲虛疑蜀川湧實恐地軸翻﨑嶇厯險崿窈窕經屈盤微雨飄然至風徑中夜寒僕夫倦前進欲留山下眠徘徊望陵谷萬籟俱蕭然豈不念夕息鑾輅駐我前疲馬顧影嘶月出髙林端行行險阻盡豁焉見平原曠蕩縱遊目始覺天宇寬初日照大營百里戈戟攢行營列侍從喜遂瞻天顔祥飈捲旌斾瑞霧霏林巒得趂屬車塵安知行路難懷來獨立懷來羽樹間淩秋一望意偏間平原曠衍迷千里古戍逶迤抱兩山近郭雲連青嶂路傍河人住緑楊灣如今扈蹕勤征伐奏凱還從此處還駐蹕土木閲武賜宴諸將乘輿侵曉度層巒駐蹕平原更覺寬西去連山通代谷北登峻嶺入長安雲飛斥候清秋逺鳥避軍門白日寒玉帳前頭因閲武傳宣賜宴聖情歡二十八日駐蹕雞鳴山之沙城出營間逰清蹕駐沙城玉帳淩髙丘團營百里靜日已明戈矛田家惜筋力禾黍尚未收盲飈吹沙塵泱漭煙雲浮晚景風稍定天宇澄素秋轅門得隨步延目遂夷猶近矚雞峯秀淨見渾河流去適山水情返值公與侯撝訶盛騶從意氣赫道周古來説良將不貽明主憂豈伊重髙爵激烈著嘉謀裹革志何壯據鞍心未休一身豈復惜百代聲名留遲回白日下欲言無與酬俯仰氣益奮把筆試欲投拔劍坐深夜寒光衝斗牛何當一搴旗兵氣掃旄頭歸懸藁街邸歌舞頌皇猷銘功在彛鼎彼哉不懷羞曉發沙城由東山間道薄暮始達宣府僕夫促嚴駕曉發鑾輿先避彼雞鳴道迂回由東山山險厯層疉路狹經萬盤下山入地底登髙上雲端俯視蹴飛鳥仰望捫蒼天谷崖莽無路下馬相攀緣﨑嶇幾回轉猶在數里間旌旗蔽雲日劍戟森林巒憩陰摘山果㪺壑漱清泉試看荷戈士飛走輕飈旋邊關雖迢遞大道亦便便既違淡臺志驅馳固宜然悠悠日將夕始及見平川未知足力倦飛騎得前奔疾風覺後隨倐忽達軍門故人喜我至尊酌且相歡願言勵雅操戮力奉至尊但願師奏凱辛苦馬足論道傍老婦道傍老婦七十餘眼中流淚口中呼丁男征戍無生計婦姑開荒種田地東鄰西舍惜犂牛朝朝辛苦在田頭種成禾黍連山谷秋來望收未曾熟今朝軍馬忽過來踐食無餘真可哀但使官軍却強敵免得丁男守烽堠今年飢苦何足憐明年無事多種田一年耕有三年足更得眼前見骨肉宣府北入大王川由龍門往開平西北由萬全出德勝口往興和四面晴山擁翠環孤城正在萬山間平川路入龍門戍絶塞雲連德勝關扈蹕將軍齊虎衛來朝父老望天顔書生愧不知兵略懷筆轅門白晝間初五日暮雨後雪霽承宣草制有作呈同行諸公雨殘飛雪浩漫漫積素連山正好看冷透綿衣添更薄暗飄油幄溼難乾雲開帳殿笙歌靜月落營門劍戟寒天上傳宣催草制華燈歸送到更闌沙嶺營中夜坐作太乙鈎陳到月明連營殺氣夜中橫彎弓欲射旄頭落還從鑾輿出塞行沙嶺在宣府之西此由萬全出德勝口往野狐嶺由萬全左入紅堂口往山西平沙浩茫茫積嶺長風吹射目星炯炯揚飈煙霏霏草莽被髙阜河水流南崖自從出關來幾日才及茲四出環城郭到處長相隨險阻自天設從古已如斯西通白登道北接狐嶺陲鎮衛列兩戍士卒雄虎貔連營堅守備敵人焉敢窺聖心猶未寧秋巡動六師豈惟振威武實欲安黔黎熊羆盡奮發白日雷電飛獨慚劍術疏報恩將奚為送林御史還北京獨持使節出臺端關外人爭識豸冠行在趨朝朝復命轅門握手夜同歡北征殺氣天邊肅南去霜威馬上寒歸見故人如有問軍中無事頗間安八月初九日初聞鴈曉侍軍門到夕暉忽驚賓鴈向南飛靜流寒影迷青嶂遙帶秋聲度翠微作陳豈防矰繳患隨陽寧為稻粱肥尋常不羡傳書美能使看羊仗節歸駕發沙嶺度陽河沿邊父老來迎和黃中書韻鑾輿行處曉風和父老來迎臨大河六師百里迷赤岸萬馬一飲無清波報主誰知寸心苦臨邊自把長劍磨定須逺紹甘陳績還遣邊氓聽凱歌與黃中書入萬全城訪王主事聨轡徐行入栁陰連雲雉堞噪寒禽人家土屋風霜古官府門牆樹木深絶塞孤城千里道舊交尊酒百年心垂鞭信馬歸營去天淨山髙日未沉題黃中書畫竹贈王主事行營寫竹萬全西翠影翛翛望欲迷客至只疑臨嶰谷興來渾憶釣璜溪虛心寒厯風霜徑密葉春承雨露低自是郎官堪比德新詩吟罷為君題八月中秋日午一時颶風起南北雲陰而中獨見日南山外雷雨大作須臾而霽每逢佳節愁陰凝八月十五尤喜晴百里精兵臨塞駐一時颶風疑海行天中白日臨空淨山外黑雲飛雨聲轟雷掣電在咫尺倐忽還收宇宙清楊名堡堡在萬全西楊名舊日説繁華桃樹垂楊繞縣衙自掃邊塵清朔漠空餘雉堞亂啼鴉連村禾黍猶千畝滿堡人煙有幾家訪古從容問耆老出門不覺夕陽斜黃鼠柘彩凝沙映日光平原窟宅翳蒼茫拱門豈畏飛鷹搏入穴還如狡兔藏物類生來形獨異天厨賜出味偏長好當校獵捐軀日莫遣傍人謾得將擬題飲馬窟飲馬長城窟馬多水不乾無人到關塞甘好有誰看俠客辭堂中無復事誓與報君仇一劍成何用空令易水羞摘瓜辭辛苦黃臺下秋風瓜蔓多不堪回首望落日獨悲歌牧羝曲漠漠黃沙外寒氊抱雪眠此心誰復識白日在青天商婦詞十年不到家到家便辭去安得作大石塞斷前頭路續絃詞煎膠續斷絃絃好琴音和莫彈别鶴操好鼓南薰歌夜至萬全城中小寺適寺僧亦自塞上歸晚來尋小寺直在古城間石路斜通市禪房逺見山夜中孤客到月下一僧還靜禮無生法空門不記關九日插栁樊籬逺似村正逢九日在轅門摘花隨意看春色倚劍長歌對酒尊醉裏猶懷陶縣宰風前誰憶孟參軍千官扈蹕承歡宴獨愧無才負聖恩九日吕尚書送燒酒葡萄家釀到邊頭九日分將意獨優可是王𢎞知靖節不勞庾信問蒲州開壺泛菊香猶逺倚醉題詩興未休自覺晚來寒氣薄臨風不用襲輕裘雨中與黃中書圍棊對雨臨棊局終朝興未闌潰圍嘗蹈險取勢每由寬動靜懷張説從容憶謝安須令強敵滅賭勝任為歡自鳴續藁送黃恆修還鄉祭掃五首南還六月别都城獨阻臨溪送客行捲地朔風吹急雨緑楊何處有啼鶯薊門昨夜雨如傾潞渚朝來波浪驚自是虛舟能獨往商船持重不堪行南行誰喜説南風獨棹扁舟逆浪中夜宿廣陵逢北客幾人相語此心同帆轉青原是故鄉頓令桑梓有輝光因君遙憶先塋隔悵望南天淚幾行封章激怒九重天亂撲金瓜玉陛前歸到鄉閭親故問幸留殘喘不須憐商婦怨二首百嵗似相期安知有别離去時兒在腹今已長過眉憶昔初結髮兩鬢黑如漆但恐君歸來白頭不相識楊栁枝章臺大道邊栗里舊門前苦被行人折何如伴醉眠白頭吟交頸鴛鴦思鳴琴誓此心如何未終曲已有别離音桃李樹託根逰宴地寒樹亦花開獨在淒涼處春風淚滿腮古意二首落日層樓上當歌忽自悲空令翻白雪此曲少人知海上望仙山鏘然響珮環如何一水近不遣離人間流水曲滄江無日夜脈脈向東注曲岸多洑流好為操舟渡張百户惠李惠來仙李好礧砢出氷盤瑩潔虬珠潤頳紅瑪瑙寒自應同石髓誰復羡龍肝若遂王戎意如今那得看齊百戶送氷夏熱已難度况此居樊籠徽纆削我體炎暑毒我中故人致清氷髙誼誰與同蕭爽逼涼氣頓覺如嚴冬食之肌骨清煩慮俱消融不聞鳴琴奏怡然對春風沈思艱危際感激意無窮李指揮惠桃仙果何處來採摘瑤池濱香含雨露潤色染胭脂勻結實自有時豈必三千春方朔狎恩愛田疆罹苦辛王母何不吝齊相何不仁世情甘近味幽思誰與論感意良殷勤稍以清形神瓊瑤愧相報述古聊為陳章郎中送茶雀舌金芽玉色鮮貢餘獨得大夫憐寄來春日聞雷動採摘雲林禁火前手閲香逾仙掌草鼎烹味勝惠山泉玉堂曾是誇風韻何似陶潛樂醉眠七夕喜晴盡説窮陰七月多忽驚此夕見明河欲令霄漢星辰會不遣陽臺雲雨過士女茶瓜爭乞巧天孫機杼暫停梭可慚獨守潘生拙圜圄詩成只自歌紀夢萬里雲開天欲曙紫陌鳴珂早朝去覺來窗外雷電驚捲地朔風雨如注與梁指揮飲燒酒宛勝葡萄釀何須鸚鵡杯入門便相喚到手不教催深意憐吾渴愁懷為爾開醉時即髙卧不省有人來月下行吟夜卧不成夢淒涼誰見親起行明月下涼影伴愁人中夜飲酒中夜渴欲飲起來還自斟數杯應不醉燈下獨愁吟夏夜斗轉銀河仄虛窗瞰逺天夜深明月裏夢繞五雲邊夏日雨中黑雲半空來飛雨門前度但聞啼鳥聲不辨雲中樹十四日晚至陵下昔從多士侍朝廷嘗對龍顔展寸誠今日共來供祭祀獨瞻松柏不勝情天夀山路傍林禽樹路傍林禽樹朱實亞枝垂行人不敢動山鳥時來窺路傍棗樹人家棗園本無路未熱人來偷摘去此中棗樹在路傍從人往來莫敢取過晉賢行路皆稱張尹有善政試問肩輿者應知令尹名飢羸俱樂業凶暴少橫行犴獄無囚繫山村有頌聲誰言漢卓魯前史獨為榮五兩日日船南去飈輪忽向東舟人喜相報正是渡江風謁孝陵橋陵一别恨歸遲松柏青青似舊時漢室規模長在想鼎湖雲氣不勝思儀文盡洗前朝弊禮樂終為後代規對越威靈在天表壯年不遇老來悲辭陵絶句八首太極才分有此山龍飛鳳舞擁天關靈宫負扆端居處正在雲霄杳渺間蕭森松柏結愁陰白日常懸舊赤心翹首不瞻龍鳳質空流清淚滿衣襟昔年端冕在楓宸治化流行疾若神萬國車書歸一統四方風俗盡還淳讀書直以古人期記得當年拜命時天地恩深無所報一登廷閣一回悲昔日天門侍聖明春回枯朽荷生成鼎湖龍去青天逺獨抱鳥號淚雨傾曾從鑾輅出邊陲虜得名王奏凱歸從此沙場無戰鬬至今逺塞震皇威少年鳳闕侍龍顔天語從容咫尺間今日玉音何處聽不勝悲苦望椿山每遇春秋上謁時傾心只恐到來遲如今歸老辭陵去回首雲山不盡思十八日發張家灣楊栁初青黃鳥鳴長河兩岸緑波平乍從客路看帆影還想君門聽漏聲七十挂冠雖稱意五雲回首尚關情深恩未報身先老俯仰乾坤愧此生連日行舟大東風長風吹河水倒流對此如何銷客愁半日才行三十里幾彎還見一孤舟商船屢過詢名姓驛吏頻來問去留計日算程關路逺菊花時節到林丘宿螺山菴菴屋幽僻靜無譁十里青山一徑斜舊引泉流長繞澗新移茶樹正開花荒田草合多寒雀曠野林稀少暮鴉日夕相看誰是伴清風明月與煙霞去伐遣人送五月菊石菖蒲詩以道意金錢帶露粲雲光九夏開時分外香若使當年陶令見賞心不但在重陽仙家瑤草種初成此日分來獨有情願遣山居塵俗逺何須嵩嶺説長生余自城中逢與粟同歸過去伐隱居留宿明日告别去伐又欲留有不滿之意作詩贈余勉強和之云城中逢舊友返路喜追陪欲到壺丘去先過剡曲來春舒江上栁風度竹間梅留住堪能久無端歸思催山居病中即事山居少田種江上旋開荒有病多收藥無醫只檢方雨餘千嶂淨春暖百花香逰覽無筋力沉吟自可傷一春淫雨間居寂寥有懷故人率爾短述解組歸來初學耕野田數畝不聊生家貧作事難稱意年老逢人只順情久雨郊園多草色殘春堤栁少鶯聲何應得有巡撫使為我回轡到山城久雨一月雨淋漓山雲拂户低路岐泥沒馬畎畝水平溪江上看濤湧林間斷鳥啼新居無覆瓦終夜竟何栖病中偶成去年病發到今春春夏炎蒸病又新窗下檢方無驗者眼前知已有何人通宵藥鼎常存火五月綿衣未去身不是平生甘寂寞可堪衰疾更長貧病中去伐見訪間居聞我病獨騎逺來看見面深相慰中心便覺寬坐留菜羮飯好似綺筵歡臨别無為贈濤箋寫肺肝題蓮四首芰荷開處藹芳馨鸂鶒雙雙應曉晴絶勝金灘溪水上時來還見繡衣行鴛鴦飛下水東西十里芙蕖望欲迷只少紅粧隔花語此間不是若耶溪飛來白鷺傍紅蓮宛在華峯玉井邊亦有花開逾十丈可應得見藕如船頳霞翠霧護蓮房風度晴漪漾日光好是昆明池上見粉紅墜露散清香新梢捧日密葉新梢長結陰亭亭直節出平林誰言解籜初成竹便有雲霄捧日心淇園暑雨碧樹琅玕翠作團不勝酷暑葉聲乾須臾霖雨從天降信有人間六月寒渭水秋風古木修篁緑蔭稠一川浩浩自東流鏘金戛玉清如許不為狂風也似秋老幹淩雲老樹疏篁自作林蒼藤翠葉嵗年深莫言蕭索寒冬裏厯遍風霜却到今送劉思清分教惠州衰老常多病那堪送客行且將京國酒聊慰故鄉情瀘水秋容淨梅關雪色清惠陽施教日帳下盡羣英伏日燕餞謝謙牧大尹分韻得揮字盛時多令節佳會未能違鳴珮趨清禁聨班近紫微大官應早到方朔豈遲歸華館開朝宴清尊對夕暉運交金伏火暑赫汗沾衣玄鳥先秋去蒼蠅傍席飛羽觴從數勸䊵扇不停揮明日南行客歡筵似此稀送謝謙牧知黔江京華燕集幾論文作宰南行忽離羣鳴珮自應辭聖主過家喜得拜嚴君金臺鳬影三秋别巫峽猿聲兩岸聞自古循良多善政須令黎庶樂耕耘送謝謙牧還任黔江作縣三年政有成東來萬里到神京褒書已荷天邊寵歸棹還從峽裏行暑雨離亭看栁色秋風客路聽猿聲黔江江上棠陰下多少兒童竹馬迎益菴為謝謙牧大尹作端居玩無極悟此造化機日中固當昃月滿輒復虧何如東大海得此江河歸萬古未嘗溢一水不曽遺鐘聲自虛出噫氣從空吹所以古聖人德邵心益卑君子契明義往迹誠所希開軒向前峯那能見崔巍簣積髙自下水流汙成池行矣貴有終姬孔真我師黔江三瑞有序民安政善實相宜和氣蒸祥正此時瑞麥兩岐真可羡嘉瓜並蒂亦何竒更看白燕離羣出為顯清名與世知自昔中牟誇異政由來循吏每如斯黔江大尹謝君謙牧為政既六年政洽民安邑以無事百里之間和氣充周蒸為佳祥麥秀兩岐瓜實並蒂世或有之至於紫燕産雛異色潔白玉立離羣則未嘗有也豈其清修苦節有以致然也耶昔魯恭為中牟令有三異政垂譽無窮今謙牧之在黔江能致三瑞之應如此事雖不同而所以為政之善則無以異也固將光昭竹帛而後先相輝故為賦此詩而識以歸之挽謝處士顔良幽隱孤城外園林二水間門前數竿竹屋後萬重山座隔紅塵逺心同白日間只今那可見煙樹暗柴關瀟湘竹二絶為謝大尹尊甫尚哲題論文作賦與吟詩還憶當年遊泮時一任京華今皓首何如蕭散在東籬又江邊修竹繞雲林三徑翛翛翠色深何日歸來尋舊隱看雲坐石話同心古亷文集卷十一
