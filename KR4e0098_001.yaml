body:
  text: 古廉文集卷一明李時勉撰賦北京賦維皇明之受天命也我太祖皇帝首役義師以平暴亂豪傑景從聲震江漢削除僭竊拯民塗炭定鼎金陵撫綏萬邦乃眷兹土實雄朔方放成周之卜洛欲並建而未遑逮我皇上繼明重光握乾御極一遵舊章仁聲洋溢乎遐邇恩澤汪濊於八荒既致洽於太平遵皇衢以省方仰先志之未遂度宏規以作京羌經營之伊始遍諸夏其歡騰曰惟北都在冀之域右挾大行左據碣石背疊險兮重關面平原兮廣澤崇恆嶽其巍巍鎮醫閭而奕奕冠九門之形勝實為天府之國是以軒轅邑之以分州唐堯階之以為帝擴神化以宜民大勳業之光被鬱王氣之所鍾于今兹而有待也於是仰瞻析木俯測地靈龜筮兆吉天人叶應神祇獻珍而山石自出河嶽效靈而神木自行民子來兮相續期不日而功成爾乃懸水樹臬識景表營方位既正高下既平羣力畢舉百工並興建不拔之丕址拓萬雉之金城引天泉於西阜環湯池而鏡清九衢百㕓之通達連甍邃宇之縱橫顧壯麗其若此非燕逸而娛情蓋所以强幹而弱枝居重以御輕展皇儀而朝諸侯遵先軌而布仁政者也若乃四郊砥平皇道正直視萬國之環拱適居中而建極其南則萬流宗海平林蔽天攬邯鄲巨鹿之廣衍馳平疇沃野之綿延溏淤恆衛徑其墅濡滋淶漆匯其前界以大陸廣阿之宏壤厄以大茂井陘之連山包絡趙魏襟帶齊魯膏腴之地綿亘三千餘里而極於黃河伊潁之川其水陸之所産卓犖繁盛蓋莫得而記焉其北則疊嶂􅕲峗層巒蔽虧長城矗乎雲表百泉湧乎山隈壯天關而設險守一夫而莫開偉左盤而右顧宛鳳舞而龍飛實旁礴而鬱積粵擁衛於邦畿包狼山上谷之阻據狐野獨石之危掩祖山木葉之離立連白登紫塞之逶迤控遐荒而極乎洮河之北鎮朔漠而逾乎瀚海之湄莫不傾心向化畏威懷德相率而來歸其東則潞河通漕控引江淮肥如灤淶灌注縈回連峯片石之隘首陽崆峒之崖玉田白璧神仙瓊臺超無終而越金山跨遼瀋而逾鴨緑至於暘谷日出之涯固已遐哉邈乎而莫不在乎綏懷環以大海衆水所歸洪濤巨浪洶湧崔嵬蓋不知其幾千萬里而蠻商畨舶帆檣隱天不絶而往來又有蓬瀛方壺鳳麟聚窟十洲三島靈異非一流精之闕瓊華之室墉城岧嶤金臺崒嵂紫翠丹青景雲爥日靈圄偓佺安期羡門之倫相與從游乎其間出入隱見而慌惚瞻帝京其伊邇庶可見其驂鸞駕鶴之髣佛其西則崇山鬱翠高挹泰岱北接居庸南首河內奇峯擁關龍門阻隘玉泉垂虹青煙浮黛上嶻􅑖兮倚空下蟠據而際海其麓則有渾河湯湯西湖泱泱鹽溝琉璃桑乾廣陽雪波泛湧灝溔汪洋一㵼千里㑹流帝鄉又有上林禁苑種植畜牧連郊踰畿緣丘彌谷澤瀦川匯若大湖瀛海渺瀰而相屬其中則有奇花珍果喜樹甘木禽獸魚鱉豐殖繁育猋猋籍籍不可得而盡録固可因農隙而校田獵選車徒以講武事乃遵國風稽王制詔期門簡將帥乘玉輅擁翠蓋出天關而雷轟轢芳郊而雲㑹非所以揚兵示武娛樂騁意蓋將取不妊而除苗害狩無擇而順殺氣謹大易之用於三驅之時驗騶虞之仁於一發之際水衡虞人之容與武夫壯士之奮厲皆知夫仁者之為勇而以投石超距之足鄙亦何必殄夷禽獸割鮮野食而以俯仰極樂之為貴也若夫其宫室之制則損益乎黃帝合宫之宜式遵乎太祖貽謀之良居高以臨下背隂而面陽奉天凌霄以磊砢謹身鎮極而峥嶸華蓋穹崇以造天儼特處乎中央上倣象夫天體之圓下效法夫坤德之方兩觀對峙以嶽立五門高矗乎昊蒼飛閣屼以奠乎四表瓊樓嵬以立乎兩旁廟社並列左右相當東崇文華重國家之大本西翊武英嚴齊居而存誠彤庭玉砌璧檻華廊飛簷下啄甍楹高驤闢閶闔其蕩蕩儼帝居兮將將玉户燦華星之炯晃璇題納明月之輝煌寶珠焜耀於天闕金龍夭矯於虹梁藻井煥發綺窗玲瓏建瓴聨絡復道回衝軼霄漢以上出俯日月而蕩胸五色炫映金碧晶熒浮輝揚耀霞彩雲紅其後則奉先之殿仁壽之宫乾清坤寧眇麗穹窿掖庭椒房閨闈閎通其前則郊建圓丘合祭天地山川壇壝恭肅明祀至於五軍庶府之司六卿百僚之位嚴署宇之齊設比館舍而並置列大明之東西割文武而制異至於京尹赤縣之治所王侯貴戚之邸第辟雍成均育賢之地守羽林而掌佽飛者至九十而有四衛莫不井列而棊布各雄壯而偉麗其巖廊之上則有臯䕫稷契之倫元凱俊乂之輩相與賡虞廷之歌談羲農之際罄補衮之能懷忠貞之志考禮文於大備贊聲樂之大美是以朝無缺政德教漸暨薄海內外均陶至治幸其有作聿來趨事成此大功忘其劬勩人和既極休徵滋至慶雲瑞靄之覆於闕庭素烏𤣥之獻於丹陛醴泉屢出甘露數墜麒麟騶虞之珍馴獅天馬之類紛紜雜遝莫能殫記于以見天眷之益隆而聖德之純備者也於是正月上日工既訖工爰告成於天地肆昭美於祖宗清心凝慮齊沐肅雍粢盛既潔牲牷既豐芬郁郁以旁達靈繽繽其來降錫嘉貺之穰穰介景福於帝躬將順應於昌期趾盛美而無窮乃服衮冕御帝座開九重之深殿受萬邦之朝賀內侯甸而要荒外殊方而異俗胥近悅而逺來紛鼓舞而匍匐方物溢以盈庭奓絢燦而駭矚率蹈舞于階墀效華封之三祝爾乃浹和㑹昭景鑠鏗鯨鐘奏雅樂詔光祿以開筵合百辟而燕樂饌珍玉兮芳馨罍璚漿而斟酌聨貂蟬兮夾陛雜蠻貊之荒服莫不酣暢而飽德咸頌歌而踊躍越填城而溢郛藹歡聲而寥廓斯可以嫓太古之無為慶華胥而蹈栗陸顧皇上之謙抑視至治為未足於是降德音播嘉惠省刑罰薄賦稅汰冗濁旌廉吏舉賢才擢俊乂發倉廪賑貧匱尊高年而禮有德慎防禦而修武備貴爵重賞以厲廉恥厚往薄來以馭㝢內蓋欲使人知所本士知所勵四方萬國無一民之失所窮陬僻壤無一物之不遂舉陶於春風和煦之中而樂於雍熙泰和之治此蓋堯舜兢業之心文王敬止之意所以紹鴻業繼先志益宏逺而有偉故不勞而甚易冠絶乎前古垂休於後世固可必聖子之與神孫益暢茂而無替小臣微陋忝職文字願賦帝都之盛槩揚國美于萬祀復為之歌曰煌煌帝都兮逾鎬豐組山帶河兮壯以雄天開日明兮王氣所鍾穹窿造天兮惟帝之宫廓氛祲兮開溟濛鎮諸夏兮宣皇風王道平平兮四方來同願皇圖之鞏固厯萬世兮無窮白象賦炎海之濱和氣薰蒸山川育秀瑤光降精祥氛瑞靄煜煜熒熒而奇獸於是生焉其色皓潔厥狀瓌奇修牙玉潤柔毳霜披燭青霄而有耀瑩白璧而無疵浥甘露以澤質餐沆瀣以充飢峥嶸乎宇宙掩映乎朝曦鼓舞踊躍風回電馳爾乃出林谷離嶔㠌遊廣澤憩郊陲祥煙被體白日凝輝長鳴而山谷震昻首而絮雲霏濯清流於碧海斂素彩於咸池行大陸而莫蔽步皓月其誰知若乃賦性易馴任力莫敵動若嶽徙止猶冰積恍雪山之峩峩訝璚島之奕奕首不以觸齒不以齰其産也固由乎天造其致也不藉乎人力進退步趨必由於規矩蹈舞跪起寧勞於訓飭巴蛇為之斂暴文犀為之辟易兹蓋異於伊水之長洲豈獨産於弗林之大食使姬旦見之應獨驅於虎豹軒轅得之亦何羡乎白澤此其所以罕聞於前古而兩見於今日也爾乃綿首燦爛羅絡玲瓏掖以羣類從以胥童顧盼炳煜步履從容辭荒服之逺徼獻蓬萊之新宫豈比夫深山之麋鹿徒接跡於蒿蓬固當以麒麟而為侣慶盛世之遭逢遊靈囿以自適沐膏澤於無窮麒麟賦惟聖德之廣運兮屢感召夫禎祥粵瑞世之仁獸兮乃復見夫遐方榮光淡其輝耀兮佳氣蓊其汪洋曜靈晃以下燭兮海波靜而不揚邦人聚而來觀兮偭徙倚而倣徨徵往牒之所紀兮叶瑞應其彰彰繄含仁而懷義兮復步履之安詳彼生草之不折兮矧生物之或戕不踶觸以相戾兮寧羣居以為亢嗟彼毳之總總兮敢接跡而隨行遭聖人之在位兮霈恩澤於窮荒仍曠世而一出兮昭皇化之無疆實中國之大瑞兮豈小國之敢當爰卜日而命使兮肅惟戒乎舟航羌侑之以方物兮于以貢夫神京離屬國之僻逺兮道瀛海之滄茫神飈颯以清路兮百靈繽其在傍波灝溔而粼粼兮雲飄拂其雵雵偕神龍以為侣兮挾靈龜以為朋鯨鯢伏浪而屏息兮鸞鳳下顧而回翔邅汗漫以徑渡兮肆陸厯乎康莊犀兕紛以雜遝兮騶虞掖其蹡蹡彼熊羆羣於虎豹兮暨鵾鵬之與􅒗鶬徒飛走其誰羡兮咸錯愕而相望乾坤蕩而清肅兮山嶽煥其焜煌踰重譯之迢遞兮爰始達於帝鄉望九門其既闢兮雙闕燦其光芒翠華絢日以冉冉兮金莖浴露以瀼瀼冕旒儼其既臨兮瑞物偉其在庭性振振以自馴兮乃不擾而不驚龜文燦而濯濯兮龍首挺其昻昻方引脰而一鳴兮叶律吕而諧宫商重瞳載顧於丹扆兮百辟歡動乎巖廊曰麒麟之為物兮實瑞世而匪常昔軒轅之至聖兮來苑囿而徜佯或遊憩乎郊藪兮復一見於成康周詩托咏於仁厚兮傳記徒載其荒唐惟我皇之仁聖兮勤宵旰而不遑治化隆於三代兮功德嫓乎羲黃既禮備而樂和兮惟端拱而垂裳此至瑞所以特見於今日兮實有徵於太平顧微臣之謭謭兮幸遭逢乎聖明惟盛德之深厚兮欲稱頌而未能竭菲才以為賦兮于麟趾有其光祝聖祚於悠久兮與天地而同長獅子賦偉西域之奇獸性猛戾而形殊匪圈束之可制豈鞿紲之能拘離中國之既逺固難得而見諸惟聖皇之御宇德無逺而不被越侏􅍣與左祍率獻珍而奉贄豈兹物之是遺厯重譯而俱至觀其鈎爪㦸利鑿齒霜潔首固蜀山之金額壯昆吾之鐵紺眼晶熒蒼髯煜燁體性禀金精之剛毛質得中央之色尾冉冉兮綴裘腹皎皎兮凝雪清風飄拂乎柔毳赤日炫曜于廣臆哮吼則威聲雷奮顧盼而目光電激林谷為之震動江河為之蕩潏舉趾迅奔則千里倐忽奮怒揚威而百獸戰栗萬牛失據六駮奪魄驅貓喪氣猰㺄屏跡白甝懾以奔竄元熊局而辟易捩犀兕以飛涎磔虎豹而喋血兹所以為毛羣之特而非可致以人力也昔軒轅之盛時曾一見於東巡厯億載以逮兹幸有生之逢辰顧西極之綿邈沐膏澤於皇仁雄姿弭其如擾猛氣婉以自馴固將逺攬騶虞接跡祥麟游乎靈囿之內違夫寂寞之濱安能踡局於哈烈之地與歲月以因循爾乃慿祥雲駕雕闌涉流沙踰玉關倚天路而蹀足望都城以怡顔金門曉兮洞開龍駕儼以臨軒與方物而並進伏丹墀以盤桓珍禽奇獸固非聖人之所重而嚮風慕義乃逺人之所先亦惟我皇上有懷逺為近之德居重馭輕之權故四逺咸服中國奠安仁恩溥洽而兹獸自致乎苑囿之間是蓋同符於越裳之貢雉而實盛德至治之應豈徒夸以為奇玩若赤烏白之角端也哉嗟淺薄其何庸屢進退於金門同百辟以拜舞觀盛美而欣歡繼頌聲以獻賦效微衷之惓惓願皇圖兮鞏固祝聖壽於萬年冰雪軒賦客有乘玉虬駕雲車慿祥風以遐舉將縱觀乎名區邅天路以遊遨倐豫至乎帝都訪瀛洲之仙侣造冰雪之軒居觀其四壁皎潔中庭廓舒顧紛濁其何有開縞素之新圖雲慿慿其在户風冉冉兮飄裾凌天山於咫尺俯冰谷於座隅澗不寒而長沍林未春而先敷色炯晃以承日氣婪栗而襲豫乃淡然而忘反相與偃仰而怡愈軒中主人乃顧謂客曰子知吾之處乎是軒抑亦知吾名軒之意已乎客曰吾聞之水伏隂而為冰雨遇寒而為雪實因時而天成非有假於人力當夫嚴氣既升北風凛栗溫泉凝而不流沸井涸而不溢渺洪河兮萬里冰峩峩兮千尺雪氛氛而交下恍澔涆其委積既增高而臶庳忽穢掩而瑕匿雖金玉不足以擬其堅而白羽焉能以侔其色際春陽之和煦乃泮然而流液揆物情其若此覩名軒其猶惑主人仰而吁俯而太息曰名固各有所寓而意各有所適茍惟求諸形似窮探討其焉極客曰吾知之矣於斯時也無愁戚之態有燕賞之樂襲貂裘兮䝉葺焚獸炭其芬馥欲撾鐘而考鼓亦炮羔而烹犢璚筵列珠履之英玉管閒青商之曲將適意其在兹而名扁以寓闕三益鮮聞五交遂起朝握手以同歡夕反目而相視此晏平仲之所不與臧孫紇之所不齒曾不若三者之不改其舊而無可議者乎當夫雪霜摧之而自若驚飈觸之而不抗有子淵犯而不校之氣象焉羣芳既歇而益盛榮華比之而不屑有任安獨立不去之志節焉歲寒相保而益堅顔色相顧而不戾有范張守約不違之信義焉是則物之所可嘉而人或有不逮者矣若夫脅肩諂笑比附沈湎隨波逐流樂而忘返孰與挺然如端人莊士正顔厲色可畏而不可犯也功利相趨禍患相避憂樂殊情貴賤異志孰與不爭榮于春風不相捐於憔悴而寒暑一致也貌順心違殄行敗德忌能毁善志滿意得孰與虛而有容質直無飾而表裏洞徹也况乎語其才用則可以為棟梁之具備鼎鼐之味叶律吕之音而非尋常之可擬故傅說出乎版築任和羮之重寄武公敏於自修歌淇澳以自勵夫子見其後雕爰興懷於歎美顧豫何人乃欲托交於三物而為四偃仰思之猶或顔靦而心愧奈何以凡草木視之而譏其友之為非是乎今之論者徒習於世俗之所尚狃於耳目之所䁥無有重金蘭之契崇麗澤之益樂談乎仁義琢磨於道德者乃屑屑於往還煦煦於朝夕及其一旦背而馳也然後勒門以為戒廣論以示絶雖有警於將來諒何救於覆轍回顧吾之齊居反不知草木之可悅也於是客乃赧然謝曰鄙人固陋昧於博識一聞雅言渙若氷釋拂衣而歌抗手言别歌曰芳菲菲兮競陽春野遊遨兮交朱輪樂歡賞兮及良辰怦豫心兮將誰與論公子歌以和之曰山蒼蒼兮江水深偭遙路兮不可尋襲芳香兮息曾隂坐白石兮絃素琴清風時來兮明月滿林於焉逍遙兮誰知我心瑞應景星賦有序宣德八年閏八月戊午昏刻景星見於西北乾位天門之上其色黃潤照燭如晝明日欽天監以聞百官奉表稱賀以昭聖德之致皇上謙抑不居誕降德音戒飭羣臣敬慎有位共圖治理以承天休臣伏惟皇上是心即堯舜刺天之命大禹不自滿假之心也夫如是天命安得不固天下安得不理治效安得不如古哉臣退稽典籍瑞星有五景星其一也王者至孝德洞幽微舉賢命官不私於人號令禮樂協民心合天意則景星見見則國祚大昌堯之時一見於翼舜之時一見於房自是厥後寥寥無聞厯數千載而特見於今日於以見天眷聖德有隆而無替而國家萬萬年太平之盛亦兆於此矣何其幸哉臣䝉國恩備詞林躬覩嘉祥不敢以默謹撰賦詞一篇以歌頌盛美垂示無極賦曰維皇御極于今九年海宇寧謐民物阜安和氣薰蒸坱圠無垠奇祥異瑞畢至駢臻粵惟歲之仲秋兮月閏夕之初昏試仰瞻於天門兮劃欣覩夫景星訝光彩之炫映兮紛煜煜而熒熒於時銀漢澄碧滉漾太清素娥啓匣炳靈若英豈惟麗天而有耀兮將助月以為明蟾倚桂而凝睇兮望舒倚馭而不征顧朏魄之未充兮倐澄輝其若盈六合晃其如晝兮風露寂以無聲若乃北極煥映齊玉燭以宣朗兮越清徹乎恆營華蓋儼其可挹兮泰階平而可升統衆曜以環拱兮翊皇御乎羣靈爥河海以燦爛兮波濤靜而不揚馮夷出而抃舞兮海若起而徜徉鯨鯢引領於絶岸兮蛟螭跂足於渺茫曩昔處此長夜兮兹朗視乎彼蒼若夫荒嶠僻壤隂山積雪背陽之阿面隂之室窮岩絶壑茂林叢樾雖白日猶罕麗兮尚可望乎明月忽天光之下臨兮袪昧晦以昭晰草木被其光澤兮咸欣欣以茂悅爾其蓬瀛洞達金莖融液瑤臺凝素玉漏微滴雞先鳴以警曉兮鵲繞樹而未息珮珊珊以響起兮爰益集乎百辟率踴躍以快覩兮終惝恍而莫識於是揣圖以𤣥覽兮稽往牒以究詳兹實國之大瑞兮其為狀也無常或一參兩而為三兮氣青赤而連芳颯焉合而半規兮燦奇色以輝煌或環圜而空中兮騰瑞彩於八荒曰有象而無其次兮恆見於有道之世王者不私人以官兮俾賢俊之在位號令協於民心兮禮樂合乎天意至德洞於幽微兮大孝顯而莫嫓圓靈不祕其神兮斯昭焉而一出昔神堯之時雍兮翼軫萃其祥光暨重華之協德兮乃復顯於氐房越漢武之大誇兮徒以被之樂章曠千祀而莫覩兮昭聖美於吾皇至治極而馨香兮肆天降之嘉祥揆前古而莫與並兮宜接跡於虞唐嗟微臣之淺陋兮沐萬世之恩光龍馬頌欽惟皇帝陛下自即位以來惓惓以敬天愛民為急務旁求哲人布列庶位罷黜貪殘以懲不率人心以勸民用和悅於是萬幾之暇發其睿思作為文章經緯天地光耀日月是以至和之氣薰蒸洋溢萃為嘉祥莫不來備乃者龍馬又出於西北守臣奉以獻頂耳騣尾皆與龍同鬈毛參差宛若鱗甲體色純白光潤如玉羣臣觀望莫不抃舞頓首呼萬歲退而欲上表稱賀皇上謙抑不居敕命勿賀臣伏念伏羲在位龍負圖出於河伏羲則之以畫八卦而人文始昭今皇上德合天地恩洽四海而聖藻神翰貫絶古今故皇天眷佑致此龍馬應瑞而至以昭國家文明之盛宗社悠久之福而聖壽靈長之徴蓋與伏羲同符不可以無紀述垂諸久逺謹拜手稽首而獻頌曰惟皇臨御德合乾坤仁恩溥洽和氣氤氲萬物並育百祥駢臻惟此龍馬與凡馬異元氣所鍾靈和所萃匪德匪時其何能致厯稽往古粵惟伏羲曾一負圖出於滎河於洛之湄八卦之畫斯其是則越數千年邈不可識匪天之圖惟覽於德其來斯來匪人之力惟今天子德邁羲皇發其藻思蔚為文章雲漢之昭日月之光惟是龍馬惟德之應羣臣快覩抃舞稱慶惟瑞之徴惟天子聖惟聖天子謙抑不居時和歲豐為瑞有餘臣拜稽首欽承聖謨祝天子聖荷天之佑祝天子壽與天齊久小臣作頌播於九有祝天子聖長有兹瑞祝天子壽萬百千歲小臣作頌以告來世古廉文集卷一
