body:
  text: 古亷文集後序翰林學士國子祭酒古廉李先生之歿三十餘年其孫顒宰惠之長樂數年始克彚集先生文稿若干卷託廣州郡守鄉先生伍公校正夀梓以傳屬豫一言以序諸末簡豫觀先生之文渾厚醇正博洽贍麗淡然菽粟之味鏘然韶鈞之鳴真可以追蹤古人卓冠當世後生小子安敢容喙於其間哉然豫少居鄉閭聞先生之忠言讜論切於時政一時名聞海內如景星鳳凰天下之人爭先而快覩焉及豫叨領鄉薦宦逰四方先生雖已物故而凡見公卿大夫出自先生之門者無間隱顯莫不相與感慨夫先生之儀刑有不可得而復作焉是則先生之忠義德教傳之天下浹於人心愈久不忘而况於文章之作有不足以歆動於人而傳於世耶夫泰山之峻絶天下之人雖不盡見而皆知其為髙河海之浩瀚天下之人雖不盡涉而皆知其為大先生之文本之以道德參之以才氣而又浸淫乎六經搜獵乎百家其言辭之發見諸行事之實皆足以扶世立教正君善俗如是而鳴當時傳後世豈不猶泰山河海之髙大天下之人幸而見之者莫不有以快其心目焉雖然此特先生之餘事爾至於臨大節而不可奪者載諸史册而無愧勒之金石而不磨千載之下猶可以使人感慕興起奚翅文章之傳而已哉姑書以為序云成化十七年辛丑嵗冬十月既望廣州府儒學教授吉水蕭尚彛序古亷文集後序
