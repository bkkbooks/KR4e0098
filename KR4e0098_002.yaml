body:
  text: 古廉文集卷二明李時勉撰記車駕幸學禮儀記孔子之道堯舜禹湯文武之道也堯舜禹湯文武以其道施諸當時孔子修而明之以詔後世使天下後世知有堯舜禹湯文武之道而服行之以開太平之治者孔子也故孔子者窮天地亘萬世而不可違也我國家自太祖高皇帝平一海內即詔天下皆立學宫祀孔子申明五常之典以正前代之弊習繇是文教大興四方外國皆遣子入學是又修明孔子之道以致然也聖聖相承光啓文運薄海內外翕然同風皇上嗣大厯服祗循舊章而求賢訪道之心尤篤顧惟賢才為致治之本然賢才之出必由學校而太學者首善之地風化之原所係尤重每注意焉而言者謂舊學卑陋宜改建高爽皇上命司禮太監臣王某往視之還奏舊學地寬平深靜為國家教養人才實惟其宜上乃詔工部撤而新之命內官監太監臣阮某總其事某等精勤不懈晨夜展力以正統八年秋興工未三月而廟堂廊廡巍然煥然堅壯完固師生之舍庖廪之所至於祀事之需教養之具莫不悉備告成之日優加勞錫明年春二月皇上刺禮部擇吉日嚴法駕以三月朔旦躬謁先師孔子先是禮官言常制帝王幸學惟釋菜皇上特命加祀孔子以大牢餘悉如春秋釋奠儀既而幸彞倫堂命臣等講論經典冠帶縉紳之臣逢掖介胄之士圜拱而觀聽者以億萬計駕還百官忭舞稱賀聖心悅懌明日特燕太學儒臣賜之襲衣誕降綸音申以勸勵文武吏民莫不瞻望歎羡以為太學之盛寵眷之隆斯文際遇古所未有其禮儀節目恩榮次第宜勒諸貞石昭示方來使四方萬國皆知皇上崇儒重道之盛心禮部以聞特賜俞允臣竊惟虞夏商周學校之制教養之方載諸經可見已由周而降若漢唐宋其間願治之主非不知建學育才之為重然有未盡善者惟我太祖高皇帝創業於前太宗文皇帝繼統於後皆嘗幸學以奬文教仁宗宣宗尊崇聖道嚮用儒術實同一心故人才治效比隆古昔仰惟皇帝陛下以聰明睿智之資統承列聖丕闡大猷禮樂昭明教化洋溢宏謨逺略真近代所未聞而聿修廟學躬禮先師使聖道愈明於世其神功聖烈誠與堯舜禹湯文武同一揆也猗歟盛哉謹用撰述而備刻之使觀者有所感發興起為臣盡忠為子盡孝風俗益以淳美世治極於隆平則我皇明之祚與天地相為悠久矣謹記營建紀成記夫營建國家大事為國家舉大事而成之若無事者然非其才賢公正足以任之而無分毫私者不能也正統丁已春皇上以三殿朝會燕享之所而九門與百官庶府皆所當營建者乃命內官太監與工部臣計議以聞議既定上命阮某曰經營圖為悉以付汝汝出總之其往欽哉公既受命營度規畫惟日孜孜會其高下大小之材計其金碧藻繪之物量其事期緩急之序與凡工匠力役之所出權其輕重多寡究其始終盈縮度可以為之也然後諏日興工衆力齊舉萬手偕作不三載而都域九門皇域四門成又二載而三殿兩宫以及祀天之所觀天之器莫不皆成又二載而五軍六部暨夫百司之署賓客之館亦莫不皆成乃眷辟雍育才之地不可以後不三月而廟堂又成公於是告厥成功皇上嘉勞甚至而錫賚優厚公乃書其事始末來曰吾受朝廷厚恩無所報稱罄竭心力以圖效其兮寸者實在於此幸為我記之昔者成周之營洛邑本武王之志至於成王而後成之成王之所以成洛邑也召公周公相繼而往費心勞力蓋亦不易矣國朝遷都北京營建之事自太宗文皇帝以來三十餘年猶未就緒今皇上以至聖之德纘承大統守祖宗之成法行寬仁之善政海內富庶一與休息惟注意於此簡任內臣以蒞其事於時百官皆修其職四方皆以無虞民心皆已安樂是惟無作作則翕然子來無不應者而六七載之間興大役以建萬萬年不拔之丕基而民不以為勞但見宫殿樓觀巍然煥然高聳乎宇宙輝映乎日月若未嘗有所為者然於是過成周逺矣蓋成周所以用役作者殷民也殷民服周之化淺必待誥諭諄切而後能使之是以難也若我朝五聖之德澤漸磨涵養之深一旦有所興作宜乎其歡欣鼓舞聿來趨事况二公以超卓之才任事之際又能以寬宏公正之心而行之故其成功不勞而甚易也如此豫於是不獨有以知二公之賢又有以見皇上知人之明而任人之專雖三代聖君有莫能及因公之請特為記之使後者有所考焉刺建永通橋記通州在京城之東潞河之上凡四方萬國貢賦由水道以達京師者必萃於此實國家之要衝也由州城西行八里許有河蓋京都諸水之會流而東者河雖不廣而水潦沮洳每夏秋之交雨水泛漲嘗架木為橋或比舟為梁以通道往來數易而速壞輿馬多致覆溺而運輸者尤為艱阻勞費煩擾不勝其患太監臣李德等以其事聞上欲於其地建石橋乃命司禮監太監臣王某往經度之某還奏云此陸運之通衢商旅使客往還之要路建橋實宜方今不燠不寒興工修築是惟其時然欲堅久而不壞在委任得人上聞即命總督漕運都督臣武興等發軍夫都指揮僉事臣陳信領之工部侍郎臣王永和督工匠內官監太監臣阮安董之安謂衆曰朝廷遷都北京建萬世不拔之丕基而漕運實軍國所資重務也故興役萬夫齊奮並手偕作未及三月而功已就緒橋南北五千尺為水道三券券與平底石皆交互通貫錮以鐵券水石護以鐵柱當其衝橋東西二百尺兩傍欄檻皆以石為之作二牌樓題曰永通橋蓋上所賜名也又立廟祀河神而以玄帝鎮之經始於正統十一年八月二十七日告成於十一月某日阮公與侍郎王公謀求請豫記昔文王作臺於苑囿固無預於民事而民歡樂之謂其臺曰靈臺詩人又被之歌詠傳誦至今皇上營建此橋實所以惠利於人而人踊躍歡欣以趨其事者誠無異乎文王之時亦何其盛哉是故不可無所紀述以傳示後世因公之請特為記之而又繫之以詩曰惟皇仁聖統御寰宇萬方畢臣罔有違拒粵惟漕運軍國所資道江厯淮其來如歸潞河湯湯漕舟所聚陸運京師有河伊阻帝曰臣某汝往視之惟梁惟石惟其宜之臣具還奏誠如聖制作為橋梁萬世之利帝曰休哉是惟在人我其命之汝為豫申乃命永和汝督工匠勿亟勿徐德綏是尚曰內臣安汝其總之經營規畫惟汝是司安拜稽首敢不盡心圖為堅久以副德音羣工百役莫不踊躍攻金攻石並手偕作惟橋南北惟水西東不日而成敷奏厥功商旅使客車輿步騎昔憂顛覆今履平易岸有豐草水有遊魚昔為嵒險今為坦途運輸之來紛紜絡繹國用以序廩庾充實行者忭舞以播頌聲四方無警萬國咸寧惟此成功帝德之致勒之兹碑以告永世修造盧溝橋記盧溝在都城西南四十里外凡趙魏汴宋秦代隴蜀滇南交廣吳楚淮江陸行以入京師與夫朝廷之使臣仕宦商賈之人自京師道西南以適四方萬國者皆由於此是蓋國之要津也舊有橋橋有石欄作於金明昌中以通道往來至今四百餘年矣頽毁日甚車輿步騎多顛覆墜溺之患所宜修也橋之近有固安堤故狼窩口也春夏之間驟雨時至水潦衝激嘗加修築築輒復決決則有漂沒民田廬舍之害所宜修也然國家所宜修者不獨此顧有所未暇及焉耳今上皇帝即位詔內監與工部臣計國家內外所當營建者有幾次其緩急先後以聞於是特命太監阮公董其事公既受命晨夕惟勤正統九年三月朝廷宫殿以及百司庶府莫不皆成公奉命往西山過盧溝見橋與堤之患還奏曰盧溝橋不修且壞而固安堤水患猶在今京師之工既畢請致力於此上曰然汝往治之公於是率工匠往視橋一理新之水道十有一券錮若天成東西跨水凡三百二十有二步平易如砥欄檻其兩傍凡四百八十有四鎮以獅象華表堅壯偉觀公又行視堤曰此吾向所築者猶不足以捍其患也耶乃循水而六七里許至卧龍岡之東南岸曰其病在此於是相其所宜是濬是築以殺其勢使漸流而西水循其道而堤以無虞往者臆決工費纍巨萬經歲不得休今不踰月二工皆以告成而民不被其擾不預其勞但見其東西行過是橋者若履亨衢公務才力之通於橋下者若道平川民之安居樂業而無蕩析之慮者其誰使然耶公之力也公何以能然哉豫嘗觀公之為人矣正以持已公以蒞事勤以率衆而惠以恤下正則安公則悅勤則有功惠則足以使人而忘其勞持是以往將無所為而不得者而况於此工之近小者耶公嘗圖其迹以示豫曰是工雖小然有以見國家之於政由內以及外先其所急而後其所緩有如此也吁公可謂知本者哉夫京師天下之本也公既盡心於所務而後致力於斯所以不勞而甚易也歟後之人有不知公者觀於斯圖則其所為之大者可從而推也是故不可以不記正統九年三月十有六日其經始月日也是年四月十有八日其成之月日也記作於六月草日云新化縣重修學舍記學校風化之原誠牧民者之先務而世儒俗士往往忽之乃汲汲於簿書期會之間視此為迂緩不之經意此教化之所以不興人才之所以不盛而治功之所以不廣也新化湖廣寶慶之屬邑庠學在其邑之西建始於國朝洪武之戊申規制庳陋庭宇狹隘見者知其不稱無能改作厯歲既久學舍頽圮廟屋亦壞師儒講學莫啓觀瞻春秋祭祀無以展誠及莆陽黃君濟生來為幕賓首謁學宫顧而惕然曰是豈非為政者之羞乎於是與長佐謀出捐已資倡率於衆庀材僦工既以完具乃蠲日之吉悉徹而新之禮殿講堂門廡齋舍泮池橋門與夫庖湢之所栖息之室莫不畢備壯麗閎大加於舊觀又設先聖先賢像於其位經始於宣德丙午秋七月落成於是歲之冬十月是役也工費不為少矣一毫不斂於民功成而民不告勞此其所以為賢也濟生聰敏有才略諳練政體識達事機其來贊政也能留心於學校以為先務使弦誦之聲被於閭里而射鄉祀享皆有以備其禮儀民之得於觀感之間翕然化服而經生學士知所勸率獷驁悖戾知所改悔鰥孤羸寒得所依歸如是而俾教化之行治功之成也甚易賢才之出將彬彬焉盛矣然則為政者之於學校豈細故哉彼有不能而幕職能之是可嘉也濟生比以職事至京師求豫記其成以告於後之人益理而修之俾勿壞尤見其用心之至也於是乎書江浦縣學重修大成殿碑隂記學校育賢之地實有司之首務所當盡心者也有司不盡其心而典教者不加之意焉則教化陵夷風俗頽敗而賢才委靡不振宜也江浦縣學在大江之濱縣治之東歲久傾圮厯載以來莫克究思廬陵孫鼎來為學官謀於訓導孫珙等曰學之庳陋如此欲重修之堂廡齋舍庖湢之處可因其舊規其功小而力為易若至孔子廟臺殿庫狹非一大徹理新之不足以棲神起敬稱王者之居然其功大力不足以為宜先圖其易其必有好事者感發慕嚮則庶乎其可乃相與告於縣之長二各捐已俸鳩工聚材徐而葺之於是衛之賢特與邑里之耆老儒秀商旅使客之過往者聞之相率出錢幣榖粟爭來助應財力既具遂經始大成殿悉去其故而惟新是營增庳擴隘極於高廣衆心齊奮羣力畢舉曾不幾時而殿宇巍然奐然百廢具興莫不完好明年春享祀禮畢大合文武僚屬與士民之俊秀邑之老長子弟咸集來觀瞻望歎羡以為兹邑學校之興禮義之備文物之盛未有若今日者是皆良有司者之能盡其心賢典教者之能加之意以致然也咸願立石以紀之孫君遂請文於右都御史熊公以刻之碑又欲列縣長二以下及諸相助者之姓名於碑之隂而請豫記栁宗元曰仲尼之道與王化逺邇蓋王化之所至孔子之道亦至焉雖蠻貊無以異故宗元云然夫以蠻貊尚知篤信孔子而尊其道况在中國畿甸之內也耶凡吾父子兄弟夫婦長幼其序秩然而不紊其恩歡然以相接惇禮樂尚仁義有以異於禽獸異類者其誰之功也然則由其道立其宫以奉之未為過是固無足道也特以其能知所尊而信之猶愈於飾佛老之宫溺而不知止者故列序其人庶於世教有警也是以記之博羅縣重修儒學記博羅縣學廣文李先生聞豫以祭掃還至家遣人以書告曰縣舊有學在浮定江之側地既狹隘而左又有武安王廟故學宫無門由櫺星門以出入永樂甲申縣令林和至以為非宜遂遷廟於延壽寺之左而闢學門於其上來者始起觀瞻辛卯縣令昌祚重修大成殿是後典史吳吉修起戟門署縣事稅課大使龔福修復眀倫堂兩齋學舍庶幾其備也曾不十載腐朽弊壞已甚正統初皇上以天下學校之政不修簡賢以任風憲之職專督勵之而廣東則僉憲彭公實承命以來明年秋巡厯至兹邑展謁廟庭顧瞻前後惻然曰此有司之過也自漢以來郡縣皆有學學有廟廟以棲神學以施教今廟學毁墜如此神無常棲祀事何所展誠教無所施學者何所取法遂欲更而新之慮無能董其事共謂府判鄭君廉慎有才智實堪任之檄使以來君至周覽度曰此易易耳昔之所以屢成而屢毁者所司不為經久計取其速成具為目前觀美數費勞力不顧也遂欲圖其久逺不在乎他材木磚石之用取其碩大堅好而梁棟室屋不在華美取其完固而已衆咸曰然於是經營調度不資於人不擾於民不旬月而百用皆具乃召匠僦工諏吉興事衆力齊舉並手偕作經始於丁巳冬十有二月已已落成於戊午秋八月上丁日殿堂廊廡齋厨庫舍奐然一新雄壯宏廓視昔有加時邑二令劉君適理縣事亦克盡心乃謀於衆欲具石記公之德與鄭君之勞以告後之人俾勿壞或壞而能修之者用是取以為請夫葺屋瓦囷倉之制至微也而周官猶悉書之以為後法况學校首善之地賢才之所自出而可不加之意哉有能加之意者又可使之無聞哉昔漢何武為刺史行部所至先即學宫接見諸生試其誦論問以得失鮑德為南陽學校廢弛乃修起黌舍宴舍師儒觀者嘆服故二公名昭於時而傳誦至今今僉憲有何武之賢判府有鮑德之功其所以見重於時而垂聲於後世也又豈有窮哉若二令之與廣文能謀所以使人之善傳諸久逺是皆可書豫故不辭而書之使并勒諸石云僉憲名琉安成人鄭君名述莆田人二令名智安成人廣文名浩建安人高安縣重修儒學藏書閣記高安縣儒學在縣治之東宋政和間所建元末兵燹學廢國朝洪武中因舊址修復之然其地狹隘東逼衛治西逼縣牆前臨大街後近於城雖有隙地而為戍卒所據師生講誦無所栖宿無舍書籍無所藏飲膳無所設殿堂廊廡悉已弊壞祀事無所揭處正統戊午提督學政僉事彭君育敬巡厯至是欲擴而充之顧瞻左右莫可為力獨其後軍營實舊學地雖失之已久而理有可言衛帥聞之即徹軍營以其地來歸君於是即其地創為高閣若干楹上以貯國朝詔刺及所賜書其中下為諸生講論之所西為膳堂東為會饌閣之前為明倫堂堂之兩傍為閣皆三間下以為西齋上以貯經籍子史諸書堂之南為大成殿兩廡戟門以次成其西有池曰浴沂池水深而長傍池之東為屋若干楹以跨於池上覆以板闌檻軒窗疏通明達牀帳几席悉具以為諸生退息之所池之西為射圃南為校官廨宇凡三所其二南向皆東出至於神厨庫廩庖湢之處莫不備具地雖狹隘而規制壯觀有加於昔經始於正統戊午之春三月明年已未春三月訖工儒師萬載李君瓊書其事來請記且曰是役也多因其舊餘各創為之而所重者又在於書故吾於閣言之特詳焉夫堯舜禹湯文武之所以為治孔子孟軻顔曾子思之所以為言臯陶伊傳周召諸臣之所以匡贊輔弼之迹馬融鄭玄周程張朱諸儒之所以論議訓釋之辭與夫古今治亂興衰之迹以及聖朝訓飭誥誡勸懲之制皆載諸簡策凡師之所以為教弟子之所以為學皆在於此不可無者况學校乎今高安縣重修學舍而能篤意於此特閣而藏之可謂知所重矣誠使學者能即此以講求二帝三王之道先聖之言以修其身以勵其行則其才之成亦易矣用是知嶺南之士彬彬然輩出者必先於高安見之因李君之請書此以復之以為他日徴云黃岡重修學記學校之興有資於守令舊矣文翁之在蜀郡范純仁之在襄邑皆以能興學校崇教化致民俗丕變故聲譽顯於當時名聞昭於後世有不可及也蓋學校風化之原三綱五常之道由是而後明詩書禮樂之教由是而後行風俗由是而變人才由是而出古昔治效之盛所以為不可及者有此道也洪惟我太祖高皇帝自正位以來輒詔天下郡縣皆立學置師弟子員付之守令以陶淑之藩臬二司考察其勤惰而勸懲之賢能文學之士往往出其間自公卿大夫以至於州縣之選常不乏人焉是亦興學之效也比年以來儒學之士多以記誦文辭為業而不務實學蓋由有司每以簿書期會為急視學校若不干已者至於廟舍頽毁教化廢弛略不加之意焉雖朝廷專設憲臣以督理之亦未能或之變也吁習俗漸染之深未可以朝夕革也歟是殆不然憲臣之巡厯有時而守令之臨蒞無間苟一加之意焉則無不可者在鼓舞而作興之何如耳黃岡黃州附郭邑也地濱大江舊有學規制庳隘歲久頽圮太守錢公至周覽慨歎首捐已俸誓欲擴而大之於是縣正僚佐邑人富室爭出錢幣以相助者甚衆乃庀材僦工諏吉興作自大成殿以次明倫堂池臺門廡師生講誦之所栖宿之舍一理新之至於神厨射圃倉庫庖湢之處莫不備具壯麗宏偉數倍於昔經始於正統七年丁已九月告成於十年庚申七月費不出於公帑勞不及於民庶而成此大功非公其孰能之公之為人端厚坦夷廉靜而不阿居家以孝弟聞親喪廬墓三年朝廷旌異之其在大理獄以不寃今為黃州環千里之民無不歸心焉又能以其餘力一新郡縣之學暇輒與諸生講誦經史課其所業而奬勵之莫不翕然嚮於學文翁范純仁不得專美其前矣大學曰身修而後家齊家齊而後國治若公者可謂身體而力行之矣邑學官尹某夏某以書來求豫言夫郡縣學博士樂得賢太守以蒙其作興之惠又樂得英才以盡其教育之方何其幸哉故豫亦樂聞其事而為記之如此云刺賜興德寺記興德寺在德勝橋之西舊本興國寺不知自何時而廢其遺址尚存為中官居第者若干年矣一日因久雨牆壞掘地修築得石碑云龍泉祖剎監寺圓公置結落􅏛施興國禪寺永為供具凡二百餘年蓋至正三年也後有住持宗主慈照大師明孝立石十二字衆皆曰此古剎也非吾徒所宜居於是白諸內官太監阮公願立屋以居僧衆公以為然捐已資若干緡俾閔某領其事四方好善之士聞而相與施錢幣以相助者甚衆遂相度其地因其舊而平治之鳩材僦工諏吉而營之經始於某年某月某日落成於某年某月某日殿堂廊廡禪居丈室與夫藏經之處説法之所鼓鐘之懸栖宿之舍庖湢庫藏悉已備具逺近來觀者莫不嘆羡曰昔為丘墟莽蒼之地今為禪剎最盛之區且為之不勞而成之甚易豈非其所遭遇得其時哉於是請於朝刺賜今名且命僧來求記曰將勒諸石以遺其後人使相繼而慎守之庶其永無替也凡天下之物其成也必有毁其興也必有廢廢興成毁相尋於無窮則其成之也實難而其毁之也甚易或者諉之於數曰非人之所能為也然於其間有一成而不壞益盛而永存者蓋由其興之者得其人而其為之也堅其承之者得其人而其守之也固譬之寶物前人之所以求之者未始不用心焉後之人以為不足貴而不知所以守之又豈能使其長存已乎由是觀之則成之者固在乎人而守之者尤在乎人豫既承公命因推其意而書之居於斯者尚慎思永厥傳哉刺賜廣教寺記都城之西南百里許曰房山之西若干里有山曰三峯巖巒清秀其外諸峯拱揖若連環然林木隂翳磴道縈紆其中平寬而草樹荆棘叢雜鬱塞常有雲氣旋繞其上人迹罕至知者蓋鮮宣德八年尚衣太監李公寧與同志之士王毫等厯覽山川至此而心曠神怡目之所覩耳之所聞自覺有異者焉徘徊久之公以為盡去蕪穢將必有可觀衆皆曰然翼日命僮僕具畚鍤持斧斤以入剃榛莽輦汚塗伐灌木遂得古剎遺址循其舊而理之高者窪者欹者狹者夷之益之正之拓之劃然開朗地若闢而廣山若增而高草木若澤而悅居民耆老聞而來觀咸曰我輩生長兹土亦不知其有此勝境得非山川之靈隱奇蓄秀有所待也耶公乃與衆各捐已資暨善姓江勝所助緣得若干緡鳩工貰材因其勢而為之制中建佛殿前為天王殿後為方丈室皆翼以廊廡曲折回環通道往來庫廩在其東僧房在其西庖湢之所栖宿之舍莫不備具總若干楹巍然奐然可謂盛也矣經始於正統丙辰之三月落成於已未之正月是歲春公請於上賜名廣教由是四方緇流日益雲集大乘妙法日益宣傳於以祝延聖壽於以資福生民實維其宜然猶欲因是書其始末劖之石以告其後之人相與保之而勿壞乃來請文於豫蓋金仙氏之道之在天地間猶泉源之行乎地中鑿井得泉汲而用之滚滚而來及其湮塞之而不通不知者以為泉竭也有濬之而汲之則泉即此而在矣又豈有竭也哉斯寺之建不知創自何時當頽廢寂寥之餘值太平無事之日而公等得以其餘力以及於此使百廢頓興而壯觀若是豈偶然之故哉誠使守真乘法印於斯食於斯而遊於斯者恆思慕祖風勿混民俗則益演而益盛焉兹寺亦將永存而不替矣尚勉乎哉新修宏善禪寺記懷柔畿內縣東南曰寅洞里有山高聳秀麗自北而來至是而止翼者鳳翥峙者鸞停故號鳳林山山之前衍為平地爽塏而寬廣山之東西擁掖而出者如虎豹如象犀而拱列其南者如劒戟如聨壁林樹茂密隂森薈蔚萬山之中有此勝境非天造地設人力固如之何哉常德長公主聰慧慈仁出其天性嘗念皇考與聖母生成之恩如天之廣大如地之博厚莫能報稱訪求福地創立佛宇奉揚真乘妙法用答大恩遂得於此實昔之龍祥寺遺址也乃捐金幣貰材僦工即其中為正殿六楹其北為後殿四楹以奉三寶諸佛菩薩後殿之東為伽藍堂西為祖師堂周回為廊廡三十有八楹東廊有殿四楹曰左殿西廊有殿亦四楹曰右殿東向由東廊之中西入有門北入方丈四楹南向由西廊之中西入有門北入方丈亦四楹南向前為天王殿四楹殿之東角為鐘樓四楹殿之西角為鼓樓亦四楹殿之外東西有牆牆有門東門北入庫房四楹西門北入延客之室亦四楹又其前為三門以磚石為之古朴堅壯外為櫺星門至於庖湢之所栖宿之舍與凡法樂供具莫不悉備繞以周垣垣之外乾隅為圃植所宜果以給供佛薦新之用為屋總八十餘間雄傑壯麗前所未有經始於正統七年九月朔日其成以八年二月也是月三日請於上賜名宏善禪寺於是緇流雲集奉宣法典以資皇考冥福以祝聖母萬壽以祈皇圖永固聖算益增竣事之日乃遣中使書其始末來請記稽諸佛書最重孝敬之道故有大報恩之説今常德長公主欲報國恩非金玉珠璣錦繡綺縠之所能信其意者必仗佛力而後能致其所以仗佛力者又在於創造其所廣集其徒奉宣其言而後能遂兹寺之建工力如是之廣豈徒以媚佛為哉其孝誠純篤固有所在得佛書大報恩之義夫以天潢至親其名位祿食所當然者而猶思效報如此為人臣者膺爵祿之厚受付託之重果能竭誠盡慮委身圖報有若此者焉則何事之不濟何治之不成哉懷柔畿內大縣兹寺懷柔名剎士大夫往來者固不少因并書此使觀者尚有所感發而興起焉是亦與人為善之意也天威神機火雷大將廟記都知監少監黎城韓公政奉命備禦北邊已十年矣公專掌神銃愛養士卒教閲練習坐作進退左右前後皆有矩度修治器械長短廣狹寒涼燥濕輕重多寡皆有條理備具於平昔而致用於一旦無有不給者偶或來擾輒出禦之勢若雷奮震動山谷衆皆驚愕摧敗救死扶傷之不及故一見公兵出盡死奔竄由是邊庭晏然無冦攘之驚公凡三出皆有功以功纍升今職公既榮府寵命俯而思曰此豈吾之所能皆賴神靈之力不可誣也然神無常棲歲時祀事無以妥神靈致誠敬兹非缺典歟乃於獨石擇高爽之地平治之中為正殿東西為廟房前為門三後為庫二十有一總為屋三十有四間正殿以奉天威神機火雷大將軍之神庫以貯火器火藥炮銃等物祠宇壯堅階墀寬敞壇垣完固巋巍奐然經始於正統十有一年五月落成於是歲之秋七月既訖工合諸將士備禮享祀於神器幣蠲潔牲牷苾芬肅雍恭敬瞻仰如存既竣事退就燕享合辭言曰神靈之昭著如此茍不勒之堅石將無以仰答神休而昭示後世衆咸曰然乃謀來請記夫神天地造化之精英然無形聲之可求常依物而行故凡物皆有神以司之惟主之者心無私曲而行無邪僻然後足以用其物而神亦為所用矣不然則人且不為之用而况於神乎吾聞公聰眀慷慨公平而正大諳練世故通達人情而又能盡乎事神之道神人和悅是惟無動動則無不如其意者亦其理宜也惟公不屑居其功而必歸功於神於是作迎神送神曲俾歸歌以奉祀焉迎神曲赫赫煜煜騰光燭空雷轟電激孰當其鋒享祀精潔莫不肅雍洋洋如在來格來降送神曲惟神是依惟福之徼敬恭在廟匪夕伊朝嘉禮既成靈貺昭昭惟其相之以答聖朝曠氏望阡樓記廬陵曠子碔氏世家邑之敖城所居頗幽僻子碔相其地宜庀材僦工别搆為樓凡幾楹高廣老干尺周為闌檻軒窗榱桷率由質素不加雕飾既成而名之曰望阡之樓比來京師求豫記之詢其所以名之義則曰昔吾父母之在堂也吾兄弟雖有愛親之心而遭家多難嬰於世故不能有以盡其意備其禮今也吾兄弟幸能立其家不墜其先緒又當太平無事之時人皆得以盡仰事俯育之樂而吾二親俱已亡沒雖欲竭孝養之心盡菽水之歡無由致之常切以為恨嗟夫思吾親而不可見所可見者獨惟其墳墓耳蓋墳墓者吾親托體之地見墳墓即所以見吾親也然而山川間之有不能常接於目此吾樓之所以作也每一登而望之見松柏之隂翳猿鳥之悲鳴與夫四時寒暑之變遷而風雨霜露之悽慘則又怛然傷心而不覺其悲苦之俱集涕淚之交頤也雖然吾名之所以識吾志也豫聞而悲之且夫敖城之地山水清秀原田曠衍喬林濬谷競奇而獻巧佳花異卉攢翠而爭艷一舉目之頃無非可樂而可玩者子碔兄弟舉不以動其心而惟先隴之是望豈不異於人哉豈非所謂終身慕父母者哉彼有於其存而不知所以為養者聞子碔兄弟之所為能不有愧也歟故吾為之記使聞之者知所勸也子碔兄弟四人喪其二今所共居者兄曰子琮友愛怡愈誠孝弟之士可尚也已古廉文集卷二
