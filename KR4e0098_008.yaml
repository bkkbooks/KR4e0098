body:
  text: 古亷文集卷八明李時勉撰封事臣李時勉言臣聞憂國忘家者臣子之誠心聽言致治者人君之大德臣身居林野心在朝廷方卧病床帷忽聞乘輿有沙漠之征恨不臂羽面陳利害未幾來報者有敗績覆軍之禍不覺驚悸起立肝腸寸裂拊心揮淚慟哭而不能止于時人情皆為之洶洶不安既而皇上即位詔下人始歡欣踴躍有太平之望臣惟國家之事已往者付之無可奈何未來之治伏望陛下敬慎以嗣之臣聞制治于未亂保邦于未危者此治國之要道昔在李唐當開元天寶之間正車書混同之日使有憂危之心則後來焉有安史之禍至于如此伏惟陛下鑒前古之失究方今之弊留心于政務加意于武備以安中國以馭四夷則不勝幸甚臣昔在太學有所當言欲上陳而未果今幸皇上正位有可言之事理宜開坐謹具題聞一件崇奬忠節事臣聞三綱五常天地之常經古今之通義惟忠梗負氣之臣生則以靖安社稷為心死則以捐軀報國為事如文天祥之在宋朝身任匡復之責間關險阻無不備嘗及國運既去猶執死義不屈于敵國逮今雖有贈封而諡法尚未盡乎公義今幸陛下尊臨大寶欲勸當代之人臣宜先奬前朝之忠節伏望特敕禮部與翰林儒臣及在廷大臣㑹議褒以美諡庶俾人心激勸各懷忠義之心則大業可成矣一件武備事臣聞選將帥練士卒保國之常規順隂陽求便利用兵之良法此皆在乎治平之日而預致夫防禦之宜者也方今天下太平惟備邉一事不可不加之意焉臣竊以為備邉之道在選將練兵選將必得通知兵法使日練精兵習學戰陳臣見今武臣子弟襲職論走馬跳溝射箭中否京師無賴之徒多買快馬教習跳溝以規厚利而已臣惟武臣子弟宜令熟讀武經七書如有知兵法者教之通曉團營列陳破敵攻守之法為上昔人有學劔者以劔為一人敵不足學去學萬人敵今之走馬跳溝射箭正所謂一人敵者也至于兵法萬人敵則未必知也臣又聞臨敵用兵在于日時之利求日時之利在于竒門黃帝擒蚩尤時所立法也專于兵事用之其大要在擇時日隂陽之利以取勝古之為將未有不用此者如使曉兵法而不用此雖有精兵終難成功宜令武臣子弟年少聰明者學習之既知兵法又能究于此則用兵之際必收成功免敗亡之失矣一件加恩死節子孫事臣聞捐軀殞命者臣子之大節閔勞録功者朝廷之沛恩近者彊敵陸梁將帥不謹致令士卒敗北死于疆埸其官員士卒之所以盡力决鬪而死者為人主也宜令該部及紀功官收葬其骸骨録用其子孫或仍祿以褒其家善或加祿以表其忠誠則人心思奮莫不欲報仇漠北翦滅敵人以成大功矣史書曰雪恥酬百王除凶蕩千古惟其時也惟陛下裁處焉一件南北通好事缺景泰元年進又永樂九年夏四月本一封言事十五件缺又洪熙元年建言本二缺題跋題文丞相與升叟書跋後務施報者非仁人君子之心也宋丞相文信公受命于國步艱難之日非有深恩極寵以榮耀于當時而所以圗恢復之意蓋惓惓焉雖至于危促而氣益壯極于死亡而心不悔者豈欲以致報稱之意哉仁人君子之心固如是也詳觀臨清司訓錢先生以公所與其五世祖升叟書三通反覆觀之可以知其志之所存矣升叟其後與其兄弟三人皆死于王事孔子曰智者不失人亦不失言公又可謂智者歟景仰忠義感歎不已因題以歸之書松根子傳豫觀吏部侍郎蕭山魏公為松根子傳稱松根子因其母不御酒肉松根子與其配亦不御酒肉終其身此蓋闕于人情之所感者有以致然也若夫其友有見其所嗜淡泊欲以金丹延年之術授之則曰貧賤壽夭出于天非人力所能為却之不受此非中心確然有所見者不能也豫于是有以見松根之為人宜乎其見重于世而傳于遠也松根子姓孫氏字思敬其子樞今為象山縣尹以示豫故題以歸之題山谷書太學生吳匯以豫致仕歸持山谷所書奉答任道州教授行題江亭韻詩來觀山谷書雖宋人體格而有晉人風度其清徑端重他所不及誠足寶重觀畢題以歸之題香山九老圖後右香山九老圖一卷唐㑹昌白居易以刑部尚書致仕歸東都與懷州司馬胡杲等九人㑹于香山飲酒賦詩以相樂當時以為勝事後世好事者繪為圖以傳此則蘇州郡倅邵君信之所藏者信之考績京師以示豫自古宦達之士皆以知止足為賢故疏廣受二子去漢庭歸鄉里日與故人賔客以相娛樂泊然無所纍乎其心其與耽慕榮利一朝以衰老不得已而辭位去歸其鄉矜恃其富貴之身以傲忽里閭而又急于園田屋室以為子孫後世慮營營于流俗塵雜之中而不知其為賤且辱者賢否何如哉此樂天之高懷雅度所以曠絶前古而為後賢之所慕尚至于今而不已者豈不宜哉信之之于圖畫足以為玩好之娛者舉無所尚而獨珍藏乎此豫于是有以知其志之所存也故識以歸之題黃氏所藏先世像後太學黃深以其所藏黃氏歷世祖先畫像自唐御史裏行府君而下至國朝檢討君凡十有八人于此非惟有以見其先世出處衣冠文物之盛亦有以見其後世子孫繼述之賢偉然文獻之宗為可重也歆羡歆羡書王博士母孺人墓銘後右琅琊劉孺人墓碑銘前翰林學士兼左春坊大學士解先生撰今太學生泰和王慥之曾祖母前國子博士復原之母也孺人沒時博士為庠學諸生求鄉先生謝子方為銘以葬及博士為外校官歸以孺人墓銘埋之土中無以顯示子孫適遇解先生得表諸其墓而其先君子志德甫墓銘及族譜序皆先生所作皆親筆書今志德甫銘與譜序具存惟孺人碑文墨跡亡失慥痛恨無以傳視後人嘗録副以自隨比來太學求豫言夫博士君以孺人之碑文不作無以顯示子孫慥以解先生墨跡亡失無以傳視後人嗚呼父子祖孫之間其慎于繼述之道如此得不謂賢矣乎是亦故家文獻之一端也先生謂孺人有再造王氏之功豫不及論論其子孫之賢則孺人之德善從可知矣跋周珏所藏先世手澤卷後安成儒者有功于聖門有益于後學者五人齊齊集齊魯齊三彭先生公瑾劉先生行簡李先生也三彭先生有禮記圖纂劉先生有詩傳通釋李先生有春秋㑹通行于世今其書存其名存其後嗣則寂然無聞焉此其為可哀也一日鄉生周珏持其先曽祖父啓周先生元末亂離中還鄉五詩示豫于時和者四人莘樂吳先生聞廷劉先生嗣哲趙先生成均伍先生吳先生有子有孫皆業儒趙先生不知何許人劉先生伍先生皆無後矣聞廷先生和詩小序云啓周又以餘力至先妣郡君墓次翦剃榛莽進守墳老翁撫慰以言而後去為人子者聞之能不赧然顙泚澘然出涕乎其詩結句有云何時攜麥飯痛哭向山原今先生之墓與其先塋具在誰其為之翦剃榛莽澘然而出涕攜麥飯而痛哭哉珏雖貧窘甚有舊墓在今下村可貨得重資珏曰三賢之地科第之鄉先世有遺訓不敢以售人此其所難也又能存其先世手澤書策雖厯艱虞不致失墜尤難也于今可仰見前輩風流儒雅之一二者以此此豫深有感于五先生之無後也吁五先生之無後然以其書存焉又得列在先賢祠中而二先生獨不得與焉平生手澤又無一存者此其尤可哀者也因珏之請而并及之以寄豫哀云跋李懷琳嵇康絶交書故人劉隱君志達之子灝持唐懷琳嵇康絶交書一卷示豫後有元湯垕右載跋以為懷琳倣嵇康書蓋唐世嵇康書尚存故懷琳得以倣之宜其高出于其所自作者其說有據理或然也此帖鄉先逹彭伯圻先生尊府家藏者右載題于燕山張氏不知先生尊府自何得之後為劉君惟彰所得志達又得之惟彰惟彰伯圻姻家子而志達則惟彰之族昆弟也其相傳有自觀先生遺訓子孫之言亦安知其後世流落如此此與李德裕平泉莊之意無以異吁凡物可貴重于世者偶得之固宜寶藏以資玩適至于傳之後世或存或亡亦聽其自然又何留心哉跋周氏世直堂集後前兵部職方員外郎致仕周先生岐鳯為漢王府紀善時王所為多不法先生隨事規正王雖不從而嚴敬憚之而疏之先生言益切遂怒而黜先生益肆其所為後卒以謀不軌敗亡向使能聼先生言而改之則豈至此哉豫昔聞先生所言未嘗不矜而誦之謂先生賦性剛直學問優裕有以為之也及今得其嗣子翰林侍讀君所集世直堂文觀而後知先生所為家法之傳有自也蓋仁義禮樂所以正人心者必由直道而後行士君子所恃以立身國家所恃以立政茍或悖之未有不至喪敗者夫以周氏之先立身行道如此而先生繼之又如此傳之後世不患無人所謂世濟其美者端在周氏矣可敬可羡侍讀君求豫叙引年老疾作雖沗清職殊無清思姑識以歸之題戴氏家藏先賢遺墨古愚戴君豫友也志氣高邁而嗜閒安拙際明時而薄榮利洪武中由縣庠貢太學擢五軍斷事官不數日以故去宣德初詔下求賢為所知薦入朝試以文不對又復去竊嘗怪其然及其子去伐持其先世所藏宋元諸名賢交游書翰來示豫其中有取名甚亷難進甚偉之語則東山先生與其八世祖府判大中者然後知其家法有所授受非偶然也今君不可作而豫猶貪祿尸位垂老不能去其有愧于君深矣靦顔識之有以見君之高而自責其不知止也題東郭王氏族譜後安成東郭有王氏郭村有戴氏二氏嘗以閥閲相高每有所論質鄉邦莫不聞豫時幼居泮庠以學問文章為事雖有所聞而未暇究及今五十餘年王氏之彥曰儼相者膺薦來京師持其家譜示豫反覆觀之然後知其先世之所論質者皆有所據而非妄也儼相欲求豫序遇豫卧病兩月不能起而儼相亦承命有嘉興郡庠分教之行遂題其後以歸之跋李布政至正妓人行同年友廣西布政使李公昌祺示豫所為至正妓人行凡一千二百餘言觀其橫放浩汗如春泉注壑瀺而無窮流麗動蕩如纎雲浮空變態而難狀自昔文人才士辭藻之盛未有過于此者也嗟夫妓人今為民婦有子與孫尚不忘其故態常持簫管自隨雖老矣出其伎猶能使公賞惜若此况于其盛年也耶今有懷德藴義砥行立名之士欲求當道之君子出一語以褒嘉之且不可得此妓者乃能使公聽其議而又重之以詩亦何其幸哉雖然此未足以窺公之淺深也公為方面大臣固當以功名事業為務宣上恩德以施惠政使夫環數千里之地悉陶于春風和氣之中乃以其文章黼黻至治而歌詠太平播之金石傳之無窮然後足以見公之大此特其緒餘耳烏足以窺公淺深也哉豫故書其後使觀者知求公于其大而不在此也書楊處士墓銘後建寧有處士曰楊公逹卿者仁義厚德之君子也處士平生之善行多矣其卓卓可見者出錢給粟於人使不毒溪魚不探巢鷇盜入其室而不窘之又化之使為善者當春戒焚山林以傷長養之氣若此者非所謂仁者歟具棺斂以葬族人之喪又教育孤貧使不失其所代人償債使不至鬻其妻及夫市牛以給鄉黨散粟以賑貧乏若此者非所謂義者歟仁義之人固如此也至于盜發人冢有司受賄罰不行則力言之當道置盜于法荒歲賑給而惡其名則假以植材木而酬其直及材之成也唯以給貧困送終之需津渡舟梁之用而不以自利非行仁義之至者能若是乎向使不激當道不置盜于法則為仁而流于姑息非所謂仁矣不假植材木或植而貨焉則為義而幾于近名與利非所謂義矣此處士之所為難能也宜乎其沒也其哀之者衆至于今人猶思之不衰而吾黨之士亦不䏻不為之敬慕也夫以處士之德行若此猶不䏻沾一命以表見于世人固為惜之而處士之孫今學士君以宏才奧學擢第明時入翰林纍官文淵閣大學士兼翰林學士文章德業炳煥輝赫而其進蓋猶未巳人皆以為處士之積之所發也嗚呼天之報于善人豈為無所慿哉學士君以處士墓銘示豫題其後非獨以致敬慕之意抑使世之為善者有所勸也題彭氏所藏瀘溪王先生手書後右瀘溪廷圭王先生謫居辰州時與其壻彭將仕家手書十幅觀其辭意胸次陶然無毫髮係纍蓋不知其在遷謫困厄之中者是豈非素其位而行者歟書中所謂外甥者將仕之子夢協也夢協之裔孫曰同升者豫故人也自夢協至同升凡若干世中間遭罹兵戈患難者數矣而能保守之不失可謂賢也已同升有子貫今為秋官主事以亷介名䏻不墜厥家聲其又不賢矣乎彭氏之多賢如此則是書之傳也無疑矣進唯奉其尊府之命求豫題遂書以歸之題吏部尚書王公所藏趙秉文草書卷後右草書李謫仙白頭吟一幅前禮部尚書翰林學士趙秉文所書今天官冢宰泰和王公得之以示豫蓋秦漢以下篆𨽻楷法必由規矩若夫草書則羲獻後自唐宋以來隨其人資性學力所至放筆輒為之縱橫曲直髙下大小惟其意所欲飄飄然如龍翔鳯舞風雲簸蕩波濤洶湧倐去忽來不可端倪而動快俊逸清徑遒麗自成一家亦難得也秉文書已見重于當時史臣言其文章不以繩墨自拘意其必落魄放曠之士然考其治政論事倬有條紀常請于其主欲得一州以自效曰陛下勿謂書生不知兵顔真卿張巡許遠以身許國亦書生也使臣死有益于國家猶勝生縻廪祿為無用之人雖歸老猶以時事為憂聞一事可便民一士可擢用大則拜章小則為當路者言之其一心于國家如此觀其書殊類其為人因并及之使人知秉文之所可重者不獨在此也題禇遂良臨蘭亭帖太學生陳鑑家藏持禇遂良所臨王羲之蘭亭記一卷後有米元章跋語字體清瘦俊逸可愛觀之纍日不厭豫見世所傳蘭亭帖有定武肥瘦本不同竊嘗疑之今見元章云世俗所收或肥或瘦乃是今人所作正以此本為定于是渙然氷釋吁聞見不廣而欲辨事物之是非烏可得哉觀畢遂題以歸之題夏氏所收詩字後常聞前輩言文章亦可以卜人之壽夭何也夫人年少之時辭氣清俊如朝霞映日光彩流麗及其壯也辭氣峥嶸如龍騰霄漢雨意滿空其既老也辭氣蒼古如嵗寒松柏不改其操此皆夀徵也若夫老人而為衰澀語宜也少壯而為老人語則非所宜姑蘇夏友諒年十二䏻作詩句語驚人不幸十九嵗而卒詩藁皆不存其子闕獨䏻記其七言絶句一首今有孫遂佑為禮部屬闕少宗伯臨川王先生書之裝潢以示豫觀其氣象與文賦髙軒過有異焉因記憶舊所聞識以歸之云題恩賜圗書記卷後豫為謝君庭循作此記未及奉還而有國子之命置諸篋笥而忘之庭循以豫窘于應務亦絶口不言及豫得南還閲篋中舊書取而展玩不勝惶汗遂識以歸之使觀者知君之有容而豫之昏眊潦倒如此也題潮陽李氏族譜後潮陽李氏其先不知何許人元末有宦潮者因留家焉亦不能記其名至思謙者生元中元中生彌月而父沒鞠于姊夫魏氏既長遂冒魏姓元中生憲舉憲舉生今國子學正齡才五世耳其世系之所出思謙必能知之不幸早沒至元中之時與思謙同輩故舊長老猶有存者可以質問訪求又不幸早世至憲舉則與其父祖故舊遺老零落殆盡欲詳究先世之故何可得哉觀其自序曰欲因循冒襲是自忘吾祖若安姓之冒駱氏也欲遡流尋源以達于祖初恐竄附妄引若崇韜之認子儀也則其怨痛恨之意者何如哉其所以斷自思謙以下為之譜以貽後嗣者蓋亦不得已也然其所以惓惓欲有所為遽沒而未遂復姓一事耳幸有賢令子若學正君者繼其志述其事將必有以成之故吾識之以俟云題東里先生翰墨卷後少師東里楊先生與今冢宰抑庵王公書簡凡四十幅其首簡所謂璚州先生者公之尊府嘗為璚州大守考績京師將還先生邀之夜宿話别者也其他則皆以與公凡所云悉出肺腑相親相愛之意非尋常浮辭泛語相諛悅者比誰得而聞之或者乃謂公之去翰林出先生意豈其然耶先生受付託之重當持公平正大之心以鎮撫國家在他人尚不可有所抑揚前却况于公耶果若然其何以示當世傳來世乎或者又以為公之學問文章當在館閣出蒞政務則為非宜是雖天下之公論然士大夫出處自有定分人固不䏻為之輕重取舍况在廷大臣皆上所自裁先生亦何所容力于其間哉豫昔在翰林與先生論士之賢者至公曰當今德行文學無有過之者且才猷敏給而其量有容他日可大受也及先生疾革少保楊先生亦以疾在告豫謂先生館閣少人朝廷必來求之先生因論及公先生曰我亦念及之但甄别人物進退賢才國家首務滌革弊蠧以由于正朝廷方倚重今且未可由此觀之先生于公未嘗不以為重亦未嘗或忘之也因兩家子弟有遺言而公之出院適當其時故或者得乘其說聽者不察譁然駭之蓋未知先生與公相與之心也先生與公相與之心固不待言而或者之論不可以不辨故為詳識諸其後云題范氏族譜姑蘇玉峰范氏其譜牒因兵燹亡失不能記其世次所始啓東范氏之良子弟遂因其所可知者自曾祖大本而下至其子才五世耳于是著為之譜以遺其後人使益續而書之庶幾其猶愈于棄而不為者前史官豫章吳先生為序之有曰范氏之譜據實而書闕其可疑著其可知使一覽之間昭穆長幼疏戚粲然畢具其于水木本源之義蓋得之矣是以序之此實啓東作譜之意也豫復何言哉題沈少卿草書右草書一卷大理少卿簡庵沈先生為翰林檢討錢君原博作也原博以示豫觀之如龍蛇騰躍風雲變化倐來忽往不可端倪非熟于書法者有不䏻也三復之餘識以歸之題唐太宗賜進士針進士之名起于隋而盛于唐唐時取士之塗極廣惟進士科為最重嘗觀貞觀中賜進士針則其為重也可知其辭有曰鐘鼓在懸五音相對利國安民恆居富貴蓋以為士之䏻長保其祿位者惟其所為有益于國與民也又曰聞善必舉先須自理速效賢䏻貪鄙勿起蓋以為士或不能薦賢為國見賢思齊者以其有貪濁鄙吝之心也是皆誡警之深意茍于此而䏻致其力焉則所以致君澤民為人臣子忠孝之道亦無不盡矣然則是針也其有益于進士豈小哉其果足以見重于世而極其始終哉是卷太學生金銑之所藏也銑擢進士在即行將見重于世而施于政其尚深省于此哉庶幾有始終者也題林志善詩後右志善詩文一卷永樂初翰林諸公為前南康大守林侯仕敏作也逮今四十餘年而其子某保藏之如新亦可謂賢也矣今世士大夫家子弟多溺于勢利于其父祖之手澤漠然視之不以為意况于他人之文翰也耶吾因是而有所感焉當時作者十五六人自修撰王褒先生而下三數人為前輩舊德餘皆吾同年友也今多物故惟吾與冢宰王公致仕教諭劉君子欽三人在此其尤可感也然獨喜賢侯之有子䏻繼續聲光而不墜為可與也故識以歸之題池文華墓銘後豫在翰林為池君文華銘時其子謙為縣庠生及豫在太學謙舉進士不利來卒業太學居稠人中不知其文華子也比豫得請致仕南還謙持此文來告曰是先生為先人作也豫嘗憐文華有志之士恨未之識思識其子孫五六年來始與謙相聚于此有師生之好其亦有數存乎其間也耶文華務德行義而未施于用不在其身必在其子孫謙尚勉之哉食其報而享其福者端在于子矣豫日望之跋後樂堂卷當憂而先憂當樂而不樂者君子之心也君子之心在天下故其憂其樂亦在天下禹稷契臯陶伊傅周召之所以佐二帝三王為治也蓋未嘗一日而不憂未嘗一日而不憂則其于樂也自有不暇及焉不暇及于其樂則其憂勞之心專且盡使天下無一物不遂其生無一民不得其所而後其心安焉其心安是即所以為樂也是則所謂禹稷契臯陶伊傅周召也由是推之漢唐宋以來居輔相之位以天下為憂而不暇于其樂者皆可知也然或存此心而不得施居其位而不得行者故范文正公有士當先天下之憂而憂後天下之樂而樂之言公在當時雖不究其用而其心即禹稷契臯陶伊傅周召之心其言即禹稷契臯陶伊傅周召之言傳誦萬世孰不瞻仰以為名言今少保户部尚書東萊黃公寬厚坦夷學識明敏志意髙廣胸次灑然無一㸃塵俗之態無一毫比眤之私論大政決大疑辭簡而盡不為阿徇自筮仕以來厯事五朝四十餘年其心未嘗一日不在天下國家平居言議未嘗一語不在天下國家論大臣以道事君赤心報國而不為私已圗者方今其一人焉公嘗感范文正公之言而以後樂名其堂賢士大夫為歌詠之者衆矣其子某以來示豫且求豫言因憶前年得告歸過南京訪公于寓館公時已抱疾出與豫坐語移時皆天下國家事意甚惓惓又取酒酌豫悵然而别别未四越月而公竟沒然則公之在位多憂勤之時而未見其所以為樂者是亦其名堂之意也因識以歸之若夫其功在國家德被生民見于今少師楊先生神道碑兹不著也恭書黃尚書制書跋正統五年少保兼户部尚書臣福歿于南京訃聞詔遣官致祭命有司營葬事既葬諸子以朝廷褒嘉其先臣之德美昭著于當時抑欲以見今上皇帝圖任舊人恩禮周洽光榮照耀賁于泉壤俾臣福之靈得慰安地下而庇佑其後之人其意亦可謂至也矣臣謹按黃氏之先積德優厚至福始佐入為衛幕上章言事受知于太祖髙皇帝拜工部侍郎太宗文皇帝入正大統升尚書調北京行部交址平受命往撫掌其民控制一方晏然無警者十有九年仁宗昭皇帝即位召還未幾而交址叛宣宗皇帝仍命往撫之至則鎮將已失守為賊所得然終不敢加害禮送之出境既還改户部守備南京上即位升少保兼户部尚書錫以誥命進階光祿大夫推恩及其三代考妣亦榮矣嘗謂福何以得此于朝廷哉蓋其為人寬厚和易襟度灑然與人言傾吐心腹然無所阿比人亦不敢干以私問學優裕通知古今識達大體諳練世故臨大政決大疑侃侃焉無所徇人咸莫之能及自初至于今厯仕以來五十餘年厯事五聖忠在朝廷心在黎庶知有其君而不知有其身知有其國而不知有其家知以天下為憂而不知以富貴為樂真可謂大臣以道事君者也洪惟我太祖髙皇帝君臨天下三十餘年延攬英雄旁招俊乂以開太平之基一時股肱輔弼之臣顧己多矣而碩德重望敷遺後人以佐守成之業者殆亦不少而福其表表者歟題尹氏藏楊少師帖右少師東里楊先生贈侍御尹循尊甫道充翁文一通手帖二幅少師之文難得而侍御得之之易且稱道甚至蓋有以來之也豫時扈從北京少師留守南京于今二十餘年而侍御尊甫與楊先生俱已物故觀此文不能無感焉侍御嗣子仁器持求豫題豫今亦已衰老矣其所感不幾時後之觀者其亦將有所感也耶題少傅先生啓本録副卷後少傅兵部尚書兼華蓋殿大學士西昌楊公為兼翰林院侍講時其同母弟羅京坐事謫新開路為民公念京之一兄久戍永昌衛京又以謫去而其子尚幼母氏墳墓在故鄉無與守者于是以其情具啓仁廟乞宥京俾先塋有所依辭甚迫切仁廟憐惻其意允其請親御寶翰題十九字于其末并永昌戎伍開免之即所司施行焉十九字蓋令㫖也公録在副本今年京來省公北京請録副以示羅氏子孫公既志其後以授之具以示臣時勉臣反覆觀之有以見仁宗皇帝天地覆載生育之恩待遇臣下優禮之意具于十九字之中而公孝親友弟之情感恩思報之心藹然見之前後辭氣之間使人不覺惕然欽敬何其盛哉雖然雨露之私不可偶得使公不有格君之德佐國之功輔導之美安能致恩命之隆若是哉望鼎湖之雲氣瞻獻陵之松柏不得不感激而思慕之深也嗚呼羅氏子孫享有安閒之福于太平無事之時可不知所自也耶固宜慎于自修期無忘朝廷曠蕩之恩無沗于公親親之義可也天台吳同志父祖墓碣銘跋天台吳君同志曩嘗求右春坊曽先生太子少保禮部尚書金先生為其父祖墓碣及銘二首同志既刻而納之墓立之其阡復取二先生文章與其鄉先生張珽張圭所遺其父祖詩三幅為一卷嘗攜以自隨時展而玩之曰庶幾以慰終身之慕者昨考績來京以示豫求豫言惟世之為人子若孫者視其先世金玉錢貨田産地宅不啻若肺肝心膂兄弟之間紛爭鬭欲不肯分毫尺寸以相讓致使其祖父暴棺露尸他人或為之寒心而略不以經意者何也彼各有所重也其所重在彼則視此固為輕也視之既輕宜乎其不以經意也于此且不以經意况肯收恤其遺書手澤而以為重哉其遺書手澤且不肯收恤况于他人之所與者哉以是觀之同志豈不賢于人遠乎豈非吳氏之賢子孫也歟三嘆之餘特為識之跋女教續編女婦之教亦難矣教以言為訓者也女婦處乎閨門之間內言不出外言不入內外之言不相聞則其為教豈不難哉然其所以事親事夫事舅姑為婦為妻為母之道日用之間彛倫之常性分之所固有因其所固有者而施其教則豈不易易乎元相臺許獻臣輯女教一書其意以為女婦之事散見經史難以遍覩于是㑹類成編可以一覽而盡得之至為切當然其中未免有所遺略今冢宰泰和王公又纂輯為續編然後女教之書無不備矣或曰詩書之教不如風俗之美南國被文王后妃之化至于里巷小夫婦人女子亦皆知以道自處以禮自防豈必皆詩書之化哉殊不知國風之詩多婦人女子之作其言皆道德禮義孝弟忠愛之感發惟其如是之多也故其化得于耳濡目染習熟見聞而行之于日用之間以為常然而不覺其入于道德之中禮義之域也矣詩書之化其有益于世教豈小哉公之所以修于家行于國者皆孝弟仁義之行忠厚愷悌之政故推其治餘以成是書豈空言哉讀行行重行行竊嘗反覆是詩以為行行重行行者有遲遲不忍去曰生别離者不當别而别雖曰生别離而有死别離之悲之意存焉重行行其行蓋不遠至于萬里道阻㑹面無期則君臣之心不相投合有如胡馬越鳥南北背馳相去日遠相思益深而不覺其憔悴益甚也然相思雖深猶幸君心之悟而召已及其讒邪蠱惑君心終以不悟如浮雲之蔽白日故長往而顧念還返也中之思猶冀君心悔悟則其思有時而不已今而君心既不悟則其思至于老死而後已吁忠愛不忘君之情何其至哉末二句聊以自寬譬耳蓋亦無可奈何之辭也青青陵上柏卒章曰極宴娛心意戚戚何所迫補注曰冠帶之人自相求索極宴以為樂則人之不䏻自娛而常戚戚憂慮者何所驅迫而然乎如此則戚戚不䏻自娛者為非而極宴以樂者為是矣竊嘗以為京洛富貴之家極宴以相樂及其樂極悲來戚戚然而懷憂慮亦何所驅迫而然耶驅迫者非謂憂戚謂宴樂也以此觀之則斗酒相集雖淡薄而可長久極宴相索雖歡樂而多後患亦自然之理也冉冉孤生竹亮君執高節賤妾亦何為賢者不見用于時而即于老也則曰使君誠能執守髙節而不為奸邪所變移則我亦何所為哉李陵與蘇武詩良時不再至末云欲因晨風發送子以賤軀補注云亦欲乘風而以身俱往也竊以為少卿失身丐奴不即死者欲得當以報漢漢不䏻存其母妻子是以絶望也雖富貴虜庭而羞愧之心不能無一旦見蘇武歸中心愧憤而欲死故有送子以賤軀之言殆亦王陵母以死送使者之意于此正好究觀少卿之初心也沉潛玩味自當見之書簡與胡學士書一大學士先生閣下時勉忝以鄉後輩得參侍翰林承誨加多日昨同里修撰彭汝器歿于京寓過承車騎降賜撫慰為榮倍萬近又憐其力學無成躬言于上有㫖差人護喪以歸不惟生者有耀而死者亦得以瞑目無憾于九泉其為恩德何如耶但羣議以為汝器平生孤苦家族荒寒若得大人先生賜銘其墓以鎮撫其子孫則百世之下永有餘榮謹述其行實一通呈進惟髙明憐而賜之以銘亦鄉郡之所同幸也不宣與胡祭酒書一致政賔客先生閣下時勉自忖無似由竊第來先生居內翰職講筵得夤緣以鄉故進侍每蒙教誨深厚暨以不才出為秋官屬先生由大司成移掌史事謬承牽引得復參與同列者先生力也銘刻之懷永永毋忘前歲先生以年辭榮歸老于鄉優遊山水間時與耆英髙談羲皇之上時勉欲因夤幸㑹無從而去近者人來乃蒙賜以佳章組縟富麗每展誦之餘若覿丰采誼當屬和特以使還急迫先致片楮為謝俟遲當别具箋申酬也不具與楊少師書二少師先生閣下近者謬具封章觸犯國諱死有餘辜但思自束髮以來蒙國家教養以有名位坐食厚恩未有涓埃之報所職惟文墨是事是以繆取所聞以進冀得一言以措之于用實平生之幸也不意事與願違命遭時滯日昨廷撲骨折其三茍存喘喙幽閉過嚴自分永棄盡瘁于時無復人世矣邇者側聆運化惟新萬務氷釋春暘所煦不遺幽隂某與大人先生誼雖師友情則肺腑倘䏻一言以闢扃鑰俾黜為山澤之民以守斷壠以奠丘首是即生死而肉骨也臨楮不勝涕頥之至不宣承遣佳札至喻欲集諸耆英于京寓為燕㑹猥及愚庸俾參末席竊惟諸公皆位重朝端名滿天下為時具瞻者而愚輩學術疏淺位非要津齒雖差長而行不逮人恐不慊公論理宜遜避然嚴命再至其必或有所取謹當趨赴以聆任使不具與戴古愚簡三古愚翰學知己懋久不承誨迂鄙之心復萌昨見與務威書知髙懷之不忘吾猶吾之于賢兄也伻回竊有告焉僕兄弟近年以來雖愈貧窶然于母子兄弟之間麥飯藜羹皆能自處冀以盡一世彛倫之歡而已其不愜意者惟吾姪養蒙知吾兄弟心事甚至意其必䏻待吾子若吾兄之于我也豈期天所不佑竟奪吾賢姪在他人之于弟者則以為幸于豫心獨以為不幸蓋舍姪存日嘗與家兄私相謂曰此子寬而䏻容儉而䏻守率諸弟孝弟以繼吾兄志者必此子也今既死而吾子獨存知其他日為善人乎使其長而事吾兄如舍姪之于我也則家兄為有子矣如其不然則吾無子也今日慮而至此他日不幸而遭此䏻不痛于心割于肝肺而灑淚終日以思吾賢姪乎世俗多異是意也但可與賢昆季孝弟者道之非是而發徒多取譏爾近聞家兄居館悲哀殊甚煩執事為一言以寬譬之則惠我多矣貧居寂寥殊無雅懷故爾潦略闕恕暮春行間承昆玉不鄙棄意貺備至且連舟遠送數十里外握手噫嘻不能别非厚愛奚至此哉今遙遙在千里不得與故人接也竹林溪路扁舟野水之思往來于懷不釋者豈惟不得相從于杯酒之間以酣嬉縱謔而已誠以知已者遠而心緒無所託云爾寓此徼德庇無恙無足道念私家貧薄年老劫劫者莫吾長兄若也不才不能有所顧安之者其䏻時一往安之乎足下昆季仁義人也豫言顧己贅矣令兄令弟知己怡怡之暇倫誼篤至其猶有故人之念乎幸達下意雷闕也懋擬今歲歸省先人墳墓以達朝廷追贈之恩祭掃之餘得拜謁鄉閭親故而與吾兄論道舊懷以求其所以益我者屈指可期也不意中沮此自取得之無足惜者愧赧愧赧以是匆匆度日懷抱鬱塞有時茫然若病風眩人世都忘每作一詩操筆書罷輒不䏻記憶其不可與有為也審矣并録近作具在别幅觀之亦可以知其所存矣令兄令弟諸茂才及親故見問者為我謝焉李懋再拜與同年曽學士書二西墅學士年兄閣下日昨金城坊㑹聚言具本求歸省批答不允欲再陳乞懋以為士之去就有異自古有親近之臣有庸衆之臣親近之臣不可旦夕去左右庸衆之臣則去國長年纍歲而不屑是何也付託任使有重輕也閣下以科目則為殿魁以譽望則重于天下以付託則為近臣又昨承恩命賜紫金魚袋令隨從製作如唐虞世南為行祕書其不可以旦夕去左右也必矣如愚輩則旅進旅退或任一事或修一職可以長年纍歲遠去而不為多近聚而不為少此固庸衆之臣其去也奚屑哉以愚觀之則閣下雖欲再陳其不允也必矣莫若更遲數嵗而後可議行止也不宣䝉示髙作巢睫集讀之長篇多舂容演迤短篇亦皆精嚴雅麗信乎四方播誦如南金美玉足以埀世傳遠也無疑矣日昨㑹語間言不及唐人有活法自以為歉愚聞專祖蹈襲者謂之死法脫胎換骨者謂活法昔吕居仁序江西詩派言靈君有自得之妙忽然有入然後惟意所得萬變而不窮是即真活法也閣下之作已皆曲盡其妙蓋自活法中來奚必屑于唐人之軌轍而後謂之造詣也耶但在優遊厭飫以培其本爾如愚輩奚足以攀乎逸駕者耶不宣答貢士問書一貢士某文英足下日昨承書問宋朝進士有特奏名何也此載在宋史聞板被回祿不存惟通鑑采緝不詳載記云宋開寶二年十月詔禮部閲貢士十五舉以上曽經終場者具名以聞庚戌詔曰貢士司焉浦等一百六十人困頓風塵潦倒場屋非有特恩終成遐棄各賜本科出身此特奏所由始也景德二年三月賜李迪等進士第賜特奏名五舉以上本科六十四人三傳十八人三禮四十四人如年老受將作監主簿三十一人此特奏名所由立也又曰宋進士廷試何時而始也載記云開寶六年諸經學進士並試殿廷二月庚午御講武殿覆試新進士宋凖等以下一百二十七人其廷試之始乎又問宋之書判銓試其亦有自乎載記云建隆三年八月左拾遺髙錫言請問法書十條以代試判詔今後應求仕及選人並試判三道仍設書判科此書判所由起也乾德二年正月詔選人四時參選景德元年八月令銓司引對賫所試書判以備奏御至仁宗即位以諸官缺官凡守選者並與放選以示特恩逮至景祐而廢書判為銓試矣此銓試之由也餘問只採通鑑所載亦足以知其略矣不具與去伐友書二數日在告可䏻相就飲一斗乎秋凉步趨而大道平易車馬减少雖有沙塵亦風靜不逼人專俟專俟勿嫌坐邀舍館定己久宜一見過紙短情長不䏻一一前日聞貴恙或傳手足微有動搖疑是風即欲往問奈前者别歸數次咳血以此怕出蓋恐犯熱又且無肩輿之人以故不得盡情兹徑令一誠去問候動履何似希示報以慰渴思序芳徑胡氏族譜序廬陵邑庠生胡鍊以其族譜求豫序按譜胡氏始居長沙醴陵厥後有諱贇字文善者仕後唐官至文淵閣大學士兼知樞密院加特進贈太師中書令生三子五季時遭馬殷亂辟地于吉伯曰杲居廬陵值夏仲曰暹居泰和南城季曰炅居泰和禾溪其子惠字子仁徙黃漕子仁之孫諱良字文像徙廬陵之芳徑而德行文學簪纓仕宦代不乏人載之其譜見于諸公之序録備矣反覆觀之有足為斯譜重者三焉其為譜例譜規立法簡當議論正大意慮深遠防範切至此則七世祖江洲教授克明十四世孫樂泌翁宏敷之所作也觀者莫不起敬而况于其宗族子弟也耶是豈不足為斯譜重哉其譜圖序文有曰昔晉人以宦譜相髙寒門單緒談者齒冷吾宗之寒與否不暇計獨慮夫世次失紀則其序紊族屬不明則其道乖務欲念其祖之所自出合其族之所由分别尊卑叙昭穆喜而慶哀而弔不以其富貴貧賤相視如路人焉則于人倫厚矣此則九世祖宋景定進士翰林學士嵩之所作也其言有禆于世教也大矣是又豈不足為斯譜重哉宋紹興中淡菴先生上封事極論和議事連遭貶斥至于再三而不悔德祐中嵩之子太學生山甫上書論賈似道誤國不報宋季社溪有曰文可號可山從文丞相勤王至海上被執及元有天下可山季弟文定號定山誓不仕于元竟以不屈被害孤忠徑節出于一族炳炳烺烺照耀萬古此尤足為斯譜重也方今世族家之為譜者所以紀録先世簮纓科第求士大夫作為文辭欲以誇耀于時而己其有能如樂泌翁學士公之篤于綱常倫理之誼而以敦宗睦族為意者乎其有能如淡菴先生與山甫及定山昆弟之忠烈冠世者乎故豫因鍊之求特為著其槩足為斯譜重者以復之若夫繁文諛辭殆不足道也是為序古亷文集卷八
