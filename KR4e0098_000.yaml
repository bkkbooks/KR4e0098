body:
  text: 古廉文集别集類五明提要臣等謹案古廉文集十一卷附録一卷明李時勉撰時勉本名懋以字行安福人永樂甲申進士官至國子監祭酒卒諡文毅成化中改諡宗文事蹟具明史本傳時勉學術剛正初以三殿灾條上時務忤成祖繼以奏上六事忤仁宗終以不附王振為所搆陷前後瀕死者三而徑直之節始終如一其在國學以道義砥礪諸生人才蔚起與南京祭酒陳敬宗號南陳北李而時尤為人望所歸明以來司成均者莫能先也至其為文則平易通達不露圭角多藹然仁義之言豈非以躬行實踐所養者醇故與講學之家驕心盛氣以大言劫伏者異歟其所著作以當代重其為人脫稿多為人持去故所存者無多此集乃成化中其門人戴難所編其孫長樂知縣顒所刋併以墓志傳贊之類附録於末焉乾隆四十六年十月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:ef4f9347c4b403d50fc5b7c712bc05648bd4ca74760adaaccd27a872bdf9e144
