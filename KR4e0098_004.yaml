body:
  text: 古亷文集卷四明李時勉撰序應天府鄉試録序宣德七年壬子嵗當大比前期應天府尹臣璘奏請考試官皇上命臣時勉臣衷往蒞其事比至同考試官臣潤生臣用繹臣希亮臣紀亦皆來相與奉命惟謹不敢怠遑而監試官臣鯉臣觀提調官臣璘以為此朝廷盛典無容慢易綜理精嚴防範周密究弊滌滯廓然大公衆志既一羣情恱喜一時內外執事之臣莫不竭誠殫慮精白一心以供厥職乃八月乙未總太學畿內之士千三百餘人凡三試之于時連隂積雨比試之三日皆大晴朗衆咸歡然一口言曰是豈非天開文明之運國家太平之象諸士子得意之秋也耶於時就試之士亦皆踴躍奮發爭相淬礪傾吐其胸中之所有以期必得之者有以致然也臣等詳加考較得八十人之優者次第其先後與其文辭以為小録既成咸謂宜有序夫國家養育賢才而以科目取之蓋欲得其真才以為用也士之修於家窮嵗月憊精神以求堯舜禹湯文武之所以為治稷契臯陶伊傅周召之所以為臣孔子顔曽子思孟軻之所以為言孜孜矻矻不極其至不已逮夫學之既充德之既成一旦出而應上之求發舒其所藴以見於文章足以隆聲譽而掇髙科由是以有祿位隨其所遇遇皆能以堯舜禹湯文武之治期于上以稷契臯陶伊傅周召之事任諸已以孔子顔曽子思孟軻之道持其身不肯一失身屈已以由於非義者有以見賢者學問之力朝廷作養之效而科目得人之盛也洪惟我皇上以聰明睿智之資纘承大統膺重熙纍洽之運當國家無事之時而求賢圖治之意每惓惓焉故自朝之公卿大夫以至內外大小之職莫不皆得人以任之矣而聖心猶以為未足雖屏迹丘園棲身岩冗不求聞達之士猶欲招而致之况諸士子奮志厲氣翹然而出欲有為於當世者寧不加之意也耶今而獲登名於斯籍者皆學成德茂有用之才朝廷將進之以禮待之以爵祿之意也必厚矣尚益堅其志礪其操以修其職業期必無愧於科目之選可也孔子曰不患無位患所以立諸士子勉乎哉順天府鄉試録序皇上即位之初適當大比興賢之嵗是秋八月順天府兼掌府事行在工部左侍郎臣庸請考試官皇上以命臣時勉臣榖而同考官臣厚臣彥良臣圭臣若英監試官臣來臣春以是月丁未往蒞其事臣等奉命惟謹合八郡暨太學之士千二百餘人考試之取其尤者得八十人焉小録既成咸謂設科取士國家之盛典也不可以無序竊嘗以為成周之世鄉舉里選之法行士之修於家者皆仁義道德之行取於上者皆英偉博達之才而用於時者皆敦化善俗之政有以見上之待士也為最厚而士之自待也為不輕故由是而來者未有不可取取者未有不可用而用之未有無其效者也故曰唐虞之際於斯為盛豈不信然自唐以來取士之法亦已異矣惟進士之科為最重以其猶有鄉舉里選之遺意也然其後漸亦以弊而所以待士之意亦薄矣豈惟上之人待之之薄抑亦士之不能自重有以致然也國朝有天下我太祖髙皇帝即設學校詔天下三年大比以取士於今餘七十年矣五聖之德澤涵濡覆育鼓舞而作興之者非一日矣而賢才之出也蓋彬彬焉雖山林岩冗之間有志於當世者亦莫不爭自磨濯以求是途出而效用於時况學校之士乎方今內而公卿大臣外而方嶽郡縣以至于有司庶府之官莫不皆得人以任之矣而興賢之典猶不廢待之之意益加厚則夫士亦可不知所以自重哉今獲登名于是録者宜皆自重之士也行將試于春官對于大廷以爭先天下士而有官守之責尚其益思所以自重而圖所以自效哉元夕燕集詩序宣德八年癸丑正月朔旦皇上既受羣臣朝乃降敕諭曰今國家寧謐邊境無虞時和嵗豐兵民樂業斯皆天地祖宗眷祐亦爾文武羣臣贊輔所致兹嵗事肇新上元節近正當共樂太平自正月一日為始賜百官節假二十五日遇機務重事具本封進官員除齋戒餘日及軍民悉聽飲酒為樂京師如故張燈五城兵馬弛夜禁尚各循禮度用副朕懷羣臣俯伏恭聽咸踴躍歡呼以為慶幸越十有三日郊祀禮成明日賜百官宴而燈山亦成是夕皇上奉皇太后於西苑放燈觀賞又明詔文武百僚由西安門入同觀之既夕賜坐于圓殿萬嵗山前太液池之上環池至于山頂萬燈齊舉光熖燭天晃焉如晝命光祿設宴教坊呈百伎傳宣羣臣樂飲至醉既醉罷出而月當午矣時吾邑之士之在京師者頗衆既出東西散去得相聚會才幾人而河南參政王公太守陳公適相遇焉回顧鼇峰餘興未巳豫於是邀延至家粗具酒殽相與歡宴咸曰今日之事不可以無述乃取詩人雙鳯雲中扶輦下六鰲海上駕山來二句各分一字為韻賦五言詩一章以紀一時之盛詩既成衆以序屬豫夫元夕觀燈其來久矣而莫盛於唐開元中然其時君臣之間略無警戒之心習為侈靡耽樂逸遊淫詞艷曲流布中外至於顛越播遷而不知返其事可勝道哉惟昔唐虞三代之時君臣上下更相敕戒形於歌詠渢渢乎不可尚矣是以致治雍熙而後世莫及考諸詩書猶可槩見今皇上嗣登大寶動法古昔聿遵成憲故能隆守成之業以撫方夏之大佳時令節思與民臣同享太平之樂而必以敬慎為先羣臣奉法守職莫敢怠遑故今諸賢士於宴飲之際雖觥籌交錯而不踰於禮法之外談笑傾倒而不失乎莊敬之容至其見於辭藻以歌頌聖朝治化之盛者又皆發乎其情而止於禮義庶幾乎唐虞三代之風其視開元天寶之盛衰為不侔矣孔子曰詩可以觀豈不信然於是光祿署正萬資中作而言曰先生之言是也然吾輩得以宴樂於斯唱和於斯從容暇豫於斯奚可不知所自耶遐陬僻壤窮鄉深谷之民安居而暇食優遊以生死其不知所自者宜也若吾輩躬覩朝廷之制作親被朝廷之德化親沐朝廷之恩澤如此而不知其所自可乎哉既知其所自而怠於其職慢於其事而不知圖所以報稱者其又可乎哉衆咸曰宜書以為元夕燕集詩序一以自警且使遐陬僻壤窮鄉深谷之民聞而覽者皆知其所自而相與咏歌於無窮也夏日燕集詩序正統六年夏方伯髙安王君大參安成鮑君二令宜陽李君以考績至京師翰林侍講劉君有端陽之會停之以俟三君子之行乃於是月十有六日三君子皆至衆既恱喜集燕于其宅而庭宇軒豁薰風徐來纎塵不興几席淨蠲清言雅論從容欵洽以敘鄉邦之好道契闊之懷皆樂飲而忘倦酒半酣侍講起而請曰今日之會得三君子之見臨實有光耀焉不可以無述衆曰然於是即席分韻各賦五言八韻詩一章及暮酒罷而詩亦成明日侍講集其詩謂豫宜為序王符曰化國之日舒以長夫日出于暘谷入于虞淵厥有恆運而云然者蓋國家治安四方無虞朝廷公卿百執事以及于閭巷農工商賈之人舉欣然相安於無事惟佳時令節相與玩賞燕會歌吟嘯咏以為娛樂而已故嘗翹首跂足望其時節之至真若其晷運之有所增益者而益見其逺且長茍為不然則愁苦憔悴之餘將不知其時序之遷亦豈暇於燕飲而有歡樂之趣也哉然則豫與諸君得優遊於此時而有此樂者其可不知所自耶是故為郡縣為方面大臣昭宣聖朝德美以及於民使夫百里千里一方面之內之民皆熙然囿於光天化日之中而無嘆息愁恨之聲者是蓋可以報稱於明時而無負也若夫嬰冠食祿拘拘於詩書筆硯之間而無益於國與民者獨不有愧哉是則觀於此可以知太平之時之有可樂而樂之為無負者惟三君子為然也於其行并書以為贈云七夕燕會詩序北方之地夏秋多雨故七夕晴明者少時節之宴不愜人意今嵗正月不雨至于四月四月凡三得雨雖未厭足然人皆喜五月朔日始大雨朝野相慶自是淋淫不絶晴無連三日者有時雨驟至溝渠泛溢街巷水沒焉墻屋頺毁相望郊野之間舟行禾黍上七月朔旦始大開朗咸謂今秋七夕銀漢庶其可見也及期禮部主事陳鉉當設會適有五嶺使命於是邀同鄉之士凡十有六人合燕於其家几席既具延客入座天空雲淨星月交輝明河皎潔衆心亦暢觴酌屢行獻酬有容踰時涼風西來微雨灑庭衆皆欲起罷酒鉉曰今夕飲酒樂諸公何為去耶昔韋應物有詩曰炎月得涼夜芳樽誰與斟蓋以良時難遇而良朋難聚也今二者俱得而不盡其歡豈不有負於應物也耶乃復坐舉杯痛酌而雲亦斂雨亦散去遂取唐盧綸詩紫陌夜深槐露滴碧空雲淨火星流為韻各賦五言八韻一首以紀一時之盛就以贈會鼎行紙筆具於前而杯斚循環言論往復不輟衆皆構思詩酒之興蓋浩然于尊爼間而大風忽起隂雲四合雨意近在眉睫衆復默然主事劉求樂曰諸公但速為詩詩成雨自不至不然杜少陵何以曰片雲頭上黑應是雨催詩乎諸公慎無憂於是主人懼客之散也促為酒令行酒甚急諸公亦操紙筆競書詩成雨亦不至衆又舉杯劇飲醉然後歸明日國子上舍左璇輯其詩為大軸謂豫宜為序自古遊宦之為樂多在乎佳節令時而是會也頃刻之間天之晦明變化之不同人之憂樂緩急之不一如此則夫人生百嵗之內天時人事之不齊者其又可計也耶雖然當夫聖明之時國家無事海宇寧謐因得以極夫燕集之歡其所以不能盡如其意者不過風雨之虞耳茍非遇其時雖無風雨之虞其能得歡宴若此者乎主事行矣過家拜髙堂稱觴獻夀慈顔恱喜退而與宗親故舊序契闊之懷其樂固有踰於是者去而上三湘浮七澤厯五嶺翺翔於通都大邑蓋不減子長之遊然求其交遊之畢集合尊爼以相樂情孚意契無纎芥乎其中若兹夕者或少也故書之以贈或時一誦之庶幾其於吾徒不忘哉中元日燕送劉主事序吾邑之士在京師者每時節燕會常二十餘人今年自伏日以來或使于四方或受職外任以去至中元之會猶十四五人焉是會也禮部儀制主事鮑時博實主之以豫有上陵之行故停以待及豫歸又連有國忌至是月之二十有五日始會衆賔合燕于其第而儀制主事劉君求樂適有奉使西蜀之命酒半時博曰燕會常事也然有所賦詠今劉君行在即盍亦以是為餞而賦詩以贈之乎衆咸曰然於是取杜少陵詩主人送客何所作飲酒賦詩殊未休二句各分一字作五言八韻詩一首既成時博又以序屬豫夫禮貴得中凡燕聘饗覲冠婚喪祭其儀文度數隆殺損益有一定而不可易者然必合乎中道而後有以通乎古今適乎時宜當乎人心行乎久逺而無弊也國朝自太祖髙皇帝有天下以來制禮作樂上自朝廷下至郡國庶人里巷極而至於蠻夷外國其禮文法制纎悉備具未有逆於道而戾乎古者於今餘七十年其行之也已久其賢者得於見聞之間也非一日矣然有舉而施之或不能盡愜乎人意蓋未嘗究心於是而不知夫隆殺損益之體者也求樂故家子性頴敏而沈靜其在儀曹有年其於禮諳練之已熟今之去而至彼也必有以為王國之所瞻仰而為知禮者之所欽服則於君命庶幾其不辱也此豫與諸君之所以樂為求樂餞而又重之以詩者抑亦以求樂足以勝此而於鄉士大夫為有光也遂合諸君之詩書之以贈云九日賞菊詩序豫在北京復居城西又十稔矣始構屋數楹于其東偏以為延客之館前有隙地種菊數十株時維九日繁英欲吐秀色可愛遂邀鄉曲之士之在京師者相與燕集而賞之殽羞既陳不愧菲劣而客亦不以為簡掇英泛觴皆引滿而不辭笑談雖劇而禮度不踰酣暢淋漓而杯行有序市喧不聞塵慮都忘自以為山林之樂亦不過此春官主事劉求樂以為今日之會不可以無述衆咸曰然於是分題賦詩而行不輟酒既闌而詩亦成會者鄉先生吳良善存監察御史王讓體艮禮部員外郎鮑時時博主事陳鉉會鼎翰林編修吳節與儉檢討李紹克述信宜學諭尹遜恆遜浦城學諭彭素三白進士彭貫進唯戴相廷器劉鉞伩德洎豫與求樂凡十有三人時幼子艮初冠侍酒尊爼間亦令拾題得詠菊有武臣子在席亦與題作七字詩一首皆歡然以為難得於是洗盞更酌極醉而罷明日求樂輯其詩得十有五首以示豫曰宜有序夫物之負其芳香清潔之姿而不遇騷人墨客玩賞而賦詠之以傳誦於世則憔悴零落與深山窮谷之草莽叢生而並脆何以異哉今是菊也得諸君子一顧賞之以酒而重之以詩其文采煥爛豈獨增其穠豔而於弊廬亦有光耀焉何其幸哉雖然吾與諸君得休其暇日因其節序而寓其樂於此者蓋遇夫聖明之時而非偶然也願相與勉焉共圖報稱庶以保有其樂於無窮哉新安九日詩序正統四年七月十有八日甲子豫之去家鄉而還朝廷也連日北風舟行甚艱九月三日戊申渡大江始得順風九日甲寅至新安心頗快適而又遇佳節先是過淮隂欲買菊以備節賞有故人之兄羅文振者聞之特送菊一株置之篷窗便覺有清趣因與同行諸公約節至燕賞以暢敘客懷至是風便皆欲行而大雨驟作乃留宿河畔秉燭對菊諧談劇飲得盡此興以償夙願蓋甚樂也指揮趙公曰我不知書諸公能詩者烏可以無述遂各賦律詩一首而罷越六日已未至棗林閘水淺舟膠不可行而舟中之菊猶榮茂盛開芳香襲人衆以為但有可樂即為美景亦何必九日於是復取酒賞玩舉觴緩酌宛然如在東籬三徑之間不覺其泛舟河曲而居客中也乃取陶淵明悠然見南山之句各分一字為韻作五言八韻詩一章詩成咸謂豫宜序去嵗暫還故鄉家多喪禍憔悴無聊不知九日之過今兹喜逢九日而又在乎關河數千里之外不有故交賔客以相慰藉則何能有此歡會而以見之文辭間哉昔劉松袁紹飲于河朔以避暑後世稱為河朔會今豫與諸公飲于新安以賞佳節又安知不為他日之故實也耶同飲者鷹揚衛指揮趙興前左司稽禮戴公之子去伐司經局正字顧公之子榮祚族弟振通慶生侍酒者幼子艮小孫驄洎豫凡八人賦詩者五人而豫又為序云至日燕集詩序鄉里之士之仕于京師者時節有燕賞賦詩之會豫自去嵗之春連遭喪禍及秋得請暫歸其鄉不預會久矣今冬還朝遇至日而參議鮑君時博以進賀聖夀表文自山西至二守劉君存有與其姪廣文金鉉以秩滿自滇南巴蜀至前五軍斷事官戴君之子去伐以事自其家至諸君喜朋遊之多集而又值佳節於是置酒會于侍講劉君之寓館列坐以次引觴緩酌清談雅論祛逺塵俗時出新令以申主意以暢客懷既夕乃罷而餘興未弭豫以諸君闊别之久也期以明日會于旅舍衆皆諾明日如期無不至者歡飲如昨酒半侍講取杜少陵至後詩中第三聨即席各分一字為韻作五言八韻詩一首吟咏之間而觴酌不廢雖絲竹管絃之音有不足以喻其樂且適也又明日侍講輯其詩為一軸示豫曰宜有序夫聖明在上中國尊安三邊無警四方萬國舉相安於無事佳時令節自國都以及閭巷公卿大夫士庶人孰不具尊爼以相宴樂以頌歌太平之盛然求其在數千里外為一鄉故之人道同而氣合情孚而誼篤優遊間雅從容溫厚而無乖忤彼我勸酬交錯之間論議往復之際或直切以相規或婉委以相朂或謔浪笑傲以相為樂雖甚而不流雖劇而無競雖酣嬉淋漓之餘而有歌吟賦咏之什則人或此之羡而豫蓋不知其為可也尚期與諸公益勉且慎之使人曰此其有始終者庶乎其可也會者二十人賦詩者十有四人詩凡十有四首以次列于下方云石瀨曽氏族譜序吉水石瀨曽氏郕國之後宋寶祐中其裔孫德卿纂輯譜系明正詳備元未燬于兵燹國朝洪武中德卿之七世孫思勝又修復之用心篤至久而後成今年冬思勝之從叔父伯善以來京師示豫因翰林侍讀周君徴為序適豫有掌教國子之命冗迫不暇以為辭之再四伯善請之亦再四雖祁寒颶風往返不厭辭不獲則為之言曰譜為敦宗睦族作也故家大姓不可以無譜族廣而人衆源逺而末益分茍無譜以紀之則昭穆不明長幼無序禮節不行恩愛不通而乖爭陵犯之風起矣乖爭陵犯之風起則其禍害有不可勝言者豈特相視如塗人而已哉竊嘗見今士大夫家莫不有譜觀其所自出與夫其世次逺近長少卑尊之序粲然明白而其纍世簪纓文物之盛有若不可及者然或貴傲其賤富欺其貧強陵其弱衆暴其寡長幼尊卑之序蕩然莫復可辨是則譜雖存果何益哉惟吾曽氏則不然曽氏自郕國十五世孫據避王莽亂南遷居廬陵之吉陽厥後子孫散處四方如永豐之龍潭蘭溪皆其族也當元季兵亂蘭溪粹中昆弟遣人至石瀨邀曰可舉族來此同避禍亂以待時清意甚惓切石瀨雖不往而宗族之誼藹然可挹及今伯善建立家學俾族屬子弟肄業其中延明師教之使之習知孝悌志信之義以為敦宗睦族計此其度越常情逺矣雖使譜之不作亦可保無傷倫敗俗之事况譜之修備若此者乎大賢之後厯數千百年而有此可謂不落莫矣為子孫者觀於此可不勉哉南岡李氏族譜序譜者記先世所自出與夫長幼尊卑逺近親踈之序所以明昭穆而著彞倫之道也善者紀之而不善者諱之仕宦者書之而隱處者不遺所以存忠厚而示勸懲之義也然則故家大族又豈可以無譜哉無譜則不惟無以考觀前人之所遺而效法之以盡承先裕後之道且將無以辨昭穆别長幼而盡敦宗睦族之意由是禮義不興則恩意不通而紛爭陵犯之風起矣紛爭陵犯之風起則將相視如塗人者有矣又何以稱故家大族之名哉有志於尊祖敬宗而盡貽謀之道者誠不可不加之意也泰和孝君桓圭持其族譜示豫求為序李氏系出唐西平忠武王晟晟之孫遊為宜春守子孫因居宜春白芒其後有曰公儀者為南安大庾簿既老其子禹輔奉以歸過泰和留居為南岡李氏至桓圭八世矣上距西平二十有四世其間詩書禮樂之澤衣冠文物之美簪纓科第之傳蟬聨不絶何其盛哉説者謂西平勳德之隆足以庇蔭之要亦其後嗣之多賢有以致然也宜春之李自嶺南節度使憲以來積德纍仁不可勝紀至南岡有曰英叔者仕至柏興路同知嘗築碉槎灘二陂堰江水溉田三百餘頃至今人賴其利桓圭英叔五世孫與其弟信圭俱為縣令以寬厚之德行平易之政民親之若父母桓圭由南陽遷常州府判信圭由清河遷秩知州署縣事民之蒙其惠者尤衆也夫以李氏作之於前繼之於後者皆有其人如此其所以蕃衍盛大而益振耀不衰者固其宜也桓圭之為是譜而詳著之以示其後之人得無意哉先世之澤深矣在迓續之者何如耳譬之泉焉源之深者其流也必逺為桓圭之子若孫者疏濬之盡其道慎無壅遏之則李氏之福其有涯哉南溪蕭氏族譜序豫家食時聞泰和蕭翀鵬舉之名甚盛及登進士官京師而鵬舉為山東運副以沒卒不獲一見識以為慊今年秋其姪子煒攜其尊府鵬翔所修蕭氏房譜示豫其序文則鵬舉作也反覆觀之有以見運副昆季為忠厚純雅之士人所不能及也夫人之所以異於草木鳥獸之類者以有五常之道也自堯舜禹湯文武以來國家以是而設教百官以是而為治人民以是而相與蓋天理民彜自然之則人生日用常行之道有不可違者一或違之即非所謂道矣有元入主中國其政治之隆或幾乎古獨彛倫之道為有缺焉者其相習然也一時之人漸染之久不能不為所變我太祖髙皇帝平一海內首以五常之道申明於四方聞者翕然而從獨其中有未盡革者以弟為子之一事耳吾嘗救其弊矣一時隨俗而為之不覺其非及乎易世之後子弟不見先世父兄叔姪之相與狃於近習安於故常一旦欲釐而正之勢有所未易也宗族之間茍有仁人君子懷中正之心負剛果之性確然以復彛倫為務者則天理之在人心未嘗泯滅烏有倡之而不從哉泰和南溪蕭氏有南山為其兄德明之後德明有子信可早卒故以南山為嗣此逆理亂常之事不可為訓於後世者南山生子蘭谷蘭谷有子三人今以蘭谷次子為信可後而正南山之位與德明並德明之祀不絶南山之次不紊則天理順人心安此天地之常經古今之通義孰得而間之哉雖然在鵬翔則有難焉者鵬翔南山之曽孫南山德明之同母弟一家父子兄弟之親有未可以號於衆者此房譜之所作也而運副亦曰與其合而致爭莫若分而無爭之為愈也委曲之意婉欵之辭蓋欲以此感悟族人而歸於正此忠厚純雅之心胸人固有所不及者然吾猶怪鵬翔待族之狹也子貢欲去告朔之餼羊孔子曰爾愛其羊我愛其禮欲存羊以復禮望後世鵬翔獨不可存族譜之名而以復彛倫之道望族人耶故吾特為正之曰南溪蕭氏族譜云一族之間將必有傑然而出如吾所以云者使蕭氏長幼尊卑之序秩然而不亂和樂愛敬之容藹然而相接則房譜無所庸矣姑序之以俟鄒氏族譜序兵部武庫郎中鄒君孟爵以其所為家譜一編示豫求豫序按鄒氏之先世居撫之艷坪其後有贅于新淦之閏陂者遂為新淦人閏陂生二子其季曰少四府君復徙邑之晉溪蓋孟爵之八世祖也今為晉溪鄒氏孟爵慨其舊譜亡失由閏陂而上至艷坪其世次不可考於是自少四府君而下著其所可知者以為之譜其不知者略之生卒嵗月娶某氏葬某處仕不仕備書其下其詳且實如此孟爵之用心亦勤矣孟爵之大父義叔翁嘗有志於是未就而沒至于孟爵懼夫因循怠廢愈久而愈忘之則後之子孫不知其所自出及其族屬蕃衍昭穆不明長幼不辨恩意不相孚慶弔不相及幾何其不相視如塗人也歟其所以至於少陵其長貴傲其賤富欺其貧乖爭悖戾輕蔑棄絶若素不相識者固宜也何也由譜之不立也茍有譜則孰昭孰穆孰長孰幼孰親孰疏一考證而可見嵗時會聚之間坐立拜跪之際其分斬焉其序秩焉毫髮不容以或紊孝弟恩愛之意油然而生歡然而相接人將不歎羡歆慕以為故家大族詩書禮樂之澤之所以流衍洋溢至於如此而不知其致此者有由然也譜之有益於世教也大矣宜乎吾孟爵惓惓而必欲成之也歟且孟爵之意以為鄒氏自晉漢來惟少四府君仕宋至銀青光祿大夫其後隱居樂善積纍之久至於吾始得叨祿於時以從大夫之後實前人之餘慶吾其可以不知所自哉著之譜使後之人知之慎修以承之庶引而勿替也然則孟爵之作是譜非獨為敦宗睦族計蓋貽謀之道存焉故并序之為其子若孫者尚勉乎哉仙居吳氏世譜序孝弟仁義詩書禮樂之澤之垂于後固足以庇隂其後之人使之蕃衍盛大若水木之本源深厚而其流之逺其枝葉之茂固其宜也觀諸天台之仙居桂里吳氏可見矣吳氏之先居遂昌自其始祖銀青光祿大夫檢校國子祭酒兼侍御史全智由遂昌徙仙居銀青之九世孫曰詠與其從弟謙芾連擢髙科詠之子驤謙之子浚芾之子津又聨登甲第鄉人榮之縣大夫為更名其里曰折桂至今稱桂里吳氏考之其譜有篤於事親親沒而後仕者有不忍違親假近職以資養者有因寄託權其子母以待其來而歸之者有因飢嵗傾廪以濟飢者有闢館聚書延禮名師以訓教族屬者有執義秉節始終不渝者是豈求異於人哉由其大家舊族性習之美有以為之也其所以垂休衍慶以遺其後之人豈為少哉今陜西都司都使同志吳氏之賢子弟也昨來報政天官為豫言同志之先自居仙居來十世祖洽始為之譜十二世祖岐又重修之至先大夫淳慮有他族相冒之患總萃為一圖以銀青為始祖居中餘一世一匝以旋於外其防範之意可謂密矣然不拘世次但以生年月日為先後而以上中下别為尊卑其於昭穆之序親疏之辨則或難於考據先君子與先叔父欲重加修輯志未就而沒同志與諸弟姪痛先志之不遂於是翻閲舊譜考諸文集并其所聞知足其未備補其缺略先立譜圖五世為一編次立譜傳一世為一編名曰世譜其封贈誥敕贊述文字别為一卷名曰世録而先大父之圖仍存於其前總名之曰宗譜編類已成願為我序吳氏自銀青來至于今二十餘世矣其宗族之盛子孫之衆多凡數千指而簪纓科第代不乏人非其先世之所遺者深以厚烏能若此哉同志之所為譜謹嚴詳備既免乎他族冒妄之患而又盡乎惇宗睦族之誼於前人之意兼得之矣非其賢能之乎為吳氏之後人者可不思所以繼承之而使先世之餘慶永永而無替哉谷平李氏宗譜序谷平李氏西平忠武王之裔忠武之子憲節度嶺南節度之子遊刺宜春節度沒刺史奉其喪葬分宜遂留居宜春之白芒白芒後七世至唐始析居谷平其二十四世孫克勉持其所修族譜示豫自忠武而上略紀名世至于黃帝迂逺遼逖難以考據依舊所載録而存之耳忠武而下則詳述之谷平至于今日又加詳焉其譜自為類例不倣於古不同乎今雖若繁蕪而實詳備雖若雜亂而有條理以其諸𣲖分而為圖各有標識生卒葬娶行第名諱仕宦出處各疏其下支分𣲖别粲然明白上下若干世萃為一帙名曰谷平李氏宗譜又輯國家詔誥敕與夫史籍之所載文人才士之所記述等類文字别為一帙名曰西平李氏文獻既成鋟梓將以散給其族人徴豫序夫忠武之豐功厚德所以庇蔭其後之人使益逺而益盛者固無以尚矣自谷平出而仕處而居所以積德行義修仁厲行以延前人之餘慶而貽後人之福澤者蓋亦有其人焉考諸譜可見也譬之大木之本固矣大川之源深矣茍益培植而疏濬之則其參天赴海之勢孰得而遏之敦宗睦族克勉之用心亦至矣繩其祖武以不墜厥緒深有望於後人焉為其子孫者尚慎勉之使益蕃衍而盛大庶有光於前人而無負於作譜之意也上黨趙氏族譜序曩時中原無事北方士大夫家皆有譜以紀其世次雖離散分析而昭穆不紊自戰爭兵革之興奔走流離之後公私載籍化為灰燼故家大族之人既得獲舊業欣喜相慶而不復念存先世以為貽謀計如使當時之子弟能因其所知訪求而紀録之則故老遺德猶有存者殘編斷簡猶可考究存其所信而缺其所疑使後世之子若孫或可因是而知其一二以舒其尊祖敬宗之心則豈不美哉奈何其樂於因循茍且而不能也厯世久逺益以茫昧雖有孝子慈孫欲求其先代世次之久近字諱行第隱顯出處之詳有不能得不過撫膺長嘆而已此吾常州二守趙公所以痛心切骨而莫能泄其情者也趙氏先世有譜元末燬於兵燹其世次逺不可考二守但以其所記憶者自一世祖山居潞城之神泉二世祖均玉自神泉徙居上黨今為上黨趙氏均玉四子十孫曽孫男十有八人其季曰德新三子長曰賢賢三子長即二守曰泰字熙和始以鄉貢進士出身貴顯則其先世餘慶之所發方自兹始趙氏之福固未已也二守嘗以為先代世有顯人而紀載無傳自神泉來至今才五世百五十餘年之間而始至於吾得五品官是豈吾之所能哉先世之所積也先世之所積逺不可知自吾所知者安可不紀之以遺其後人使之因是而有所考據以續而傳之不致悔恨猶吾今之於昔也遂以成是譜而來求豫序吁公之用心可謂勤也矣其承先裕後之意可謂至也矣誠使其後之人知其所用心益相續而慎修之紀載有法昭穆不紊尊卑長幼之序秩然而有倫宗親愛敬之意歡然而相接則人將稱曰此上黨趙氏之賢宗也於是譜獨不有光也耶浮山李氏族譜序安成之李有兩族一祖唐忠武王晟一祖南唐江王景逖祖忠武者曰西平李祖江王者曰金陵李金陵李族屬鮮少近而且易知若西平李則自袁州白芒來源逺而未益分支𣲖繁盛散處四方不勝其衆皆有譜系豫之所見者數家世次多寡不齊因究其所以然繇其逺且衆也未嘗遡其流而窮其源惟紀忠武而下數世人所共知者以居其前掇已之宗所可知者自下而上以續之中間世次脫落不計也故自忠武至今九百餘年有以二十世為一譜者以十五六世二十二三世為一譜者其繆妄可知也今浮山李氏實忠武之裔舊譜亡失無可考據因其所知者著之才十三耳八世以上則處士昻霄甫之所紀也昻霄甫讀書有文行專以存録先世啓迪後人為心故有是紀也九世而下則今翰林檢討克述因其兄順陽之所續增者而編次之而譜遂以成按譜圖李氏始居縣治北堅濟廟之東不知自何時何人從何而來其後徙南田自南田徙凹頭徙浮山今惟浮山之族盛盛則必有譜以紀之然後足以統宗合族而不至於相視如塗人也宜乎昻霄甫與檢討君拳拳於是譜之作也上至七承事而止不強其所不知者以傳於白芒然人皆知其為忠武之裔是則可尚也吾嘗以為故家大族不可無譜然不必汲汲求其所自出也惟其子孫明乎道德仁義而由乎規矩凖繩持之以恭敬辭讓而文之以詩書禮樂自其一家達於邦國於天下而無不得焉則人無不仰之矣不然則雖聖人賢哲之裔後世之公論有莫能逃將奈之何哉夫不以其名而必以其實者天下之事皆然也故吾深有重於昻霄甫檢討君之作是譜足以為世法也遂推其意而序之若夫序昭穆明長幼以維持綱常之道則凡為譜者皆然是故不足述也燕山胡氏族譜序故家大族不可以無譜無譜則不知先世之所自來四時祀事無由以致其敬吾見孝子仁人之失其祖痛心切骨而無所用其情者多矣此何以然哉或遭兵戈亂離之厄或遇水火盜賦之災或由子孫窮苦困極流離顛沛之餘是數者皆足以致之然則為其後人者宜何如其用心哉親戚故舊記憶之或可徴逺宗疏族紀載之或可考名賢碩士文字之或相及是皆可訪求而輯録之雖未能完具猶庶足以盡其孝思追逺之忱愈於棄而不為者也吉水之燕山有胡氏世居之其彥前中書舍人淨海澄與其從弟昕持其世父有初翁所修家譜來謂豫曰胡氏自吉水令仲雅公以來家素殷富世以詩禮相傳文物衣冠之盛為士大夫所重而小人則不恱也元末兵亂盜賊蜂起肆行劫掠鄉里咸被其毒一日至燕山曰此素以詩禮自髙貴者殘燬特甚先世所藏圖籍盡為灰燼譜牒遂以不存國朝平定海內宗族漸歸規復舊業稍克就緒有初翁即有意於修譜掇拾於煨燼殘缺之餘詢訪於親故長老之言而徴之以宗黨伯叔之所記憶厯嵗逾紀頗有可觀惟縣令公以上不知其所從來先世相傳出自華林然不相關問不知華林為何所適有鄉親云嘗授徒奉新奉新有華林胡氏得無是耶有初翁即遣嗣子昕往參考焉有元鳯者七子第五子仲雅為吉水令子用晦用方用簡皆從在官仲雅沒以兵亂不能歸葬葬其邑南芙蓉山下燕山之陽三子因留家焉名其山曰燕山因家山下華林之譜所載如此昕遂録以歸報有初翁會族人道其事深自喜慰曰此豈非祖宗之靈之使然耶於是譜遂以成願先生為序之吁有初之用心可謂至也矣夫承先裕後之道莫大於孝孔子曰慎終追逺蓋逺者人之易忘也而能追之是不忘也若有初之所為可謂能不忘乎其逺者矣不忘乎逺則有以承乎先矣有以承乎先則有以裕乎後使世世相承而不替豈非孝之大者歟豫於是論其孝之大者以為之序若夫其昭穆親疏長幼之次見於譜者兹不著也清溪李氏族譜序安成李氏多祖西平忠武王蓋忠武十有五子皆貴顯多處中原而清溪忠武第七子隴西公憲之裔憲為江西觀察嶺南節度使其後子孫有居安成之清溪者凡若干世族屬蕃盛散徙四方詩禮嗣續簮纓蟬聨至于今不絶是雖忠武之積慶遺澤抑亦其子孫世守家法有以致然也往昔家居時識李氏之老成曰克端慷慨尚義讀書而好文别號鑑泉人以鑑泉先生稱之而不名豫嘗一往訪之延豫坐于其讀書樓憑闌望逺臨流賦詠舉觴對酌樂而忘歸俯仰瞬息於今餘四十載前年暫得歸復過清溪而鑑泉已遺世矣鑑泉嘗修復舊譜以付其族子黃梅教諭靜又倣宗法為譜系圖於其前以足其未修然後是譜粲然明白可觀今年教諭考滿京師以致仕還持是譜求豫序曰亦鑑泉之意也撫今念昔不能無所感焉李氏之祖父遭值亂離扶老攜幼避入廣西故自其曽祖而下皆沒于廣西教諭生長蒼梧宦遊四方惓惓求其所自出遂得與鑑泉通往書問每欲尋訪故鄉以會宗族而致其親親之意數十餘年中間幸獲一歸宗親父老藹然于相見之頃以為水木本源之義尊祖敬宗之情追逺不忘之意具見於此是雖無譜孝弟恩愛之忱昭穆親疏之辨自若也世有至親骨肉相與忿爭鬬敓狠怒毁詈相視如仇讐喜喪休戚略不以為意者是雖有譜何益哉豫聞而深以為然曰教諭君可謂李氏之賢子孫也今致政而歸汲汲於是譜惟恐負鑑泉所託而來求豫言將以遺其後人使益敦夫孝弟忠信之行以毋忝前人豈不尤賢矣乎豫故不辭而為之序莫氏族譜序譜者所以明昭穆别長幼辨親疏誠敦宗睦族之要道也雖無古者宗法之意而所以扶世教厚風俗使彛倫之道不至於蕩然無檢者則於是端有賴焉然非詩書文獻之族敦禮而尚義者則亦或莫能知所重而留心於此也毗陵太守莫公報政天官持其所修家譜示豫徴豫序按譜莫氏之先居山東之渤海至宋有曰霸祥者仕為兵部尚書南丹安撫使初往南丹時道經廣西之靜江登覽其山川詢訪其民俗徘徊久之而後去安撫既卒于南丹其子綜以其喪還至靜江曰昔我先人徘徊顧瞻而不能去者得無意乎今過此其冥靈殆亦將遲留而遊於此乎反覆念之於是卜善地葬之困廬於其側而弗去厥後子孫因留家靜江靜江之有莫氏自綜始綜生蒼梧尹邦達蒼梧生象州同知東軒象州生元靜江路學正道回學正生國朝浙江都司事雲章雲章生鎮江府司獄伯常司獄生公自安撫至公八世自綜居靜江才七世族屬益盛而倫理益明粲然禮義之相接藹然恩意之相洽處者德行可尊出者聲譽可挹文采風流他族莫比吁非其先世積纍之厚與其子孫之賢亦何克至此今公又能作是譜以維持而敦睦之使其後之人益繼續而修之雖子孫衆多散處遼逖一展玩之間逺近親戚長幼卑尊之序昭然明白相親相愛而不至相視如塗人者則豈不美哉此實公作譜之意也公之在毗陵其善政敷於民也深而民之愛之若孺子之慕母惟恐其去已也夫仁民愛物之施必始於親親觀於此則知公之為政信有本哉因并及之東里續文藁序少師兵部尚書泰和東里楊先生未仕時遊湖湘與楚府教授吳一翁為莫逆交一翁鄉前輩嘗為豫言先生博學而有志端敏而寬厚識達事體不矜已傲物為文章獨追古作者後來當必鳴世而其才德可大任豫聞而識之其後往往得先生文讀之愈深企慕欲一相見不可得及忝進士被選入翰林而先生已居禁近參掌機務一見歡如平生其所以教愛之意甚厚出入翰林三十餘年見先生言語動靜與其所行事公平廣大寬和而有則其心專在於國家未嘗有一毫私已圖至於臨大政決大疑衆皆爭論紛紜先生獨無言久之徐為一言衆莫不懾服至有輿論不一須上聞者既以聞卒從先生言其在上前遇事盡言不計利害每辨論人賢否及解釋人過失一出於公不以恩讐為輕重取舍至於獻可替否有旋乾轉坤之力然未嘗與人言韓子曰入以告其君出不使人知者大臣宰相之事於先生見之先生以其餘力發為文辭渾涵溫潤謹嚴而靜密如精金粹玉自足以見重於世夫文章之見重於世以其人也茍非其人雖美而傳反以為病矣揚雄柳子厚王安石文非不美也人或因是而訾之由其所行悖焉耳董仲舒諸葛孔明陸贄范希文之流讀其書思其人恨不生其時聽其議論以求其益則其文章之存雖與日月爭光可也誰得而議焉先生之志行固無異乎四君子者而仕宦四十餘年厯事四朝其功在國家德在生民所謂先天下之憂而憂後天下之樂而樂者庶乎其無所愧焉其文章之足以垂世而傳後者豈偶然之故哉先生病在牀以其續文藁授豫曰其為我序之以付孺子藏於家豫文未成而先生沒嗚呼先生其可死也耶國家柱石後進儀型一日不見其感念之情慟悼之意豈獨豫一人哉思其遊處思其笑語聲音容貌宛然在目其何能以不悲也耶悲苦之餘又何能以序其文也耶然先生治命不可違遂收淚而序之如此先生字士竒東里其别號也李方伯詩集序河南布政李君昌祺集其平生所作之詩凡若干卷不逺千里以示豫反覆觀之有典則溫厚如正士立朝有流麗動快如明珠走盤有舂容浩瀚如長河大海滔滔不息論方今之作者李君固其人也夫詩本情性學問以實之仁義以達之篤敬以足之學問其力也仁義其氣也篤敬其誠也學問不足則其力不固仁義不至則其氣不充篤敬或間則其神不清三者不備不可以言詩三者備矣又必先明體製審音律體製明矣音律審矣又必辨清濁去固陋清濁辨矣固陋去矣又必得夫興象則其發也沛然矣夫如是雖處富貴榮華煩擾之中貧賤羈孤無聊之際發於其心而見於言辭者無不得焉何也其本立也君自少學問入郡庠為弟子員孜孜焉窮晝夜不怠官府貨利之場不一迹至故其學甚髙其守甚正其量寬宏而物莫能攖之自為進士遷郎官而位方伯三十餘年其操履如一日雖政務倥偬中而吟詠不廢非其本領之厚講貫之精者能如是乎哉公之德行道義既已表表偉偉而其文章又粹美如此固不待豫序説而足以垂世也必矣君亦未嘗求豫序豫以其必可傳也故為之序以歸之戴古愚詩集序安成戴君誠問别號古愚洪武中與豫同為縣庠生時在泮者皆以經術為務莫有言及詩者君窮經之暇輒事吟詠故又以能詩名其後貢入太學得五軍斷事司稽禮罷官歸益專意於詩鄉里有復古謝先生者篤學老成工為詩君攜所業造而問焉先生曰不知古不知今自漢魏以來至于今日作者非一人不能窮探厯考知其要妙之所在則視今之作與古無以異欲有所造詣難矣蓋詩有體格有製作有音律有興象必辨其體格詳其製作審其音律體格明製作精音律諧而後可以言詩至於興象則在乎其人學問之至用力之久自當得之非可以言喻子歸而求之有餘師不必我也君歸取其藁焚之大肆力於詩考求古作者之意而必欲與之偕居數月復見先生先生曰若子者始可與言詩也矣且自成一家言而後必有傳焉由是其詩名益有聞于時君今不可見矣其嗣子去伐輯其所作以鋟諸梓徴豫序夫詩本乎人情關乎世運未易言也雄渾清麗雅淡俊逸放曠綺靡刻苦怪險之作隨其人才性之所得髙下厚薄有以為之也若夫其溫淳敦厚乖戾蹙迫安樂怨怒長短緩急之音則因其時世之所遭盛衰治忽之不同有以致然也夫以其人才性之髙而遭夫時世之會得以鳴國家之盛者蓋千載而一遇豈非其幸也耶君故家子長身美髯性介特而寬厚不妄與人交所交皆當時賢士家無餘積鄉鄰故舊有不給周之惟恐後晚節益屏逺俗纍惟娛情山水間以自適其為人如此而又遇乎太平無事之時故其見於文辭清婉流麗有不可及者如此豫特為序之使人知是集實所以鳴國家之盛者而亦有以見君遭會之幸也柏臺玩月詩序餘姚侍御胡公遣使至豫章以書介其友縣大尹李公來謂豫曰吾為御史凡若干年矣一日夜宿憲臺與二三友坐于庭中于時天宇澄淨明月當空朗然如晝玩而樂之各賦詩見意既罷退休于寢軒窗玲瓏几席淨蠲容光之處無不昭晰洞見毫未乃反而自省曰月之明照無私如此吾之心其有未明者乎茍有未明也其何以燭于理以施於政以底於公而服乎人哉於是務欲求以至于明之之地以施於政以底於公以服乎人而後已未知其果能否也士大夫聞者皆為柏臺玩月之詩以見朂先生其為我序焉古之人德已至矣而常若未至雖老而猶進進不已衛武公行年九十見淇澳之竹作淇澳之詩以致切磋琢磨之益故武公晚年進德之髙至于今人猶頌武公之賢不衰侍御以科目發身入為御史溫和簡靜端徑而亷介明於政體而持憲平恕久居憲府而人多稱其賢非其明德有以誠乎其身行事有以合乎人心固不能如此然於玩月之際猶思所以反求諸已加學問自修之功雖居富貴而不怠古之人何讓哉若夫謝尚之泛月牛渚庾亮之玩月南樓謝希逸之抽毫作賦李太白之舉杯邀月徒縱遊樂於間放之日騁才思於辭藻之間其於反身修德省已勵行之事亦何暇於留意哉此武公之所以為賢而侍御之所以難得也士大夫歌詠以美之不為過也殆將與抑戒之什並傳於永久惜乎豫未之見也徒竊卜子之意僣為序之葛溪别業詩序劉氏世居安成之西茨溪為邑望族代有顯人至伯文之先君子子定得别業于城北之葛溪而徙居焉今二世矣而茨溪之遺基故址園田林沼固在也其原野曠衍山水明秀臨于通衢實為邑之勝處而葛溪則幽深靜僻土地饒沃林木叢茂是宜樂淡薄而嗜間安之所居故伯文既不能忘乎茨溪之勝而亦不能舍乎葛溪之幽常往來于二溪之間其情之係乎茨溪者雖切而樂之在乎葛溪者為多也豫昔家居時嘗一過其地見葛溪之山自西北蜿蜒而來至是屹然而止下為平疇周環可十許里溪水循之流縈紆曲折清瑩澄徹其外則崇山峻嶺攢青疊翠羅列而環拱夸竒而呈秀於逺近者不可具狀意甚樂之坐于溪石上問之其老人云每春夏之交山水泛溢溪流浩渺而深林喬樹人煙閭巷之相接于是溪之上者宛若臨乎滄洲璚島之間而閬風武陵不知其孰勝也徘徊久之而後去於今别蓋二十餘年矣而伯文之子球舉進士來京師因得詢溪山之舊殆又有過於曩時者宜乎伯文之所以居之安而不能舍也球既請於今翰林侍講鄒公記之而士大夫又多歌詠其事以來徴豫序豫惟邑中幽勝之地若葛溪者固多而能如伯文父子祖孫之皆賢相繼守之不失而足以為是溪之重者蓋鮮焉昔李德裕平泉之勝最極侈靡不一再傳遂成丘墟而王祐三槐之居纍世相承不絶故夫人之欲子孫計者視吾之所遺何如耳不在乎基業之廣而謀慮之深也今吾伯文之於葛溪别業益恢𢎞而有立可謂能承繼前人之志者矣而其諸子皆聰明賢達球又力於學問登第為名進士有聲于時則所以振起其後人者又有其道也吾知其繁衍盛大將自兹始而晉公不得專美其前矣慶壽詩序宣德十年秋七月以進士謝牧為黔江知縣比年以來進士多除京官為主事御史獨是選始除進士為知縣凡七人牧其一也或者謂牧必不慊於是行也牧曰吾二親皆老矣吾非樂得其縣樂得便道過家拜吾親稱觴膝下以祝百歲壽古人有捧檄而喜及親仕而樂者吾何為不慊哉於是聞者皆以牧為賢作為慶壽之詩以遺之俾歸而歌之以侑觴所以發其愛親孝養之情以為其親長生久視之祝凡得詩若干篇牧受而輯之為一卷以來徵豫序世恆言南陽有菊潭水甘而芳飲之能令人壽蜀青城山有溪溪中多枸杞人飲其水亦多壽是知求之物而不知求之已者也廣成子曰無勞爾形無搖爾精乃可以長生是知求諸已而不知求諸天者也孔子曰仁者夀夫夀出於天非人力所能為而仁者天之道也能盡乎天之道則夀從之矣牧之尊甫尚哲君嘗為邑庠生豫與同遊知其為人君性剛徑而循於禮不肯少屈以從人故與世多齟齬卒以不樂仕進退歸逍遙山水間以耕桑藝圃為事雖近城市而足迹不至官府率其婦子事其親以孝聞尤篤兄弟之誼訓其子姓多遊於學不敢為非義事是皆仁者之效也夫以仁者而際太平之時享祿養之榮優遊林泉之下無官府發召之役無憂悲憔悴之事以勞其形以搖動其精神固不必居南陽青城山而所以臻于期頥之夀者自可必矣牧歸拜二親於髙堂稱觴獻夀以歌諸公之詩其心豈不樂哉鄉鄰子弟觀於其傍其不有感發而興起者乎傳曰詩可以興聊因牧之行卜之雖然豫重有告焉牧之所為可謂孝也矣孔子以孝弟為行仁之本牧往治其民所以仁民愛物者皆由是以推果若然將見黔江之民歸之者若孺子之於父母也矣是則尊甫之為仁不獨以得於天又將因牧以及於民其心又豈不樂哉其心之樂無量則其夀年之永亦無量矣牧行勉之古亷文集卷四
