body:
  text: 古亷文集卷十二附録雜著敕命敕曰國家置文學侍從之臣而用之於講讀所以資其學問之益蓋非博洽端重之士曷足以稱爾翰林侍讀承德郎李時勉早以經術發身賢科荷先皇帝期待之厚俾進學于中祕既屬秋官克著聲稱遂參史事遷職侍讀行藝卓著益勵不懈是用錫之敕命以示褒奬於乎講讀以明道而治所由出也士之欲致君澤民者莫出於此其益懋誠敬正學以言用光我寵命欽哉洪熙元年三月日誥命朕惟翰林學士之職朝夕左右所以備顧問典詞命非內外百司之比故必簡學博履正之士居之庶以稱厥官焉爾行在翰林院侍讀學士李時勉科第入官持志端慤事我皇祖皇考薦登侍從以至于今纂述編摩率殫乃力暨三朝信史益克盡心是用進爾官資俾二其長廉厚祗飭久而不渝考質論思允稱厥服今特升爾階為奉直大夫職如舊用示褒嘉夫文學施之朝廷者必推於先王之道乃可貴也而自古君臣之相知難矣朕既不忘爾勞爾益圗懋厥績以永有嘉譽欽哉宣德八年九月日御祭文卿以剛介之資通敏之學發身科第進職詞林厯事纍朝多輸誠悃列聖眷遇賢譽用彰爰自翰林遷掌太學作興造就士類有成方諧致政之休詎意遺榮之速倐茲聞訃傷悼惟深遣祭卿靈尚其欽服景泰年月日誥命奉天承運皇帝制曰我國家昔有老臣厯事列聖常懷致主之志確守為儒之規惟身雖沒而猶存肆恩已頒而重錫故國子祭酒諡文毅李時勉孜孜問學􅈤􅈤操存紬史講經懋克修於厥職責難陳善尤克罄於爾誠乃掌玉堂乃師璧水領袖華國之衆彥模範用世之羣英晚節髙進退之風夜臺承褒恤之澤尚鬱士論致達朕聞今特贈爾禮部左侍郎改諡忠文於戲繼迹先賢得此易名而良鮮竦聽後覺由今垂譽以何長永矣不忘嗟哉無愧成化年月日像贊老友楊士竒贊氣充而志端外和而內剛其學也本原純深其文也篤實輝光史館謹嚴經筵裨益有規有矩惟正惟直玉署金馬四朝于茲國有老成儒有表儀胄監成賢允屬耆老需祐隆平天子有詔弋陽李奎其儀慎肅其貌清癯志奪三軍之帥胸蟠萬卷之書行之潔也無愧古廉之號學之確也誠為君子之儒厯登華要處之裕如節操貞松徑柏襟懷秋月氷壺于以揚芳翰苑負文章之重望進秩胄監為天下之師模又豈不與昔之令狐綯孔穎達之並駕而齊驅者乎自贊爾之貌不魁梧而秀麗爾之心不機警而婉委爾之學問不廣博而深宏爾之文章不豐贍而華美動止粗率言辭鄙俚徒竊科名以取祿位承荷寵榮恬不知愧雖然爾生六十有六矣不為不仁不為不義不矜已而傲物不徇私而慕利於人而無所爭居官而無所恃今之所以貌敬而不忍欺者其在此歟吁汝其慎之以保終始行狀朝列大夫翰林學士國子祭酒兼修國史知經筵官致仕諡忠文安成李懋時勉行狀門生湖廣按察司副使參贊廣西軍務前翰林編修同修國史同邑中溪彭琉述先生諱懋字時勉號古廉姓李氏其先系出南唐烈祖第五子景蕩之後景蕩纍封江王嘗為虔州節度使簡易節儉號稱賢王王之子曰瀚宋平江南瀚匿迹虔吉間吉守李鬯聞其賢求見之不出乃辟其子先為閻嶺鐵務官俾以祿養遂家安成東門光三子十一孫孫兩為府尹一為縣尉自是子孫益蕃衍擢髙科登仕籍者比比其人有諱疏林行正一翁贅居梅林劉氏遂家梅林梅林之李自正一翁始諱本字源芳先生曾祖也諱煒字文明先生祖也皆有隱德考諱夢觀字思誠端厚坦亮洪熙元年以先生貴贈翰林侍讀承德郎宣德八年加贈侍讀學士奉直大夫妣凍坑周氏繼社背王氏俱贈為安人加贈為宜人五子長時傑號恆心性耿介穎悟過人次時春早卒時魁時彥其第五即先生也先生生洪武甲寅八月丙午先夕學士翁夢一異人至家神光燁然翌日生先生明年晬日翁循里俗告祖先畢鋪席于地羅置書册筆墨錢果諸物於席上為試周先生先取筆次取墨又取書學士翁大喜曰符吾夢矣五嵗屹如成童投靜室勤學鄰兒有牽引戲狎者輒辭去七嵗孝經小學四書皆已成誦十二三詩詞歌賦語皆驚人十四五言動不茍即以聖賢自勵嘗曰顔子不二過不遷怒曾子日三省其身豫所願學者二子也十六入縣庠大肆力於羣書攻習舉業之外益究道德性命之學寒不能置爐炭擁重衾實木桶置足其中達旦不寐其刻苦類如此訓導城門持真尹先生理安胡先生皆篤行儒者一見先生竒之嘗曰李時勉用心理學豈詞章之儒可比丁丑學士翁寢疾先生親侍藥食不就寢席者旬餘無怠容是年七月學士卒先生與諸兄居喪治葬率循文公家禮行之已卯十月釋服永樂癸未中江西鄉試明年甲申中會試賜同進士出身時太宗皇帝御天下慨然作新人材興起斯文於進士中簡明秀通敏者二十八人改翰林庶吉士俾就文淵閣讀書免常朝光祿供膳司禮監給紙筆內庫給鈔為膏火之費蓋期之於伊傅周召韓栁歐蘇諸賢而先生與焉先生益自淬礪磨濯造詣精深同列亦多推讓之明年預修永樂大典丙戌三月丁丑王宜人卒于京先生與兄恆心奉柩歸葬居喪如禮七年春起復是年車駕幸北京仁宗皇帝居東宫監國召入直房修書尋徵赴行在賜路費鈔六十錠至則命錦衣衛撥官房預修太祖髙皇帝實録十年壬辰授刑部湖廣清吏司主事時四境苦於寇盜有捕送法司者輒峻拷訊雖連及平人亦不為之伸理先生獨推情審辨不事煅煉獄成待決者止十七八人其存心仁厚用法平恕多類此刑部尚書張公稱之曰李時勉古仁人君子也十一年授承直郎十二年詔重修太祖髙皇帝實録先生仍預焉冬十二月進承德郎十六年實録成賜鈔襲衣文綺改翰林侍讀九年夏四月庚子奉天文華謹身三殿災太宗皇帝降敕求言先生備陳十五事一曰停止工作二曰罷四夷朝貢三曰沙汰冗官四曰賑恤飢荒五曰慎選舉六曰嚴考核七曰清理獄囚八曰罪黜贓官九曰散處韃官十曰罷遣僧道十一曰買辦作弊十二曰闕軍夫十三曰矜免侍親充軍生闕十五曰優恤軍士所言多中時病有旨下所司行之未幾為飛言所中下獄二十一年七月邊人內侵太宗皇帝念前所言散處韃官諸事慮患深逺特宥之仍舊職扈從北征先生出關墜馬折左股舁歸京療凡三月餘跛不良行洪熙元年三月仁宗皇帝頒賜誥命封贈父如先生官妣及妻劉氏皆為安人先生既受敕感激思圗報稱因覩時政日漸違節賞罰豫奪恩讐太過鮮愜中外之望仍備陳其事若干條析為二本其一厯言朝政得失利害其一専於責難陳善具言此本乞留中勿使外知前本宜付所司衆議行之二本既進即焚其稿仁宗皇帝見所言峻直怒甚中官從而擠之次早臨朝震怒命將軍以所執金瓜撲之瓜及體者十七八脅肋已斷其二意其必死矣命曳出及視之神色不動猶能言時侍講羅汝敬亦嘗言事上罷朝諭吏部曰李時勉羅汝敬俱有才幹在翰林院間了其改為監察御史李時勉交趾道羅汝敬雲南道俱令掌道每日問囚一起言事一章凡三日先生三上章言事遂下錦衣衛獄施以嚴刑先是折脅內向不相著及用挺棍而斷肋忽自接人謂先生忠誠感動天地若有鬼神陰相之也宣德改元冬十月宣宗皇帝幸萬嵗山謂左右曰李時勉所言為社稷計忠臣也立召至前備問激怒先帝之由先生奏對懇切感動聖𠂻特憐而宥之仍為侍讀預修太宗皇帝仁宗皇帝兩朝實録五年庚戌五月升侍讀學士一日駕幸史館撒金錢賜儒臣拾者爭趨前先生獨退立不進宣宗皇帝獨呼前拾故得金錢尤多無何駕幸文淵閣命內臣舉金杯次第賜諸學士飲至先生獨名呼之曰李時勉卿非朕安得飲此酒先生叩首謝曰臣蒙陛下再造之恩不勝感戴自是傅保而下始知聖意寵眷先生日隆七年壬子命為南京鄉試考官秋還京八年癸丑掌翰林院事一日得風疾不語上聞之惻然遣中官賜寶楮二百錠偕太醫院官就其第視疾給藥連三日中官更至守視奏報頗愈入謝恩仍賜休息九月頒賜誥命贈父如先生官妣及妻皆宜人十年已卯預修宣宗皇帝實録是年秋命為順天府鄉試考官正統元年丙寅兼經筵講官三年戊午二月給授勳階協正庶尹四月實録成升學士六月給假還鄉祭祖東里先生不忍舍以序送之又嘗為李氏族譜序及贊則東里重愛先生大略可見四年己未先生在鄉嵗旱苗將稿先生齋沐率鄉老徒步犯烈日禱大雨沾足禾稼豐登先生初得善地于中村適有故人劉君伯淳死遂與葬之是年以劉宜人暨兄時魁二喪在殯未葬力求善地葬之又遷葬兄嫂子姪凡六喪地皆新得得皆以義非力取也又創南溪居室令第二子養敬居之秋七月還京六年升國子監祭酒八年癸亥重建太學成上命先生致告于文廟九年甲子三月朔上親釋奠先師孔子禮成視學賜坐先生講二帝三王治天下大經大法甚悉末復陳諷勸之言音吐洪暢天顔悅豫一時文武臣僚肅然聳聽莫不欣喜明日奉表謝恩賜紵絲衣一襲羅衣一襲又賜宴于廷斯文際遇之隆未有盛於此也先生在監多所建畫上皆從之師生稱便諸生有疾親給醫藥有貧不能娶死不能葬者為給費賙之其教諸生以毋自欺為本以忠孝為先隨其才質髙下誘引成就之絶私謁之路杜幸進之門革奔競之風禁淫蕩賭博之習諸生數千人皆肅然樂從其教成德達材彬彬輩出國學得人於是為盛丙寅先生屢以老疾乞致仕諸生伏闕請留上以太學師資之地方倚老成不許其去丁卯先生年七十有四病益深上章乞骸骨上覽其言甚懇切遂許之詔兵部具舟陛辭之日賜鈔一千貫命光祿具酒饌錢之及行達官顯人多出崇文門外以敘别太學師生以綵幣製旗帳各為文詞諸生親厚者又命工繪恩榮歸老圗取其事為十題求諸名公識以為贈以頌先生之德翰林舊知亦各為文為詩教坊諸樂工椎大鼓雜以金石絲竹之音喧然前導送者凡三千餘人逺近觀者塞路一時行旅不得往來商賈為之廢業莫不嘖嘖焉稱羡以為榮至有為泣下者諸生又以先生平日廉潔自守行李蕭然乃集白金數百兩為贐先生悉郤之今太師吏部尚書王公直為十題稱先生漢之疏廣唐之楊巨源不能過也其餘若禮部尚書胡公濙工部尚書髙公榖左都御史陳公鑑禮部尚書王公英國子祭酒蕭公鎡侍講陳公詢徐公珵修撰劉公儼檢討錢公溥司業趙公琬南京祭酒陳公敬宗皆有文為贈先生自北歸以故居去城稍近倦於逢迎遂卜邑西三十里其地曰梅礱創隱居焉逺方慕名以求文至者踵踵相繼先生以病多謝去前此土俗不立社不祭社厲過夏多缺雨先生創空地為社又創地為社厲壇率旁近之家循古禮祭之約以為常至是雨澤應期連年皆熟父老喜曰古有隨車雨先生似之先生雖處林野而其心未嘗不在朝廷景泰元年三月嘗建議四事一曰奬忠節二曰修武備三曰加恩賞四曰通和好具本遣長孫騏達于朝騏既行三日先生在别墅病作四月十二日謝世享年七十有七易簀之先戒諸子曰治後事悉如汝父送汝祖循古制勿尚浮屠言訖而逝無一言及家事有司以聞上深加悼惜遣官賜祭是年十二月某日葬雙峯鋪東某山向葬之日大雪送者幾千人初娶縣背劉氏繼冠縣劉氏子男六人曰融字養和廙字養敬皆卒原字養源剛字養健早卒縣背出也艮字養道鼎字養端冠縣出也女二人河南參政王公瀘源第五子固始教授邦正禮部郎中陳君鉉長子晉其壻也孫男十九人騏驥驊駢顒知縣馴泮生昻監生曾孫男二十五人先生德性粹美操履修潔事父母處兄弟孝友篤至事君忠義激發不為身謀遇朋友誠而有禮緩急可以託死生修撰彭君汝器抱疾無子弟在側先生以同年故竭力扶持湯藥如至親然既卒哭之盡哀具衣衾棺斂如儀已而有命遣族人傳送其喪歸葬先生仍為裒集所為文稿付其子初太常博士劉君履節有交趾之行妻病子且幼乃以託於先生而去去未幾妻死先生為之斂殯如禮是年劉君竟死不反先生撫育其子女如已子長為娶妻教以經學俾有成立發身科目仕至國子助教皆先生力也其篤於友誼如此平居衣冠端正凝然不動與人語詞嚴誼正是非豫奪確乎其不可易天下之人聞其名而慕接其貌聽其言為之改行易心者衆矣其在朝尤為公卿大夫所推重少師東里楊先生嘗稱於人曰時勉當今第一流人也故於經濟大略密與商論者居多侍講鄒先生緝曰時勉可追配古人學士髙公榖曰先生文學足以嫓美乎陸贄忠義足以追蹤乎汲黯道德足以比肩韓愈世以為知言先生學問奧博詞翰兼美有得其片言隻字者寶重之如拱璧故平生文稿多為好事者持去所存於家者殆十一二耳既葬之後其遺孤屬琉以狀而琉稽於王事未及成又二年琉致仕歸巡撫江西都憲韓公雍以先生節槩上言賜諡文毅琉念先生與先君編修公最相善而琉兄弟皆受學焉慨先生不可復作思欲昭其德於不朽實琉之大願也第先生之德髙大逺密非拙工所能倣佛形容謹述其槩如右俟知者采焉故祭酒李先生墓表光祿大夫少傅兼太子太師吏部尚書泰和王直撰先生諱懋字時勉姓李氏系出南唐江王景蕩之後世居安成之東門以宦學顯曾祖源芳祖文明父思誠皆有德誼而不仕先生少負大志勤於學問窮性命道德之奧於書無所不讀永樂初取進士第太宗皇帝鋭意文學擇進士之尤者俾盡讀中祕書學古為文辭先生與焉其文學日進有盛名以母憂居喪務盡禮服除授刑部主事而所治無寃入與修髙廟實録成授翰林侍讀先生自以蒙恩厚思所以報殊遇早夜孳孳盡其職凡事有當言者輒以聞上亦多所聽納雖時被箠下獄旋復釋之宣宗皇帝尤肆矜容升侍讀學士待之加厚賓興之嵗三命典文衡上臨軒策士則命讀卷人皆服其公正統初上御經筵命先生兼經筵官當進講必盡誠敬冀有所感悟上亦為之傾聽聞者莫不稱善以為范淳夫其人也時太學缺祭酒而難其人諸公皆謂莫如先生相與言於上遂以任之諸生數千人皆習經藝先生開導訓誨各因其才以窮其旨趣俾有所領解如飢者得食渴者得飲於是小大皆有所造就病者有醫死者有歸其未娶者俾有室皆先生出資為之倡而仁義之行成焉諸生事先生亦如子之事父有急必赴雖危難不避賢才之盛彬彬焉一時見於用者人皆以為宜車駕視學行釋菜禮退御彛倫堂祭酒當以經進講而先生久病嗽人疑之至是升堂愈敬慎色溫氣和賜坐西南隅講尚書闡明帝堯所以親親仁民協和萬邦之道辭旨清逺聽者忘倦上為之喜甚賜豫有加明日入謝又賜宴錫衣一襲人皆謂先生宜之正統十二年以老疾乞致仕諸生亦拜疏乞留先生請至再三上亦察其病許焉賜鈔二百錠官以舟載之歸之日滿城送者無貴賤皆嘖嘖稱道諸生則曰先生歸矣吾何所視法哉連數十里奔走涕泗如送其所親先生既歸卜築城西山水間不與流俗接惟教子孫及鄉族子弟使讀書為善而已其德行文章蔚然為天下之望蓋有嚮仰不及之嘆者景泰元年四月十二日以疾卒于家事聞上命禮部致祭逺近士大夫皆弔哭往來不絶者數月其生以洪武甲寅八月十三日享年七十有七娶劉氏封安人先卒生男四人養和養敬養源養健繼室劉氏亦先卒有男二人養道養端以某年某月某日葬于某里某山下豫與先生同郡人同年取進士又同入翰林仕而同朝者四十五年思請益於先生以老終而先生遽去今又棄豫往矣豫何能不哀先生既葬子養源等謀於其鄉之大夫君子求豫文表墓上嗚呼豫聞昔安定胡先生之墓為之表者歐陽公也今先生之墓當求如公者屬筆焉豫文何足以揚先生盛美哉然不可辭也故述其行之大者俾刻焉古廉李先生小傳門人行人司行人尹恕撰原闕仁宗改元先生又疏陳若干條為二本進皆犯顔格心之言扶持綱常之道左右不悅構之上閲所言峻直召問不屈命撲之折脅曳出不死改行在交址道御史日令問事具條以進次日有旨繫獄遇良醫得活在獄中水漿不入口者五日而神氣自若卧幾一月而愈是時庸人孺子皆知先生忠義所為若有神明護佑非偶然也宣宗皇帝嗣承大統先生在獄惟吟咏情性自適是年秋有燕入於先生幕聲喧不已時同獄者以為先生喜其夕就寢忽夢渡橋橋斷下有一覆舟從舟背而渡有水崖不得上傍有一朱衣人扶上之云明日橋成可無事矣覺乃夢中爾天明果宣至文華殿內見上推詢建言之由先生復以忠鯁之言對遂命收獄輒取回再問其由辭語如昔復呼至前欲備詢之先生誦向前所言至第六事少止上曰事尚有何以不言先生曰天威嚴重臣不能記其詳矣上微哂曰是第難言耳汝之諫藁在否先生對曰藁已焚矣臣讀聖賢書忠孝是先敢不直對上以其言始終不變可任以事宥之命以次日早大班謝恩仍授翰林侍讀宣德元年冬十一月也未幾預修兩朝實録初先生在獄時有一布衣老人鬚髮皆白遍詣諸縉紳大夫門稽首曰李侍讀一忠臣今置之死地宜急拯之以扶名教後先生復職求其人不復得咸疑以為異人云厥後上臨內閣親賜諸閣老酒呼先生賜之且曰卿非朕安得飲此酒先生頓首謝曰臣荷陛下再造之恩不勝感激五年春上復以金甌賜諸閣老宴以次該先生飲先生曰臣可與陛下同飲不可與陛下同器上遂易甌與之一時諸公咸服是年纂修兩朝實録成欽升本院侍讀學士兩京鄉闈二與文衡上臨軒策士兩為讀卷官是年秋先生抱風疾不語上賜鈔一千貫遣御醫與內臣逐日診視先生恐勞聖慮一日同寅諸公來視因囑曰主上問及幸告以疾漸瘳矣及痊入謝仍賜休息免早朝一日上納碎銀於兩袖召諸閣老遊內苑將銀撒之于地命拾為買果資衆皆爭取之先生獨正色立俟上退顧先生猶立上復呼先生以袖中餘銀親賜時論皆以先生得大臣體至每嵗四裔入貢纍纍私自於朝班願一識先生面朝廷嘗命使於琉球諸國聞國人皆知慕先生得一詩輒朝夕諷詠不已其譽望見重於外藩者如是十年上崩先生哀痛雙目幾昏其忠愛之心又如是正統初皇上嗣位先生與經筵講官三年四月修宣廟實録成升翰林學士與少傳建安楊先生諸公為杏園雅集時號九老會先生給假祭祖東里先生不忍舍去以序送之其略曰初李君時勉請去諸同官皆曰翰林者天子親臣君方握院章為之長且上富於春秋萬幾稍暇御經筵孜孜聖學奈何去先生曰諸公謂我者公義也顧今迫於私情二三年來子死妻死兄又死一門孤寡相望吾能忍而委置之乎東里之文真能述先生之心矣抵家葬其所未下土者若干喪時附邑之美地多為人所有先生欲擇山水之善者以妥其靈遂躬自跋涉不以為勞四年還朝六年閏十一月上以太學為天下教化之原前蒞其職者不愜輿論衆議咸以先生薦遂任之先生至太學冠帶縉紳之士迎迓道左者相屬文武衆寮父老戎卒相率詣橋門而拜者無虛時監規久弛先生為嚴立教條因才設科壯而可仕者教以吏事如今官府論判之類幼而可進者教以舉子業日考課程夜則令宿學舍雖隆冬盛寒先生俯就講解經史每至通宵於是諸生各有所造就當時作人之盛如商輅姚夔彭時嶽正萬安諸彥俱廷試魁天下其餘或中進士髙第或任御史黃門部屬二司守令者皆先生教導之力致然也先生處置細務綽有條理病者如徐瑄輩得以有醫死者如劉顯輩得以有歸未娶者如鄭韶輩得以有室以至助教陳除被盜復監見先生先生給之凡此之費皆先生捐俸資為之由是諸生觀感亦樂為之助焉以故諸生事先生如子事父先生以太學規模弗稱請於朝為改作時監其事者素與先生弗協設他故而陷之太學生三千餘人皆伏闕請宥諸生石大用獨封章乞代罪上覽所奏有義在師生恩同父子之語憫之遂獲釋八年春上命駕視學釋奠先師孔子禮畢退御彛倫堂賜先生坐講書先是病嗽至是病愈講尚書闡明帝堯所以親親仁民協和萬邦之道詞旨清逺天顔喜甚賜與有加十二年屢以老疾上章乞歸有形骸潦倒精力衰頺之語詞極懇切諸生有抗疏願留者先生益堅纍表再三始蒙俞允賜鈔二百錠官給驛舟以歸公卿大夫相率餞别都門外不可以數計大學諸生皆曰先生歸矣吾何所視法哉遮道灑淚如别父母然諸生有厯政者則請假逺送在法司者則違假而往其恩義之篤如此今少傅吏部尚書王公為十題序稱先生漢之疏廣唐之楊巨源不能過少傅禮部尚書胡公序先生德學充贍政教一新諸生心悅而誠服兵部侍郎兼學士苗公稱先生洪熙間密陳讜言盡忠所職雖殞身而無憾工部尚書兼學士髙公稱先生文學嫓美陸贄忠義追蹤汲黯道德比韓愈而詞翰特餘事耳少師楊公又稱先生忠槩文章卓然當時而士之識與不識皆知李先生先生之德之學見稱於文序如此先生抵家隱居縣城西近山水間别築一室其地曰梅礱慕名求文者無逺不至先生多以病謝去有不可已者勉應之十四年秋聞邊人內侵國家多難景泰元年三月建議四事一曰崇奬忠節二曰選將練兵三曰加恩死節四曰南北通好遣孫騏賫進是其忠義之心不以進退有異也孫既行三日先生在别墅遭疾不豫醫診弗效時山有大石隕于池者人以為憂病篤戒諸子治後事如葬祖之儀言訖而逝景泰元年四月十二日也視其室惟經史文籍僅存四壁蕭然自藩臬以至郡邑大夫與夫逺近好義之士咸踵門弔哭往來不絶有司以事聞上命翰林撰文遣官致祭享年七十有七葬某里某山之陽先生存日恩贈父思誠翁翰林侍讀學士奉直大夫妣周繼王與妻劉皆封安人子養和養敬養源養健劉出也養道養端次室劉出也養和養健先卒養道國子生先是助教李洪嘗上章乞升先生官秩以慰天下士夫之望至是教諭邵祥乞加先生贈諡巡按江西都御史韓雍言先生清德正學推重時輩忠言正論可方古人宜加封諡請至再遂贈文毅嗚呼先生儀容清古語聲洪亮文詞雄渾其忠義廉介卓然見重於天下而人獲接其光儀者自不容以不敬畏之其沒也又莫不思慕之是可驗天理民彛之在人心者有不可泯矣豫愧謭薄叨承宿誨慮先生德行政事未之盡傳於是廣採行實又得京郡治中劉實國子學録劉貴刑部員外潘瑄諸公所書集而為傳庶他日立言君子出於其間得有所採俾事業垂諸簡册輝映古今則先生雖死而有不死者存實斯文之幸也謹述以俟古廉先生祠堂記自古宏才碩德之士負人望之重者志不大展於當時名必益彰於後世何也用不究其才而天下共惜之惜之不已至形於言暴諸事則其名在世愈久而愈彰夫如是其榮過於得志於一時者逺矣吾安成古廉李先生負天下之重望而官終於祭酒識者蓋深惜焉故其沒也尚德君子交章請行褒恤之典最後巡撫江西右僉都御史韓公雍列其誼行以請乃得諡為文毅當是時有司已崇祀於學宫矣今提學僉憲潮陽李公齡復命建祠于家而尊崇之益至嗟夫先生何以得此於人哉蓋先生資稟秀異涵養深厚清德正學追蹤古人方其為翰林侍讀也感太宗文皇帝作養之恩疏陳時政十五事言甚切直下獄踰年乃釋洪熙改元又條十事上之皆人所不敢言者坐是激怒宸𠂻命以金瓜撲之於庭不死降監察御史凡三日章復三上遂下獄宣宗皇帝嗣位出於獄親鞫之嘉其志仍釋為侍讀自是忠直之名震天下雖庸人孺子皆知尊而慕之正統中自學士為祭酒當國學政教弛弊之餘慨然以成就賢才為己任嚴條約勤課試程才敘進一以至公而賑貧藥疾恩意尤篤故教化行而人心樂從其出而取髙科躋要途者纍纍相繼於是天下皆知先生之教恩義兼盡真一世之師表也既老懇乞休致家居而憂國愛君之念不少忘比聞土木之難聖駕北狩痛憤纍日即疏安攘大政所宜先者遣長孫騏達於朝事未報而先生下世矣天下之人又皆聞其事而壯其言謂先生忠毅之氣沒齒不衰有如此嗚呼先生盛德之士也不獨忠誠義氣為世所稱至其仁厚之心廉潔正直之行通達宏偉之才雖一時名公巨卿亦莫不推而下之然獨不得並列於公卿以大其用以霈其澤於天下宜乎人望有不滿焉而惜之深仰之至如此也僉憲嘗為國子師屬知先生為詳故景仰愛慕之尤切而遂欲因以垂教於來學此専祠之所以建歟祠在先生所居之左為間者二有門有廡不侈不儉實邑令黃巖李君會經營以成之其成也司訓桐廬姚君稷以書屬時記其意嗚呼二三君子惓惓於先生如此非尚德好義之尤者歟先生得此名於是愈彰而不朽矣時念先生家食時與先祖交莫逆父叔輩皆受學焉其教國子也時亦執經在諸生後於先生文章道德之實耳熟而目詳矣此不能悉著謹著其槩以詔其子孫與邑之來學俾相與勉慕以追芳躅于萬一庶無負於僉憲公之教云先生名懋字時勉别號古廉登永樂甲申進士翰林庶吉士授刑部主事轉侍讀列學士至景泰元年卒年七十有七矣成化四年嵗次戊子賜進士及第資政大夫太子少保兵部尚書兼文淵閣大學士知制誥同知經筵事國史總裁彭時記古廉李先生改遷諡葬墓碑銘門人通議大夫國子祭酒進太常寺卿兼翰林侍讀學士知經筵官掌詹事府事國史副總裁致仕安成臺北吳節撰士君子以忠毅存心生有美名殁有美諡此天下之所同榮而古今之所共尚也然求有名實兼全輿誦罔間者其惟古亷先生乎按狀先生諱懋字時勉姓李氏安成人古亷其號也系出南唐景王蕩之後祖文明有隱德考思誠贈侍讀學士母周氏贈安人先生兄弟五人行居末早孤以兄誨為泮生以經取甲申進士第遭逢太宗文皇帝作新文運選入中祕為庶吉士與二十八人俱學業日益冨預修永樂大典丙戌以慈制去服闋赴行在預修髙廟實録壬辰授刑部主事未幾再召入修實録書完改翰林侍讀時宫殿災詔求直言先生開陳十五事以進允者十三無何遭飛言下獄二十一年以近臣言得釋扈從巡北邊出關折左股輿歸療愈洪熙元年先生以荷國厚恩思圗報稱具為二本其一言朝政得失其二不避國諱仁宗皇帝初皆含之中人從而擠之召問不屈命力士撲之以瓜折左脅曳出不死改監察御史令日言事翌日下錦衣獄禁錮之宣宗皇帝嗣位召問所言先生奏對懇切感動上心特命宥之復翰林侍讀預修兩朝實録五年夏特升侍讀學士一日駕幸史館特呼先生名與之金錢賞以巵酒衆學士榮之壬子主南京鄉試癸丑得疾上聞賜寶楮二百命醫治療乙卯英宗皇帝嗣大寶詔修宣廟實録秋主京闈鄉試丙寅進經筵講官廷試為讀卷官戊午實録成升本院學士是年夏先生以諸子融敬早卒二配劉氏俱亡給假還鄉祭祖改葬諸兄於善地事畢還京六年升國子祭酒八年重建太學成命代祭聖賢告畢工甲子春上親臨太學釋奠於先師孔子禮成視學賜坐先生講書經帝堯章兼陳諷諌上大悅明日賜衣二襲宴於殿庭而還先生益加感激嚴立監規修陳防範諸生數千人咸引領克遵教誨由是賢才彬彬輩出掇殿魁者如商輅彭時諸公出焉丙寅復以中子源剛繼卒惟幼子艮侍諸孫皆幼稚具本乞休致不許未幾復上章乞骸骨凡數百言益懇切上特許之賜寶楮筵宴具驛舟遣還縉紳俱祖道餞送之盛於是鮮倫先生既歸居邑之西山曰梅礱謝絶人事日與文士數人為山水遊景泰紀元聞敵人犯邊王師不利奮然曰禁中無頗牧安攘孰任耶特遣其孫騏詣闕言軍旅事數件因憤憤成疾遂不復瘳歿於别墅時四月十二日也享年七十有七有司以聞詔加悼惜遣官致祭葬本里楓鋪之原巡撫西江都憲韓雍言先生清德正學推重時輩忠言正論可方古人宜加封諡章凡再上詔賜諡文毅督學僉事李齡以先生葬地不應陰陽下知縣李會營善地改葬先生於蒙岡之陽某山某向從衆議也天順初元言者復謂先生諡法不愜輿情冝於改諡詔改諡曰忠文仍録其一孫曰昻為國子生逮成化癸巳先生之孫顒任長樂知縣便道歸省祖塋謂先生諡葬俱改宜有銘文以彰事實謂豫有姻好且承先生宿誨者來需言豫事先生久既幸有名位又獲全歸思先生不可見矣可無言乎嘗聞諡法云事主不欺之謂忠強忍不屈之謂毅今先生之諡易文毅為忠文先忠而後文則先生忠以事主文以經邦二者又兼備矣語曰生榮死哀惟先生有焉謹述其始末而為之銘銘曰稽古訓言君明臣直二美克完政紀乃立吁嗟先生忠毅拳拳遇事憤發不恤盡言折脅挫獄摧頺者幾起而復言不恤瀕死在周萇鰌在漢黯朱為贄為愈抑何間歟究茲終始實遭明聖包容狂直以懲諛佞晚躋榮福為國碩師解組而返終樂畋虞善名蓋世美諡重錫易毅為忠芳流千億蒙山之陽波濤湯湯先生之譽其存者長難少承先生誨導俾侍筆硯間及先生歸榮與解組又得執巾杖為山澤遊俱非一日也豈期先生物故遺藁多失遂與諸孫及交遊士大夫通得若干謹録成四册别以文行忠信質之同門吳卿與儉曰汝當以書付其孫知縣顒鋟梓以傳愚受先生指教之恩誼深淵海是集焉敢不用情者乎餘文散失尤冀斯文君子採寄示豫續編可也峕成化十年甲午仲春吉八十七翁門生戴難跋顒惟先大父忠文公平生所著文集甚多奈嵗久散失存者無幾門人戴先生嘗編録成卷若干篇國子祭酒吳先生又為序以辨其端顒以菲材弗克繼述叨承前休授今惠之長樂令嘗於公退之暇覽大父手澤不勝感戚於是遍求餘藁而增益之繕寫成帙特以託廣郡守鄉先生伍公希淵重加校正鋟梓以傳雖然先祖之居官行實昭昭然名於當世固不待文而顯然禮曰先祖無美而稱之是誣也有善而弗知不智也知而弗傳不仁也此三者君子之所恥也茍是編不傳則不智不仁之恥顒莫逃焉匠氏告完姑述其槩以紀其成栁子有云至哀無文至敬不飾顒竊以焉孝孫顒謹識古亷文集卷十二
