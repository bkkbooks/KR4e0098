body:
  text: 古廉文集卷五明李時勉撰闕始自小官進二六卿受三聖恩寵過矣雖老疾侵尋宜思所以報稱者斃而後已故疾少間輒出視事俯伏殿陛下一瞻天顔不勝其喜幸然出輒復劇如是數四不已人或止之則曰吾受國厚恩吾所以為此者猶懼不能有萬一報效尚暇恤吾身哉若公之事上者不亦忠矣乎初上命公為侍郎公辭詔報曰惟卿孝敬誠篤足以為之卿其勿復辭公遂受命自公有疾遣醫候問不絶于門及公勉強上謁每從容勞問亟命歸第勉進藥物慎於調攝毋自煩勞蓋冀其復起以遂股肱之寄而公疾益甚遂有是命若皇上之待公者不亦有禮矣乎君臣之間各盡其道如此唐虞成周而降蓋未之有也或曰昔周公輔成王有歸老之志成王留之今公有願留之意而皇上遣之豈古今之道異宜也耶蓋周公無疾而求去故留之者欲與有為也今公有疾而欲留故遣之者所以優禮之也使周公有公之疾而欲留成王亦必有以處之使公如周公之無疾而欲去皇上亦豈肯舍之哉故吾以為公與周公之事有不同而成王與皇上之心則無以異也是蓋千載之遇豈偶然哉宜乎公之惓惓不忍去也雖然公深體上意以慎厥疾庶其有瘳是亦所以為忠也亦何必居其位事其事而後然哉公行矣尚慎之送楊少保省祭序正統六年春少保禮部尚書南郡揚公上章乞歸省先塋皇上許之詔兵部給驛傳光祿備厨饌明日賜以敕書賚以綵幣金帛甚厚且命內臣送之行凡僮𨽻之在行者皆給廪餼又明日公入經筵稽謝上溫言諭之且曰卿往其速來朕延佇望卿矣吁公何以得此哉蓋公之聰明篤厚正直而溫雅昔居于鄉遊于縣庠已翹然以文學行義見稱於時及出而第進士鄉先輩皆以王佐才期之四方經生學士聞其名莫不仰望其風采故自其筮仕以來至于今四十餘年不離翰苑居論思宥密之地厯事四聖凡七遷而至于八座之尊三孤之重人不以為過其在朝廷與公卿大夫言恆恭謹自下及論事有不適於義合於理則直前無所顧忌爭之必直而後已其在上前小心慎密兢業以自持至于是非利害之際正言讜論所以感天聽回天心而有禆于德禮刑政之施者蓋多而人莫之知也知者以為方今有事君以忠之義而得大臣之體者公可無愧焉其所以居髙位食厚祿而膺寵眷之隆豈不宜哉昔周自文武至于成康之際禮樂備舉民物阜康賢俊登庸而致雍熙泰和之治者是雖賢聖之君相繼而作於上亦惟有若太顛閎夭散宜生之徒相與輔相之於下有以致然也而所以經營圖維殫力措慮之尤甚者莫如周公召公焉方其時周公為師召公為保協贊而總統之成王實有所倚重焉今公與廬陵楊公居師保之位當皇上臨御之日留心學問篤志治道孜孜於求賢才任官使恤民隱與凡一政之施一令之出莫不究極而詳審之蓋欲追蹤於唐虞三代之盛非茍焉而已也而公于此亦能體上之所欲為盡其情竭其智而不敢少自怠忽焉其所以見諸言議施諸行事者皆可以達諸四海而不悖是以中國奠安三邊無警四方萬國舉相安於無事有以副皇上之心其視周召亦何愧哉公之暫離左右而去也上安得不致其丁寧之意而望其來之速也耶公行翰林之士以相從久也餞燕於都城門外各賦詩以贈之而豫為之序送少宗伯王公致仕詩序正統六年冬禮部右侍郎武城王公士嘉上章乞致仕特詔許之公既謝恩闕下即辭去夫士之出處進退必由於道公自太學擢任牧民登風憲佐方嶽厯郎官拜少宗伯出入內外五十餘年其行義卓然至于今逾七十矣三載之間兩上章求去既得請輒行非由於道能如是乎或者曰方今皇上繼承大統留心庶政篤於求賢命官尤欲得老成舊人以圖維政理公雖當引年之期而精力未衰獨不可强留以副上意耶乃汲汲求去之决如此豈竭誠事君之道哉公曰是殆不然幼而學壯而仕老而休此古今之通義而七十致政又聖明之令典年未及之而求去是便已怠政者之所為我不能也年及之而不知去是貪祿固位者之所欲我豈為之哉若夫疾病之所侵加智力有所不逮雖年少氣鋭而訖無所施蓋不可以不去古之人有行之者鄭均李請是也其年德之尊位望之隆受國家付託之重任天下安危之責雖至衰老欲去不可古之人有行之者周公召公是也上無所託下無所責則其於進退去留之間豈不在我乎若豫也亦既老矣不可以有為矣雖使竭智盡慮不足以為經國之圖極言切論不足以起人之聽乃猶不思自引而去僕僕焉旅進退於賢士大夫之間其猶不之止耶此吾之所以决於去也衆聞公言然後知公之意相與燕餞而歎羡之不已曰昔疏廣受二子以宦成名辭老而去公卿大夫故人設祖道供帳東都門外送者車百輛道路觀者皆曰賢哉二大夫或歎息為之泣下蓋以當時知止足者鮮也况後世乎今公之去無愧於二疏豈不賢乎哉於是學士錢公合吾黨之士八人酌酒賦詩以贈之而豫為之序云贈永寧伯談公進爵序國朝有天下八十餘年禮樂教化洋溢于中國施及於蠻貊遐方異域雕題椎髻之人莫不輦琛奉贄奔走而來朝貢于闕下獨殘敵遺類竄伏近邊時復竊發故嘗選任名將總率兵馬修飭邊備以待之自遼海至于西鄙要害之處皆有其人焉然赤心為國以攘外安內為已任而名重於時威震逺方者可數也鎮朔將軍都督談公出鎮宣府今十六七年矣皇上以其久勞於外勳績著聞特拜永寧伯以褒之左軍都督曹公謂豫曰儉與鎮朔交好甚篤義雖友朋情逾昆季今公荷䝉國恩榮膺髙爵關山杳隔莫罄賀忱念惟文字可以道交遊之誼致契濶之懷以頌公之美而吾或未之能焉又曰公在洪武中為昭信校尉隨太宗文皇帝之國小心慎密而有智略同列敬讓而上亦知之當舉兵靖難時出守保定以完城功纍遷都指揮僉事永樂中從征沙漠以功升都督僉事洪熙改元特升左都督總兵鎮宣府以至有今爵公之竭誠以盡其職者可謂至矣朝廷頒爵以報其功者亦可謂極矣願先生序以贈之在昔成周諸侯有四夷之功以獻于王王或錫之以弓矢而宴勞之被之絃歌紀于策書以傳示無窮若彤弓之什猶可想見當時氣象使人感發而興起况重之以名器爵之以五等而寵遇之隆若此之盛者乎是宜鎮朔懷感激之心都督有頌美之詞拳拳而不已也雖然國家之待武臣厚矣自祖宗以來凡有功於時者隨其髙下大小莫不有以酬之然有得之未幾而復失之者由夫驕侈縱恣不思盡所以報稱之意而肆為私已圖蓋勤於始而怠於終有以致然也公自幼為偏禆至於老為大將恆敬慎以自持不務富其家有餘輒以散士卒濟窮餓修治學舍與佛老子之宫故位至極品而家無餘財平居愛恤士卒不事燕遊専力於清邊之務而致安攘之功以承寵命之隆如此而人不以為過茍由是而往益懋乃功不怠以止焉則其祿位之進殆未可量也因都督之請并書此以為公贈云贈商𢎞載第狀元序進士始於隋而盛於唐唐初有秀才進士二科然秀才常列進士之前人以是重之其後罷秀才専取進士進士之名始貴重于時而猶未得即釋褐故有三試吏部無成者至宋進士一登第後即復入仕然狀元止擢司理參軍或與諸進士授將作監丞諸州通判節察推官而已且其制每年一科又與諸科同時舉選頻數煩擾非所以重待賢士之意也至元以來始三年一設科取士慎重専恪故前後八科文物之盛綽有可觀但其授官多郡幕縣佐之職猶襲前代之弊國朝取士之塗甚廣惟進士之科為最重其賢才皆教養之于學校每三嵗大比郡縣貢其名於方嶽試之擇其文之髙者達之禮部禮部合天下所貢士羣試之於貢院擇其文之髙者以其名上之天子親策之于廷第其髙下為三甲臚傳于丹陛揭黃榜于通衢一時名動京師其第一甲第一人唐宋以來謂之狀元者其授官與第二第三人皆翰林清職諸進士俱觀政於諸司以次增秩命官不與他途等其待士之意比之前代亦厚矣淳安商輅𢎞載始由縣庠生試于浙江鄉闈第一人試于禮部又第一人對策大廷列名黃榜又第一人趙宋或以省元而為狀元者猶見重當時而名後世國朝自設科以來六十餘年為狀元者凡二十一人其以道德行義學問文章得君得名得行其志而能以勳業始終者皆曰文穆胡先生若夫以三元擅名於一時而冠絶乎前古者則惟吾𢎞載一人耳𢎞載聰明篤厚溫雅而簡靜雖貧而不茍取於人資用匱乏而無憂見人有急難傾槖濟之而不吝其在成均篤志於學不以游惰廢其業每試必在首選及為㑹元為狀元人皆稱譽之方且自視欿然略無自矜意其為人如此吾知其他日得其時際於用而以建諸其事業將必表表偉偉足以追配於前聞人也無疑矣𢎞載既為翰林修撰鄉友秋官主事周君相率賀之而來徵豫文豫老矣姑為是說贈之以為後日徴云送司業趙先生歸省詩序士有越千里而自相知或以聲聞相接或以行義之契非有所為而然也一旦相遇得以輸瀉其夙昔慕望之懷其歡欣悅懌之意為何如哉由是議事而事立施教而教行有順而無逆有同而無異無所為而不得者志同而氣合有以為之揆之古今皆若此也國子司業趙先生淳篤廉介士也德行學術實有諸已初為外校官所至有聲豫聞其名甚熟先生亦聞豫名而未識也及先生調官兖之金鄉衍聖公聞其賢言於朝乞遷為府教授朝廷亦知先生之賢也留弗遣擬授京秩遂以為翰林待詔時豫在翰林一見與語即歡然若素交者然觀其意度辭氣從容溫雅而悉其為人未幾先生升二國子跡雖踈而情則相親然終不得朝夕相往還論議滌其滯幽之懷以為慊去嵗之冬荷䝉聖恩命豫掌教國子時先生適被誣得白同日謝恩闕下相視俱不勝喜先生在監之日久監學之政練析無遺其所以處已化人之術惟所施為無不宜焉而豫學識疏淺暗於事情承命兢惕莫知所措然所恃可以自勉者以有先生為之助也故自視事以來凡所以行於事施于教庶幾其無大失者皆仗於先生豫何能為哉向非得先生則豫之𡨕行妄作其所失也多矣雖然使先生非素相知豫之心而豫亦不諒乎先生之言各以其私情紛爭於是非利害之間則將有不勝之患豈特多失而已哉今先生得告歸省先塋即日促裝上道在監諸先生各賦詩以贈之謂豫宜為序豫於是悵然曰先生行矣言而莫豫正也行而莫豫針也過而莫豫規也而今而後人知向之所為者皆出於先生而豫之不能於其職也彰彰矣然則將奈何先生其速來慎無久留於家期使豫寡過矣乎送王博士還南監序國朝外郡縣皆設學置師弟子員內設大學每嵗郡縣學以其才之成者貢之禮部禮部考試之中其式者升之大學有廪餼以養之有師傅以訓之驗其術業之所至致之有司以厯試之有司者考其勤惰達之吏部而任用之然則大學受成才于郡縣吏部用成才于大學大學貢士之所自出也吾嘗以為賢士之出由乎師道之立師道既立則賢士之出也必多矣然其本源則在乎郡縣學也今郡縣學之士之出者未見其皆賢也豈師道未盡立也歟自建學以來大學師儒之職多用郡縣學之師之教有成效篤學而賢者為之夫以篤實之學而教乎已成之才宜乎其士之出於其間者彬彬然而盛矣而亦未之見焉吾不知其何以然也豈為師者未盡其所以教之之方而為學者未盡其所以受教之道以致然耶前年豫得告暫還其鄉而少師楊先生亦奉命歸省先塋豫往訪因過泰和縣庠今冡宰王公嗣子希稷分教庠學不慮豫之至也雖㑹晤倉猝而禮度雍容諸生自兩齊出見進退詳雅威儀整肅退即齊居絃誦之聲琅琅然豫以是知其善教其為教如此故出其門者舉進士為國子生文學才行表表出人使郡縣學之為師者皆如吾希稷也則賢才之出豈不多哉希稷為南京國子博士三年矣來考績天官書最將還國子助教姑蘇李某與希稷交善也徴豫文贈之夫仁義道德廉恥禮節人道之大端也為師者以是而為教為弟子者以是而為學則何教之不行何學之不成哉若夫偭仁義道德以為不足為棄廉恥禮節以為不足尚一切茍簡蔑裂怠弛縱恣以為之則學者何從取法哉此教之所以不興而習俗之所以頽靡者宜乎其然也若豫者德薄才劣叨居掌教之職知是職之難為也大懼不稱以取譏於時所賴僚屬之士相與輔其不及彌縫其缺失由是內釁不作外侮不至幸或庶幾焉吾聞南監自博士以下皆賢者也而吾友陳公為其祭酒陳公又賢也夫為其長與其屬之皆賢如此則其為教豈不易而其士之出也豈不彬彬然而盛哉因希稷行吾為陳公賀故有以贈希稷勉乎哉庶其有始終者哉送徐郎中赴南京刑部詩序南京刑部主事四明徐君仲福蒞政陕西司九載秩滿來天官考其績最升四川司郎中仍分政南京其表兄余公天祥為郎中禮部率同鄉及相知賦詩以贈徴豫序之念昔太祖髙皇帝在位時詔百司之屬升調改遷無得出所司蓋以刑名錢穀甲兵禮儀之事各有所司惟其嫺習練達則不窘於所施而易以成功也豫時亦未知其言之切既為秋官屬召詣行在行在刑獄頗煩而理刑者蓋鮮刑部以言先是命廷臣舉在外有司官之能且賢者以聞至是適至上命以知縣縣丞為吏部郎者數人皆名能治民者悉自矜喜以為自外而得效用於朝可以行其志矣及其居位而蒞政也囚繫滿前吏牘盈几言不能折其是非心不能籌其當否端坐終日無所猷為政煩而慮亂獄滯而案積然後知才不素試驟用之為難而髙皇帝之立法垂訓可以行于永世而無弊也近年以來郎官缺多用主事為之以故仲福有是命也人皆為仲福喜至形於言以褒之亦所以樂道其賢也仲福是行駕輕車就熟路固無難者然吾猶有告焉仲福昔為主事也分理司事而已今去為正郎兼該總統一司之事心無所不當知然亦有不當知者非不當知也知而若不知者焉耳無所不當聞然亦有不當聞者非不當聞也聞而若不聞者焉夫人皆有廉恥之心皆有改過之念吾之所聞知有可以使人保其廉恥而亟於改過者而吾盡以覺而發之使人廉恥之心喪改過之念沮而終不得夫為善之利使人不得夫為善之利仁人長者之所不為也吾聞仲福賢明端厚而善為政故敢以此言進仲福其必自知之矣雖然此特處人接物之事耳若夫明刑慎罰則仁人長者之意猶所當盡遂請以為終篇獻送考功貟外郎紀公序天官考功部缺冡宰王公以為考功考察內外百官之賢否而殿最之而黜陟之其責亦重矣必得有學識公明賢正之人任之而後可久之公以監察御史吉之永豐彭君武學校授大名之開州紀君文鐸二人有學有守任於內外大著賢聲足當其任特上章薦之以彭君為考功郎中紀君為員外郎以副之公卿大夫與司庶府暨四方之士之萃為吏部者莫不以為宜二人者亦自以為遇知已思盡其力能雖未覩其盛而一時相傳以為吏部小大之官皆碩望賢德協心以圖其政則朝廷之上賢才充牣而不肖者不得以幸進矣不肖者不得以幸進則在外之職無有不當者矣內外之政各得其人則政其有不興而雍熙之治其有不成也哉於是與文鐸交者相率來徵豫文贈之豫嘗與士大夫論天官四部之務孰難易皆曰文選擢任天下賢才以充衆職髙下大小輕重緩急必當其才必慊人心難矣或曰文選不難譬之農夫播種五穀隨其地髙下肥磽而布之無不生者及其生而茂而秀也耘而耨之然後知其孰為稂莠孰為稊稗鋤而去之而後嘉榖植焉此則考功之任所以為難也豫曰二賢之言皆是也然唐虞之際惟曰知人難能知人則能官人至於考績則曰三載考績三考黜陟幽明庶績咸熙未見言其所謂難者周官有廢置之則以馭羣吏又有六計以弊羣吏之治皆考功之職亦未見言其所謂難者然欲辨其治之得失而殿最之别其人之賢否而黜陟之而無不當焉則其所以為難者不知而可知矣雖然天下無難事在人所力行何如耳若勤慎以蒞之公平以處之勤則精公則明則天下之事無不可為者又豈有所謂難者哉二公皆由校官纍遷至今官嘗謂豫言欲盡教官之職窮日之力有不能若夫有司之事其力减半而功倍之豫聞其言竊自思之昔嘗為秋官屬從容有餘今老矣備員太學汲汲然無須臾之少暇而猶不能盡其所當為每自顧歉然然後知二公之言之有味而今之能勝其任也無疑能不負公之所舉而負衆賢之所望必矣送孫檢討致仕詩序荆南孫先生子敏始以鄉貢進士典教蜀縣升教嚴陵既滿遷國子博士博士滿擢翰林檢討仍理博士事又九載赴吏部而先生已年滿七十上章乞致仕朝廷於是頒以敕命褒嘉之又推恩贈封其父母妻而許之先生喜不勝告行於其素所游者買舟輒辭去同寅之士求豫文贈之因念與先生同年舉進士宦四十餘年皆老矣又同在國子而先生獨得引年而去於其行不能無所動於其中夫少而不仕為無志老而不歸為無恥以無恥之人而旅進退於朝廷朝廷之人其謂我何先生之先世吾鄉人也祖宗墳墓在焉先生嘗謂豫必歸行省祭之禮鄉人見先生來必歡迎喜慰而豫獨不見焉鄉人其謂我何夫以朝野之人鄙議而非笑之如此而使之出言以贈先生曽何足以見重而先生亦豈以為重哉豫以是辭焉諸君曰先生之言過矣人之出處進退各有其時不足較也若夫㑹晤離别之際則係於情先生在翰林在國子與檢討君皆為僚屬而又有同鄉之好垂老之别烏得無情哉無情之人人所不取也豫於是悵然曰既不得於朝廷之人不得於鄉里之人而僚屬又不之取焉是所謂進退維谷者也復何言沈而思之諸君所謂出於情者有不能已故為言以贈先生曰先生以道德行義重於朝廷故能得其始終以歸榮於鄉邦其不足為鄉邦重哉誠使其後生小子知其足重而效法焉荆南賢士之出自先生歸益多矣雖然非獨荆南之士之所望亦吾鄉之士之所望是故豫情之所發也先生幸無食前言哉送上官主事還南京序户部周禮地官之職掌土地人民之數貢賦財用之事漢有尚書主財帛委輸即其任也魏晉曰度支宋齊因之始立曹官隋為民部而統四曹李唐以來始改曰户部而總户部度支金部倉部四司謂之子司有子司印得専行事國朝置六部如唐制其屬曰清吏司而户部以天下輿圗之大人民之衆貢賦之夥國初有十二司及皇上即位以來德業益盛土宇益廣人民益蕃而賦稅益增也則十有四司而兩京畿甸之地不與焉凡四方貢賦之所委輸倉庫錢榖之所出納國家經費之所取資皆出户部非得公明廉慎賢而有才器者為之則往往弊出百端耗財用而損國家無益於上而殃逮於下者多矣故嘗慎擇其人以居之邵武上官志真重厚質直發身庠序登永樂進士第選任户部主四川司事分治南京其聲譽燁然聞諸公間昨以事至京師既竣事將還大理評事魯君用質來徵文贈其行夫士之未仕視為政若易易然莫不曰患不得仕耳不患名之不立及其偶得之泯泯焉而無聞者其才不勝其任無足責焉耳若夫其既有聞而旋出於士大夫之公議者由勤於始而怠於宦成者也志真居是職久矣名聞益昭著於時不衰諸公又敬愛之而惜其别則其賢可知故豫不辭而為之序非徒以為贈且因以相勉志真其尚無怠以保厥令名哉金臺别意送沐千户南征序黔寧昭靖王之孫沐喜字可怡今鎮雲南都督公之子也性篤厚有武略而尚文藝比以公事上京師適朝廷命將往同都督公復征麓川而可怡至詔授錦衣衛千户命還隨都督公征進可怡既受命曰祖父子孫荷國厚恩如此敢不盡其所能力即日陛辭上道于其行也太子太保成國朱公黔國沐公襄城李公保定梁公廣寧劉公與豫數人者送之都城南門外小金臺之上酌而餞之朱公謂豫曰先生交于其父子間今日之行可無一言以識其别意乎豫惟凡通都大邑交游故舊有行也必擇名勝之地以為燕餞之所壺觴尊俎歌吟談笑各極其歡務利爭名者則惟富貴利達之是營經生學士則惟道德文辭之是尚斯二者豫或能言其意若夫軍旅之事則未之學也豫何言哉公乃起而舉酒命豫酌可怡曰先王佐太祖髙皇帝平一海內開拓土疆鎮靜南詔父子相繼于今七十餘年矣麓川小醜不順國法恃險為亂上勞王師征之三數年間始破其巢穴而不誅滅之是皇上天地之恩好生之仁也彼不知德乃復萌異心命將再舉勢不得已也易曰師貞丈人吉蓋師出必以正而又得老成之人以主之然後人心悅從無往不克所以吉也孝經曰戰陳無勇非孝蓋戰非勇則不足以勝敵不足以勝敵則不足以為孝夫孝者所以事君也不足以為孝則不足以為忠忠與孝實係乎此可不慎哉師貞丈人朝廷既以屬之尊甫戰陳之勇吾徒敢以屬之吾子子其勉乎哉若夫道離别之懷序交游之意徘徊繾綣而不能舍者此婦人女子之態非慷慨激烈之士之所宜故皆不及也於是襄城諸公咸歡然曰公之言是也請書以為贈遂次第其語以書之使觀者知諸公之所以為别之意者在此而不在彼也送劉萬二進士序皇上自即位以來遵倣舊制設科取士於今十有九年凡七設科矣今年適當取士之春而北京宫殿成正月甲子上御奉天殿受朝賀而天下貢士舉集於京師凡千餘人考試之獲登名於禮部者才二百人三月丁丑上自臨軒策之二百人皆英偉俊邁自喜其出而遭其時也欣忭踴躍以對揚聖天子之休命不自知其發乎情而為文者浩然不可遏何其盛哉既而皇上以天下無事人才衆多列於庶位者咸有其人欲有以優待之使得從容於學問之中以成其大用之才於是各賜之出身敕遣之還其鄉以待用於時吾鄉之士舉進士而來得中其科而在列者二人劉球萬節皆故家子年少而氣鋭聰慧而俊爽有志於為學者其來也迫於有司之命今之歸固可以遂其志矣雖然吾尤有告焉古之學者窮則求其志達則行其道蓋達之所施即其窮之所養非有二致也後世則不然其未仕也誦其書而不知其道既仕也習其事而不顧背於理専留心於簿書文移之務刀筆簡牘之末以應變為急救時為切相競於智術之小數而相誇於巧捷之微才汲汲無須臾之少暇是烏知為治之大道耶嗟夫彼卑官小職其所為在給於事者固無怪其然若夫居廟堂之中以致君澤民為事者其可不知所務哉黃帝堯舜三代之時風后力牧稷契伊傅周召之為佐其德足以輔君其道足以濟世從容議論于一堂之上而教化政治自行於八荒之外豈嘗若是之瑣瑣耶賈誼曰移風易俗類非俗吏所能為俗吏之所為在於刀筆筐篋而不知大體其言雖譏切當時實後世之通患也夫為士者學聖人之道不思舉而行之乃相率而趨于彼以求合乎時之所尚而冒俗吏之名何其謬哉二君歸其益勉乎其未至者定其心一其志涵泳乎六經之所言究觀乎史籍之所紀思所以修身齊家者何道而所以事君治民者何術務其大而不屑乎其細求合乎古而不茍徇於時使他日出而仕於朝卓然有所樹立而不為俗尚之所搖奪則庶幾其不負皇上養育造就之意而將以為科目得人賀豈不美哉送吳編修歸省序翰林編修吳節與儉得請歸省其親鄉邦士大夫相與燕餞於侍講劉君之宅各賦詩以贈之而以序屬豫與儉豫族妹壻也豫妻兄與儉姊壻也既親且故序宜無辭夫士之仕於時有冠冕以華其躬有爵祿以養其家有推恩之典以及於其親而又當乎國家清平無事之時得盡覲省祭掃之禮昔人所謂衣錦之榮者此人情之所同也而有不同者或貧苦憔悴而田園林壑無復昔時游樂之所者有焉或父母昆弟俱已零落俯仰顧望而無非可慨者有焉或兄弟宗族不相顧念漠然相視若途人者有焉夫如是將不以為榮而又何樂哉與儉書臺大家家有慈母在堂康寧夀考而其貞節懿行足為女婦法式其從兄與肅溫恭而執禮慷慨而好義與與儉居自幼至長恩義尤篤與儉之所以得専志於學問文藝而無內顧之憂以有與肅也昆季皆自郡城徙居西山中前年豫歸訪與肅與豫游觀於山谷間至一平田沃壤林木茂密處指以示豫曰我將搆屋數十楹以待吾賢弟歸奉親待賔於此别未幾而屋已成今與儉歸其為樂可勝道哉吁天倫之樂真樂也而得者蓋鮮豫也二親久已見棄諸兄子姪之訃相繼而至所謂俯仰可慨者莫甚於豫也然則豫與與儉同其情而不同具樂於其行不能無所感故道其所不同者特詳焉送方伯張公赴江西序正統八年春以監察御史廬山張公文節為江西右布政使國子助教李洪與翰林檢討謝濟助教羅伯初率太學諸生往餞之而徴豫文贈之皇上自即位以來孜孜於求賢命官以圖至治而於方面大臣尤加之意焉雖簡在聖心又必參之以在廷重臣之所舉選不輕授也公自御史超拜方伯人皆以為宜由其才德足以稱之也然而方伯大任布宣恩德號令之出政化之施斟酌損益必適其宜如是而後可以無愧於其任故豫於公特有告焉方伯總治於外郡守縣令望之以為表率四郊之民仰之以為父母今一方面之間環千里而為郡者不知其幾所環百里而為縣者不知其幾區自守令而下任牧民之責者不知其幾人有賢而善為政不肖而怠於事者有廉而惠於民貪而毒於下者欲考察於平時而激揚於一旦則為力勞而不勝其擾矣若夫不假於稱賞譽賚彼賢而廉者自知所勸不勞於搏擊黜罰彼貪而不肖者自知所懲而皆為良有司是必有其道也窮鄉下邑鰥寡流冗不得遂其生者不可勝數而郡邑之間獷驁凶悍不事生業者不可盡紀有飢寒困苦望救於上而流離顛沛失其所者有把握官府以濟其奸而豪橫鄉曲以肆其毒者欲人人而濟之一一而制之則為力煩而不勝其難矣若夫不假於勞來撫摩彼窮人自得其養不勞於榜笞桎梏彼惡人自向於化而皆為良民亦必有其術也孔子曰其身正不令而行又曰德之流行速於置郵而傳命仁人君子之為政類如此公學廣而明于理才髙而練於事剛正而簡靜有守而有為其致此不難豫故為公一言焉公行矣方伯毗陵吳公豫故人也聽政之暇其亦以是告之將必有契焉送李參議赴浙江序正統九年夏吏部言方面太臣缺皇上命選廷臣之賢者任之得十有一人司封貟外郎雲間李君士徴預焉詔授浙江布政司參議於其行也少保成國朱公徴為文贈之豫因念昔舉進士赴春官時李君之尊府敬齊適為尚書知貢舉其後豫第進士入翰林往還兩京而公不離禮部喜接納後進溫然不以位望驕人故豫得與公為忘年交厚善今公不可見矣見君之榮遇顯達如此猶見公也不能不為之喜慰贈言其可辭方面郡縣之表率其任固非輕也夫郡縣之吏有賢有不賢者焉有廉有不廉者焉賢而廉者不有以旌異之則人不知所勸不賢而不廉者不有以黜罰之則人不知所懲其所以旌異所以黜罰之固在於方面大臣也然欲一一訪其績而旌之人人究其隙而黜之則不勝其煩勢亦或有所不行焉惟夫不假旌異而使人自知所勸不假黜罰而使人自知所懲是必有其道也環數千里之地山川風氣之所間隔民情習俗之所異宜非探其情而導率之則人不知所從因其俗而誘掖之則人不知所化其所以導率所以誘掖之亦在於方面大臣也然欲人人探其情而導之一一求其俗而誘之則不勝其勞而力亦或有所不贍焉惟夫不假導率而使人自知所從不假誘掖而使人自向於化亦必有其道也其道不在他求正其身端其心為之耳古昔仁人長者之為政類如此以君之賢固優為之而豫猶有告焉凡仕者在知大體達下情而方面大臣尤為急務茍大體之不知則煩瑣細碎郡縣吏承之而致之民而民不勝其擾矣下情之不達則倒行逆施郡縣吏承之而致之民而民不勝其害矣君之尊府自方面入為六卿其為政之大體君得之觀感聽聞之際熟矣雲間之與兩浙壤地相接民情風俗不甚相逺不待詢察而君固已知之矣如此而為政將無往而不得固可以追配古昔仁人長者之風也必矣此豫於君端有望焉君行勉之贈按察李副使復任貴州序一方面之間布政司所以宣布天子政教表率郡縣以治其民都司所以掌治國家兵柄鎮撫所衛以衛其民按察司執守國家憲度以臨蒞乎二者之間亦所以求民瘼而安之也是故居官者不能無賢否廉汚之不齊為民者不能無貧富強弱之不一政務之行刑罰之施不能無暴急枉濫之失而逺鄉下邑又豈能無不得其所不得其養不得其平者乎二司拘於其職而不得行惟按察官者皆得以拘執訊問而無所忌誠得人焉以公平正大之心行激揚勸懲之政則一方數千里之內官何由而不歸於正民何由而不得其所鰥寡孤獨何由而不得其所養哉濟寧李公宗性初以光祿署官拜參議貴州民雜夷獠俗尚殊異以賊殺攻鬬為常事故易與為變不習禮義故難以馴服公至佐理政教示之以威而仁慈寓於施設之間綏之以德而制馭形於言辭之表以故民夷感畏郡邑帖然而聲譽之著益章章乎聞於人矣未幾朝廷以貴州副使員缺廷臣交章薦公升授按察副使時公以外艱家居詔即起公以往至貴州歡聲雷震四方肅然守令皆修其職業武吏皆斂其威暴雖深山窮谷獷夷黠獠莫不畏威懷德向風慕化士間於營堡民樂于耕鑿歌謡之聲溢於逺邇吁亦何其盛哉是皆由于公之聲威碩望之所素著有以為之也今述職將還任進士鄭生相率來乞言贈之夫贈之為言增也將以增益其所不能也夫公以寬厚之德負有為之才當聖明之時膺祿秩之隆出入內外所至皆有聲稱如此亦奚以余言為哉余雖言之亦何能有益於公哉雖然方今佐聖天子以施政化於廊廟之上多方面之賢而有名者然則公之往豈久於外哉惜乎余老矣歸田有日不得候公於都門以與士大夫慶賀之列於其行聊因鄭生之請而為贈行序送王僉憲復任廣西序太宗文皇帝即位之初舉行舊典首以科目取士及永樂甲申天下歌鹿鳴而來者凡三千餘人羣試于禮部録名而對大廷登進士選者四百七十人武昌王君時舉預焉時舉通敏質直操履堅正不事矯僞而又有才藝諳練世故初授知江寧縣事改春坊中允於時同年之士多去為大官內而佐六卿副臺憲外而居方面守専城者比比如是人皆謂國朝科目得人之盛莫是過也而時舉以詿誤坐廢十餘年然後得僉憲廣西夫以其才識學行並進於時而獨罹屯蹇既艱而後通豈其所遭遇固自有其時耶時之未至也處之泰然及其既亨也若固有之一無所動乎其中形於其顔面者惟君子為能然非君子而能然者蓋未之有也夫汲汲於富貴者必戚戚於貧賤况處屯難之極也耶處屯難之極悒悒若不可生及其脫然而躋於康莊且致位貴顯其能不自矜喜而變易其所守者乎此時舉之所以為難得也貴賤不移其心險夷不渝其操方之古君子其有異也歟視乎今之人其有同也歟豫也亦嘗遭罹艱險未有比君之甚且久也而猶所不堪以豫之不甚且久而猶不堪故知君之所以為難也雖然豫與君同榜士也幸而遭值聖明無事之時荷䝉天地覆育之恩致有今日可不思竭盡心力以圗所報效於萬一也耶君行矣勉之送彭僉事詩序皇帝即位之明年夏四月意謂治天下必本於賢才賢才之出必本於學校學校之教不興而望賢才之出也難矣乃詔在廷大臣各舉學術明正操履端恪者為按察副使僉事監察御史命往各方嶽及畿內之地専督學校作興賢才以圗至治於是得十三人而吾翰林編修彭琉育敬與焉授廣東按察僉事以行同鄉之士各賦詩贈屬豫序竊嘗以為學校之政在乎隆師道作士氣簡賢俊此三者其要也記曰凡學之道嚴師為難此隆師道之謂也皮辨祭菜以示敬道小雅肄三以官其始此作士氣之謂也燕朋逆其師燕辟廢其學此簡賢俊之謂也古之為此者所以誘掖賢才以進于善而無須臾離于學之中故賢才之出濟濟然其盛惟國家所用而無不足者焉後世尊師重道之意衰釋菜歌詩之禮廢朋比邪辟之行作凡學校之教所以修已治人之方相繼而盡壞以至于今抑又甚焉其為師者不知所以為教為弟子者不知所以為學雖其素習已久然亦由乎作興之者無其人也郡縣之吏惟簿書期㑹之為務而有不暇及焉無足責也至于藩臬大臣與夫朝廷之使之至也不知視學激勸之方不計其人之賢否不考其學之踈密惟以其衣冠容貌進退應對之庸偉綬給以為吾禮之輕重拜伏跪起瞻望俯仰與𨽻卒無以異出迎逺郊伏於道左以俟車騎之過而後敢起小不如其意輒怒罵而退斥之怒罵不足而施之以鞭撲鞭撲不已而加以罪戾吁道德仁義廉恥禮節果安在哉是故無賢者也果有如胡瑗其人何蕃之才將潛深伏隩之不暇肯從事乎其間以自取辱哉此師道所以不尊士氣之所以日卑而粗鄙暴橫輕浮薄惡之徒相與游從乎其中詩書不足以變其習德義不足以求其心驕侈怠惰自肆於規矩之外其才之不成也固然此賢俊之所以無聞而儒效之所以疏闊者有由然也不一大振作之不可以有成也宜乎朝廷汲汲於簡拔才行之士以専督責之任而吾特以此三者為要務與諸公一言之果何如也倘以為可而致行之則三者之中又當以隆師道為先焉周子曰師道立則善人多多則朝廷正而天下治矣夫學校所係之大如此而以屬之十三人者其任不亦重矣乎育敬可不加之意耶雖然此非旦暮事也勤慎以率之鼓舞以進之從容以待之務期其效之大成以副所望慎無速於近效哉古廉文集卷五
