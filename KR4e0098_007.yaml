body:
  text: 古亷文集卷七明李時勉撰表車駕幸太學謝表泰運宏開光啓雍熙之治重明麗正茂昭經緯之文辟雍式睹于告成聖駕特䝉于臨幸衣冠咸集海宇同歡恭惟皇帝陛下睿哲文明剛健中正聲教被乎四海道德冠于百王聖學緝熙舉經筵之盛典文謨丕顯新胄監之宏規廊廟煥金碧之輝聖哲儼威儀之雅斯文郁郁振古罕倫成功巍巍于今乃見念祖宗曽勤于龍馭宜聖明躬睹于虎闈瓘瓚有容籩豆加飭陳詩書而敷帝王之訓因富庶而宣教養之方曠世稀逢清時榮睹瞻依天表聆訓飭之綸音拜舞橋門感作興之恩意是皆皇上至仁大德聿彰文運之鴻猷斯實國家重熙纍洽化成天下之偉績也臣等粗知章句沗職師儒叨承寵遇之隆愧乏㳙埃之報天長地久祝聖壽于萬年日照月臨仰皇明于八表無任瞻天仰聖激切屏營之至陳情乞致仕表臣草茅賤質樗散微材十六而游泮庠從師講學三十而登進士釋褐飄纓選入翰林首被文皇之隆眷使居祕閣博觀先聖之遺書既九年而擢屬秋官未三載而召與史事自兹七命膺祿秩之益崇歷事四朝沐恩榮之甚廣叨荷聖皇之寵命授臣掌教之清班受職䝉恩所當戮力反躬度德實匪其材譬猶下乘之駑駘空負上槽之菽粟今臣行年七十之上而疾病交侵居任三紀之餘而㳙埃無補昨者敷陳愚悃懇乞歸休皇上垂念老臣未賜俞允而愚臣亦戀明主敢遂閒安第以枯朽之資不堪委任之重昔也徒持文墨議論何曽有益于朝廷今焉幸當教育賢才豈能有禆于聖化正宜堅葵藿之誠心可惜迫桑榆之暮景形骸潦倒精力衰頺尋常于庶務之施行或記一而忘十朝夕于諸生之訓誨每語後而遺前言則氣不續聲行則筋不束骨臨政多怠慮事不精雖使竭犬馬之微勞終莫報乾坤之大德徒有妨于賢路終無補于明時伏望聖慈許其致仕俾得棲身畎畝全三尺之微軀擊壤康衢祝萬年之聖壽無任瞻天仰聖激切屛營之至說文說進士劉球求樂既登第將歸過豫而請曰吾昔所學者科目之文也今承命得還鄉以績學于家將盡棄舊學而惟新是圖其道何由豫曰子之所謂圖其新者其至于道耶將惟在于其外之文耶志于道則昔之所學者固無悖焉而文不外是矣如惟事乎其外之文而不究其實焉則雖學之勤而求之切吾未見其得也夫六經之所載者皆聖人之言未嘗有心于為文而文從之者其道在焉耳讀其書則思所以窮其理誦其言則思所以行其道由乎仁義之塗而不汨于利誘之私使其氣充而理得則其發于文者自優然而及于古豈有異術哉雖然王荆公嘗云文章當先體製而後工拙必知乎體格變態之髙下于是從而由之則庶不眩瞀而流于卑弱不知乎古而能有及乎古蓋未之見焉堯舜三代辭簡而理備渾然深以厚不可尚矣先秦兩漢去古未遠雄壯博雅未易及也自是而降至于唐宋作者益衆然能追蹤乎古人者不過數人耳是皆道明德立之士其言足以垂世而立教豈偶然哉下至魏晉六朝五代之間流于磔裂而純駁相雜者要在慎取之耳至于今之所謂時文者特掇科求仕者假是以進焉雖其文體輕浮疏淺而于道則未嘗戾也道在是而不戾則由是而進于古也不難矣求樂歸而求之吾知其新之所得者固沛然有餘矣且求樂之先能為古文者若容忩先生至今人猶傳道之以家學之舊而又以求乎古則進而至于古也將自有所不能及矣易說南昌涂彥昌作玩易山房為退休所命其子來京師求子言彥昌善先天數學以人之生年月日推其富貴貧賤壽夭死生禍福患難如指諸掌其所玩果易之所得乎昔者聖人之作易也一本諸理因其盈虛消息而知進退吉凶死生禍福而避就之故常有吉而無凶得福而少禍後世搜探其奧以推測宇宙古今之運天地隂陽風霆變化之妙因以及乎人物貴賤貧富壽夭之不齊此易之緒餘也若彥昌之所玩其古聖人所作易乎抑後世所探之緒餘也古聖人之所言理也後世之所探緒餘也數也論理而不論數可論數而不本于理不可不本于理則將涉于虛無妄誕而無所歸矣故吾欲與彥昌一論之進退存亡數也知進退存亡而不失其正者明于理也易之所言故如此彥昌其以是玩之京房善易而以欺詐招禍虛中知命而以餌丹求仙由其知數而不知理也彥昌其慎之哉琴書說廬陵彭翔漢年富而聰敏能鼓琴又知讀書好文辭嘗闢一軒畜琴一張書萬卷來徵豫言豫聞琴者禁也所以禁止其邪思以就夫中和之德者也書者著也所以著聖賢之言而使之求其道也古者聲樂未作伏羲始制琴以修身理性反其天真由是聲音起焉聲有宮商角徴羽被于五絃厥後黃帝之作咸池堯之大章虞舜之作簫韶禹之大夏湯之大濩周之大武得有所因者皆權輿于此古者文字未立伏羲始畫八卦以通神明以類萬物之情由是文籍生焉易有彖辭有爻辭以斷卦爻之吉凶至孔子又作十翼而文辭于是益盛厥後典謨訓誥之言國風雅頌之什禮樂制作之文褒貶筆削之㫖得有所紀者皆本原于此故論聲音而不本于伏羲之琴韻者非知音者也論文辭而不本于伏羲之畫卦者非知文者也然則琴樂之器也書載道之器也君子無故琴瑟不去于前詩書不釋于手非以徇耳目之欲縱玩好之娛蓋以其有益于身心者固非尋常外誘之物之可拒也誠䏻因是以求之而不怠焉以養其性情以明其道義則中和之德可成聖賢之域可企而為君子之歸也不難矣翔漢以是名其軒可謂有志之士也世恆言有志者事竟成翔漢勉乎哉化導說詩書禮樂之化人易易也而或者以為難豫不知其何以然也夫父子君臣夫婦兄弟朋友之倫人之所固有者不以華夷而有間但其日用由之而不知其自有聖賢者懼其終不之知則三綱五常之道壞亂極矣不惟壞亂胥入于鳥獸之羣而不能變也矣于是筆之于書庶乎有䏻以之而教乎民使知其道之為已之所固有者而䏻盡不至于鳥獸同羣此古聖賢之用心也今有䏻以古聖賢之心舉詩書之所言以教導之彼以其所固有者而聽乎詩書禮樂之言歡然以由于其道不煩鞭朴而自不出于防範之外者則豈不易哉夫鳥獸産于山林其去人也遠矣茍拘而教之其拜舞跪起言語歌詠莫不如人意者非其性然也教使然也况于人之靈于物者不可以教也歟豫友彭冲霄以永樂甲午鄉貢分教貴州之普安本夷獠之地素不習詩書禮樂之教冲霄至擇其秀爽者日夕訓誨而督責之不惟其言語文字之間而又導之以躬行踐履之實未踰年而風俗大變詩書禮樂之習蔚然可觀視中邦無異學校之士穎然而出咸欲效用于時而貴州初未有科貢之設士無由以進冲霄知其然遂以聞于朝俾附雲南試使有出身之望宣德己酉貴州中者果三之一而普安有預選者由冲霄始也以是觀之世之子弟違綱常悖禮義而同于無知之羣而不知自反者豈其罪哉實父師之不䏻教使然也夫以無知異類蠻夷逺方盡心以教之宜若自然况于中國禮義之俗之易易者乎冲霄考績天官升教祁陽交游之士重之皆贈之以言豫以冲霄之教于普安且如此而况于祁陽也哉雖然教者貴于不倦學者貴于自勉豫故為此言以為冲霄頌且以為祁陽之士勸也師友說宜章彭先生友諒分教蜀之溫江既滿入京調安成衆咸謂豫安成人能無言耶豫曰然韓子曰師者所以傳道授業解惑者也夫所以為教者必由于是而後其教行其所以為學者必由于是而後其學進是故為師者道既充矣而必為人傳之業既廣矣而必為人授之惑既釋矣而必為人解之彼不吾求也不吾受也不吾問也是自棄自暴者也絶之可也為弟子者道不足于已必于師而求之業未成于已必于師而就之惑未釋于已必于師而辨之彼不吾傳也不吾授也不吾解也是為已而非為人者也去之可也夫如是則為教者誠而為學者篤其能相與以有成也必矣若夫為師者靳吝閉固非有重資厚幣足以動人者未肯一輕示之而輒絶之為弟子者怠惰玩愒非有誦習可以速成者未肯一輕從之而輒去之是則為師者不知所以為教為弟子者不知所以為學其能相與以有成者鮮矣弊邑雖小而士多好學雖深幽僻逺之地絃誦之聲相聞㑹處之際論文賦詠之外不及乎其他故子弟多成其材況學校有廩餼以養之有師長以教之有有司以勸督之得専心一志以由于學而不暇乎他所務則其所以成乎其材也抑義易矣夫以好學易成之材而又得如先生者以為之師將見士之彬彬然出于一時而盛于往昔時者無疑矣豫故道師弟子之所以為教與學有成與否以為先生贈者所以激勸乎邑之士子而有望于先生以成之先生必有以副吾望也懷德說宋太師中書令范文正公之裔孫內臺照磨以圭生九嵗而失所恃既長而失所怙嘗以今之獲授榮名者皆先德之所致也因扁其堂曰懷德問其義于豫豫曰德莫大乎天地而親之德與天地同天地之德不可名而親之德亦不可名不可名而以名其堂則堂之所存亦親之所存也是故時乎春也大鈞團垣淑氣咻和飛潛動立以息以萃此天地生物之德也處斯堂而大觀之其䏻忘父母生身之德乎時乎夏也二氣動蕩景凱扇燠披拂長養庶類以育此天地育物之德也處斯堂而反思之其能忘父母養育之德乎時乎秋冬也霜露團結風氣烈栗羣動既成品彚亦實此天地成物之德也處斯堂而內省之其能忘父母成已之德乎是以升是堂也肅乎若親之陟降而出入腹我也僾乎若親之言笑而辟咡教詔也宛乎若察其疾痾而為之摩抑也恍乎若識其飢寒而為之飲食也懌乎若有所得而喜其䏻言也戚乎若有所失而懼其或仆也倣佛乎若獨立而趨庭之有間也隱約乎若倚閭而望其未至之有憂也食息也而常若見乎羮墻啓處也而常若見乎几席以至萃嘉賔于斯聚姻友于斯安樂笑語于斯而吾親之德亦恆若著存于斯而不能忘焉然則以圭思親之意其有已乎昔子路南逰于楚纍裀而坐列鼎而食以不及養親為感而有風木之悲故聖人稱其能以死事盡思焉今君以是而名其堂其亦可謂能以死事盡思者矣雖然親殁矣不可得而見矣雖日具三牲五鼎之養亦無自而進矣然則果何為而可以泄其思也歟聖人不云乎立身行道揚名于後世以顯父母是則親雖殁而猶不殁也懷其德而致其報孰有大于此哉方今聖明以孝治天下善無不録以圭于移孝就忠之道維其時矣成性說水之行乎地中流而不息其孰得而名之哉及其泓而停深而明撓之而不混汲之而不竭于是名之曰淵然後人知其為淵而稱之而淵之名始著隂陽五行之理運行而不已也亦莫得而名焉及其妙合而凝而賦物也至靜而未形至純而不雜于是名之曰性然後人知其為性而稱之而性之名始立夫淵之所以為淵也人知其為淵而不知其為水之所聚也性之所以為性也人知其為性而不知其為理之所寓也理者衆人之所同而性者吾心之所獨蓋得于天之所賦渾淪全具無少缺缺孔子繫易之辭曰成之者性也其此之謂乎孟子曰堯舜性之也性之者不失本然之天而已是即所謂成性也自非聖人則不能無氣禀之偏物欲之蔽而失其本然之天者也然是理之流行具于人心者未嘗滅息茍䏻以知禮存之而不已也則道義由是而出而聖人之域亦可馴至矣故曰成性存存道義之門歙之方以茂以是名其室其知大易之義乎其知孔子之意乎因其來請豫言故申其說以告之習靜說無錫俞公辨以習靜名其軒且以自號徵其義于豫豫聞靜非塊然之謂蓋有所主而不妄動者也自天地之大以至事物之細莫不各有自然之妙當然之則惟能盡之所以安靜而不擾者固其宜也是故天惟靜也然後運晝夜而不息地惟靜也然後振河海而不泄山非靜則不能以生草木水非靜則不足以鑑萬類人豈異是哉人以心為主心以靜為本天下之事至于理而止天下之理至于善而止知善之所在則心有定向而不妄動即大學所謂定而後能靜者也譬夫蹈東海者必先知海之所在然後泛江河以趨之而不為斷港絶潢之所惑適泰山者必知山之所在然後遵大道以求之而不為曲蹊斜徑之所移求聖人之道者必先知夫道之所在然後致知力行以探之而不為異端邪說之所亂則為學之士之所當知也至于農工商賈莫不皆然農惟知夫稼穡播種之候故能安于畎畝而致有秋之望工惟知夫審曲面勢之宜故能安于規矩而成斫削之巧商賈惟知懋遷廢舉之機故能安于貨殖以致居積之富使心有所移則或以彼易此不足以居其業而成其功矣是則天地萬物之妙生人向仰之途莫非以靜而成以撓而廢靜之為道其亦大矣哉豫聞公辨平生自處欿然宅心淡泊不務華飾不矜已誇人安于所履無分外之求其于靜之理必得之而有素者也為厯述其言以告之公辨慎毋以吾言為簡直也冠禮說徐鎡時用吾友亞卿徐公良玉之子也既冠冬官亞卿廬陵周公為製祝辭內臺副都海虞吾公又字以朂之少保户部尚書東萊黃公復詩以美之士大夫之長于詩者皆屬而和之時用集為一卷求豫言夫冠禮之始也而冠醮又人道之始也始而不可以不重故古今重之時用可不知所重哉方其在童子也人惟童子之視及其冠也將責以成人之道焉成人之道與童子時敻異也而自今日始不亦重矣乎時用其亦自念乎其既冠也其敬慎威儀與童子時為何如人之持已也其恭遜禮貌與童子時闕則其進于成人之道也自不容于少怠也茍怠矣則孝弟忠信之道不立闕為人雖冠與童子何異哉以時用公冡嗣也其冠其醮其禮秩焉其見于母兄母兄與為禮見于鄉大夫鄉先生鄉大夫先生與為禮蓋為其有成人之道焉其為重也如此時用可不知所重哉知所重則必兢業以持其身勤勵以力于學從容于進退周旋之際優游于仁義禮樂之區而可以為人子可以為人弟可以為人臣可以為人少者而其行信于人矣能盡四者之行而信于人所以成人也如是而後可以不負尊府重冠而行之之意如是而後可無愧乎諸公祝之字之美之之情時用勉乎哉吾深有望焉未齊說臨川黎近之大家居時力于學問蓋欲求古人之心行古人之道不極其至不已也嘗謂人曰吾承纍世詩書禮義之澤烏可不知所事事以顛墜厥緒哉于是閉門讀書謝絶人事凡數載學積而行成或曰若子者可無愧于前修無負于古人矣近曰未也文王大聖人也孔子大聖人也于道則曰未之見于躬行君子則曰未之有得况于衆人乎况于吾之暗劣闕者乎乃名其室曰未齊以示警也及學闕名益有聞或曰若子之學德之成可以出而仕矣近曰未也漆雕開大賢也韓退之大儒也孔子使之仕則曰吾斯之未能信李翊求其道則曰愈不知其尤未至也况于吾之淺才薄識獨學無成而不可與有為者乎于是乃退休于齊潛心篤志淡然若無意于人世者及其久也聲譽日以著于外卒為知者薦授銅陵丞自銅陵擢令高安所至皆有聲稱士頌其德美民服其教令人曰若子之為政雖古循吏何加焉近曰未也昔西門豹之治鄴有令名史起猶以為未盡于仁知宓子賤之治單父而民恱孔子猶以為未足于大道吾于二子何能有及焉而敢妄自誇許以驕人哉于是飾官舍揭以舊名曰吾將益視以自警云由是人皆知之大之力于學而能有始終者作為詩歌以相勸之來徵豫言豫惟為學之道其戒在自暴自棄與夫半途而廢也茍非甘于暴棄力進而不知止焉則何所為而不成哉故孔子嘗嘆夫有恆者之難見若之大其可為有恆者歟有恆者孔子之所未見而今見之得不可重哉諸公形之于詩亦所以重之也惜乎子言不足為之大重姑次第其語以廣未齊之義云叙引丹房十詠詩引姑蘇李敏為大醫院良醫居都城南門外地雖闤闠有幽雅之趣圖古聖賢自神農至葛洪為丹房十詠將求士大夫詠歌之持以示豫豫聞醫豈易言哉昔人有達則願為良相窮則願為良醫者夫宰相上佐天子理隂陽順四時下遂萬物之宜而醫之名乃與之並醫豈易言哉敏志于古先聖賢之事逮將有齊芳並美者豈徒玩諸文辭而已哉為賦十詠詩一篇并叙引其前俾續珠玉者繼焉遙聞古聖賢妙用無端倪今兹丹房中賦咏分十題其一首神農以赭鞭草木溫凉俱親嘗由是啓醫藥其二長桑君躬授盧醫方飲以上池水中見身所藏其三孫思邈捐劑活龍子獻方三十道來自龍宮裏其四葉法師有鏡如水流照見六腑疾療之無不瘳其五費長房恆逰汝南市巧遇懸壺公躍入得仙祕其六有桓景竒士與絳囊九日飲茰酒疫癘因可攘其七董奉居作室依匡廬愈疾種五杏嵗久成千株其八郴井傍上有蘇丹橘摘葉置水中能愈萬人疾其九扁鵲石乃出髙氏山用之針血脈流注皆安便其十金匱書世謂葛洪造今昔共流傳自是人間寶側惟醫與相勢位逾天淵究其恤民隱實則同心田李君蘇臺裔濟利得竒術以兹住京師揚芬萬家室汛掃煉丹房中列圗與書展圖玩金碧璀璨生光輝盡是古仙人一一總前哲神聖顯功巧載籍著遺跡願君味至理造詣窮高深聲華與齊等視古猶視今慎莫重文詞外觀侈虛飾珍重紹遺芳上醫可醫國送陳太守詩有叙四明陳公本深永樂中與豫同為刑部屬其後豫復入翰林公升員外郎膺薦出守吾郡在郡有善政九邑之民仰之若父母及任滿而去也相率訴于藩府留之藩府以達于朝許之升其秩正三品還之任以副民望吁亦榮矣古之人治郡如黃霸邵信臣輩所以名重當時而傳譽至今者亦不過得民心而已若公之為政視昔人豈多讓哉其名世傳遠無疑于其行賦詩贈之且以道故交之意云詩曰憶昔在秋官同寅百餘人磊落俱妙年衆中情獨真到今三十載零落如飈塵相逢各皓首論舊忽悲辛君才既特達膺薦承殊恩高車駕五馬出守濟斯民千里洽嘉政萬室熙陽春草木自生遂黎庶咸歡欣九載報政成鳴珮覲楓宸居民不忍舍封章聿來陳惟皇圖治理眷顧益以臻秩祿既增厚天語猶殷勤饑羸重引領行矣毋逡巡民俗固如舊政化當復新恩榮有若此旭日耀征輪繾綣故交意局促何由申一别㑹靣難有如參與辰聊取尊中酒酌别來通津徘徊岐路側車馬何繽紛臨行無所贈眷眷平生親小瀛洲詩有序少宰抑庵王先生于所居之寓作退休之室具琴書其中四壁圖蓬萊閬苑諸神山扁曰小瀛洲蓋寓興于高遠也俾豫賦詩豫為之賦曰甲第既宏敞齊居愛幽偏徘徊梁棟間宛在蓬壺山蒼松隱岩岫白日霏雲烟皓鶴天邉來靈飈波上旋偓佺羡門子羽蓋何翩翩鳯舞吹洞簫龍吟耕玉田我欲往從之愧無凌風翰一水邈難即引領增慨然其二溟海波浩蕩扁舟何所投微茫見島嶼遙識是瀛洲晴雲覆其上弱水環之流金銀為宮闕瑶草羅層丘仙人空中下可以長淹留日月自往來不知春與秋餐霞吸沆􅒭終歲無閒愁借問世間人可有此樂否其三流塵飛不到几席净如洗銀甕有瓊漿殽核甘且㫖客來啓華筵歡樂殊未巳靈芝滿庭除日出粲霞綺微風泛清香飄拂忩户裏因之發髙詠落紙雲烟起何必㑹列仙削脯餐石髓自非情曠達取適能如此其四憶昔唐帝時學士皆翹英同寅十八友宛若登蓬瀛我皇濬且哲文運勃以興妙選中祕書羅列如天經明公榜中傑聨步得同升拜官玉堂署出入飄華纓凌晨趨紫閣日晏居彤庭看花過上苑視草來西清恩渥沛深厚不减登瀛名奚必羡仙侶鴻飛去冥冥丹丘在人世服食增遐齡送樂舞生詩詞有序神樂觀樂舞生禾川戴尚禮將歸于鄉或勸之曰子方外之士若行雲流水無室家之戀惟其所寓無適非安也奚歸之亟耶尚禮曰吾雖無妻子之慮無資産之營然亦人耳豈能免祖宗墳墓之思無林泉山水之好哉諸君不能見憐而反相為訾無乃不可乎豫與尚禮交二十餘載矣追思往時逰觀之樂邈不可得于其行也贈之以詞詞曰艷秋菊兮花滿枝掇芳香兮泛瓊巵送君去兮南歸風飄飄兮吹衣楚山峩峩兮楚水灕灕水有蒲蓮兮山有靈芝山中之樂兮何有窮期悵一别兮天之涯月皎皎兮長相思像贊張若金像贊外貌雍容中心樂易持已無纎芥之邪私接人藹一團之和氣娛情山水之間適意烟霞之趣居文獻之邦為簪纓之裔積書嘗滿于危樓教子遂登于髙第豸冠振耀之有名鳯詔褒封之必至惟賢惟德宜富宜貴享三釜之養于無窮膺九疇之福于咸偹李奎御史像贊夷坦心胸清和姿宇守禮以持身讀書而好古事非義不為里非仁不處言其文字則人有不如論其操行則人無不與是以掌教化而賢才輩出職風憲而紀綱振舉既享榮名復隆清譽是固將進于顯庸而瑣瑣者殆未可與同日而語也拙藏章先生像贊我用其拙而巧藏焉我藏其拙而巧亡焉彼用其智為巧之過騁巧實拙媒以賈禍君子之守不務其名嗚呼先生百世儀刑金御史父像贊貌溫而氣和性淳而心靜優遊林泉而于情有適安處鄉閭而與物無競教子掇科而居清要之職荷國推恩而有褒封之命吁此豈非有福有德所以享祿養之榮而膺永年之慶者歟侍衛王百户像贊儀刑端謹進止從容有儒雅之意趣存忠厚之心胸列職于侍衛之司而其名自顯退身于幽閒之地而其氣益充瞰西湖之清泚睇天目之高峰或杖屨逍遙于其下或舟航遊樂于其中有子孫以供其養有冠裳以華其躬此所以為太平人物而享福壽于無窮也歟文江許處士像贊其貌臞然其中坦然而其色充然其學也有滿架之詩書其耕也有繞屋之園田其處心也不險不忮其待物也無黨無偏一任人情之翻覆不知世事之糾纒優遊林泉之下相將古稀之年有子掇科有孫滿前陶然自得樂乎其天此豈非太平之遺老而享五福之兼全者耶孫參政像贊瀟灑襟懷雍容意氣從師講道必務盡情取友輔仁必求勝已當文明之盛時望雲霄而奮起登名桂籍可不負所學佐政薇垣得行其所志聲譽益以著聞儀觀益以瓌偉殆將享福享壽如山嶽之益增而不止于此也吳謙與讓像贊溫淳氣質夷坦心胸持身謙抑處事從容當至治之明時而無利祿之慕以蕭散之髙致而居林壑之中有山水足以資游覽之適有田園足以備朝夕之供處兄弟而著薛河東之美接賔客而擅孔北海之風臨清流而賦白石望𤣥雲而撫蒼松塵俗固莫得以攖其慮而世之擾擾又安得與之雷同也哉戴慎誠思像贊其儀表瓌偉而翛然其心胸寬厚而坦然其言辭簡直而意氣溫然居家庭而以孝友為務處鄉曲而以和睦為先既無心于富貴惟樂志于林泉修竹蒼松固可與為侶世情俗慮亦那得而相牽此所以優遊于太平無事之時享福享壽又何必假昌陽以引年也歟宜春楊大尹父仲康像贊存心忠厚處世和平服今人之衣冠馴古人之性情得遺金而不以自利捐廪粟而不以自矜惟樂乎山林泉石之幽而不慕乎軒冕鍾祿之榮種竹開蔣生之徑教子守韋氏之經是蓋治平之遺逸鄉邦之老成惜乎今不可見矣而徒想望其儀刑也歟獨孤中郎像贊觀其貌薾然乎其外探其義充然乎其內蹈規矩而不渝窮經術而不怠其勵操也確乎堅貞其持心也淵乎深粹其言從容而有則其行始終而無愧是以厯官三十餘年無纎毫瑕玷以為之纍此豈今世之可倫實古仁人君子之流輩也歟武官像贊心志和平儀容清偉德善之門衣纓之裔隱居求志而憺若無為仗劔遭時而奮然崛起攻城遇敵而自不顧身撫降恤順而人感其惠是以際風雲之㑹而益進益鶱受爵命之榮而愈顯愈貴非惟功建于當時而且福庇于後嗣惜乎其今不可見矣徒使後人仰瞻其遺像增感慨而歔欷張巨川像贊魁梧竒偉之資慷慨溫和之性處已無愆與物無競父母兄弟稱其孝友宗族鄉黨嘉其愛敬教子積鄴侯之書好客開蔣生之徑義周閭里有以蘇困窮之人名達朝廷足以受褒嘉之命千載聲華一生榮慶吁此豈非仁人君子宜乎其膺福祉享壽考益增而益盛也古亷文集卷七
