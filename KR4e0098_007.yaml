body:
  text: 古亷文集巻七明李時勉撰表車駕幸太學謝表泰運宏開光啓雍熈之治重明麗正茂昭經緯之文辟雍式睹扵告成聖駕特䝉扵臨幸衣冠咸集海宇同懽恭惟皇帝陛下睿哲文明剛健中正聲教被乎四海道徳冠扵百王聖學緝熈舉經筵之盛典文謨丕顯新胄監之宏規廊廟煥金碧之輝聖哲儼威儀之雅斯文郁郁振古罕倫成功巍巍扵今乃見念祖宗曽勤扵龍馭宜聖明躬睹扵虎闈瓘瓚有容籩豆加飭陳詩書而敷帝王之訓因富庻而宣教養之方曠世稀逢清時榮睹瞻依天表聆訓飭之綸音拜舞橋門感作興之恩意是皆皇上至仁大徳聿彰文運之鴻猷斯實國家重熈累洽化成天下之偉績也臣等粗知章句沗職師儒叨承寵遇之隆愧乏㳙埃之報天長地久祝聖壽扵萬年日照月臨仰皇明扵八表無任瞻天仰聖激切屏營之至陳情乞致仕表臣草茅賤質樗散㣲材十六而游泮庠從師講學三十而登進士釋褐飄纓選入翰林首被文皇之隆眷使居秘閣博觀先聖之遺書既九年而擢屬秋官未三載而召與史事自兹七命膺禄秩之益崇歴事四朝沐恩榮之甚廣叨荷聖皇之寵命授臣掌教之清班受職䝉恩所當戮力反躬度徳實匪其材譬猶下乗之駑駘空負上槽之菽粟今臣行年七十之上而疾病交侵居任三紀之餘而㳙埃無補昨者敷陳愚悃懇乞歸休皇上垂念老臣未賜俞允而愚臣亦戀明主敢遂閒安第以枯朽之資不堪委任之重昔也徒持文墨議論何曽有益扵朝廷今焉幸當教育賢才豈能有禆扵聖化正宜堅葵藿之誠心可惜廹桑榆之暮景形骸潦倒精力衰頺尋常扵庻務之施行或記一而忘十朝夕扵諸生之訓誨每語後而遺前言則氣不續聲行則筋不束骨臨政多怠慮事不精雖使竭犬馬之㣲勞終莫報乾坤之大徳徒有妨扵賢路終無補扵明時伏望聖慈許其致仕俾得棲身畎畝全三尺之㣲軀擊壤康衢祝萬年之聖壽無任瞻天仰聖激切屛營之至説文説進士劉球求樂既登第將歸過予而請曰吾昔所學者科目之文也今承命得還鄉以績學扵家將盡棄舊學而惟新是圖其道何由予曰子之所謂圖其新者其至扵道耶將惟在扵其外之文耶志扵道則昔之所學者固無悖焉而文不外是矣如惟事乎其外之文而不究其實焉則雖學之勤而求之切吾未見其得也夫六經之所載者皆聖人之言未嘗有心扵為文而文從之者其道在焉耳讀其書則思所以窮其理誦其言則思所以行其道由乎仁義之塗而不汨扵利誘之私使其氣充而理得則其發扵文者自優然而及扵古豈有異術哉雖然王荆公嘗云文章當先體製而後工拙必知乎體格變態之髙下扵是從而由之則庶不眩瞀而流扵卑弱不知乎古而能有及乎古盖未之見焉堯舜三代辭簡而理備渾然深以厚不可尚矣先秦兩漢去古未遠雄壯博雅未易及也自是而降至扵唐宋作者益衆然能追蹤乎古人者不過數人耳是皆道明德立之士其言足以垂世而立教豈偶然哉下至魏晉六朝五代之間流扵磔裂而純駁相雜者要在慎取之耳至扵今之所謂時文者特掇科求仕者假是以進焉雖其文體輕浮疎淺而扵道則未嘗戾也道在是而不戾則由是而進扵古也不難矣求樂歸而求之吾知其新之所得者固沛然有餘矣且求樂之先能為古文者若容忩先生至今人猶傳道之以家學之舊而又以求乎古則進而至扵古也將自有所不能及矣易説南昌涂彦昌作玩易山房為退休所命其子來京師求子言彦昌善先天數學以人之生年月日推其富貴貧賤壽夭死生禍福患難如指諸掌其所玩果易之所得乎昔者聖人之作易也一本諸理因其盈虛消息而知進退吉凶死生禍福而避就之故常有吉而無凶得福而少禍後世捜探其奥以推測宇宙古今之運天地隂陽風霆變化之妙因以及乎人物貴賤貧富壽夭之不齊此易之緒餘也若彦昌之所玩其古聖人所作易乎抑後世所探之緒餘也古聖人之所言理也後世之所探緒餘也數也論理而不論數可論數而不本扵理不可不本扵理則將涉扵虛無妄誕而無所歸矣故吾欲與彦昌一論之進退存亡數也知進退存亡而不失其正者明扵理也易之所言故如此彦昌其以是玩之京房善易而以欺詐招禍虚中知命而以餌丹求仙由其知數而不知理也彦昌其慎之哉琴書説廬陵彭翔漢年富而聦敏能鼓琴又知讀書好文辭嘗闢一軒畜琴一張書萬巻來徵予言予聞琴者禁也所以禁止其邪思以就夫中和之德者也書者著也所以著聖賢之言而使之求其道也古者聲樂未作伏羲始制琴以脩身理性反其天真由是聲音起焉聲有宮商角徴羽被于五絃厥後黄帝之作咸池堯之大章虞舜之作簫韶禹之大夏湯之大濩周之大武得有所因者皆權輿扵此古者文字未立伏羲始畫八卦以通神明以類萬物之情由是文籍生焉易有彖辭有爻辭以斷卦爻之吉㓙至孔子又作十翼而文辭扵是益盛厥後典謨訓誥之言國風雅頌之什禮樂制作之文褒貶筆削之㫖得有所紀者皆本原扵此故論聲音而不本扵伏羲之琴韻者非知音者也論文辭而不本扵伏羲之畫卦者非知文者也然則琴樂之器也書載道之器也君子無故琴瑟不去扵前詩書不釋扵手非以徇耳目之欲縱玩好之娱葢以其有益扵身心者固非尋常外誘之物之可拒也誠䏻因是以求之而不怠焉以養其性情以明其道義則中和之徳可成聖賢之域可企而為君子之歸也不難矣翔漢以是名其軒可謂有志之士也世恒言有志者事竟成翔漢勉乎哉化導説詩書禮樂之化人易易也而或者以為難予不知其何以然也夫父子君臣夫婦兄弟朋友之倫人之所固有者不以華夷而有間但其日用由之而不知其自有聖賢者懼其終不之知則三綱五常之道壞亂極矣不惟壞亂胥入扵鳥獸之羣而不能變也矣扵是筆之扵書庻乎有䏻以之而教乎民使知其道之為已之所固有者而䏻盡不至扵鳥獸同羣此古聖賢之用心也今有䏻以古聖賢之心舉詩書之所言以教導之彼以其所固有者而聽乎詩書禮樂之言歡然以由扵其道不煩鞭朴而自不出扵防範之外者則豈不易哉夫鳥獸産扵山林其去人也遠矣茍拘而敎之其拜舞跪起言語歌詠莫不如人意者非其性然也敎使然也况扵人之靈扵物者不可以教也歟予友彭冲霄以永樂甲午鄉貢分教貴州之普安本夷獠之地素不習詩書禮樂之教冲霄至擇其秀爽者日夕訓誨而督責之不惟其言語文字之間而又導之以躬行踐履之實未踰年而風俗大變詩書禮樂之習蔚然可觀視中邦無異學校之士穎然而出咸欲効用扵時而貴州初未有科貢之設士無由以進冲霄知其然遂以聞扵朝俾附雲南試使有出身之望宣德己酉貴州中者果三之一而普安有預選者由冲霄始也以是觀之世之子弟違綱常悖禮義而同扵無知之羣而不知自反者豈其罪哉實父師之不䏻教使然也夫以無知異類蠻夷逺方盡心以教之宜若自然况扵中國禮義之俗之易易者乎冲霄考績天官陞教祁陽交游之士重之皆贈之以言予以冲霄之教扵普安且如此而况扵祁陽也哉雖然教者貴扵不倦學者貴扵自勉予故為此言以為冲霄頌且以為祁陽之士勸也師友説宜章彭先生友諒分教蜀之温江既滿入京調安成衆咸謂予安成人能無言耶予曰然韓子曰師者所以傳道授業解惑者也夫所以為教者必由扵是而後其教行其所以為學者必由扵是而後其學進是故為師者道既充矣而必為人傳之業既廣矣而必為人授之惑既釋矣而必為人解之彼不吾求也不吾受也不吾問也是自棄自暴者也絶之可也為弟子者道不足扵已必扵師而求之業未成扵已必扵師而就之惑未釋扵已必扵師而辨之彼不吾傳也不吾授也不吾解也是為已而非為人者也去之可也夫如是則為教者誠而為學者篤其能相與以有成也必矣若夫為師者靳恡閉固非有重資厚幣足以動人者未肯一輕示之而輒絶之為弟子者怠惰玩愒非有誦習可以速成者未肯一輕從之而輒去之是則為師者不知所以為教為弟子者不知所以為學其能相與以有成者鮮矣弊邑雖小而士多好學雖深幽僻逺之地絃誦之聲相聞㑹處之際論文賦詠之外不及乎其他故子弟多成其材況學校有廩餼以養之有師長以教之有有司以勸督之得専心一志以由扵學而不暇乎他所務則其所以成乎其材也抑义易矣夫以好學易成之材而又得如先生者以為之師將見士之彬彬然出扵一時而盛扵往昔時者無疑矣予故道師弟子之所以為教與學有成與否以為先生贈者所以激勸乎邑之士子而有望扵先生以成之先生必有以副吾望也懐德説宋太師中書令范文正公之裔孫内臺照磨以珪生九嵗而失所恃既長而失所怙嘗以今之獲授榮名者皆先徳之所致也因扁其堂曰懷徳問其義扵予予曰徳莫大乎天地而親之徳與天地同天地之徳不可名而親之徳亦不可名不可名而以名其堂則堂之所存亦親之所存也是故時乎春也大鈞團垣淑氣咻和飛潛動立以息以萃此天地生物之徳也處斯堂而大觀之其䏻㤀父母生身之徳乎時乎夏也二氣動盪景凱扇燠披拂長養庻類以育此天地育物之徳也處斯堂而反思之其能㤀父母養育之徳乎時乎秋冬也霜露團結風氣烈栗羣動既成品彚亦實此天地成物之徳也處斯堂而内省之其能㤀父母成已之徳乎是以升是堂也肅乎若親之陟降而出入腹我也僾乎若親之言笑而辟咡教詔也宛乎若察其疾痾而為之摩抑也恍乎若識其飢寒而為之飲食也懌乎若有所得而喜其䏻言也戚乎若有所失而懼其或仆也彷彿乎若獨立而趨庭之有間也隠約乎若倚閭而望其未至之有憂也食息也而常若見乎羮墻啓處也而常若見乎几席以至萃嘉賔于斯聚婣友于斯安樂笑語于斯而吾親之徳亦恒若著存于斯而不能㤀焉然則以珪思親之意其有已乎昔子路南逰扵楚累裀而坐列鼎而食以不及養親為感而有風木之悲故聖人稱其能以死事盡思焉今君以是而名其堂其亦可謂能以死事盡思者矣雖然親殁矣不可得而見矣雖日具三牲五鼎之養亦無自而進矣然則果何為而可以洩其思也歟聖人不云乎立身行道揚名扵後世以顯父母是則親雖殁而猶不殁也懷其徳而致其報孰有大扵此哉方今聖明以孝治天下善無不録以珪扵移孝就忠之道維其時矣成性説水之行乎地中流而不息其孰得而名之哉及其泓而停深而明撓之而不混汲之而不竭扵是名之曰淵然後人知其為淵而稱之而淵之名始著隂陽五行之理運行而不已也亦莫得而名焉及其妙合而凝而賦物也至静而未形至純而不雜扵是名之曰性然後人知其為性而稱之而性之名始立夫淵之所以為淵也人知其為淵而不知其為水之所聚也性之所以為性也人知其為性而不知其為理之所寓也理者衆人之所同而性者吾心之所獨葢得扵天之所賦渾淪全具無少欠缺孔子繫易之辭曰成之者性也其此之謂乎孟子曰堯舜性之也性之者不失本然之天而已是即所謂成性也自非聖人則不能無氣禀之偏物欲之蔽而失其本然之天者也然是理之流行具扵人心者未嘗㓕息茍䏻以知禮存之而不已也則道義由是而出而聖人之域亦可馴至矣故曰成性存存道義之門歙之方以茂以是名其室其知大易之義乎其知孔子之意乎因其來請予言故申其説以告之習静説無錫俞公弁以習静名其軒且以自號徵其義扵予予聞静非塊然之謂葢有所主而不妄動者也自天地之大以至事物之細莫不各有自然之妙當然之則惟能盡之所以安静而不擾者固其宜也是故天惟静也然後運晝夜而不息地惟静也然後振河海而不洩山非静則不能以生草木水非静則不足以鑑萬類人豈異是哉人以心為主心以静為本天下之事至扵理而止天下之理至扵善而止知善之所在則心有定向而不妄動即大學所謂定而後能静者也譬夫蹈東海者必先知海之所在然後泛江河以趨之而不為斷港絶潢之所惑適泰山者必知山之所在然後遵大道以求之而不為曲蹊斜徑之所移求聖人之道者必先知夫道之所在然後致知力行以探之而不為異端邪説之所亂則為學之士之所當知也至扵農工商賈莫不皆然農惟知夫稼穡播種之候故能安扵畎畝而致有秋之望工惟知夫審曲面勢之宜故能安扵規矩而成斵削之巧商賈惟知懋遷廢舉之機故能安扵貨殖以致居積之富使心有所移則或以彼易此不足以居其業而成其功矣是則天地萬物之妙生人向仰之途莫非以静而成以撓而廢静之為道其亦大矣哉予聞公弁平生自處欿然宅心澹泊不務華飾不矜已誇人安扵所履無分外之求其扵静之理必得之而有素者也為厯述其言以告之公弁慎毋以吾言為簡直也冠禮説徐鎡時用吾友亞卿徐公良玉之子也既冠冬官亞卿廬陵周公為製祝辭内臺副都海虞吾公又字以朂之少保户部尚書東萊黄公復詩以美之士大夫之長扵詩者皆屬而和之時用集為一巻求予言夫冠禮之始也而冠醮又人道之始也始而不可以不重故古今重之時用可不知所重哉方其在童子也人惟童子之視及其冠也將責以成人之道焉成人之道與童子時夐異也而自今日始不亦重矣乎時用其亦自念乎其既冠也其敬慎威儀與童子時為何如人之持已也其恭遜禮貌與童子時闕則其進扵成人之道也自不容扵少怠也茍怠矣則孝弟忠信之道不立闕為人雖冠與童子何異哉以時用公冡嗣也其冠其醮其禮秩焉其見扵母兄母兄與為禮見扵鄉大夫鄉先生鄉大夫先生與為禮葢為其有成人之道焉其為重也如此時用可不知所重哉知所重則必兢業以持其身勤勵以力扵學從容扵進退周旋之際優游扵仁義禮樂之區而可以為人子可以為人弟可以為人臣可以為人少者而其行信扵人矣能盡四者之行而信扵人所以成人也如是而後可以不負尊府重冠而行之之意如是而後可無媿乎諸公祝之字之美之之情時用勉乎哉吾深有望焉未齋説臨川黎近之大家居時力扵學問葢欲求古人之心行古人之道不極其至不已也嘗謂人曰吾承累世詩書禮義之澤烏可不知所事事以顛墜厥緒哉扵是閉門讀書謝絶人事凡數載學積而行成或曰若子者可無媿扵前修無負扵古人矣近曰未也文王大聖人也孔子大聖人也扵道則曰未之見扵躬行君子則曰未之有得况扵衆人乎况扵吾之闇劣闕者乎乃名其室曰未齋以示警也及學闕名益有聞或曰若子之學徳之成可以出而仕矣近曰未也漆雕開大賢也韓退之大儒也孔子使之仕則曰吾斯之未能信李翊求其道則曰愈不知其尤未至也况扵吾之淺才薄識獨學無成而不可與有為者乎扵是乃退休扵齋潛心篤志澹然若無意扵人世者及其久也聲譽日以著扵外卒為知者薦授銅陵丞自銅陵擢令高安所至皆有聲稱士頌其徳美民服其教令人曰若子之為政雖古循吏何加焉近曰未也昔西門豹之治鄴有令名史起猶以為未盡扵仁知宓子賤之治單父而民恱孔子猶以為未足扵大道吾扵二子何能有及焉而敢妄自誇許以驕人哉扵是飾官舍掲以舊名曰吾將益視以自警云由是人皆知之大之力扵學而能有始終者作為詩歌以相勸之來徵予言予惟為學之道其戒在自暴自棄與夫半途而廢也茍非甘扵暴棄力進而不知止焉則何所為而不成哉故孔子嘗嘆夫有恒者之難見若之大其可為有恒者歟有恒者孔子之所未見而今見之得不可重哉諸公形之扵詩亦所以重之也惜乎子言不足為之大重姑次第其語以廣未齋之義云叙引丹房十詠詩引姑蘇李敏為大醫院良醫居都城南門外地雖闤闠有幽雅之趣圖古聖賢自神農至葛洪為丹房十詠將求士大夫詠歌之持以示予予聞醫豈易言哉昔人有達則願為良相窮則願為良醫者夫宰相上佐天子理隂陽順四時下遂萬物之宜而醫之名乃與之並醫豈易言哉敏志扵古先聖賢之事迨將有齊芳並美者豈徒玩諸文辭而已哉為賦十詠詩一篇并叙引其前俾續珠玉者繼焉遥聞古聖賢妙用無端倪今兹丹房中賦咏分十題其一首神農以赭鞭草木温凉俱親嘗由是啓醫藥其二長桑君躬授盧醫方飲以上池水中見身所藏其三孫思邈捐劑活龍子獻方三十道來自龍宮裏其四葉法師有鏡如水流照見六腑疾療之無不瘳其五費長房恒逰汝南市巧遇懸壺公躍入得仙秘其六有桓景竒士與絳嚢九日飲茰酒疫癘因可攘其七董奉居作室依匡廬愈疾種五杏嵗久成千株其八郴井傍上有蘇丹橘摘葉置水中能愈萬人疾其九扁鵲石乃出髙氏山用之鍼血脈流注皆安便其十金匱書世謂葛洪造今昔共流傳自是人間寳側惟醫與相勢位逾天淵究其恤民隠實則同心田李君蘇臺裔濟利得竒術以兹住京師揚芬萬家室汛掃煉丹房中列圗與書展圖玩金碧璀璨生光輝盡是古仙人一一總前哲神聖顯功巧載籍著遺跡願君味至理造詣窮高深聲華與齊等視古猶視今慎莫重文詞外觀侈虛飾珍重紹遺芳上醫可醫國送陳太守詩有叙四明陳公本深永樂中與予同為刑部屬其後予復入翰林公陞員外郎膺薦出守吾郡在郡有善政九邑之民仰之若父母及任滿而去也相率訴扵藩府留之藩府以達扵朝許之陞其秩正三品還之任以副民望吁亦榮矣古之人治郡如黄霸邵信臣輩所以名重當時而傳譽至今者亦不過得民心而已若公之為政視昔人豈多讓哉其名世傳遠無疑扵其行賦詩贈之且以道故交之意云詩曰憶昔在秋官同寅百餘人磊落俱妙年衆中情獨真到今三十載零落如飈塵相逢各皓首論舊忽悲辛君才既特達膺薦承殊恩高車駕五馬出守濟斯民千里洽嘉政萬室熈陽春草木自生遂黎庻咸歡忻九載報政成鳴珮覲楓宸居民不忍舍封章聿來陳惟皇圖治理眷顧益以臻秩禄既増厚天語猶殷勤饑羸重引領行矣毋逡廵民俗固如舊政化當復新恩榮有若此旭日耀征輪繾綣故交意局促何由申一别㑹靣難有如參與辰聊取尊中酒酌别來通津徘徊岐路側車馬何繽紛臨行無所贈眷眷平生親小瀛洲詩有序少宰抑庵王先生扵所居之寓作退休之室具琴書其中四壁圖蓬莱閬苑諸神山扁曰小瀛洲葢寓興扵高遠也俾予賦詩予為之賦曰甲第既宏敞齋居愛幽偏徘徊梁棟間宛在蓬壺山蒼松隠岩岫白日霏雲烟皓鶴天邉來靈飈波上旋偓佺羨門子羽葢何翩翩鳯舞吹洞簫龍吟耕玉田我欲往從之愧無凌風翰一水邈難即引領増慨然其二溟海波浩蕩扁舟何所投㣲茫見島嶼遥識是瀛洲晴雲覆其上弱水環之流金銀為宮闕瑶草羅層丘仙人空中下可以長淹留日月自往來不知春與秋餐霞吸沆􅒭終歲無閒愁借問世間人可有此樂否其三流塵飛不到几席净如洗銀甕有瓊漿殽核甘且㫖客來啓華筵歡樂殊未巳靈芝滿庭除日出粲霞綺㣲風泛清香飄拂忩户裏因之發髙詠落紙雲烟起何必㑹列仙削脯餐石髓自非情曠達取適能如此其四憶昔唐帝時學士皆翹英同寅十八友宛若登蓬瀛我皇濬且哲文運勃以興妙選中秘書羅列如天經明公榜中傑聨步得同升拜官玉堂署出入飄華纓凌晨趨紫閣日晏居彤庭㸔花過上苑視草來西清恩渥沛深厚不减登瀛名奚必羨仙侶鴻飛去㝠㝠丹丘在人世服食増遐齡送樂舞生詩詞有序神樂觀樂舞生禾川戴尚禮将歸扵鄉或勸之曰子方外之士若行雲流水無室家之戀惟其所寓無適非安也奚歸之亟耶尚禮曰吾雖無妻子之慮無貲産之營然亦人耳豈能免祖宗墳墓之思無林泉山水之好哉諸君不能見憐而反相為訾無乃不可乎予與尚禮交二十餘載矣追思往時逰觀之樂邈不可得扵其行也贈之以詞詞曰艶秋菊兮花滿枝掇芳香兮泛瓊巵送君去兮南歸風飄飄兮吹衣楚山峩峩兮楚水灕灕水有蒲蓮兮山有靈芝山中之樂兮何有窮期悵一别兮天之涯月皎皎兮長相思像贊張若金像贊外貌雍容中心樂易持已無纎芥之邪私接人藹一團之和氣娛情山水之間適意烟霞之趣居文獻之邦為簪纓之裔積書嘗滿扵危樓教子遂登扵髙第豸冠振耀之有名鳯詔褒封之必至惟賢惟徳宜富宜貴享三釜之養扵無窮膺九疇之福扵咸偹李奎御史像贊夷坦心胷清和姿宇守禮以持身讀書而好古事非義不為里非仁不處言其文字則人有不如論其操行則人無不與是以掌教化而賢才輩出職風憲而紀綱振舉既享榮名復隆清譽是固将進扵顯庸而瑣瑣者殆未可與同日而語也拙藏章先生像贊我用其拙而巧藏焉我藏其拙而巧亡焉彼用其智為巧之過騁巧實拙媒以賈禍君子之守不務其名嗚呼先生百世儀刑金御史父像贊貌温而氣和性淳而心静優㳺林泉而扵情有適安處鄉閭而與物無競教子掇科而居清要之職荷國推恩而有褒封之命吁此豈非有福有徳所以享禄養之榮而膺永年之慶者歟侍衛王百户像贊儀刑端謹進止從容有儒雅之意趣存忠厚之心胸列職扵侍衛之司而其名自顯退身扵幽閒之地而其氣益充瞰西湖之清泚睇天目之高峰或杖屨逍遥扵其下或舟航㳺樂扵其中有子孫以供其養有冠裳以華其躬此所以為太平人物而享福壽扵無窮也歟文江許處士像贊其貌臞然其中坦然而其色充然其學也有滿架之詩書其耕也有繞屋之園田其處心也不險不忮其待物也無黨無偏一任人情之翻覆不知世事之糾纒優㳺林泉之下相將古稀之年有子掇科有孫滿前陶然自得樂乎其天此豈非太平之遺老而享五福之兼全者耶孫叅政像贊瀟洒襟懷雍容意氣從師講道必務盡情取友輔仁必求勝已當文明之盛時望雲霄而奮起登名桂籍可不負所學佐政薇垣得行其所志聲譽益以著聞儀觀益以瓌偉殆將享福享壽如山岳之益増而不止扵此也呉謙與讓像贊温淳氣質夷坦心胸持身謙抑處事從容當至治之明時而無利禄之慕以蕭散之髙致而居林壑之中有山水足以資游覧之適有田園足以備朝夕之供處兄弟而著薛河東之美接賔客而擅孔北海之風臨清流而賦白石望𤣥雲而撫蒼松塵俗固莫得以攖其慮而世之擾擾又安得與之雷同也哉戴慎誠思像贊其儀表瓌偉而翛然其心胸寛厚而坦然其言辭簡直而意氣温然居家庭而以孝友為務處鄉曲而以和睦為先既無心扵富貴惟樂志扵林泉脩竹蒼松固可與為侶世情俗慮亦那得而相牽此所以優㳺扵太平無事之時享福享壽又何必假昌陽以引年也歟宜春楊大尹父仲康像贊存心忠厚處世和平服今人之衣冠馴古人之性情得遺金而不以自利捐廪粟而不以自矜惟樂乎山林泉石之幽而不慕乎軒冕鍾禄之榮種竹開蔣生之徑教子守韋氏之經是葢治平之遺逸鄉邦之老成惜乎今不可見矣而徒想望其儀刑也歟獨孤中郎像贊觀其貎薾然乎其外探其義充然乎其内蹈規矩而不渝窮經術而不怠其勵操也確乎堅貞其持心也淵乎深粹其言從容而有則其行始終而無愧是以厯官三十餘年無纎毫瑕玷以為之累此豈今世之可倫實古仁人君子之流輩也歟武官像贊心志和平儀容清偉徳善之門衣纓之裔隱居求志而憺若無為仗劔遭時而奮然崛起攻城遇敵而自不顧身撫降䘏順而人感其惠是以際風雲之㑹而益進益鶱受爵命之榮而愈顯愈貴非惟功建扵當時而且福庇扵後嗣惜乎其今不可見矣徒使後人仰瞻其遺像増感慨而歔欷張巨川像贊魁梧竒偉之資慷慨温和之性處已無愆與物無競父母兄弟稱其孝友宗族鄉黨嘉其愛敬教子積鄴侯之書好客開蔣生之徑義周閭里有以蘇困窮之人名達朝廷足以受褒嘉之命千載聲華一生榮慶吁此豈非仁人君子宜乎其膺福祉享壽考益増而益盛也古亷文集巻七
