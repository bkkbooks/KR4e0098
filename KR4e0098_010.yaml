body:
  text: 明李時勉撰碑銘故禮部右侍郎吾公神道碑正統六年秋八月二十一日禮部右侍郎吾公以官終於南京訃聞天子遣官睗祭命有司治墳塋歸其柩葬於衢之開化鍾山之原明年公從子珊走京師泣告於豫曰先從父既葬而神道之碑未刻敢以是為請豫辱與公同年不可固辭謹按狀而序次之太宗文皇帝以神聖大德入正大統二年甲申廷策進士四百七十人選其簡秀而有文者二十八人績學詞林以待擢用公在列而年最少質偉才敏博覽羣籍作為文詞其言滔滔然無凝滯方是時四方多獻祥瑞二十八人者輒進詩賦以歌頌聖德一時文學之盛人皆欣羡五年冬拔其中五人為修撰九年以公與楊相段民沈升等六人為刑部主事時有言理刑得臯陶方稱者上聞之曰此儒者之言當擇其人故以六人主事且命所訊囚既定罪徑自引奏備陳其情犯問擬不當則坐罪六人者恐懼祇謹以求副上意讞議務適其中敷奏必以實舉無差失他刑官老於法律者咸推讓其能而公尤以寬平得名升郎中總一司之政益謹其職拜禮部侍郎上謂尚書吕震曰吾紳出自翰林佐卿典禮可稱矣既而出為廣東右參政宣德四年復入為禮部改南京刑部奉敕考核兩廣方面官有參政素貪黷結權要為援見公來以故僚友可恃公黜之又以殘刻被黜者三人時論稱其至公今上皇帝嗣大厯服以公舊人賜誥命褒之有言南京獄訟蕃滋掌刑部者過於寬縱吏得並緣為姦於是命公復為禮部至是以疾終公初拜侍郎衆往賀衣冠畢集而一室蕭然在坐有笑者曰家不視先會賔乎譏其無所治具也公三佐宗伯一佐司寇持已以正不阿諂不瑣細嚴刻任性率直於人長短一無所較出佐廣藩為僚長所擠亦略無愠色其視名位得失是非榮辱坦然無介意會賔客故舊劇飲盡醉或脫帽撫掌歌詩以為娛或縱意談笑以戲謔為樂若甚放曠而其中亦有止節平生所作文詞甚富嘗和唐音集為一帙其好吟類此卒年五十有九娶徐氏封淑人子二人長聰次敏俱幼女四人二子側室史氏出公卒徐淑人自家來攜之以歸撫愛之甚至吾聞公開化名族之後曾祖諱隱操祖諱伯恭父諱仲廣俱贈通議大夫刑部右侍郎祖妣妣俱贈淑人嗚呼公有文學操履遭際其時位至顯要固不負先朝期待任之之意惜所施未究而年止於斯耳然生有名譽沒有榮寵其始終復何憾哉銘曰於赫太宗文武聖神圖惟至治敷求哲人臨軒發策賜以髙第憲憲吾公年富才偉遊於詞垣超然出羣揚芬吐竒厥聲有聞試以劇任俾典庶獄刑惟厥中不僭不酷帝用嘉之以佐春卿以典祀事克殫厥誠繼佐藩政再登朝端秩禮明刑惟敬惟寬明明天子舊人是嘉錫以寵書恩命再加去繁就簡謂公尤宜厥施未究而至於斯公性直亮素履坦平生有令譽沒而光榮鍾山之陽玄宅所閟刻銘垂休耀於永世正議大夫資治尹户部右侍郎吳公墓碑户部侍郎吳公之妻淑人王氏遣家僮寧以監察御史曹泰所為公狀來告曰妾夫不幸客死於外今奉其喪歸葬欲具石表諸其墓道而未有文先生與夫交不薄敢以為請如不吝賜之使夫名不泯於世則不勝大幸先生幸無辭嗚呼公其死也耶公雖死吾嘗念公如未死者然公被謫去未嘗一日不冀公起而復用也及訃聞為之心驚膽裂而淚下不已者纍日尚忍文其墓石也耶然以淑人之請之至又誼不得辭遂為之文曰公諱璽字信玉邵武人祖均用父仲政皆以公貴贈嘉議大夫户部右侍郎祖妣妣皆贈淑人公性穎敏而端厚永樂戊子由郡庠生以春秋舉於鄉明年試禮部不第入太學自太學厯試擢武選主事以才能為尚書方公所器重既以外艱去方公言之於太宗文皇帝奪其情起治事未幾升郎中宣宗皇帝知其賢升行在户部右侍郎或云户部政與兵部異公將窘於是職矣公至未期月而於四方萬國之版圗人民錢穀之多寡廩庾庫藏之虛實莫不窮究考察皆得其要國家經費用度出入盈縮莫不會計營度皆得其宜而於下之弊蠧一皆昭燭無遺莫敢自肆者然後人始信公之賢且能為不可及也正統己未從庫藏物入內帑敕太監洪公魏國徐公與公董其事二公性不任煩劇惟總大綱纎悉一以付公公經理調度秩有條紀人不勞而事易集二公深重之壬戌秋外蕃來貢馬上問户部馬入境日用芻束幾何邊郡所儲足給用否時公以疾在告同寅倉猝錯愕不知所對上以為大臣不事事下之獄辭連及公謫戍邊在邊僅二載以疾卒正統甲子二月二十日也享年五十有七公凡再娶前淑人黃氏後淑人王氏即請文者生男輒即夭一女尚幼死時惟家僮與王淑人在側遺命以其弟禮之子嗣公才能過人而謙卑不自任初繫獄時或謂公可不上疏求理耶公曰本同事復何言若言是欲見所長我不為也本部尚書缺公言侍郎王公尚書才也號於衆宜薦之時雖無應者其後王公果為尚書而公竟流落以死其天也耶其命也耶墓在其鄉某山某原葬以某年某月某日而立墓石則某年某月某日也正議大夫户部左侍郎薑公墓碑公諱濤字伯淵姓薑氏太原州人曽祖原祖黼父唐卿皆不仕公性敏慧自幼輒知以讀書為事今兵部尚書靖逺伯王公副憲山西時行部至欣州選民間俊秀補郡庠弟子員在選中年才十四就學為文日益以有進永樂甲子領鄉薦明年會試禮部不利卒業太學授同知嘉興府事嘉興政繁賦重公至佐政有餘力民安樂之未幾以舊官代還改河間府宣德壬子河間守以事罷去民數千詣闕舉郡守朝廷素聞公賢即日命知河間府未幾以外艱去民老幼復詣闕懇乞留公上方慎擇守令詔可之奪其情起復正統初京尹缺廷臣交薦拜順天府尹戊午頒給誥命授通議大夫祖考皆贈官如制祖妣妣妻王氏皆贈淑人癸丑進階正議大夫勳資治尹甲子升户部左侍郎乙丑奉命督江淮漕運京畿內外倉儲是嵗夏得疾還京沒於長安里第四月二十二日也上聞而悼惜之遣官致祭在廷公卿而下咸往弔祭公生於洪武壬申享年五十有四配劉氏封淑人子男三人實寧定女四人實將奉喪歸葬以禮部侍郎侯公所述公行實來請豫為墓碑文豫聞公自嘉興代還時奉命督工外有舊按察官在任之中恐懼前却若無所容蓋嘗與公有宿憾者公詔語之曰汝勿怖宜趨政事愈厚遇之河間民少恆産多以漁為生而或經豪右侵奪陂池民不得其利公至令曰凡池湖魚蝦蓮葦任民採取敢有占據者就執以來由是資民得遂其生有王同知者以徇私與公不協及公赴京忽令吏守其家不得出入讒毁百端未幾王死妻子生事械京師當遞還送至府各惶懼賄吏勿令公知吏不敢隱白公即召入欵延纍日資遣之母子謝曰公可謂以德報怨者也京師祀事課賣皆出於民吏傍緣為民姦被其毒公上請出天財庫以供其費凡三知貢舉一處之以公請託不行沒之日家無餘錢幾不能具棺斂嗚呼此可以觀其為人矣豫為書之茲碑使欲知公者於此可考焉贈户部尚書王公墓志銘户部尚書海豐王公以內艱將歸遣其屬官主事崔恭來致其語曰不肖佐先人沒葬未有銘今不幸老母又見棄背吾歸奉老母之喪於先人之兆合窆焉願先生賜之銘以掩諸幽吾先世淮北人宋南渡徙居浙之臨安曽祖仕元漕運百戶居武清漕運之子蔭補樞密院副樞入國朝棄官歸占籍海豐實佐之祖先人父也先人穎敏好學嘗從遊於張潞公仲舉之門經史百家之書靡不通貫而尤邃於易洪武壬子膺明經薦典教濵州未幾懇辭歸飬性至孝而仁恕副樞翁既老遘疾熱極思冰飲時暑月不可得遣人逺致之比至已告絶矣遂痛恨誓終身不飲冰有盜劫其財貨殖逾千金其後盜事覺被獲東光東光召先人歸其財僅半之縣官問如數否曰如數悉以散給里之貧乏及死而不能具棺斂者宣德辛亥二月五日沒年八十葬邑城之外西南先塋之次先母里人也孝敬慈仁本乎天性曽祖某祖某父士文蘇州守三世皆有賢德後先人十有五年年九十沒實正統乙丑三月十九日也先人以不肖得推恩始封文林郎吏科給事中進封嘉議大夫户部右侍郎贈資善大夫户部尚書先母自孺人加封淑人贈夫人子男二人長即不肖佐也次佑女二人長適莒州知州胡璉次適杜瑛孫男十五人女十一人曾孫男女十有九人先人老母之始終大略如此先生其以是銘豫與公交久而善誼不得辭而公廉慎寬厚為大臣有名能顯揚其親疊膺褒嘉之命而二親又皆以壽終是故可銘也漕運諱拳副樞諱均讓大夫諱朴字子素夫人姓靳氏葬以正統十年某月日也銘曰生同堂死同藏先塋之傍誰敢壞傷順天府丞朱公墓志銘正統乙丑六月九日吾友華亭朱公年七十二以沒嗣子奎奉翰林修撰姑蘇張士謙所為公事行來請銘公與豫同年生月日後於豫公魁梧竒偉雖老議論慷慨意氣超然而豫老病侵尋言語行步不逮公逺甚嘗與公言我必先公沒其以後事相屬公笑曰未必然而傍人聞者皆以豫言為然嗚呼安知公之死乃先於我也耶公今亡矣不可以復見矣慨想疇昔慟不可忍尚忍為公銘耶雖然公交之久相知之深則銘非豫為而誰宜為乃敘而銘之曰公諱寅字孔暘别號雪庭曾祖某祖某父孟仁以公生而穎異讀書有文學尤通六書有晉唐人風永樂中膺薦至京奉詔入翰林得縱觀祕閣所藏古名賢法帖而其學益進與雲間沈先生民則等八人者同擢為中書舍人太宗皇帝巡幸北京公預侍從營建宫殿禁扁皆公所書永樂辛丑正旦上御奉天殿受朝賀明日詔吏部升公翰林編修賜賚優渥仁宗皇帝素知公名即任之初見賜金繡衣一襲慰勞深至宣宗皇帝留心文翰日侍內庭纍承衣服白金之賜時遊內苑命乘騎以從賜燕於萬嵗山應制賦詩輒先就今上皇帝緝熙聖學屢應召書大字賚豫甚厚升通政司參議三殿重建復書禁扁賜綵段楮幣升順天府府丞今年春二月得歸省先塋到鄉未三月而竟以疾沒於鄉人某家公無田於其鄉無居第於其府無叔伯兄弟之親以相助徒以先塋久欲歸灑掃以盡追逺之忱而奄至大故嗚呼其可不悲耶配井氏封孺人側室謝氏子男一人即奎也女一人尚幼公孝弟有行義母患病百藥不效晨起焚香祝天刲股間忽有一人授良方服之即愈兄孔昭以詿誤當逮挺身代行後事卒得白鄉人馮章母死不能具棺斂公買棺買衣衾助之有某遂者得福建典史貧不能行周以冠服資遣之人有寃抑不得直於法司者公為言之必直而後已其人來謝拒之曰汝去我非獨為汝也公性雖抗直而意度瀟灑家有小樓客至必延坐其中觴詠終日極歡而罷能别識古今名畫又善作山水幽趣枯木竹石尤極其妙好吟咏所著有雪庭集藏於家墓在塘橋金山之原先塋之次銘曰天賦才賢固將有為既底於用用無不宜四十餘年不竟其施公望巍巍而止於斯九峯五湖山水清輝蒼松白雪悠然以歸塘橋金山神遊在兹後者不知觀我銘詩國子監丞永嘉李君墓志銘正統十一年丙寅春三月清明國子監丞李君上陵陪祀早行踏空失跌傷其左足輿歸至家君舊有消渴疾醫者誤用藥動其舊七日而死是月九日也死之日豫與司業趙先生以下往弔哭之慟比小斂大斂凡三往哭之不知其淚之雨下也未死之前四月其弟禋與其子鐸奉其母命來省之母孺人年已八十餘矣豫嘗慮其以母憂去而不虞其死也今孺人無恙而君先死其誰以不悲豫以非才領教國子恆苦事不治賴君得少事一旦遽失之是豫失右臂也豫之悲又安能以不慟耶禋將扶柩歸葬來求豫銘君墓耶雖然君在以豫為知己每盡心所事豫亦委以心腹於其死也銘非知己其誰宜為乃不辭敘而銘之曰君諱廣字叔宏别號魯庵溫之永嘉人曽祖銘祖寧父彥辰皆不仕母杜氏君初以鄉貢進士掌教汀之連城以外艱去服闋還朝擢國子博士應薦遷監丞至是卒年五十一君凡三娶初娶方氏繼康氏葉氏子男六人欽方出也鐸鋭側室黃氏出也女二人其二出適陳容吳道演其壻也餘在室葬邑之吹臺鄉瀘灣之原祖塋之次與康孺人同兆焉嗚呼君其死也耶豫念君猶未死也豫聞君在連城時邑宰為民所誣御史鞫之罪當黜君力言於御史曰邑宰賢明不宜黜厯道其所以然御史果亷得其情誣者竟抵其罪其正言感人有如此者嵗旱民飢吏無所措君曰學糧尚多可以賑濟古之循吏有開倉賑飢不待報者公何懼而不為令從之民終以不流冗其仁心愛人有如此者許氏子聰俊邑令逼為掾君曰此非掾才也勸令以補弟子員其後果以禮經魁鄉薦由是連城士子始向於學其善教及人有如此者前太守何公為秋官侍郎欲薦君為令堅辭不就其恬退之節有如此者為博士諸生有以束修來見者受之及為監丞輒戒門以絶諸生莫敢以私謁見貧乏艱飢者必思所以賙之其取與以義有如此者在官有不足嘗取給於其家其母亦嘗絡繹寄遺以副其意曰但守官慎無慮不給君亦感其母之言業業自持不敢妄有所為分外事嗚呼孺人可謂賢母君可謂賢子也矣是故可銘也銘曰有德有才有守有為不竟其施而止於斯吹臺之鄉瀘灣之原墓石有銘永世不刋禮部郎中陳會鼎墓志銘會鼎故人贈禮部主事陳君迪簡子也迪簡慷慨有志操豫為進士十年而迪簡沒迪簡沒後十年而會鼎為進士二十年而亦沒嗚呼方會鼎為進士貴顯時不能無所感焉迪簡與豫垂髫交於鄉而會鼎與豫並肩立於朝會鼎富於春秋而豫迫於暮景豫之有望於會鼎雖不言會鼎當自知之非惟會鼎知之鄉邦故舊蓋莫不信其然嗚呼又安知會鼎竟先我而沒也耶會鼎沒後三年其子進來京師奉監察御史萬資中所為會鼎行實請豫銘嗚呼迪簡豫銘之今又為會鼎銘其不尤可感也耶雖然進豫子壻也為子壻而求其父銘安得辭既不得辭則敘而銘之曰會鼎諱鉉會鼎其字也以字行姓陳氏陳氏之先自江州徙袁之石分若干世至某贅常豐溪某氏其後子孫因居常豐曾祖惠存祖環中皆不仕考即迪簡母彭氏封太安人教育之遣從師習舉子業躬紡績給其費能自力於學學遂以有成永樂庚子領鄉薦甲辰登進士第奉詔績學於家戊申召至行在擢禮部主事明年往河南督取軍匠立限期利害無一人敢後者繼往南京封諸畨貨以能為內臣所重陜右廣西二處官軍征討有功賫金帛往賚之至甘肅數日所司寂然時兵部尚書柴公為侍郎參贊軍務君問何遲滯如此公曰軍數功次不清切會鼎召吏取文書閲之曰此半晌事耳為之定規畫指授方法不終日而數以成無分毫差失自大將以下皆敬羡歎服各設燕致禮幣以贈悉郤不受至廣西守將山公請厯各營給賞之辭不往公曰他使至者皆求欲往吾不欲其往聞朝使公忠正大故煩一往使夷人知朝廷有正人君子亦馭夷之一益也會鼎曰吾奉命賫賞至此以付公公宜自處之無預使者事若往是圗利也為制在朝廷公遂不敢強及還公贈綺幣一端君辭公曰前此禮送使皆出三司吾無與焉朝使來深慊鄙懷古人有傾蓋若故者今豈異耶此非贈使者贈故人也豈宜辭君遂受之及還又出郊餞偏裨皆曰我公未嘗待使如此厚也亦嘗對人言吾受人物惟此耳正統戊午秩滿遷禮部郎中分政南京時五羊陳公為侍郎與論事無不當其意深加器重庚申太安人沒守制於家服闋將還朝偶得疾竟至不起癸亥正月九日也享年四十有八娶劉氏子男四人長進次輔次復次艮側室李氏出也女三人其二已出適一尚幼其年十二月十有六日葬廬陵某山之原先塋之次銘曰英賢出世苦不多不多不久其奈何胸懷磊落星宿羅才文浩蕩輸江河少年盡喜登甲科貴躋郎署無奔波處闕平不頗麒麟飽食玉山禾官間公府從逶迤四十八年如擲梭忽然遺世歸山阿青山緑水煙景和神此中藏安且那萬百千嵗誰敢呵後有來者此經過興懷慷慨淚滂沱桑田為海山為河清名垂世永不磨大僕寺少卿沈公墓志銘公諱升字志行杭之海寧人永樂甲申進士於時太宗文皇帝初即位欲作新士習命選進士之有學識者入翰林改庶吉士讀書祕府所以期待之意甚厚得二十八人而公預焉壬辰秋上特以刑部刑罰不清殿召公等十有二人皆授刑部主事甲午冬命修五經四書性理大全書成受厚賚丙午以失朝改行人未幾復其職丁酉升員外郎授奉訓大夫戊戌拜四川布政司參議以外艱去服闋還朝改河南參議奉命往蘇州等處參總兵官都督陳敬軍事乙卯春召還拜北京行在大僕寺少卿授中順大夫已未賜誥命進階中憲大夫勳贊治尹在職十有二年年七十一正統十有一年丙寅二月十八日以疾卒父明逺贈太僕寺少卿母葛氏繼母錢氏妻胡氏皆贈恭人繼室張氏倪氏解氏子男一人曰昶張出也女四人二出適二在室公沒時唯解氏與幼女在側族弟寧為府學教授亟召曰汝為我狀請國子祭酒銘我墓我瞑目矣遂卒是秋昶自家來迎公喪歸葬趣豫銘永樂初公率衆言巡狩事方朝會讀奏於廷百官聞之駭然驚異以為此大事豈易言之而大宗皇帝獨喜命廷臣即議行之在刑部持身慎行守正不阿居方面得大臣體採木植山中有調度人用不勞在蘇州時有鎮守內臣恣意暴橫虐人人以不堪然皆畏其勢莫敢發公上章屢劾之不報遂極言其所為僭妄不法事具有據且曰今不預制之恐後將有不勝之患辭甚懇切宣廟竟召之還其害遂己兵民皆歡抃稱頌凡此皆人所難能者豫意其必大有為也而忽焉以死惜哉銘曰大木十圍其蔭百里河流湯湯到海而止不極於海不蔭其隂言念君子邈其德音茫茫海昌青山流水我銘公墓莫之敢毁吉安府學司訓李先生墓志銘正統己未有李氏子曰淳奉吾友前秋官主事劉君子欽所為其尊府之狀來請曰先人沒草有三年而墓未有銘不肖已具石願先生賜之文刻而追納之墓中以慰先靈地下幸無辭辭不獲則序而銘之曰先生諱嶽字伯髙其先居吉之吉水後徙郡城今為廬陵人曽祖良叔祖華道皆有隱德伯父庭蘭仕元太醫院判父庭賔天臨教授三子先生其季也性穎敏而好學十五六時工為詞章鄉先輩皆竒之既長益肆力於經術文翰俱美與兄伯逵伯逺齊名時稱李氏三鳳居家有孝弟之行處鄉黨以德義見重有忿爭不平者不之官府相率質平於其門教授邑里子弟多所造就嘗卜别墅於郡城之北螺岡種竹萬竿藝菊盈圃書陶靖節詩於四壁興至則舉觴詠歌悠然以樂士大夫稱為陶軒先生而不名永樂丙申郡學官缺太守強起之上京師遂拜司訓之命到官益嚴教條士子爭嚮於學明年賔興廣西藩府禮聘為考試官以有子喪卒不果行未幾以疾沒丁酉八月九日也享年五十有五先生凡再娶皆周氏子男五人長曰昌誠先卒次昌誼即請銘者次昌信昌謨昌訓女一人以是月十一日附葬五峯菴母孺人塋次先生有學術有節操足以為世楷式而今不可見矣後生小子無所取法觀於此烏得不為之起慕也耶銘曰人誰無學而或無行誰無兄弟而或不競嗚呼伯髙有賢弟昆有學有行無愧古人惟古之人何必多壽銘以昭德永垂不朽陜西行太僕寺丞郭君道昌墓志銘陜西行太僕寺丞郭君道昌沒其子瑞至京師以其父喪南還而徵銘於豫因念昔與前國子上舍彭紹魯同逰學道昌所居鄉多大家道昌耿介少還往所與相還往者獨紹魯耳故豫因紹魯而識道昌此鄉故蓋舊且久也道昌之所以得入郡庠為弟子員亦紹魯之力也道昌既入郡庠篤志於學貢於成均永樂癸卯授大理評事以寬平得最績致褒嘉之命以及其親任滿遷擢北京太僕寺丞道昌性剛而直衣服飲食好精潔待賔客必豐厚行事任己志不受人言亦無所阿比於人以是得名然亦以是忤於物遂有陜西之命在陜西持身守官處事接物與在京師時斬然而異故聲譽大起韓王聞其賢甚敬重之正統癸亥春來報政天官以疾沒於靜海正月二十有六日也享年六十三父貴宗以道昌貴贈大理寺右評事母贈孺人子男三人璉瑞理女四人以某年某月某日葬某山之原嗚呼永樂初豫哭紹魯於南京三十餘年而又哭道昌於北京人生幾何出處死生乖離之感至於如此豈不可悲也歟豫前年暫還故鄉訪紹魯之故居荒煙野草欲求其倣佛不可復得道昌歸靈爽不昧追念疇昔抑又可悲也矣豫為之銘非以道豫之悲亦以泄道昌之悲也銘曰嗚呼道昌其死也耶仕宦數千里外報政天官而死於此也耶天賦聰敏之資磊落之才終以一太僕丞而止也耶嗚呼道昌其不可悲也耶雖然世有負其才技而不沾一命者矣有始雖榮顯而終以不令者矣道昌厯官二十餘年得正而斃亦可謂榮幸也矣嗚呼道昌楚山峩峩楚水泱泱誰卜爾兆我銘爾藏福爾後人以延厥慶錦衣衛指揮使王公墓志銘公諱節字尚節其先山東濟南之鄒平人曽祖某父成洪武初從軍𨽻燕山右護衛既老疾公代其役太宗皇帝舉兵靖難纍功升旗手正千户調錦衣衛永樂甲午從征沙漠以功升指揮僉事賜以銀兩綵幣仁宗皇帝特升指揮使欽給誥命子孫世襲以正統元年十月二十八日以疾沒將以某年某月日葬於順天府大興縣某村之原公有子二人長曰某次曰某皆幼女一人適彭城衛吳亮其同寅指揮僉事孫景亨自幼與公善書其平生來請銘公容貌溫和處心忠厚寡言笑薄滋味衣服朴素不尚華靡雖貴顯泊然以居門庭寂如家雖貧窘見親戚故舊有凶喪患禍不給者竭力以濟之為千户時嘗署鎮撫司推鞫獄囚務究其情不任己意歷事四朝小心慎密仁宗宣宗知其亷勤端恪待遇之甚厚公退慊然自處不為驕貴之態與人交歡然無所忤而不可干以私沒之日寂無餘資遺戒薄葬母作佛事是皆可銘也銘曰惟德之茂以有厥後惟吉之藏永世其昌巴陵程大尹墓志銘公諱式字邦憲姓程氏世家饒之浮梁沈毅簡重聰敏過人自幼已歧嶷不羣一日與其弟行遇邑宰宰見其俊爽叱曰誰家兒敢嬉遊通衢且命從者執以來公聞輒奔走執其弟詣宰公回顧知之即還詣宰曰此吾弟也懼明府驚悸喪其心故還初意明府有以進教之也乃非禮陵之使恐懼不知所為豈為民父母之心哉宰顧左右笑曰吾姑試之耳兒果可教遂禮送去邑庠補弟子員公既感宰之知己也一志於學學遂以有成洪武丙子領江西鄉薦入胄監整軍河南有聲竣事還待選天官尚書張公紞見其瓌偉進之與言而喜公初名超字德超特為改今名與字云授湖廣嶽之巴陵令振頺俗革弊蠧多所紛更上下初不甚喜久而人便之事集化行先是軍衛縱暴縣不敢與抗及公至皆戒斂迹民有健訟者恃故態贓誣里胥里胥將誣服公拘其親屬置别令各具贓物色輕重果互為異遂辨其誣洪武末數上書言事不報乃懇求教職會藩郡交薦不得請調澧之石門石門俗朴野行數十里不聞絃誦聲公至為之興學校之教厚生徒之餼蠲士人之徭行鄉飲之禮由是民漸知學而俗日以美其所施務安靜人或詰其異於巴陵曰為政何常取其宜於民而已豈有異哉未幾終以前請教職故左遷欽州吏目州有羣盜殺人沉尸於江以滅迹獄久不具衆議釋之公曰不可獄宜寬乃間行得其實盜乃服辜島夷叛藩臬檄他官往招者數輩多覆實復命公往猝與夷遇矢石交下公直前大呼曰吾欽州程某也來與汝衆請命朝廷安生業耳乃羅拜公諭以禍福卒使歸欵聽約束而還由是二司與州郡以賢良交薦丁內艱不赴內弟典庫藏虧貨公坐纍謫順天之楊村驛凡六載始歸邑宰復以明經舉至京師以疾卒永樂甲午二月二十日也享年五十明年某月某日葬邑西勾瀾灘畔將以宣德某年月日改葬邑之某鄉某里某山之原曽祖某祖某父聞信俱不仕公凡再娶朱氏唐氏子男五人長鑽次鋌錔鑰釧女三人孫男七人女三人公子學該博雖老手不釋卷隂陽律厯星命卜筮釋道方伎之書莫不涉獵其為文簡淨詩尤清婉性至孝母孺人嘗遘疾醫藥弗效每夕潔齋露身禱於神明乞以身代母病果瘥聞信公沒隂陽家謂不利三年後乃可葬公曰士三月而葬寧顧利不利卒葬之治喪不用浮屠一遵文公家禮訓教諸子必由禮義無詐妄之習故錔以明經第進士為茶陵令得名於時公之教也錔以事至京師奉其從弟道興所為狀來請銘銘曰有德有才可與有為絃歌小邑不究其施其施不究而又不壽天道可徵仁者有後卜吉改葬以妥靈神靈神既妥其佑我後人鄉貢進士蕭不敏墓志銘不敏諱愚姓蕭氏不敏其字也其先世居湖廣曰文昌者避馬楚之亂徙居廬陵之曲山六傳至耕道宋開禧進士廣之仁化令曽祖以萬舉博學宏辭一不偶輒絶意仕進獨好淵明詩有和陶集祖復心父樂存皆不仕樂存嘗從進士王子讓學詩經以詩經教授於鄉二子不敏其長也資性淳重穎敏年十三已能屬文辭為時輩所稱道既長博覽強記日數千言聖經賢傳諸子百家之書多所涉獵而尤邃於詩蓋其家學也尊府欲遣遊邑庠不敏跽曰不肖侍大人幸居長逸身於學家政之勞其誰任之尊府不之強命次子時中入為弟子員永樂辛卯時中擢進士第一人入翰林為修撰而尊府沒不敏哀毁骨立葬祭以禮時中歸守制兄弟自相師友事其母以孝聞嵗甲午不敏舉於鄉明年上禮部至期太宗文皇帝命時中為考試官時中欲以嫌辭不敏力止之曰朝廷取天下士以備於用豈可以我一人避嫌而廢公義也且我之來迫於有司之命老母在堂獲歸承菽水之歡幸矣竟投狀禮部去士論偉之既歸從學於門者曰益衆每秋闈榜出人輒指數曰某與某皆蕭先生門人也嘗痛其尊府早逝時節忌日薦奠必哀對食偶豐必泫然流涕曰安得以奉吾父母也時中沒教育其孤無異所生平生未嘗與人爭論是非有遇以非禮不與較輒為自咎而已其人聞自悔服癸丑秋九月遭母喪水漿不入口者六日幾絶而復蘇由是得疾明年四月二十一日沒得年五十有四配周氏有淑德子三人長維禎宣德庚戌進士次經次綸女三人孫男一人孝孫女二人維禎第進士奉命績學於家所以教之立身持己為政治人之方委曲切至維禎既承召還朝將有職任之榮以致祿飬而不敏竟沒豈非其命也耶維禎將歸以某年月日葬不敏於某山某原奉太官署正萬節所為狀來請銘古者四十始仕孔子曰學而優則仕今之仕與學庚未至而汲汲焉求進之不暇茍得之則侈然自足如不得焉不復計其己之短長而惟怨尤於人者比比是也然則學足以髙於人言行足以信於人鄉黨推之有司薦之退然自守窮約至於老死而無悔若不敏者可不謂君子歟是故可銘也其平昔所為詩文若干卷詩傳集講若干卷藏於家銘曰其學之充兮不獨以成乎己而又以成乎人其積之厚兮不惟以裕諸己而又以裕其後昆惟仁是尚兮惟義是遵惟天爵之尊兮足以潤身果孰為貴兮孰為賤貧嗚呼不敏雖死猶存謝同知墓志銘廬州府同知謝公考績至京未十日而卒卒時其嗣子禧在側既殯殮將奉柩以歸葬持翰林侍講邢寬所述公治行來請銘按狀公諱庸字孟常四川重慶之忠州人曾祖某祖文才元某路通判父必先母某氏性穎敏有學識永樂丙戌舉進士不第入為太學生癸巳授河南道監察御史庚子山東妖婦聚衆為盜三司不能制既置諸法詔簡廷臣之才賢者往任方面公膺薦為按察副使命殄餘寇公以計獲驍賊劉信者械送京師尸諸市餘黨散落悉就擒永樂丁未報政入朝奏對不稱旨遂有廬州之命到官以興學校督民耕桑為務寬厚之惠屢施於上暴虐不及於民民甚安之宣德十年七月五日以疾卒於北京之寓館享年五十有四娶韓氏子男三人長禧次禋次祺孫男二人女三人某年某月日葬於鄉之某山某原公剛介亷慎才器過人為御史守法持正不避權要禮部尚書呂震寵遇方隆人不敢近公糾其不法數事中官有恃寵靸履上殿者公劾其不敬上欲宥之公執不可左右皆失色太宗曰御史言是也在山東上言官軍捕盜逮及無辜願罷捕兵以安其人詔從之廬州所得俸資以新學舍飾神祠購書籍以奬勵學者而所居蕭然歲歉輒出巡省發倉廩貸民粟貯之寺觀祠廟計口給之民以無飢及公上京師民數千人訴於巡撫官乞遷公郡守以終厥惠奏至未幾而公竟卒嗚呼豈其命也耶抑其民之不幸也耶銘曰謂仁者壽何不耄期謂命有德何不隆資人望攸歸而止於斯有以張之庶其在茲晚圃處士墓志銘闕有處士晚圃翁沒已三十有六年矣其孫暘谷司訓璉秩滿來天官始撰次處士行實請銘於豫曰先大父沒之明年璉父以閭右徙實京師不肖亦隨徙補郡學弟子員忝領鄉薦得外校官故於先大父之潛德有未暇及恆切痛心謹述其大略乞銘於先生使先德不泯以垂無窮佩惠其敢忘豫感其言遂序而銘之曰處士之先本曹姓武惠王之後自南渡徙家廬陵其曽大父曰士昌者娶梁氏梁氏無子子孫遂冒梁姓大父壽可考以清皆隱弗仕以清客遊廣西因亂離留不歸及京朝平定海內處士跋涉險阻往迎之以清見處士至喜甚即日治裝行未上道以疾沒處士以不能遂其意哀毁幾絶或慰解之曰父子相見而後至此亦足矣使未見而先沒奈何且死生有定命公不聞惟送死足以當大事乎况在萬里外可不自慎以全孝道耶處士悟遂杖而起殯殮訖扶櫬歸葬以幼子尚留廣西復往挈以歸一門之內數百指相與歡然無間言平生不事華侈教子弟以孝弟敦厚為務待人一於誠信言語雖抗直而心氣和平常夜有盜入其室覺而執之家人欲置之死處士戒諭之曰汝所為殺身之事吾釋汝自今宜改悔盜感謝而去不復為盜處家勤儉自足雖老不少自暇逸尤好治圃種菊數百株花時邀賔客賞玩酣飲淋漓輒誦韓魏公莫嫌老圃秋容淡猶有黃花晚節香之句因以晚圃自號云永樂戊子正旦晨起家人行禮畢曰吾身飄飄然其歸矣乎舉家驚怖求醫藥悉拒絶之至夕奄然而逝享年七十有餘處士諱榮字志英娶王氏有淑德先處士卒子男二人長庭桂次庭椿女三人皆嫁為士人妻孫男六人長即璉次鏞鐸鉉鉞曾孫男十一人墓在里石臼之原銘曰塘東有曹今幾世實曹武惠王後裔從來南渡徙居此傳至於開有三子伯驤仲南武其季並以眀經同擢桂厥後士昌室梁氏冒梁之姓為梁嗣子壽可隱德不仕至於以清生處士賦性聰明貌豐偉處心接物甚和易恬淡無求亦無忮居家孝親訓子弟一以誠敬與仁義取適園田樂樹藝逄迎賔客遺世事享壽考七十有四正月元旦奄然逝坤元之山艮之水下錮九泉靈所止刻銘斯藏告萬祀素軒毛先生墓志銘君諱靖字安行姓毛氏常州武進人本業儒從遊今禮部尚書胡公之門受易經後以家學郡大夫辟為其府隂陽正術其為人恬淡不務華侈儀容端整言論謹恪事父母極孝愛母沒奉繼母陳氏如所生撫二弟友誼甚篤待宗族恩意周備族子姪有幼孤者收養教誨之與已出無以異比長為婚配築室以居之鄉人窮乏不給者周之惟恐其有餓殍後部使者聞其賢嘗屬以監獄事有二人爭訟繫獄一富一貧貧者病富者以白金五十兩賂君令勿容醫入視疾且阻隔其飲食欲置之死君厲聲叱之曰爾獨不畏官法且置此人死無難其如人心天理何輒令醫與之藥且召語其家人時具飲食貧卒賴以全活晚年益好間靜築一室無雕鏤繪飾環植花卉日吟詠其中號曰素軒一時皆以素軒先生稱之正統八年癸亥六月十有四日以疾卒於官享年六十有一配葉氏子二人長玉辛酉鄉貢進士績學成均次尚幼女五人君卒時仲弟端方為安吉令玉在太學惟季弟宏經理其喪玉聞訃將歸襄事奉國子司業趙公所為君狀來請銘君之先世居真定之元氏五代時有諱某者以儒起家仕後唐河南刺史厯晉漢周以至於宋代有聞人中更亂離譜牒亡失漫不可考髙祖某元將作院使曽祖某常州路推官子孫留家武進遂為武進人祖某國朝邵武同知同知三子長某山東道監察御史次某稽勳郎中季某號蘭竹先生君之考也蘭竹幼警敏同知君嘗曰是兒慧過人第恐非壽者相術者云有疾可延後果目疾失明嘗曰吾目雖不明吾心未嘗不明乃專意數學以人生年月日時推其貧富貴賤壽夭無不中尤精於潛虛有問者斷其吉凶悔吝禍福不失毫髮由是名益彰聞永樂中有薦之於朝者太宗文皇帝召至京師屢試之無不驗甚寵待之顧謂近臣曰此袁天綱也因問卿幾子有能讀書繼其業者否答曰臣有子為隂陽學官頗知書但迫於有司差委無暇於學帝即敕有司無差君以他事君既蒙恩詣闕謝召見便殿與語謂之曰此子非無用才待君百嵗後有以用之未幾蘭竹以老疾辭歸而文皇亦上賔由是君竟沉鬱下僚無復有能薦之者卒不得顯聞以死豈非其命也耶墓在鄉某山某原其葬以某年月日銘曰荆璞之琢不為瑚璉其美未施其遺則逺彼貴而夀名有不聞沈鬱下僚而道則尊膴膴髙原松柏之茂既固而封克昌厥後劉處士原舉墓志銘原舉沒之十五年為正統元年其子德在北京來謂豫曰先人葬未有銘不肖欲得先生銘歸而勒諸石追納之墓中以慰先靈地下為不朽圗先生與先人交厚必不吝銘之豫姑許之明年夏德將還以署正萬節之狀來趣豫銘乃敘而銘之曰原舉姓劉氏諱凱原舉其字也劉氏為邑著姓其先自漢長沙定王發分封次子禮於安成因家焉有曰德言者南唐時率子弟保障鄉里後以其兵歸宋仕至水部運使南昌郡男子孫皆官父蔭六世至溥以五舉魁天下由溥之孫曰安世清純兄弟父子祖孫聯登科第時宰表其門曰叢桂因號曰叢桂劉氏竹西翁定宇君大父也元進士宛平令仲炯隱士叔璋伯父父也君繼其世德之美生而穎敏魁岸竒偉美鬚髯善談論諳練世故識達人情鄉里有忿爭不平求之於君君一言折之無不聽從官府有疑事不能決者質之於君君為處置而行之鮮有仆敗嘗為賦役長以已資輸逋二百餘石又為里役適造版籍鄉豪欲賂之詭寄田糧堅郤之與鄉人張其姓者坐纍被繫一日張遘疾危劇衆皆懼不敢近君曰同處患難而不相恤非義也扶持之不離側又為出資以求醫藥卒賴以安里有誣搆仇家三人罪至死獄成矣君謂令曰是獄有寃令曰前宰已達上司矣君不忍其無辜也資遣其家人赴訴京師卒得白嗚呼君之才智如此茍有能薦之授一職而致之官理則其惠之及人豈止此哉乃卒不能得而浮沉里閭以死獨不可哀也耶君凡再娶皆彭氏子男六人長裕次理早卒次憲雲次憲政次憲髙次憲偉鄉貢進士未第而卒孫男九人壬寅十一月三十日以疾沒於家享年六十有三墓在其鄉禾場嶺之原銘曰安成之劉沛國裔始自長沙發子禮有曰德言南唐際率子弟保障鄉里以兵歸宋宋所貴水部郎官轉運使子程吉州服官理邑有劉氏始於此父子祖孫襲科第立榜門閭曰叢桂至今鄉邦數門地曽祖才翁祖定宇父叔璋甫皆遁世處士之生繼其杫美髯長身復英偉鄉稱孝弟與仁義仁者宜壽福無已云胡六十有三止南離之山坎之水卜云其吉窆其趾踰百千祀莫之毁安爾之藏祐爾嗣周處士添祥墓志銘處士諱禎字添祥姓周氏靜樂其别號也周氏之先世居吉水之泥田宋御史中丞訓始析居安成之城中五世至鑑遷於髙村塘髙村塘即今之橫礱也鑑生安國安國生銓銓生容容生天瑞天瑞生獻可獻可生仁夫處士曽大夫也仁夫生晉翁晉翁生良能處士大父父也處士生而聰慧體頎而貌豐美髭髯聲音洪亮辭氣溫和見者莫不敬愛之早失怙母駱氏教育之既長遭家道中微卓然能自振拔樹立以不墜厥先緒事其母極孝生事葬祭皆盡其禮無遺憾異母弟隆祥幼撫恤友愛之意極至出贅外姓及沒歸其子鞠之如所生既為婚配割産業築第宅經營園田以居之族曽孫思理孤貧來相依撫育之成其家室撥田地與之而後命歸其宗泥田初祖祠墓損壞雖老猶率子弟往拜掃修理完備而後歸女兄以歸寧卒棺斂葬之外母遭亂寡居迎養於家始終無怠意甲寅嵗歉逺近閉糶獨發倉廩賑貸鄉里賴以不飢嘗為賦稅長征斂以公不分內外十餘年官無逋負人無怨咨一日翻然曰豫老矣何為久役於人遂懇訴於官得代輒削迹城市日與賔親遊山水間以自適曰塵俗之事不關吾心則豈不樂哉因以靜樂自號預卜善地作壽藏凡棺槨殯斂之物皆具正統九年九月七日以疾卒享年七十有六娶王氏無子以族兄濟南府經厯寬居仲子孜穀為後娶彭氏生子勵穀早卒孫男三人長曰章次曰郁今為縣庠生次雍女五人曽孫男三人某年十月十九日葬順安鄉石魁山之原葬之後六年孜穀與郁奉中書舍人劉鉞之狀來請曰先人葬未有銘願先生賜之銘將追納之墓以慰先靈地下不勝其大幸豫曰豫與尊府交知其為人中書之言不誣也是宜銘銘曰橫礱之周自泥田來居安成知幾年御史中丞訓始遷五世至鑑徙髙村厯世益逺族益蕃至處士生才且賢美髯頎秀思飄然遭家中微厯險艱奮自樹立志益堅家居孝友世相傳情孚宗族義亦敦胸襟瀟灑誰與肩有子有孫有田園足以貽後光於前老來世事都不關煙霞泉石縱遊盤達生知命樂其天超然而往不復還青山白石銘以文千秋萬古長不刋彭隱士同升墓志銘先兄恆心先生有友四人其一蒼山彭君同升先生餘三人者相繼亡歿惟蒼山翁隱居不輕出入獨來執紼送兄葬豫因得一見時年已七十三矣而康強精健勝少壯人豫謂翁宜有壽豫致仕歸必當得再相見以盡下懷及今年豫得告老將辭朝而翁沒於家竟不獲償此志嗚呼慟哉既歸翁之子貫進唯自述翁行來請銘嗚呼豫方悲翁之不得見尚忍銘翁墓耶雖然翁與豫兄弟交自幼至老始終之誼不可辭遂敘而銘之曰翁今為智溪彭氏翁之彭本出東街與智溪不同宗其尊府復安與智溪伯樞同壻於里之劉氏伯樞無子欲擇於同宗無可其意者見翁少穎異遂螟以為後兩宗之先世多顯宦富盛代不乏人翁自幼讀書循道理居家持門户不肯為非義年十五六二親相繼傾逝孑然奮自樹立會官府有重役他皆亡避翁獨往役比畢事歸而藩府符下凡避役者皆謫戍邊人以是服翁之識達有妄人誣以姦黨人皆危之翁不以為意及至官反覆明辨卒得白而歸既歸資産蕩然殫力竭慮辛勤以自植始得復其舊而年已老矣家事以付諸子退隱於所居之後蒼山之陽顔其楣曰蒼山隱者客至輒觴詠纍日而不厭或曰翁孝弟人也伯樞晚年妾生子理疾革指理謂翁曰以子纍汝翁泣曰不敢違命伯樞沒撫理恩意備至既長延師教之為之婚娶後出商客死於外謀歸其喪撫其遺孤子紀至成立析家業十之六以優恤之自出繼時其兄性善季清皆在後相繼淪沒俱無後翁嘆曰吾本宗可使不祀耶既命二子繼二兄之後别置田園築室於隱居之旁俾居之以承其祀與其從兄務威相與尤盡道所居離隔若干里嵗時必相過談論欵留纍日極歡而後别始終無間言翁尤好施與常貯藥物於家有病者即與之宗族及里之貧不能葬者輒施以棺配孺人郭氏分宜人性端淑寡言笑務勤儉躬紡績理中饋皆有成規其所以相成翁教子之意尤篤生子男六人曰義遜德貫即求銘者以進士授刑部主事拜浙江按察僉事皆郭出也曰智明側室李氏出也女二人長適樂清知縣伍冕次適劉良孫男二十人女九人蒼山翁六世祖國子上舍髙祖某曾祖悅翁祖芳遠父即復安此其世也銘曰智溪之陽官山之傍惟山蒼蒼惟水泱泱昔也同堂今也同藏神之安之厥後彌昌褒崇之榮九原之光惟昌惟光惟德之宏後來不知視我銘章長陵衛指揮僉事錢公墓志銘長陵衛指揮僉事錢公殁將葬其嗣子某因欽天監監正彭德清來請銘拜且泣曰先人在時嘗言先生於不肖自居長陵衛客有京師來者輒問先生安否故不肖雖未識而耳熟先生蓋有仰慕之心焉先人英偉慷慨有智略嘗欲立功名當世而遭遇聖朝纍聖相承四方無警無所施用賫志以歿聞者傷之今葬有日願得先生銘以葬先人有知將不悼其不幸而慰安地下以蔭佑我後人則皆先生之賜也感佩其忘乎豫既悼公之殁又重其子之請銘其可辭按錢氏世居應天之六合曽祖某父伯源好善樂施鄉里稱焉公諱某生而穎敏少有大志年十二喪其父哀毁如成人事其母極孝愛姻親父老見者莫不重之知其必將昌大其門或歎曰伯源可謂有子也後以戚屬選為散騎舍人洪熙改元升錦衣衛指揮僉事宣德初調長陵衛持己謙慎蒞政勤能愛惜士卒處事咸得其宜無矯激躁妄之失暇則遍遊山水以自娛嘗曰吾得飽觀壽域龍鳳盤蔚之雄亦足以自樂矣故沒之日人皆惜之而哀之者衆也娶某氏子男二人長某次某女一人宛平縣香山梅厰之原其葬處也宣德八年十一月草七日其葬之期也銘之曰巍巍壽域山川攸萃職僉衛司實居要地靜觀龍虎保制山陵與國同休坐閲太平梅厰之原卜協龜筮窆者為誰故錢散騎劉逸士志達墓志銘逸士諱適字志達松坡其别號也姓劉氏晉安成太守遐之後遐為安成太守子孫因留居城西之下村七世至拱辰仕宋文州文學參軍罷官歸徙下村江北之樟塘今所居是也高祖孚先南昌府學教授曽祖繼屬祖存忠父子善皆隱不仕逸士生五歲而子善沒聰慧異常兒既長好讀書學問常從復古謝先生遊於名山勝境登臨唱和窮嵗月忘返以是學日益進詩名日益以有聞事其母極孝謹與二兄處友愛尤篤及家纍既衆兄弟欲分異其財産惟二兄所處一無所較長兄志楨惟一子未周及病且死召逸士與語意欲謀所以繼嗣者逸士曰兄有此子在弟雖不才不敢悖德志楨亦喜曰如此則吾瞑目矣從子彥政永樂中坐纍謫戍南丹涉險阻冒瘴厲送之直抵配所經營宅舍俾安居而後返族有貧窘不給婚喪無措者皆周濟之族兄惟章以所藏李懷琳嵇康絶交書付逸士重捐白金酬之以其貧也武士史仲和貧苦篤學好吟詩而樂幽寂棄闤闠之居來居於鄉之介源介源多劉氏業逸士與諸兄言任其耕鑿樵採又常資給之姻友謝君利亨深山中闢地立屋以隱曰桃坪率子姓捐山下田二十畝與之其尚義輕利類此中嵗嗜樂間安足迹不至城府顧所居傍近地山水清秀寬厰幽雅鑿池築園圃種松柏桃杏其中構二軒顔其楹間一曰小桃源一曰松坡清逸客至壺觴尊俎歌詠吟嘯以相樂或時取懷琳饒介之巙子山危素劉仲修端木孝思彭伯圻諸公所書與夫遁遊楊先生謝司訓汝愚桃源令利貞諸交遊往還手翰觀覽以自適風晨月夕則取阮籍陶靖節詩反覆諷咏怡然自得若與世不相關者正統丙寅正月二十九日以疾卒享年六十娶武陵伍氏子男四人長曰恆坦恆直次曰恆謙恆煥女二人長適上田李體相次適東郭王儀楷孫男十三人明年丁卯正月九日葬本里坑口之原平昔所著有松坡集山谷唱和集桂館金蘭集藏於家葬後四年恆坦昆弟奉廣西憲副萬資中狀來請豫銘銘曰嗚呼志達一鄉善士敦乎仁義篤於孝弟德周於身才不用世泉石煙霞樂其有既謂宜多壽享福無已一日不見莫不揮涕坑口之原文獻之里青山白雲滄江流水嗚呼志達乃歸於此貢士劉憲偉墓碣銘俊字憲偉姓劉氏安成人曾祖定宇祖叔璋父原舉皆隱居絶意榮進俊生而秀偉五六嵗時已能屬對語驚人十嵗能為詩伯祖仲炯元進士為宛平令有詩經傳義藏於家俊見之曰獨不可繼其志耶遂發憤以就於學父大竒之遣入縣庠為弟子員俊既穎敏又加以勤勵故其學益進莆田徐先生每夜起見俊所居舍燈火達旦謂諸生曰知自學者吾劉俊也甚重之壬子秋果以詩經領鄉薦乙卯冬始上春官自登舟手未嘗釋卷至京主翰林編修吳節家見其勤苦甚謂曰得無勞乎獨不知古人息焉之義乎曰知其益不知其勞也終不輟卒以是得咳疾藥弗效以丙辰四月十一日沒年才三十有六衆以編修所為狀來曰俊學不得祿死又不得銘無以慰其不幸於地下先生與其尊府交厚銘不可辭豫得狀不辭而銘之曰俊孝弟誠信人也父嘗患疽久不愈晝夜侍不暫離躬自浣濯不以委家人癸丑春當就禮部試值其母病輒留視疾或勸之曰時不可失曰急於功名而不顧父母可以為人子乎同舍友將引其鄉人為泮庠生者欲假俊名薦之俊不知私也而聽之一日分司官至怒學校慢之而無所發見新進生長大而粗鄙召至問所讀書茫然不解命題考之不能措一辭窮究舉主逮問俊或謂俊盍引同舍以自白乎俊曰吾豈不慮至此然不欲棄吾信也分司知其然亦薄其罰遂得還人以為難能也俊嘗見兩漢文章曰科舉之文足以發身成名不足以及乎古吾終當從事於此由是觀之俊非有志之士乎哉與俊同時出者皆第進士有名於今而俊獨不幸死矣得不可悲也耶俊沒時其兄憲政在側問曰不意吾弟至此其有所言乎不應強之再四曰吾讀書學問欲成先志以追蹤古人而卒不遂夫復何言竟無一語及家事俊有子男三人女三人皆幼憲政以公事留北京獨一家僮扶其櫬以歸嗚呼得不又可悲也耶銘曰故鄉之山昔也傷離曽幾何時忽焉以歸不增其輝而增其悲白雲霏霏緑水灕灕我銘在茲千載之思李給事中父墓志銘兵科給事中李俯及門告豫曰先人沒幾十餘年既葬而墓石未有文不肖幸叨祿明時蒙被恩命追贈先人第七品今又得歸省老母於家焚黃以致命於先人之靈願先生賜之銘追埋之墓中謹以國子博士汪公所為先人行狀來豫辭其請至再四卒不得辭按狀李氏之先居豐潤後徙臨清公字士賢資貌竒偉美鬚髯敦厚慷慨不為庳鄙庸俗之態性至孝事其父母無違禮處親族黨一於誠敬尤好賔客過者輒劇飲大醉而後已人有爭辨是非者必為之别白無委曲脂韋故年未五十共推為耆德相與言之官俾聽斷鄉里公亦莫得而辭焉於是老長子弟咸相戒飭毋為不善以煩公教縣大夫以此重之每嵗鄉飲公與焉禮儀肅雍觀者敬嘆平生未嘗為禮法外事見人有一善譽之不絶口有不善萬方為掩匿使自悔勸世故多以長者稱之永樂戊戌嬰疾卒於家得年六十四以是月日葬於邑東南溫良社之原曾祖通甫祖吉卿父用俱隱德弗耀娶張氏卒之後十一年為宣德三年始以子貴受敕贈公兵科給事中配封太孺人子男六人頻顒灝穎頥顯孫男二人嗚呼公居於鄉非有職任條教以號於人而人信服之如此安享壽考終於正寢而有令子以仕於朝廷為名臣獲膺褒寵之榮使人頌其賢德不衰是皆可銘也銘曰李氏之先世居豐潤徙來臨清隱處弗振爰及於公德善始彰以身為訓儀型一鄉生遺榮祿沒膺顯命有子有孫以延厥慶追銘其藏溫良之原百世之下其尚有聞張處士尚修墓志銘同邑義士張巨川以謝恩至京師奉鄉先生楊遁遊所為其尊府行實來請豫曰先人葬已二十有五年矣而墓石未有文先生與先人交幸惠然賜之銘追納之墓中不惟先靈有慰聞者亦將曰先生之不忘故舊如此先生之厚於不肖父子如此先生之待人不以死生為輕重如此辭不獲遂敘而銘之曰張氏本曲江文獻公之裔有曰昭宣者仕宋禾川某官子孫因留家禾川至曰師亮者徙居禾川之銅溪五世祖文質自銅溪徙安成之城中七世祖廷貴大理評事髙祖遵憲重慶監判監判之子桂芳處士曾祖也桂芳之子𢎞道處士祖也自城中徙居邑之西大畬𢎞道之子又新處士父也自又新以上連世不仕處士幼失怙獨與母居叔𢎞道翁撫育而教誨之未幾𢎞道亦卒母孺人連遭大喪竭力襄事四壁蕭然撫處士哭曰汝先世素積善今不幸陵替至此嗣德延慶實在於汝汝其念之處士雖在幼稚而知其言之悲潸然淚下以泣由是發奮從師讀書修身慎行比長有進取之志既而曰吾孑然孤立出處之際其誰與我遂絶意仕進儉以處己而勤以立其家家既饒裕而無驕矜之態以故鄉黨皆重敬之嘗痛不逮其父祖養時節祀事哀感不自勝事其母孝敬備至母卒喪葬一於禮撫育弟妹恩愛尤篤賔接士大夫惟恐弗及家門內外餘千指雍睦無間方處士初自大畬徙居里楊梅溪之東念師亮公在銅溪時有樓曰臨溪於是搆樓數楹於梅溪之上揭以舊名示不忘其先也處士性恬淡好施與飢嵗粟翔貴不徼利開倉以貸貧民有不能償者不責其償嵗旱佃田有登有不登一蠲其租入為賦稅長其副已徵民賦沒入官揭己資代輸不再徵於民假貸嵗久卷籍積多一旦盡取焚之其行義類此處士名齊字尚修死時年五十有八娶李氏子男三人長若金次即巨川次作霖女一人曾若懋其壻也孫男十餘人永樂庚子三月十有二日其卒之月日也是嵗十二月某日其葬之月日也而納墓石則正統九年某月某日也墓在里洪陂山之原銘曰既艱於幼復嗇其壽何畀之才而不之佑惟性之淳惟德之懋於何徵之仁者有後洪陂之源水深土厚有以藏之終古不朽楊處士道存墓志銘豫少遊泮庠與戴君誠問交誠問貢國監而其妻之弟楊季安來為弟子員從豫遊豫舉進士去鄉里既而以內艱歸季安之尊府處士君邀豫至其家孰令季安卒業於豫是嵗丁亥也巳丑服闋與處士别入京師承命赴行在明年冬還南京鄉人來者問安處士曰死矣豫哭之寓館距今二十五年矣季安自國子赴選天官得知景陵縣持翰林編修彭琉所述處士行實來請銘豫念與處士翁壻父子交久且厚銘不可辭乃敘而銘之處士諱誠字道存本姓郭氏其先居袁之宜春親仁里有學訥者業儒元初為安福泮庠直學娶邑雅源袁氏遂居安福處士曾祖也直學生竒伯處士大父也竒伯幼孤鞠於袁氏竒伯生觀泰處士父也元季兵亂處士三嵗失怙九嵗隨母改適楊氏遂冒姓楊處士生而質直不務浮靡志欲有為而力不足嘗歎曰世如此家又如此學則無暇仕則非時何以振先業乎惟修方寸地求無忝而已楊氏無子擇同姓子立以為後處士與之處若親昆弟然洪武初核丁産富豪者多為詭計處士曰賦稅徭役民之職也富盛者圗苟免則貧乏者當之明有國法幽有鬼神焉可誣也衆聞之皆自悔不敢作非為嵗壬申洪水泛溢人有溺死者水退率家衆荷鍤沿江見浮尸輒收瘞因捐資造舟以濟渡由是方春江漲隆冬甚寒人無病涉焉甲戌詔下郡邑修陂池為旱潦備縣符處士董其役時嚴冬興作飢窮疾疫者衆捐薪米以給之施藥餌以療之皆感激爭先赴役功獨易以就鄉人有貸息錢商於閩者三人冒瘴癘死其家懼息益重償所貸處士曰死者骨未歸而償吾債吾豈忍今付爾劵以所償歸其骨庶快吾心鄰邑有貧無賴者誘鄉童誣為己子來售處士知之隨所議直與之既去詢童得其父名召之領以歸且戒勿與讎平居訓迪子姓必以道德仁義為先非禮之言不出諸口終身與人未有爭競嘗於所居之偏築一軒前植花竹幽敻可愛客至從容賞酌平生不喜飲然待客必醉而後已暇則陶然山溪畎畝之間世事略不經慮永樂庚寅八月忽遘疾革假貸契劵悉焚之謂諸子曰吾以身報楊氏恩汝兄弟無忘所自必復姓遂卒是月二十九日也初娶劉氏繼周氏子男三人長曰懷素次懷炯次懷忠即季安女二人長適劉氏次適五軍斷事稽禮戴誠問孫男十三人女十人其葬以庚子正月一日其墓在佛嶺東坑之原銘曰生遭世艱復失怙長際時平離鄉土俯以報恩義弗去沈浮里閭甘守素我心獨知匪人喻有子有孫家亦裕老遺塵俗不關慮忽厭濁世倐然去白雲滿山風滿樹邑人作銘埋之墓萬百千嵗留清譽錢處士秉源墓志銘宣德九年十二月八日文江錢處士沒沒之後四年其從子翰林侍讀學士習禮撰次其行實請銘於豫辭不獲遂敘而銘之曰處士諱穆字秉源曾大父明則大父以和父立吾皆有善行稱於鄉里處士生魁偉有膽略元季盜起輔族之長者募鄉兵為保障計以鄰援懷二度不能舉奉二親出避寇雖擾攘艱苦中而志氣不衰甘旨必具及國朝平定天下盡室來歸經理舊業以為仰事俯育之謀外以應公上之需內以給私家之費井井有緒父卒居喪盡禮事其母尤孝謹篤意訓諸子及成立一以家事付之與宗親父老觴詠往還論説古今人事賢否得失如指諸掌亹亹忘倦既老行不以杖耳目聰明食生飲寒如少者年九十有六以疾沒配曽氏有賢行先卒子男三人孟芳仲穎季恂女一人孫男幾人某年某月日葬某山某原處士志氣髙邁勇力絶人初保障鄉里時與敢死士親冒矢石力與賊鬬手殺數人賊退走洪武末山谷惡暴子相聚為盜欲焚劫諸大姓處士方會上客有來言者輒罷酒適幼子卒於外忍哀呼子姓僮僕倡率里人分守險阻盜悉衆來攻殱其首惡者二人盜遂斂去境內安堵其壯勇如此嘗被誣役作京師處患難中怡然自得無戚戚之容每讀史傳至良將烈士慨然太息而想慕其遺風或與客飲飲酣氣振輒歌信國文公題雙廟詞感激悲憤至於泣下此其志何如哉使遭其時得其志搴旗斬將之勳烈可以指取乃自壯至於老而終不偶沉浮閭里間以死得不可哀也耶銘曰負雄豪抱竒器遭時艱翦凶類際升平樂居第喜劍歌惜無位稔將百齡溘仙逝我盟其幽表居志嶷然其光不可閟尹處士仲剛墓志銘處士諱直字仲剛姓尹氏吉之安福人祖𢎞中父一德俱隱處弗耀遡其先世始居邑西之梅礱曰德勝好遊山澤至城北二舍許地名集鳳樂其山水明秀里俗恬厚因徙居之子慶好施豫恤貧難行惠愛於鄉其後族遂以大處士承祖父之餘生而穎異少嗜學喜文尤工詩持身慎檢馭下寬簡於人無責備而交朋友務敬以信動必蹈循矩矱蹜蹜罔違禮平居訓子弟為善指切興廢以為勸戒縷縷幾百言皆可書或勸之仕則曰今天下理平明良相逢躬耕為善人可也嘗以編役當輸賦至京次子請代之行處士慨然曰昔黃叔度四十入洛吾年僅過之可不一至京師乎即具舟下彭蠡泛大江以及畿甸間遊觀景勝未幾風疾復作即促裝南還日與故人敘論契好或劇飲大醉談謔以相歡洽或咨其家事輒笑而不答惟語諸子以善承家膺門為務今年夏疾篤親黨皆來環泣處士徐曰死生常理過自悲悒非達也神色不變端坐而逝時永樂戊子七月五日日也享年四十五妻胡氏子男二人長行遜由泮生決科今任黃州郡學教授次行滚女二人蕭元仁郭泰雍其壻也孫男四人處士遺命襯先兆其孤將他葬一夕夢其家人曰吾當葬某山已而求之果吉遂以是嵗臘月草三葬焉銘曰彼狂而猘兮胡壽之遐此恭而弗永兮豈宰物者之忒差亦邂逅之偶然兮吾又奚嗟將厚蓄而不食其報兮天固以是畀其嗣人者耶池從華墓志銘天官員外郎李君茂𢎞謂豫曰吾有友學既成未沾一命以歿者於今二十餘年矣吾甚憐之前年吾蒙恩得告一暫還鄉里其嗣子謙踵門且泣曰先人葬未有銘知先人之德善之詳者莫如先生其為我撰次以求銘於當世士大夫追納之墓中不勝其大幸吾時已諾之今願竊有請以嗣其意以慰先友之靈於地下而吾於交際之誼亦庶幾其少盡也幸無辭辭不獲則敘而銘之曰君諱奉宗字從華姓池氏黃巖士族少倜儻有大志而蚤喪父母鄭鞠育而教誨之勤以理家暇則讀書學為文詞不輟既長置别業於其居之東蒔花藝竹靚深幽雅客至相與觴詠其中若無意於斯世者既而翻然曰古之人澤利生民名垂竹帛者皆由學以致之吾豈徒為太平民而已哉於是奮身而起入縣庠補弟子員委已於學學日益進行日益修名日益著鄉族老長皆期望之一日遽得疾卒於家聞者莫不痛傷焉傷其志未遂而止於此也君性至孝事其母極甘旨之養痛父早世忌日必哀處兄弟極友愛季兄蚤亡二姪孤弱撫育之如所生親故有死不能葬者出已資助之假貸不能償者因以與之朋友有以急告者赴之惟恐不及以故鄉人愛之者多惡之者益鮮而殁之日哀之者尤衆也曾大父誠大父邦佐父思彬皆隱居樂善娶同里黃氏有淑德子男二人長曰謙今為邑庠生次曰杲女一人適解孟溫孫二人裕生女二人永樂巳未四月四日其殁之年月日也明年丙申十一月九日其葬之年月日也靖化鄉古竹東山之原其葬之處也銘曰惟其材矣何不棟梁惟其良矣何不髙驤奄其逝矣誰不汝傷惟德惟善誰其汝忘於以張之其存者長國子學正林先生墓志銘正統十一年丙寅冬十月二十有五日國子學正林先生殁先生未殁之先遣其子還候官為其子議姻别數日而得疾未一月而殁殁時惟嗣子謙在側疾革其友學録劉叔翺至執其手曰吾兒子幼未練於事吾幸於子友厚善吾疾必不起矣身後事以屬吾子言盡而益悲明日遂殁叔翺既為治棺衾殯斂訖述其世系行誼來請豫銘曰此先生治命也嗚呼吾方倚先生道德行義以之淑諸生俾有所矜式而忽焉以死中心不勝其痛悼尚忍銘其墓耶雖然先生之命在豫銘不可不有副之乃敘而銘之曰林氏本光州固始人其先有曰慶源者五代時仕為某官從王審知入閩居候官曽祖洞觀祖寶考叔容皆不仕先生諱居字禮節永樂癸卯以書經領鄉薦明年會試禮部中乙榜授附州學正改蘄州以內艱去服闋升國子學正遭父喪家居起復還職未一年以疾卒享年五十有一配丘氏子男二人長謙次謹女一人先生為人篤厚簡靜敦行孝弟在官皆迎二親就飬備極子道親沒奔喪葬祭禮儀周至識者敬羡與人交必以誠信言語論議行止動作必循規蹈矩不正之言非禮之事未嘗出諸口見諸行其職教內外所以訓迪諸生由體及用循循有序故其化導於人率有成效雖武夫悍卒皆生敬仰其在太學畿內之士以舉進士為業者踵門無虛日先生皆受而教之無少怠及其沒也士子之哀之者尤慟也叔翺為豫言翺嘗與先生講易至大壯之六五喪羊于易無悔謂翺曰君子以柔制剛則剛無所用而其強暴之氣自屈矣翺服膺之其後遇人以非禮相加輒與辨論窮極而後已既退自悔悟因念先生未始與人較是非長短然後知先生涵飬深至未易及也至於誠意正心之學修己治人之方工夫切實論議皆有本源使其得進於用而充其所量將必特然有可觀者而止於斯其可哀也夫豫以叔翺知人且知言遂以是銘墓在金雞山先塋之次葬以某年月日也黃助教母杜氏墓志銘國子助教豐城黃先生俊將改葬其母孺人之墓奉內兄冠帶致仕官杜拳所為狀來請銘曰俊賴母之教獲領鄉薦受國恩典教湖廣之穀城迎母就養沒於穀城權厝於里黃家汶卜人云不吉俊將求吉地遷焉願先生賜之銘埋於塋以慰先靈幸毋辭黃先生篤厚士觀先生之為人則其母之賢可知也遂不辭而銘之曰孺人姓杜氏諱妙真南昌豐城折桂鄉人杜本詩禮之族五世祖某通經學有名纍舉不第懷憤以卒曾祖某父元實皆不仕母聶氏孺人性聰慧自幼勤於女事不待教而能既長父母為擇配歸黃氏為伯泰婦孺人既歸黃氏事其姑甚謹相其夫有禮率其女婦躬紡績之事益勤不懈宗族娣姒之間恩意相接其所以助祭祀待賔客皆有條理必盡其心由是家益以裕伯泰無內顧之憂伯泰凡再娶初娶聶氏生男二人曰熙賢熙善孺人其繼室也生男一人即俊女二人孺人所以教誨養育衣服飲食之事彼此均一外人不知異焉女長適吳永清次適左實孫男二人曰茂曰中孫女二人宣德癸丑夏六月朔日孺人沒之年月日也墓在家鄉某里某山之原其葬則某年某月某日也銘曰女德之懿婦道之純為理既勤家室既殷一日不見誰不酸辛惟山峩峩惟水沄沄既固既安以利後人亡友周志超墓志銘志超豫友也亡已二十年矣其弟志謨為太學生得還其鄉始以修撰劉君顯仁所述志超事行來請銘志超姓周氏名卓志超其字也曾祖茂敬祖芳平父如安皆隱德弗耀志超自幼穎敏其為人沉靜簡亮年十五入縣庠為弟子員專力於學其讀書日夕有程度嘗曰士之為學非徒以資利祿將以行之也故其所言與其行事必由規矩凡經史諸子百家之書竭資以購求之而大肆力於其間書日以益積學日以益博同輩皆敬讓之謂其一出必有遇焉既而嬰疾退居於家君性孝友事其二親甘旨必具疾劇猶手不釋卷如安止曰汝可養疾不宜復事詩書君但泣不能對壬午鄉閭盜起如安遇盜被害君力疾訴官取盜正其罪為文祭於父棺前哀感行路母賀氏遘疾危殆醫弗能治或言永新曠處良工於醫然非厚資不能致君聞候至事之如所親處良感其意醫為盡力母疾愈酬以金幣處良辭謝而去君於為義若嗜欲不計利害同門友朱勉行遇悍卒醉怒逼赴河死其家訴官卒黨把持之君憤然排羣黨以理白於官然後得行竟為所訴連至京卒復其仇朋友有避難人所拒而弗納者投之欵接如平時君且死呼志謨謂曰汝勉之顯親揚名在汝也吾疾不起矣其以汝子虬後我遂卒永樂丙申十二月十二日也享年四十有三某年某月某日葬里毛竹園祖塋之次配賀氏所生子震巽早夭嗣子一人即虬也女一人劉彥周其壻也志超有志於學有志於功名之事而俱不遂以死世故悲其不幸也志超與豫同年生月日長於豫豫呼之為兄平生喜奬進人以就於學而於豫尤有意焉豫嘗與君夏夜讀書東齋每至二更罷其夜過三更始就枕大雨至不知也早起水漂鞋方覺明年君疾作不能就學而豫學亦怠使君不以疾廢則麗澤之益深豫庶幾有可以及人者嗚呼君之不幸亦豫之不幸也由今思之其有負於君多矣尚敢銘其墓耶然以志謨之請不可辭遂序而銘之銘曰志欲有為而不及施忽然以死其又可悲竹園堂封宿草萋萋餘二十年我為銘詩式昭於德庶永厥垂指揮同知陳逵父墓志銘忠義左衛指揮同知陳逵將葬其父母來求豫銘曰先世本應天之六合人先大父從太祖髙皇帝平定天下東征西伐有勞績自小校纍遷袁州衛指揮同知洪武中以詿誤落職沒於京師先父坐纍謫戍大寧在大寧甘貧苦數年從太宗文皇帝平內難每戰皆有功自行伍中纍功授忠義左衛指揮同知守遵化以守城功進階懷逺將軍得世襲還京師沒於永樂十九年二月五日享年幾老母張氏袁之宜春人父嶽州衛指揮既歸陳氏未幾而先祖沒先父有大寧之行雖在艱險之中奉先祖母盧淑人極孝謹當大寧兵興擾攘之際闔室奔走遇寇急有六嵗子盧淑人曰我老宜棄抱汝子疾走老母與先人曰事迫矣勢不能兩全母不可棄棄其子舁盧淑人晝夜兼行竟獲免先人沒後二十六年今年二月二十七日以疾沒壽七十三子男二人長即大寧所棄者次即逵女三人孫男一人先人葬宛平京西鄉之原今將啓先人二墓奉老母之喪合窆焉先生與先人交厚而老母又先生之鄉人也幸賜之銘以妥先靈先生其無辭豫曰逵八嵗喪其父能自立於讀書習武藝以不墜先緒其立心制行忠厚端潔言語行事皆有條理今又能求銘以葬厥父母厥父母可謂不死矣是宜銘遂為之銘袁州君諱晟忠義府君諱啓芳張淑人尊府諱廷秀今年正統十一年丙寅也某月某日其葬月日也李處士志節墓志銘安成之李有兩派一祖西平忠武王曰西平李氏一祖南唐曰金陵李氏志節本金陵之裔由其祖用敬上繼上田庭蘭翁遂為西平裔矣用敬生重珍徑軒父也徑軒諱操字志節生甫三嵗而母周氏沒父重珍亦連遭家難謫役河南徑軒遂鞠於外氏涉厯艱苦故於鄙賤之事莫不通曉既長歸故鄉而先世資産蕩覆幾盡徑軒克自樹立於艱難之中竟復舊業拓田園築居第有加於昔徑軒聰慧過人就學兩期月於書多涉獵有讀十餘年或不能過也性孝友嘗恨其母不逮養父沒河南之役跋履險阻徑往負喪歸葬每言及流涕事繼母尤極愛敬與母兄汝庸居友愛尤篤及析田産奴婢多讓之宗族子弟有窘窮者周給之俊異而能向學者力奬諭而資之修理先祖父母墳塋其費一不以干於衆最喜吳文正先世義孰記中孝弟忠恕之説常舉以為家訓甲寅乙卯連嵗旱蝗民飢朝廷開義倉賑給而鄰近之民未之及者徑軒遂發私廩假貸鄉人不責其息顛連無告者以白粲遺之一日行龍雲嶺道中遇一荷擔者飢餓垂絶即袖出白金託近山樵者負歸食之得不死或遇荒月大集飢窘作粥飯以餉之鄉鄰有寒者衣之飢者食之貧而病者惠之藥死不能葬者給以棺每斯文賔客至傾倒欵留必極歡宴雖纍日無怠倦意襟懷磊落議論慷慨使人樂聽之不厭晚年以故居弗稱意乃改卜於下方制極精緻又築一室於新居之偏曰徑軒為休老之計鳩工甫畢而疾作矣疾革肩輿還正寢具衣冠服謁先祠退奄然而逝正統十三年六月十日也享年六十有四娶龍雲劉氏子男五人長文次章次育今為縣庠生皆劉出也次京亨側室朱出也孫男十一人談諤訥咨詠試誨讓謨記闕孫女二人曾孫男一人標以是年冬十二月草六日葬於本里麻園嶺之原育自為狀與其兄來請銘銘曰徑軒本是金陵裔由祖出為上田繼自此遂續西平李兩族簪纓習詩禮至於徑軒尤聰慧於書過目輒能記學值艱孤半途廢克自樹立起顛沛山林園田繞居第有光於前無不遂襟懷磊落負竒氣生於升平沒盛世有賢子孫繼厥志俯仰兩間可無愧麻岡之原佳山水誰其卜之青烏子式安冥靈福後嗣古亷文集卷十
