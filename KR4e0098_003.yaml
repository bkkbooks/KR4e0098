body:
  text: 古廉文集卷三明李時勉撰記銘耆英堂記劉君子欽豫同年友也豫為縣庠生時已與君相知及同登進士同入翰林為庶吉士同受命為刑部主事於今三十餘年皆老矣而君獨得致仕以歸鄉之士大夫聞其歸也為名其堂曰耆英以候之君亦喜其名之善謂豫曰吾鄉之仕於朝與四方有齒有德當引年之期者蓋多也名堂之意蓋亦有洛中之待豈獨以厚吾一人哉子其為我記之豫因記昔與君二十九人者之在翰林時君年最長學最優而負奇氣不肯與庸衆人伍佳時令節選幽擇勝登臨宴集酣嬉淋漓以相樂而君尤議論橫放莫之能難茍一語相契則豁然長笑聲振林木雖飲大醉有求其文辭者下筆數千言長篇短詠水湧山出莫之能禦或與之論時事則曰非吾所敢知故皆以儒者視之及太宗文皇帝以刑獄不中人或稱寃則以豫十二人者俱為秋官屬以理之君處決如流皆得其平人於是歎曰此天下之英才也未幾為仇家所誣謫戍廣西備厯艱險妻子皆死焉仁宗皇帝即位用薦召至授以外校官九載入覲請老歸休豫以其流離顛沛十餘年間摧挫於困厄之中而消沮於岑寂之際將憔悴委靡不復能振起矣而與之飲酒賦詩笑談論議慷慨激烈聞者悚然其英邁之氣雖老而不衰此耆英堂之所由以名之也歟今之歸鄉鄰父老宴會於斯堂之上相與賦君之盛美而歌其德音則豈不樂哉若夫繼洛中之會固有其人焉君其候之燕樂之美又當有記之者豫則未敢預為之説也崑山郎官柏記凡物之所以能取重於世者非物之能自重也因人而重也南國之甘棠以召伯手植之檜以孔子不然檜與甘棠何處無之而此獨見稱於時豈非因人而重也耶崑山本在吳地今之崑山因縣而得名非昔之崑山也高廣秀特本一邑之奇觀然居乎闤闠冗雜之區牛羊樵牧之所戕賊童然一培嶁耳廣陽羅君延齡來為是邑也勞心極慮以蒞其政期月之間政化大行民用阜康於是修舉廢墜至於兹山見其荒落弗治益增感歎爰集耆老問所宜木乃樹之以柏越數載自頂至麓蒼翠蔚然秀出於孤城埃壒之間邑居鱗次之上過者徘徊瞻望不忍舍去邑人老長爭相飭戒不忍翦伐且名之曰郎官柏欲以傳之後人使知之而不輕也於是騷人墨客相與歌吟賦詠頌君之美者相屬不絶積成卷帙傳誦至京翰林待詔沈君來求豫記方今天下財賦專倚於東南吳獨當其十八崑山吳之巨邑地大而民衆政繁而賦重為其邑者吾意其困於簿書期會之務窘於應變酬答之勞宜無須臾之暇以及乎其他且經山種樹非為政之急務而君能注意為之如此則其於修政立事從容間雅而有餘力也可知非其才猷有以過於人烏能然哉宜乎邑人愛護之而不忍傷詩人詠歌之而不能忘也雖然君之所為美矣然勢不得久於其職也如使繼君者之皆得其人焉則是柏將永存而不壞不然則君一代去而牛山之感隨至矣昔宋張徹為麻城令種萬松於道周以芘行者去不十載松之存者無幾蘇子瞻傷來者之不嗣其意也作詩以歎惜之因沈君之請嘉羅君之政特書其事以告後之來者庶其有警而郎官柏亦將永存焉重書品樹連隂圖記余職翰林侍讀時為檢討黃先生為此記明年先生沒沒時親戚子弟無一在傍者書籍翰墨未免散失而此又安得獨存永樂甲辰會試天下舉人以國子監為貢院先生為同考在院中得風疾徹棘輿歸竟以不起後二十餘年余來為監官每尋訪先生得病之處方切慨想不已適先生嗣子子嘉由敝邑司訓秩滿而來訪豫監中因道念往昔時事而余之感慨抑又甚焉既而子嘉膺薦遷擢束鹿縣尹而去以此卷求余重書此文蓋亦不忘其尊府貽謀之意可謂賢也已然則先生猶不死也固足以慰余慨慕之懷因識諸其後云環秀書屋記永豐之龍潭有馮氏居焉馮氏曰義安者與其弟禮安信安構一室於其居之偏而扁之曰環秀書屋今年致書其弟禮部員外欽訓來請記馮氏之先居武昌其曾大父良卿仕元為廣西路同知大父升之為威順王參謀元季播遷擕家流寓永豐尊府伯純有才藝未仕而歿而欽訓以明經擢進士第官至副郎其進蓋未已也今其子弟十餘人皆聰俊有志嚮義安以為其前人與其弟乘時貴顯後先相望皆本於讀書以致之使吾後人無意於學則已茍有意於學而無其書將何所用其心哉此書屋之所以作也屋之前後有九峯雙溪拱揖而回繞有園池竹樹薈蔚而環擁其蒼翠之色奇異之狀一開軒而盡得之此書屋之所以名也夫秀者山川清淑之氣之所發也龍潭山水之勝固非他處之可擬而書屋之所在據有其勝則所謂秀者不在乎山水之間而舉萃於書屋矣書者古聖賢人之道之所載也讀其書明其道以之正心而心無不正以之修身而身無不修以之事親而無不盡其孝以之事君而無不盡其忠推而至於仁民愛物處事接人而無不得其當日用常行酬酢萬變而無不得其宜使馮氏之子若孫果留心於是而有得焉則所謂秀者又不在乎書屋而將舉鍾於其人矣夫如是固有光於其先烈有光於其山川有光於其閭里而無負於義安昆季之用心也矣豫為記之所以廣義安昆季之意而為其後人勸也臨清亭記文江陳國器其所居在邑之北距其居之前若干步有池方廣凡數十百尺泉出其間冬春常盈而不縮泓澄鏡徹可濯可鑒其流不窮可以灌注畎畝而達於海比之朝盈夕涸而不可以瀦滙以利物者蓋亦異矣國器於是而作亭於其上而闌檻其四周高敞洞豁凡魚鱉蝦蟹之遊泳菱荷芙蕖之芬敷沙禽水鳥之飛鳴上下與夫波光日色晴煙曉霧之晦明舒斂皆在乎几席之下而平林茂樹遙山翠黛誇奇獻秀於池之外者一舉目而兼得之每賓客往來輒相與登臨以縱遊觀之美引觴共酌鳴琴賦詩歌吟笑詠囂雜不至而塵俗自逺其樂為何如也於是名其亭曰臨清國器來京師因中書舍人劉君求豫記豫聞國器與其兄叔寧皆倜儻奇俊友愛之情甚篤家固饒財讀書而好文喜交遊士大夫鄉里咸稱譽之嘗搆堂以養其母曰春暉而又有華萼樓以為兄弟燕息之所其以餘力復治斯亭於以暢幽懷而娛賓客國器果賢矣乎吾嘗觀於人父子兄弟之間至於居處衣食之微或不相恤而乃多飾亭館以為外賓賞玩之資豈不悖哉使聞國器之風能不愧歟雖然地以人而勝昔羲之之於蘭亭栁子厚之於愚溪特一時遊息之寓焉耳猶名傳至今况陳氏世居於此國器兄弟又以孝友之行著稱於時而詒謀之有道使其後之人守之而弗替則池亭之勝將相傳於無窮豈若蘭亭愚溪勝於一時獨名存而已哉中溪八景記距安成之東一舍許有地寬平而曠衍環境皆山或磅礴而高厚如屯雲或峭拔而離立如列旗或連亘而縈回如湧潮層見疊出不可名狀其間又多故族以儒雅相尚而彭氏在平村之間前後皆有小溪中溪而居故號中溪居之北有石榴峯特立大江之濱峯之西南峭石壁立江流至此泓渟澄瀅魚鱉之類遊泳其中可以頭數其下深不可測蓋有龍潭云溪之東可五百步有小澗狹隘兩傍皆土黃而堅下有平石甚巨中有竅如井方圓才尺許泉出其中測之不可窮雖大旱不涸由井東南行五六百步有峯曰東陽高出數千尺峯頂巨石如砥可坐百人天將雨則其上必先出雲東陽之西南有山頂趾皆石石之半有洞名石屋居人立廟其中以祀唐像像嘗為安成令歿而相傳以為神故逮今祀之石屋之南有峯拔起曰白馬諺云像嘗乘白馬止此因以名比諸峯獨高每朝陽初升而光景先動峯之下有湖曰蜜湖方廣數百畝然居高而輸下為防以瀦之然後可以灌溉故春夏瀰漫秋冬則枯竭獨南有蛟窟其水常盈且多魚漁人不敢下取之湖之上稍西其嶺曰黃牛舊傳有乘黃牛入此山者不知所往山極高每村墟夕隂而其頂尚餘返照上有三仙臺謂昔有仙者三人止此既去鄉人因築臺候之天氣清明之夕或有燈光見於其上凡此皆遊觀之勝處而在中溪左右前後可見者也彭氏有佳子弟曰琉字育敬者乃取而名之以為八景屬豫記夫山水因人而重自古已然育敬聰明有智略始第進士已為人所羡慕將見嚮用於時必卓卓有所樹立無疑然則為吾鄉山水之重者非育敬其誰哉世慶堂記松之華亭有宋氏之彥曰理以公事至京助教姑蘇李先生詣於橋門明日奉其尊府之命來求豫文且曰宋氏之先居淮隂始祖某仕宋為殿直將軍靖康之變扈蹕南度宋亡子孫因留居於杭七世祖元裔自杭徙雲間居華亭之黃墳高祖子閏以勤儉立其家家以饒裕曾大父雲卿大父孟昭皆尚禮而好施至吾父能守其先世之業以詩書教訓其子弟以恩意和睦乎宗族以信義交接乎鄉里里之有貧而無衣食死而不能葬患難而無所資者周以衣糧給以棺槨濟以金帛無所吝嘗謂生曰吾之所以保有先業不至失墜今又有汝兄弟相與優遊怡愈享安間之福於太平盛治之時豈吾之所能哉實先世積善之所致也惡可不知所自耶吾是以名所居之堂曰世慶將以示後世使知之而不忘也雖然堂非義不立義非文不傳汝往京師吾聞太學有古廉先生者樂道人之善是與人為善也汝其以吾意告之而求記焉必可得也生不敢違故來請願先生賜之言則生父子之大幸後世子孫之大幸豫曰泉流混混不息而達於海者源之深也松柏亭亭益茂而淩雲霄者本之固也茍又有浚而培之者焉則其不息而益茂者其有窮已乎子之先世淮隂而上不可知自殿直來至於今益盛而不替非世有積德其能然乎尊府又能不忘世德而以名其堂以啓迪其後人是故知所以培浚者矣宋氏之福豈有涯哉若夫敦詩書崇禮義奮揚盛世以振起其家聲而光耀於前聞則在子昆季也尚勉乎哉子歸以是復於尊府如何理曰足矣遂書以為記理字某有文學尊府名某字某有德行蓋雲間之隱士云城南茅屋記人之志所尚不同也志於金玉綺縠者視菽粟布帛為不足貴志於高甍傑棟者視蓽門蓬户為不足重志於富貴榮華者視索居間處為不足齒是蓋窮奢極欲者之所為而不知金玉綺縠有時而聚散不若菽粟布帛可以常用而不竭高甍傑棟有時而陵替不若蓽門蓬户可以久處而不厭榮華富貴有時而憔悴不若索居間處可以安肆而無虞故嗜間靜樂幽獨者常在此而不慕乎彼也雲間李氏逢吉居都城南門外有年矣其為人惇實簡靜不事表襮教其子以詩禮為務與人交必盡其始終官府之務不經其慮市利之區不有其迹嘗於其居之偏構一室為怡老之所上覆以茅葦闢軒窗明爽淨蠲積法書名畫其中客至焚香瀹茗清坐雅論終日而不倦或為題之曰城南茅屋賢士大夫歌詠之者甚衆既積成帙來求豫言吁逢吉其嗜間靜而樂幽獨者乎夫京師都會之地商賈百物之所充積使逢吉不安於此則金玉綺縠可一時而具高甍傑棟可一旦而建榮華富貴可指日而致而逢吉舉不以為意逍遙於尋丈之室而自以為得其所志蓋可知也逢吉亦嘗自云吾今年餘六十矣同時之人各臻其尚致金玉綺縠之集高甍傑棟之居榮華富貴之樂豫固莫得而並焉然其中聚散陵替而至憔悴者蓋亦多矣若夫淡然一室之中無聚也而有散乎無盛也而有替乎無榮也而有憔悴乎此吾志之所自適而不敢以告人也雖然貧富貴賤豈不有命哉能安乎命則一致耳是故不足較也太常少卿程君南雲為豫言豫以其言頗近乎道故為之記云竹園書屋記安成之南芳郊之間有地曰古竹園不知始何名或曰其地宜竹故鄉人呼為竹園或曰其山水之勝竹樹之美可擬諸淇園故名古竹園理或然也有劉氏世居焉其彥曰大淵字源澗者於其居之偏築室若干楹名之曰竹園書屋經史書籍充仞乎其中嘗延明師以訓迪其子弟將期以成其德而達其才而後已今年走京師求豫記且曰先人積書欲為詒謀之計而屢遭迍難卒不獲少展其志况於詩書禮文之事乎今幸遭遇聖明在上當重熙纍洽之時嚮用儒術之日窮簷茅屋甘藜飯糗之士莫不爭自磨濯於仁義道德以待時之需而富家大室之子弟亦皆感激奮發去其輕肥紈綺之習而以學問文章為務大淵也於斯而不加之意焉是自棄之於不中不才之地豈為人父兄之道哉此書屋之所由以作也願先生為我記之豫曰書之所載大而三綱五常之道小而萬事萬物之理則必求其義得其義則必致於行孜孜焉而不敢自放於禮法之外如是而為成德達才之歸也不難矣以之齊家而家無不齊以之治人而人無不從是蓋學問之力詩書之效也今有讀書數萬言自恃以為知道而恣情縱欲至於亡身敗家而有不悟是豈詩書之過哉不由其道也然則讀其書必由其道而後能有所成源澗之所為期望之意正在此也為其子弟者尚益勉焉以副其意使見者稱曰此古竹園之賢士則豈不美哉若夫以其所能掇第於有司登青雲而躋膴仕以為書屋之光者抑末也其有本則末自從孔子曰學也祿在其中矣請以此為書屋記於子何如源澗曰善幸書之當置諸其壁間永以為勸也怡情記春官郎中羅田程君伯玉其為人也謙恭謹密性尚雅素不事表襮好積經史圖畫求之至忘飲食故所得甚富嘗輯山水人物花木鳥獸為一巨帙皆當世名能畫者之所作也公暇時取而玩之其神情蕭散如臨乎長山大谷與幽人逸士遊觀往返而雲煙嵐翠之晦明變化卉木花實之炫爛茂密山禽野獸麋鹿之羣之飛鳴上下奔逐而出沒巖崖澗壑泉石之吞吐激射殷若雷電而風松雨竹霜叨雪虐之林之夸奇獻秀者舉集於前悅於目而快於耳有不知其身之貴顯在士大夫之列而居乎京師也伯玉深以為慊而名之曰怡情又求諸能文之士題詠之徴記於豫伯玉可謂善於取適者也伯玉為春官屬主客之政極煩政煩則心勞心勞則智滯而神晦茍不有以節宣而暢達之則無以作其怠惰之氣事至物來將莫能揆之而至於擾擾不給矣伯玉居其任凡若干年政無留滯行無過舉而名譽日聞者其處之有道也歟其以有是物也歟誠善於取適者矣雖然豫於伯玉猶有告焉昔人之好書畫者如桓玄輕舸自隨王涯復垣自固害政廢事至終身不悟是蓋溺於物者也故先儒有玩物喪志之戒伯玉尚慎之以是自適可也劉氏景德樓記瓘溪劉氏安成大姓也其彥曰從淵贅城南李氏與豫為相知去歲豫以祭掃先塋得暫歸於鄉往訪從淵城南握手道舊故情味雖不減往昔時而相視各已衰老矣從淵謂豫曰少時相與居城外內凡若干人今惟吾與先生在亦可謂難得也矣於是與豫登於其居偏之小樓曰昔日樓成之日與客燕於其上吾告之曰先世以詩書傳家有舉進士者有任韶州太守者有為國子學正者皆以儒發身顯名當世吾祖以三在名其齋而吾父以止善名其堂豫欲承述先德以啓迪我後人不才無似不能有為於是惟積書籍於斯樓以訓教吾諸子冀其成立以無忝前人今吾兒幸獲登名薦書為外校官於斯樓之積庶幾不虛也客曰然是亦先世之積也乃名吾之樓曰景德願先生為我記之實斯樓之幸也豫辭不敏及還京師而校官亦以考績至從淵又以書來求記豫又辭既而從淵之兄昆陽二守存有以致政歸而校官亦得以典教上杭復來致其尊府之命趣豫文甚急辭不獲則為之記曰樓之積六經子史百家之籍而已賢者誦而讀之可以發名成業不難也若夫先世所積者德也在乎杳冥茫昧之中不可得而見故嘗忽不以為意自非後之人專心篤意者思所以承繼而紹述之烏能使其益逺而有耀哉客之名斯樓其知德者歟夫景光也大也子之尊府積書籍於斯樓以教昆季率由乎道德仁義而子又能以之取科名厯宦達以顯揚乎其親於前人之德庶其有光也使後之子孫益慎修而不怠則其榮顯光大又豈可量哉譬之水與木焉其源已深矣其本已固矣所以疏濬而培植之使浩蕩而達於海榮茂以干雲霄則有望於後之人焉子其勉之光於前而振於後者端在子矣其為吾以是復尊府之命如何校官曰可矣遂書此以為記楓林舊業記吾李氏始居安成縣治之東曰東廂李氏後徙東門外人稱東門李氏及其族屬蕃衍有徙居西門南門者有徙居南鄉東鄉者四散離析相去隔越各保其新創基業視先世居第漠然不顧棄為間壤或以假借與人久而不歸後生小子不知其由習見目前以為當然遂至真偽莫辨識者憾焉況其子孫也邪族弟中實自其先景範公徙南門景範之孫心一宋咸淳進士江華縣尉生三子長書傳與其季承傳徙暇詠其次世傳經傳皆絶無後而忠傳蓋江華之中子中實忠傳之玄孫也獨能守其業至今存焉是亦難也矣當江華時所居之前有楓樹數株大數圍過者指曰此楓樹某人之家也既經亂離樹雖去而名尚存中實遂求府丞朱君孔暘書楓林舊業四大字揭之楹間亦不忘乎其先也求豫記夫守夫前世之業以奉先祀此孝子仁人之心固如此也今楓林舊業中實之不忘善矣東門舊業中實其忘之乎信乎先儒之言曰逺者人所易忘也於所易忘者而不忘然後為善也由其近以及其逺吾知中實必不忘也中實為我告諸族人曰此先世神靈之所在如使之無所栖以享其祀則亦何能以庇廕其後之人而享其福哉固宜協謀同力以復其地立屋以奉其祀庶幾承先裕後之道盡其楓林之業亦將永永而無替矣中實勉之得月樓記安成之西有地曰上田李氏世居焉其後有徙安田者又有徙恰田者然皆不如上田山水之幽勝草木茂密物産富厚蓋邑中一佳處也去其舊所居一里許有大溪環抱乎其前又有小溪縈繞乎其後東南行與大溪合其中沃壤平衍李氏之彥曰制節顧而樂之且曰是近先世之居乃治而築室焉小溪之上有月角山特秀麗制節於是作樓與月角齊而慿兩溪之間名之曰得月蓋取昔人近水樓臺先得月之意云當夫良宵清夜明月初升山髙而溪深樹木暗藹墟谷冥昧而斯樓之上已光彩照爛輝映洞徹晃然如晝無不燭焉制節於是反顧吾心之虛靈不昧以具衆理而應萬事者殆猶是也則其所以明德所以盡心而不至有昏塞蔽固之患必於此而得之及其朝而觀夕而望由震而乾自巽而坤其盈虛消長皆出自然制節於是反顧吾之所行損益進退存亡之道亦猶是也則其所以進德所以處事而不至傾危頽墮之憂者必於此而得之然則制節之為此樓豈徒以玩物適情放懷恣意若庾亮殷浩輩之所為而已哉世嘗言月中有仙桂後人有登科第者為折桂故有丹桂五枝芳之喻制節積書籍於斯樓課諸子姪肄業其中玩索而有得焉則吾之斯樓也不獨得月於斯而已將斧月中之仙桂而盡得之矣為制節之子姪者宜勉之將以期之也尼山書舍記大名郡滑邑司訓尹器因其叔祖父進士恕來求豫為其所謂尼山書舍記且曰吾先世本河南人唐末有曰崇珂者以保信節度來為吉州兵馬黔轄因留家安成城門居尼山之下其後有大任者宋紹興進士信可再可斗祥斗元皆以兄弟前後聨領鄉薦一時名動邑里其餘以文章鳴於世以學問教授於閭里者纍纍有其人焉先大祖以賢與其從兄以翼家素富饒置田三百餘畝構一舍為八齋以待四方遊學之士士之出其門者甚衆至先祖安行公先人啓蒙府君構書舍尼山下積經史子籍其中延明師以教訓子姓欲以修復前烈志未遂而沒今生以菲才謬膺時薦忝竊教職去家數千里而先世之所搆與其書具存欲吾今與後之人保有之而不致散逸冀或有能讀之者願先生為生記之置諸其壁間庶其有警也夫書載聖人之道讀其書固將明其道以致於用茍讀其書而不能以明其道而不能以致於用是為無用之學也又豈足道哉司馬溫公嘗曰積書以遺子孫子孫未必能讀不如積隂德於冥冥之中以為子孫長久計竊嘗以為二者皆不可無也德者固植家之本至於書力所能及則為之讀與不讀不必計也然亦有足計者視吾德之所積何如耳昔丁顗嘗聚書至八千卷曰必有好學者為吾子孫至其孫度果讀書有文名登詞學科仕至參知政事諡文簡是蓋讀書之效積德之新也尹氏世儒家安行父子又能積書籍欲以啓迪後人而紹前烈亦可謂賢也矣今恕與器皆以文學取名進士師表於人尤賢也其進於顯榮殆未可量丁度不得專美於其前矣是以記之鄭太守壽祿堂記四明太守鄭公作養親之堂於其居第之偏名之曰壽祿取主事時朝廷褒封其母太安人敇命之詞云及來報政天官求豫記夫天下之事出於天者常不可必而有可必之理由於人者常可必而有不可必之勢得年以久於世人之所欲也得祿以養其親亦人之所欲也然壽者天之所命杳冥茫昧之間有不可得而必者孔子曰仁者壽蓋仁者人也人能盡乎為人之道是不悖乎天理也不悖乎天固可以得於天矣此不可必之中而有可必之理存焉者仁也祿者朝廷之所命有德有才有守有猷者皆足以得之孔子曰學也祿在其中矣然非遇其時則孔孟之聖賢有不遇焉此可必之中而有不可必之勢存焉者時也太安人處性柔淑動存禮度早失所天而能茹苦含辛守志不渝教育其孤以至於有成立治其家內外斬斬為人婦為人母之道世或鮮嫓焉今年七十有八酡顔鶴髮康強無恙况又遇乎列聖相承當重熙纍洽之運而有賢子讀書決科為名進士厯官蒞政為賢太守膺國家推恩之命而致龍章宸翰之褒躋髙年享祿養則豈不宜哉太守以是而名其堂以不忘朝廷褒錫之恩一以祝願其親攸久之福忠孝之意至矣雖然洪範五福以壽為首蓋有壽而後能享諸福世之為父母而躋於壽考者或有之要必得賢子孫以盡奉養之道使其心優遊怡愈歡然於髙堂之上然後為可樂也若夫為之子者言而不信行而不篤動而不由於規矩則將貽其親之憂慮僇辱者有矣雖壽烏能以享其祿哉今太守在秋官無公私之過有一郡有循良之譽方今國家最重牧民之任而見稱於時者太守其一人焉宜乎太安人安居樂志享壽與祿於無窮是以足副朝廷之命遂太守之心而堂亦庶乎其榮耀焉豫是以記之袁太守祠堂記太原太守袁公謂豫曰吾與兄若弟於所居之東作祠堂以奉先世神主欲依晦庵先生家禮之制惟祭祀禮儀近有所謂家禮易見頗異同不能使人無惑焉又祭祀品物懼後世或因措置不及致有廢缺程夫子曰冬至祭始祖立春祭先祖忌日遷主至於正寢人能存此雖幼者可使漸知禮義而晦庵先生曰吾家舊時時祭外有冬至立春季秋三祭後以立春冬至二祭為僭故止季秋依舊祭禮然家禮尤存冬至立春二祭之儀懼於後世不知而行之失先儒慎於禮文之意欲依家禮定為祭祀儀式勒之於石置諸祠堂門廡間以遺之後人俾遵效而行之不為世俗所眩不為貧賤而怠不以富貴而僭庶幾奉先追逺之意永永而無替願先生為我序之夫家禮一書朱文公斟酌禮儀而為之簡便切當不背於古而宜於今然世俗鮮以為務雖簪纓士大夫而不能知况農工商賈負販之流乎富盛而有力者且不能行况貧窮寡弱衰落之族乎不惟其不能知耳所未嘗聞也不惟不能行目所未嘗見也茍有言之聞者必以為異而謗之有行之見者必以為怪而笑之自非信古而篤好違俗而特立者不能力行之而不惑也此豫於袁氏兄弟而深有重焉袁氏豐城望族敦詩書而尚禮儀至太守與其兄秉彝及其弟平恂恂雅飭篤於友愛居家者以忠信見稱居官者有廉能之譽當鄉邦禮廢之餘而能協謀以立奉先之所且取法一本乎家禮不惟定其制而且立石以傳之久其為示今傳後也不亦賢矣乎謹為序其言而書之楊氏重修祠堂記宋楊忠襄公以大義死建康聞於天下其族屬皆有節行蓋楊氏建家於吉自門下侍郎知吉州輅始侍郎善待士唐末五季之亂士大夫多依之以居逮宋之平吉之名族視古為盛真宗大中祥符八年侍郎諸孫丕擢甲科仕至屯田員外郎知康州以清謹著與鄉人蕭侍御彭大博齊名真宗御宸翰書於殿柱曰江西三瑞仁宗皇祐初著作郎純師以文章顯蔡京之柄用也洪州通判存抗以直言格其請託卒為所擯卓然之行倡於忠襄之前至文節萬里以寶謨閣學士致政家居聞韓托胄專權誤國草諌疏畢憤惋不食死子長孺仕至安撫使直義之化沾濡蠻粵擊豪強不避近戚捐俸入七十萬餘代輸民租不持一錢去凜然之節繼於忠襄之後又若安撫使炎正幼與吏部侍郎仔皆見稱於世不辱其家稽之史編古未有也於法皆當祀以表節行勵風俗故元盛時楊氏之賢同知崑山事學文始復文節故居為祠規制廣於前而益加多歲久弗治田蕪宇傾豫時與同知諸孫宜修有舊嘗示所藏文節公墨藁始讀其文見與益國周文忠公晦庵朱文公鄉之諸君子過從觴詠想見一時之盛逮偕宜修步謁祠下江東諸山如畫屏列於前地據髙爽宋崇陵御書誠齋字揭文安公所撰祠記刻石俱在喬木蒼然挺秀為之佇立顧望興懷低回而不能去者久之楊之賢季琛以舊臣膺京兆之舉作令南海次修祠之顛末命宜修授豫請記焉蓋季琛倡率其族人因故六楹及餘材之可用者益以新木凡三百四十有奇磚甓五萬有七增設始祖吉州公及屯田清謹二龕諸小宗顯宦敘昭穆從祀廢像設用木主刻世系祀田祭器牲幣酒儀設科條於碑隂祭用冬至立春子孫緣歲專直祠祀祠宇壞漏輒飭無怠怠者罰如科條所以尊祖而垂後可謂逺也已可謂詳也已於乎此可以為世勸豈特楊氏而已哉劉氏祠堂記廬陵藤橋劉氏徙自安成山莊今八世矣族屬益蕃盛舊有祠堂以祀其先毁於兵燹厯載既久莫有能復之者今其嗣孫連江尹仲戩乃度地於所居之南謀於族人創立祠堂凡若干楹繚以周垣門廡厨庫器用備悉又置祭田三十畝其費皆出仲戩歲時祭祀推族屬之長者主之祭畢而燕禮儀進退截有定體鄉里稱焉今仲戩述職京師請豫記歸而刻之碑古者嘗授士大夫圭田以奉祭祀士大夫必立宗子以主祭祀後世田制既廢宗法不立而於祀先之禮亦置而不講祀先之禮置而不講則尊祖敬宗之意無由而興尊祖敬宗之意不興則敦宗睦族親親之恩無由而展此倫理之所以不明而風俗之所以益偷也歟近世以來故家大姓有聰敏而知禮義者出慨然憫之於是立祠堂備祭器置祭田講求其禮而興行之粲然可觀而仁人孝子循而倣之者日以益衆雖不能盡合古制而敦睦長厚之風由是而起亦庶幾乎古人之遺意也此仲戩之所以為可重也歟豫因仲戩而有感焉夫一族之間有富貴貧賤智愚賢不肖之不齊究其本皆出於一人則夫愛敬之意烏可以有異焉當乎祭祀之頃凜然若先祖之臨乎其上而孝愛之誠藹然見於薦奠俯仰之際退而燕也子姓咸在長幼序列而宗親之義歡然見於獻酬跪起之時及其罷也則富欺其貧貴陵其賤智侮其愚賢欺其不肖者有焉嗚呼其視先祖為何如人耶其於祭祀燕飲之意得不相戾悖耶是皆世俗妄子弟之所為也劉氏讀書好禮必有以異乎是故因仲戩而書是説以告之使不如劉氏者觀之或有感發而興起者焉則是碑之立其於世教庶亦有補哉潘氏祠堂記祠堂所以奉先常事也常事而有異焉是以記也潘氏番陽故家國初有景嶽者以才薦授安福州判官九載以治最聞召赴闕未及用而沒子晦初求翰林學士金華宋先生銘其墓而葬番陽仍還安福晦初與豫交厚善嘗為豫言先塋俱在番陽將謀居守墳地以奉先祀而力不逮奈何豫曰君子之處世也行止去就惟其宜可焉子之先大夫有德於邑民甚厚民思慕之真有若孺子之於父母也豈有愛其父母而遺其子也邪子其念之茍可以貽後嗣而存宗祀則在此猶在彼也又何必切切故鄉之思哉晦初外雖以豫言為然而心尚未已也其後男女既長締姻結好皆在安福而園田居第日以充擴勢所不能往也則謂豫言曰子之言然第念先塋隔越不得數致祭掃之禮欲依文公家禮立祠堂於正寢之東而刻先大夫之銘文於石置其中四時薦奠之際如在番陽墟墓之間庶幾以志不忘之意云豫甚善之惜乎其志未就而沒嗣子多吉以其居逼城郭乃謀徙西山中原田曠衍林壑清秀所居壯麗遂承尊府之志置祠刻碑悉以完具而以書命其子秋官主事鑑來徴豫記曰士大夫家設祠堂以奉四世考妣神主易世而遞遷之親盡之主則埋於墓所潘氏之居安福自州判公始而墓不在是遷主無所藏擬留於初室世世祠之如事墓焉銘埋於墓者也以墓不在是則勒之石而置諸初室之傍如在墓中也此皆先人以義起之意不肖哲不敢違願先生為我記之古者為郡縣吏有功德及民者民像而祠之立碑以頌之今州判公功德在民不異乎古之為政者民之欲祠而頌之之心殆有甚焉特拘於制不得以盡其情若子父祖子孫之所為雖奉祀先之盛心而所以待州判公者實有以遂民情之所欲此其異於常者不可以無記為子記之使人因其同以考其異知賢父子之用心有所在非所以為法於後世也朱氏孝義堂記孝弟之道通於神明信乎夫以有心之為而感乎無心之天豈無其所以然之故哉誠者天之道也人之一心念慮所鍾確然不移終始無間固足以動天地感鬼神回日月貫金石而孚草木若王祥之躍鯉董永之傭身熊渠子之射魯陽之戈三田之合荆孟宗之泣竹人力不至於此是其所為有合於天天且不能違而况於人乎况於鬼神乎江隂朱氏世居邑之文林以詩禮相傳為巨室其彥有曰維吉者好學而文其尊府善慶讀書而尚禮見義勇為凡里中婚姻疾病有不給者莫不周之其夫婦皆樂於為善故維吉之在鄉未嘗有所為不善者其家教然也一日母氏卧疾危急更數醫弗效維吉遑遽無措則焚香籲天願以身代又刲股作羮以進者再母疾隨愈人皆以為一念之誠孝感之所孚有以致然也辛酉歲歉民飢維吉念二親己老且疾乃捐粟四千石以濟飢殍逺近之間人以不飢而二親亦安樂之臻於壽康衆又以為隂隲之施人感其惠祝願之至而親愛之於是相與名其養親之堂曰孝義今年夏維吉因朝廷降敕旌其義來謝恩京師請豫為記夫為人子者孰不欲孝養其親然或遇非其時不得以盡其養之之心或艱難貧窶無以為其養之之具或疾病患苦不得享其養之之禮或恃富強陵忽鄉里而取怨尤以陷其親於不義者蓋有之矣維吉遭際治平之時二親酡顔鶴髮同躋壽考而康寧無恙家素饒於財而能推其所餘以濟人之急使其親樂乎其心而安享盛福於無窮其為孝義誠有足稱者而所以膺國家褒寵之命而光耀於門閭豈為過哉豫是以記之庶以為世勸也孫氏感恩堂記仁宗皇帝自即位以來發政施仁恩澤被於天下者蓋廣未及期月而鼎湖之雲氣忽焉而起四方萬國之人哀慟之如喪考妣至於今追思而感慕之未己也孔子曰德之流行速於置郵而傳命詩云嗚呼前王不忘觀之仁廟為尤信如使天假以年則其仁政之成豈待三年必世而後然哉分宜有孫氏曰所性者與其尊府以詿誤沒入官得戍邊所性往遼東山萬而尊府居山海關塞離隔數千里不得相往還骨肉恩愛之情其將奈何一日尊府沒於山海其母氏羇孤流離煢然無依所性聞之哀號籲天無以舒其憂則以情上章達於帝庭欲迎養其母其言懇惻切至仁廟特許焉所性不勝欣喜未幾優詔復下所性得循例還其鄉便道與其母同歸於家其田宅園林官給還母子遂歡然以居是雖孝誠之所感格實乃仁廟天地之量休養愛育之恩之所致也故所性特作一室以養其母而顔楹間曰感恩以志不忘之意求豫記之夫恩仁之施也仁天地生物之心也天以仁育萬物聖人以仁育萬民萬民得遂其生育者皆聖人仁恩所及而人不自知也所謂帝力何有於我者也所性獨感仰拳拳焉而不置者蓋其拔出於艱危困苦之中得返其安居暇食之樂以養其親而享夫壽考康寧之福者自非先皇深仁厚澤涵濡沾溉之至何能若此哉此所以感之深而念之切也今有背君父之恩而不知所以為報者抑獨何哉聞所性之所為能不有愧哉故豫為記之非獨以重所性其於世教庶亦有勸哉愚隱記故人子彭瓛育信以其同産兄琉在翰林來省之嘗過顧謂豫曰吾搆一軒於所居之東扁而名之曰愚隱未有記之者敢有請於先生豫曰子故家宦族通達世故何名謂愚方今治平盛世賢才無不嚮用何名謂隱育信曰吾先世有為通判是州者有為轉運兩浙者有為上舍國子者文章事業表表在人耳目而吾不能繼志步武以嗣其聲光豈非其愚乎吾兄弟六人有舉進士不第而名厠耆英者有第進士而列官於朝者有家居幹蠱而道義可尚者出處隱顯各得其宜而吾不能聨璧連芳以與之頡頏豈非其愚乎吾居於鄉見高閎巨室之子弟其髙者讀詩書修禮度以取功名干爵祿為事其豪者馳堅良美服飾出入輝耀結知貴勢以殖貨財廣資産為務而吾窮居獨處卧間窗而坐虛室友青山而侣白雲其於人事是非得失漠然不經於心吾既無求於人人亦不資於我豈非其愚乎及來京師見四方之賢俊青年美質或以才德出衆舉或以賢良方正薦顒顒濟濟紛然萃於天官之庭發舒其文藻光耀於雲霓雖巨魚之縱大壑未足喻其得志也而豫自念蕭然一布衣無寸長可取於人雖置之通衢大道之間孰肯一回盼一舉手以引之於青雲之上哉豈非其愚乎夫既不足以接迹於先世嫓美乎兄弟聲譽不起於鄉閭姓名不達於朝廷其為愚也可知既愚矣無所用於世矣雖欲不隱不可得也此吾兹軒之所以名先生其以是記之先儒曰隱者為髙故往而不返觀育信之言而察其心其亦往而不返者歟豫竊祿於朝既老矣尤不知止而為之記得不為育信笑也耶以其請不得辭遂掇其語而書之他日或得請歸故鄉訪育信於是軒尚為育信賦之靜香書室記靜香書室者湖廣長沙荼陵周諒字士貞讀書之所也士貞自祖父來皆以醫鳴至士貞亦傳其業而尤好讀書積書數萬卷於其室中朝夕孜孜以求其理不倦喜與士大夫交講議往復以忘其勞人或曰子以醫為業而急於儒書之習以為名不亦戾乎士貞曰書者道之所載也是道也亘乎古今極乎天而蟠乎地茍能明之則天下萬事萬物之理無不可推矣況於醫乎醫者吾世業也吾所憂者惟斯道之未知耳此書室之所以作也此吾志之所在也孔子曰志於道先儒曰志道則心存於正而不他吾既事乎此又豈暇他求哉人於是知士貞之志不安於小成也皆引領而望之然終以其先世之業之所在也遂為知者薦入太醫院今為太醫院良醫而猶不忘乎昔者藏修遊息之處因吾友孫某來請記夫以士貞家居時專志於儒書而不暇乎其他則宜其於醫道疏也今以其道施之人無不效焉周官以十全為上士貞豈非醫之上者乎以是觀之則其於學可知也士貞曰吾固不能進於是矣蓋有望於吾後人焉其為我記之使益勉焉庶幾其有成也豫嘉士貞之志遂為書之以為記李氏讀書樓記距安成之北若干里有曰尼山者自西南而來蜿蜒磅礴有泉出山間自髙而輸下循山而行漫為平流鏡瑩澄徹號曰清溪自尼山東北至清溪不五里許有巨姓李氏族居之背山而臨流其田土膏腴園林幽迥為邑之勝處也李氏之彥曰克端者倜儻俊偉知書而好文善談論不妄與人交茍非其人則終日默默若不能言者一遇知已英偉秀發或論詩書道古今與夫事之是非人之賢否縷縷然窮旦暮而不厭其八世祖某仕宋為國子博士既歸老特作讀書樓於溪上至今凡若干年子孫相繼而新之及克端益積經史子籍其中當太平無事之時得以從容於兹樓之上日以課子弟誦詩讀書為務而不暇乎其他客至則設尊俎相與歌吟笑詠陶然自得而塵俗之態當世之務一不以經其慮可謂能繼述其先緒而啓迪乎後人者非其賢而能之乎余家居時常往還先師尼山尹先生所或道過李氏克端輒迎至兹樓開窗􅑀闌極目逺覽平疇曠野喬林峻壑之奇可以一覽盡在目前誠足以舒煩滌滯而遊心於簡籍之中放情於翰墨之習惜乎不得數遊於其間以為恨既而别去於今二十年矣未嘗不往來於懷也今年吾友藍山廣文陳公至京師以克端之命來求豫序且曰豫與今侍御胡公啓先秋官主事黃公恆修嘗讀書於兹樓固不能忘情焉今之請豈獨克端之意哉余以世之高甍畫棟誇示侈靡擊鐘伐鼓以飲鄉人燕樂為務客或過之既去而漠然不以留意既至於不一再傳衰落陵替者其本固己淺也今李氏之樓纍世而不廢而二三公之所以拳拳而不忘者豈非以異於世之人所為者哉昔司馬公曰積書以遺子孫子孫未必能讀不如積隂隲者是蓋有激而云然也夫讀書所以明理也循理而行則所為豈非隂德也哉然則彼之所以冥行妄作而不足以垂裕於後者孰非由其不知書而背理也歟不然則李氏之樓亦徒設而已為李氏之子孫尚勗之哉松溪别業記安成西上三十里有地曰松溪洪武中隱士吳公觀斌自城徙居之扁其室曰植齋遣其子與讓從豫遊豫每過之見其手種之松皆新蒔偃蹇而弗舒也永樂辛卯豫歸自翰林而植齋歿已久矣與讓延豫坐溪上觀諸松皆颯爽蒼翠離離若人立繞居有小溪如環玦沄沄而流遇秋冬水落穿石罅則泠泠然若琴瑟之音與松風相響答聽之可愛也别去二十餘年追想舊遊夢寐未嘗不相為往來也宣德庚戌其從弟與儉舉進士來京師明年入翰林為編修暇日因語及之曰植齋之松固無恙乎曰髙者隱白日低者淩青煙密而蟠者可以棲玄鶴而蔭蒼虬矣曰松之茂悅其若是矣乎又明年與儉賫其兄書來求記其所謂别業者豫莫能辭嘗聞松升長之物也惟其升長也是以淩霜雪傲歲寒不至於切摩霄漢不已焉然其初也膚寸而已矣溪流行之物也惟其流行也是以厯澗壑經江河不至於趨奔滄海不息焉然其始也涓瀝而已矣君子之志於道者亦若是故有充善信以至於美大者焉有希賢哲以至於聖神者焉然其發軔也不外乎謹德而已矣故易於升之象有曰地中生木升君子以慎德積小以髙大於坎之象曰水洊至習坎君子以常德行習教事其斯之謂歟吳氏世家忠厚逺自臺隂徙兹仁里既有植齋翁作之於前又有與讓兄弟繼之於後雖隱顯不同出處或異然皆有得於升長流行之義以砥礪名德而善乎其身則一也然則君子之業非徒為業身之資實所以為業德之助矣傳曰善觀物者當有以窮其理能窮其理則道不在物而在乎人矣其斯之謂歟豫也晚景侵尋時與歲去倘得請於朝當求片地西山中幅巾杖履追尋舊遊與與讓往來蔭長松而履白石嘯歌煙雲以樂餘生有日矣幸相戒毋以豫為逋客可也是為記思親堂記臨之清江鎮有蕭氏世居焉蕭氏有曰孟升者篤實士也來往吾安成甚熟豫前年致仕歸舟過清江孟升與其二兄孟端孟素來相見從容溫雅知其為忠厚之家也今年孟升至安成謂豫曰吾不幸先人早見棄賴母陳氏鞠育而教誨之以至成人今吾母亦已歿矣因名吾親昔日所居之堂曰思親願先生為記之豫曰尊甫歿已久矣久則易忘也母孺人壽考而終無足憾也何為而曰思孟升曰吾父歿時年方四十而吾今年餘六十吾長兄年八十有六次兄年亦七十有六矣當太平極治之時享壽考康寧之福而吾親不得焉吾兄弟安得而不思吾兄弟耕田鑿井以望斗升之粟貿遷有無以求錐刀之利而無不得焉是皆吾親遺澤之所致也又安得而不思有甘旨之味而不能以適吾親之口有輕暖之服而不能以被吾親之體又安得而不思晨而興夕而息而無所以行其定省之禮朝而出暮而歸而無所以致其面告之誠則又安得而不思思之無已無所用其情也則以之名其堂以識其志先生其以是記之豫聞孟升昆季雖早喪父事其母極孝謹兄弟之間怡怡然相與無間言今皆已髙年而思親之心猶不置豈非所謂孝弟人也歟世有生不能盡其養死而能致其思者乎然則孟升兄弟得不可重也歟記之世教庶其有勸也雪月亭記德清湖州之名邑也邑之北不三里許有寺曰慈相邑之名剎也創於東晉重興於唐至今益盛而不衰其左有半月泉宋東坡諸名賢嘗遊觀焉題名刻於石東萊吕公讀書泉上又有觀心堂宋御書見存寺後有亭曰雪月不知創自何時泉與堂不廢惟亭獨故址寺僧有開上人者戒行精潔覺路深詣以是信從者衆既斂其所施一新佛宇乃構其亭揭以舊名比膺薦為僧會其縣赴選於北京將歸謁豫記夫象教之顯於中土也尚矣其宫宇制作之盛擬於王公而又皆名山大川奇勝之處茍主之者得其人其欲創造改建人之助而資之者益衆可頃刻集而不勞焉若開上人在慈相是已且上人之於慈相興壞補弊固多矣而獨拳拳於斯亭者蓋以物之至潔者莫如雪至明者莫如月也當夫寒氣既凝同雲結隂而雪作焉觀其灑空布地積素千里氛埃不興萬穢俱匿而禪心之五藴皆空六塵不染者有所契也海光乍動暝色欲祛而月出焉觀其鏡淨虛明麗天燭夜懸照無私容光必入而禪心之沖虛內朗洞達外照者有所合也是則上人之搆斯亭豈徒然哉佛書有所謂淨心染心光明蔽障之不同而至於見道離道相逺之説其徒皆能傳道之鮮能擇而由之者今上人之所為如此其淨心而光明見真如之道而不離者歟且不獨止其身欲後之人無廢壞之者非泥於物也使知所以求其道也知所以求其道則斯亭烏得而廢哉記之使有所考也雲林清趣圖記有方外之士曰周道寧者年少而聰慧洞參玄妙常欲遊厯四方名山大川以探安期羡門子喬鬼谷之遐蹤勝迹以豁其心胸擴其見聞庶幾所謂至道者可得而契而長生之術可得而盡也懷之有年未克以遂一日有客以八景圖遺之者道寧反覆觀之曰是非人間所居處也得非仙境耶客厯指示之曰青山入空白雲浮動者緱山也島樹淩風波濤洶湧者弱水也雲霞擁日樓觀慿虛者玄圃也林壑縈紆煙水浩渺者青溪也至若望玉笥之晴嵐則羣峯削翠而仙臺層列若可登也觀羅浮之夜月則瑤房隱天海色如晝若可掬也度天台之石橋則霞彩氤氲而桃花正吐誠可玩也跨西湖之雪鶴則寒光璀璨而梅萼初開誠可挹也汝其試觀之將必有得也道寧欣然曰吾既不獲遊其地觀於此可以滌吾胸中之煩滯而償昔之所願欲者矣於是次第而裝潢之為一卷名之曰雲林清趣求賢士大夫賦詠之道寧間居靜室時時展玩諷誦諸君子之什恍然如在緱山弱水青溪玄圃玉笥羅浮天台西湖之上與安期羡門子喬鬼谷之倫驂鸞駕鶴雲馭風遊於汗漫之表而不覺其在人間也然則道寧豈不樂哉道寧嘗徴豫序昔季卿舉進士不第而思江南遊長安青龍寺見壁間寰瀛圖指曰安得自渭達河至家乎傍有終南山翁曰可也令折竹葉置圖上注視之須臾波泛登舟旬日至家是蓋仙術之妙向使因是以念蓬壺方丈瀛洲之境而遇翁指示之則其至仙道也不難矣奈何志不在此而塵念不忘為可惜也道寧之客仙境豈非終南山翁之徒乎其所贈圖豈非寰瀛之類乎道寧無塵凡之念而慕至道如此將必有所遇焉於斯時也斯圖與諸君子之什暨豫之言皆為外物不足道矣道寧其篤志以俟義山聚冢記廬陵銅溪劉嘉會先生所居之近有山焉初無名先生以其寬衍深秀而憫鄉人之貧窮歿而無葬地者令皆葬於此今而冢墓纍纍殆百餘所人皆以先生所為義事也故名其山曰義山先生有學行文藝洪武中以明經薦至京賜華蓋殿説書後分教壽州以言事稱旨升武進丞未幾罷官家居宣德初為知者薦入朝所司擬外校官時年已八十以老不堪事辭上曰師表後進正宜老成人不聽先生懇乞再四遂得還今年九十矣尚康強無恙鄉人德之者曰先生不慕榮利而享壽考此行義之報也然其餘慶之發殆不止此將猶在其子孫已乎先生聞之曰吾欲鄉人死生皆不失所而不能也吾量吾力之所宜而為是耳豈望報耶或曰此仁人君子之心雖推以行之天下可也而有所不行焉獨不可惜邪夫士君子讀書學道得行其志者幾何人周官有墓大夫掌凡邦墓地域為之圖令國民族葬而掌其禁令使皆有私地域是則古之人無貴賤貧富死而未有無地以葬者後世山林川澤皆歸於民而據於大家巨室非細民所得有然後有暴骸露骼蓋多也今先生居一鄉使一鄉之人無是患有古之道焉如得行其志而兼善天下則死而失其所者殆少也此世之所以惜之也歟先生誠仁人也使鄉之人祝之者信然則其後人之食其報者其又可量哉豫姑記之必有以驗之胡氏壽藏記榮武廬陵之孝義人也姓胡氏其先自丹陽徙袁之宜春至南唐國子祭酒殿中侍御史盛徙廬陵之淳化鄉遂為廬陵人七傳至伯通為王宫教授伯通之季子伯順宋崇寧進士知邵武縣事邵武子襄為廬陵學官學官次子清臣為髙安丞建炎徙家近郡城髙安四傳至遂初榮武之曾祖也遂初生九臯九臯徙郡城之北螺峰之右築室樹藝資産益盛焉榮武之大父也九臯子三人建極仁極環極榮武則建極之中子也建極早卒九臯命榮武贅於邑之張氏榮武奮志礪行克自樹立創造居第於里錢溪之上廣拓園田積書以訓諸子奉外父母如所親嘗恨其尊府不逮養時節忌日必哀慟焉事其母備極甘旨母沒以其尊府葬地逺不克朝夕見乃卜吉於所居傍近處奉尊府之喪與母氏合葬焉又作一室於家每日出之際升而望之曰朝陽軒以志其不忘之意榮武既壻張氏視田園居宅自有餘饒凡祖宗所遺財産悉推與諸父兄弟久之慮後世或有分爭之患於十分取其一築室以為其子孫往來陪祭居宿之所且以示水木本源之義性喜賓客壺觴尊俎欵延弗倦鄉人困乏者尤加存恤正統庚申朝廷遣使四出修復倉廪以廣儲蓄榮武輒出粟二千石以實官廪備濟荒之用事聞詔旌為義民賚以羊酒復其家榮武既老矣里之山前大道之傍有善地背負山阜前俯平疇岡巒環拱如抱如揖榮武顧而樂之遂即其處營為壽藏指示其諸子曰他日吾與汝母同歸於此棺衾衣殮之物無不備具吾不慮也鄉人聞之莫不以為達者之所為也今年秋榮武來謝京師將歸求豫為其壽藏記曰使吾諸子後日以是葬我也夫死者人之所惡故不預凶事致身沒之後有經年纍月而至於暴露者是誰之過歟榮武不事祖宗生業卓然自立有子七人皆循循雅飭二子遊郡庠篤於學問平生不為不義不與人爭競凡為人子為人父為人兄弟叔姪朋友之道無不盡而於身後之事亦計慮至於如此俯仰之間舉無所愧焉一旦壽考令終而安處於兹則豈不樂哉豫於是為記之而又繫之以詩曰廬陵螺岡有胡宅宜春來此矜閥閲祭酒盛居南唐末傳至伯通世已七伯通之後澤未竭簪組蟬聨紹前烈至於九臯尤英傑徙居螺峯郡城北子孫相繼盡賢哲榮武生來有美質孝親友弟兄情切力行仁義自不伐承世餘慶壽可必平生慷慨無驕拂隂陽晝夜了然達偉然佳城何鬱鬱我自為之誰我剟我有中饋自結髮後百年來同此室爰居既安心則悅諦視萬古猶一日此時誰復同髙潔青松白雲與明月清省軒銘深州太守蕭公賢而善為政其在深州也久化行而民安之公尤未以為足懼在幾微生於其心而害於其政遂題其所居之軒曰清省以自警來求豫銘銘之曰慨薄俗之侵擾也獨淡泊而無營靈臺湛然如氷壺之潔玉鑒之明事至物來處之適宜無厚薄之與重輕髙堂之上環千里之內絶歎息愁恨之聲茍利欲之一開則機務之繁興請謁踵其門而爭訟盈其庭此居敬之仲弓所以賢而清靜之蓋公所以名使凡為吏者皆若是其為政教化何憂其不成視古昔之循良固可與之齊驅而並稱豈徒光昭乎一室將垂諸簡册厯千祀而有榮也折檻圖銘漢孝成時王氏瀆亂國經欲移鼎祚張禹以帝師臣為時屬望帝幸其私第以災異之變疑在近戚禹宜開陳正道歸咎王氏庶災祥禦而忠佞分宗社有可安之機矣夫何以子不語怪聖人罕言性命之説以塞主聽遂致王氏愈肆而莽移漢祚實由兹始朱雲奮不顧身欲借利劒以斷禹首上怒命曳出斬之雲攀殿檻檻折使帝能因其言黜禹而疏王氏則外戚退聽而漢室張矣徒曰因而葺之以旌直臣是知其直而不能用也自漢迄今為日已久好事者圖其事以為世勸諸名公多有題跋之者豫景仰直節慨慕風采於是圖作銘銘之曰作室之用必求良材匪堅則圮匪巨則頽在漢國師乃用張禹依隨王氏媕阿無補帝幸其第託言厥衷子不語怪災異奚從有偉朱雲奮身赳赳欲借利劒往斬禹首直聲滿耳徑氣盈庭攀檻檻折上摩青冥揆今千載耿耿不閟流傳圖畫垂勸百世嗟嗟朱雲志從龍逢雲禆漢室逢捍有商直哉史魚其道如矢不遇名言世無夫子忠恕齋銘夫子之道忠恕為先惟斯二義體用克全中心為忠如心為恕盡已推已內外一致昔者孔門其徒三千能味其旨曰唯曾參吾道之要有終有始一以貫之無復二理郕國之裔慨慕昔賢作齋揭扁昭示几筵爰述銘辭廓宣藴奧聖學在兹胡不慥慥硯銘其堅也確然其潤也溫然其圓也不至於柔佞其方也不過於巖稜硯乎硯乎是豈徒為吾今日之師表其將尚友乎千年也歟琴銘其形三尺其絃則七具音響之泠然備格調之清越可以招南薰而阜吾民之財可以操猗蘭而供達士之適然必得於心而應於手而後有以節八風而應乎六律也歟丁母孺人墓志銘監察御史豐城丁俊改授嚴州推官未上任而母孺人歿歸守制於家將葬奉浙江憲副胡公之狀走五百里求銘於豫豫適當還朝濱行以不暇為辭洎至府城俊又在焉求愈篤豫又辭後十日舟過豐城俊挽舟請銘至再四曰俊與從兄弟粗知讀書為文以竊祿明時皆老母之教也生未能盡孝養之道歿又不得賢士大夫銘以垂不朽以慰悅冥靈地下其何以逭不孝之罪俊意注在先生先生幸無辭固辭不獲則敘而銘之按狀孺人歸丁氏為維辰婦克盡婦道俊為童子時維辰篤意延明師教諸子姪孺人極力相成之俊與諸從兄弟既長知父母意相率嚮於學每讀書至夜分孺人率婢僕瀹茗供饌亦至夜分或勸少休曰吾豈恤諸子姪待師之禮當然也及諸子姪有祿位貴顯則嘗致書諭以持身操行毋貽前人羞不及乎其他有女適楊氏未一歲夫死族人憐其少執義勸孺人嫁之立召其女告之其意曰世恆言餓死事小失節事大於汝意如何女曰不待大人言意己決矣其女卒為楊氏節婦嗚呼自孟母後古今為人母能教其子載之傳記幾何人若孺人所為雖女婦之所當為者而少能之能於此其他蓋不足言其視傳記所載亦何愧哉孺人姓周氏諱泰豐城港口人其歿以正統三年十二月十日距其生戊戌三月三日得年八十有一子男二人長即俊宣德丁未進士次曰佩從子曰侃鄉貢進士桐鄉學諭曰僟永樂辛丑進士工部主事曰倬用薦知武康縣事皆承孺人之教者女四人長適毛氏次適袁氏次即節婦次適甘氏孫男六人璉璘瑜璲璐瑄曽孫男四人以已未年十二原缺古廉文集卷三
